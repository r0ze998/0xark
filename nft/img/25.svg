<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bgGrad25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(7,22,14)"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="artBgGrad25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081408"/>
      <stop offset="100%" stop-color="#0e1e0e"/>
    </linearGradient>
    <linearGradient id="bottomGrad25" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgb(7,22,14)"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="nameBarGrad25" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38b878" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38b878" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38b878" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="cardClip25">
      <rect x="16" y="16" width="368" height="528" rx="14"/>
    </clipPath>
    
    
    
  </defs>

  <!-- Card body -->
  <rect x="16" y="16" width="368" height="528" rx="14" fill="url(#bgGrad25)"/>

  <!-- Art area background -->
  <rect x="20" y="60" width="360" height="280" fill="url(#artBgGrad25)" clip-path="url(#cardClip25)"/>

  <!-- Subtle grid lines in art area -->
  <g opacity="0.07" clip-path="url(#cardClip25)">
    <line x1="20" y1="100" x2="380" y2="100" stroke="#38b878" stroke-width="0.5"/>
    <line x1="20" y1="160" x2="380" y2="160" stroke="#38b878" stroke-width="0.5"/>
    <line x1="20" y1="220" x2="380" y2="220" stroke="#38b878" stroke-width="0.5"/>
    <line x1="20" y1="280" x2="380" y2="280" stroke="#38b878" stroke-width="0.5"/>
    <line x1="100" y1="60" x2="100" y2="340" stroke="#38b878" stroke-width="0.5"/>
    <line x1="200" y1="60" x2="200" y2="340" stroke="#38b878" stroke-width="0.5"/>
    <line x1="300" y1="60" x2="300" y2="340" stroke="#38b878" stroke-width="0.5"/>
  </g>

  <!-- Ambient glow blob behind art -->
  <ellipse cx="200" cy="200" rx="100" ry="90" fill="#38b878" opacity="0.06" clip-path="url(#cardClip25)"/>

  <!-- Card art -->
  <g clip-path="url(#cardClip25)">
    <g opacity="0.9">
      <ellipse cx="218" cy="158" rx="20" ry="22" fill="rgb(17,55,36)" stroke="#38b878" stroke-width="1.5"/>
      <rect x="207" y="180" width="18" height="55" rx="4" fill="rgb(17,55,36)" stroke="#38b878" stroke-width="1.5" transform="rotate(8,216,207)"/>
      <line x1="215" y1="235" x2="190" y2="295" stroke="#38b878" stroke-width="7" stroke-linecap="round"/>
      <line x1="225" y1="235" x2="250" y2="295" stroke="#38b878" stroke-width="7" stroke-linecap="round"/>
      <line x1="195" y1="207" x2="160" y2="235" stroke="#38b878" stroke-width="6" stroke-linecap="round"/>
      <line x1="225" y1="207" x2="255" y2="225" stroke="#38b878" stroke-width="6" stroke-linecap="round"/>
      <line x1="130" y1="220" x2="200" y2="220" stroke="rgb(101,255,216)" stroke-width="2" stroke-dasharray="10,5" opacity="0.6"/>
      <line x1="130" y1="235" x2="195" y2="235" stroke="rgb(101,255,216)" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.4"/>
    </g>
  </g>

  <!-- Art area top fade -->
  <rect x="20" y="60" width="360" height="30" fill="url(#bgGrad25)" opacity="0.5" clip-path="url(#cardClip25)"/>

  <!-- Art-to-info divider -->
  <rect x="20" y="337" width="360" height="2" fill="#38b878" opacity="0.4"/>

  <!-- Bottom info section -->
  <rect x="20" y="339" width="360" height="205" fill="url(#bottomGrad25)" clip-path="url(#cardClip25)"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="360" height="42" fill="url(#bgGrad25)" opacity="0.9" clip-path="url(#cardClip25)"/>
  <line x1="20" y1="62" x2="380" y2="62" stroke="#38b878" stroke-width="1" opacity="0.5"/>

  <!-- Card number top-left -->
  <text x="34" y="46" font-family="monospace" font-size="13" font-weight="bold"
        fill="rgb(90,255,192)" opacity="0.75" letter-spacing="1">#025</text>

  <!-- Type icon top-right -->
  <text x="355" y="47" font-family="serif" font-size="18" text-anchor="middle"
        fill="#38b878">●</text>

  <!-- Type label -->
  <text x="290" y="46" font-family="monospace" font-size="10" text-anchor="end"
        fill="#38b878" opacity="0.6" letter-spacing="2">FLEE</text>

  <!-- Rarity dots -->
  <circle cx="176" cy="46" r="4" fill="#888" opacity="0.6"/>

  <!-- Name bar -->
  <rect x="24" y="345" width="352" height="40" rx="4" fill="url(#nameBarGrad25)"/>
  <line x1="24" y1="345" x2="376" y2="345" stroke="#38b878" stroke-width="0.5" opacity="0.4"/>

  <!-- Card name -->
  <text x="200" y="372" font-family="'Arial Black', sans-serif" font-size="22"
        font-weight="900" text-anchor="middle" fill="rgb(90,255,192)" letter-spacing="3"
        style="text-transform:uppercase">DASH</text>

  <!-- Divider -->
  <line x1="36" y1="392" x2="364" y2="392" stroke="#38b878" stroke-width="0.5" opacity="0.4"/>

  <!-- Effect label -->
  <text x="36" y="410" font-family="monospace" font-size="9" fill="#38b878" opacity="0.6"
        letter-spacing="2">EFFECT</text>
  <text x="364" y="410" font-family="monospace" font-size="9" fill="#38b878" opacity="0.6"
        text-anchor="end" letter-spacing="1">RARITY: COMMON</text>

  <!-- Effect text -->
  <text x="200" y="430" font-family="'Arial', sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="rgb(90,255,192)" letter-spacing="1">Quick exit</text>

  <!-- Lore divider -->
  <line x1="36" y1="445" x2="364" y2="445" stroke="#38b878" stroke-width="0.5" opacity="0.3"/>

  <!-- Lore text (italic, small) -->
  <text x="200" y="463" font-family="Georgia, serif" font-size="11"
          font-style="italic" text-anchor="middle" fill="rgb(90,255,192)" opacity="0.65"
          letter-spacing="0.5">Leave your shadow behind</text>

  <!-- Bottom logo -->
  <text x="200" y="536" font-family="monospace" font-size="9" text-anchor="middle"
        fill="#38b878" opacity="0.4" letter-spacing="3">0xARK · SOLANA ZK PvP</text>

  <!-- Card border -->
  <rect x="18" y="18" width="364" height="524" rx="14"
        fill="none" stroke="#888888" stroke-width="1.5"/>

  <!-- Inner border -->
  <rect x="22" y="22" width="356" height="516" rx="12"
        fill="none" stroke="rgb(90,255,192)" stroke-width="0.5" opacity="0.15"/>

  
  
</svg>