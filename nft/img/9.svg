<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(27,10,6)"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="artBgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#2a0e0e"/>
    </linearGradient>
    <linearGradient id="bottomGrad9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgb(27,10,6)"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="nameBarGrad9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e05030" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#e05030" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e05030" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="cardClip9">
      <rect x="16" y="16" width="368" height="528" rx="14"/>
    </clipPath>
    
    
    
  </defs>

  <!-- Card body -->
  <rect x="16" y="16" width="368" height="528" rx="14" fill="url(#bgGrad9)"/>

  <!-- Art area background -->
  <rect x="20" y="60" width="360" height="280" fill="url(#artBgGrad9)" clip-path="url(#cardClip9)"/>

  <!-- Subtle grid lines in art area -->
  <g opacity="0.07" clip-path="url(#cardClip9)">
    <line x1="20" y1="100" x2="380" y2="100" stroke="#e05030" stroke-width="0.5"/>
    <line x1="20" y1="160" x2="380" y2="160" stroke="#e05030" stroke-width="0.5"/>
    <line x1="20" y1="220" x2="380" y2="220" stroke="#e05030" stroke-width="0.5"/>
    <line x1="20" y1="280" x2="380" y2="280" stroke="#e05030" stroke-width="0.5"/>
    <line x1="100" y1="60" x2="100" y2="340" stroke="#e05030" stroke-width="0.5"/>
    <line x1="200" y1="60" x2="200" y2="340" stroke="#e05030" stroke-width="0.5"/>
    <line x1="300" y1="60" x2="300" y2="340" stroke="#e05030" stroke-width="0.5"/>
  </g>

  <!-- Ambient glow blob behind art -->
  <ellipse cx="200" cy="200" rx="100" ry="90" fill="#e05030" opacity="0.06" clip-path="url(#cardClip9)"/>

  <!-- Card art -->
  <g clip-path="url(#cardClip9)">
    <g opacity="0.95">
      <ellipse cx="200" cy="158" rx="22" ry="25" fill="rgb(90,32,19)" stroke="#e05030" stroke-width="2"/>
      <rect x="189" y="183" width="22" height="65" rx="3" fill="rgb(90,32,19)" stroke="#e05030" stroke-width="1.5"/>
      <path d="M230,130 Q260,140 255,170 Q240,175 225,165 Q235,155 230,130Z" fill="#e05030"/>
      <path d="M170,130 Q140,140 145,170 Q160,175 175,165 Q165,155 170,130Z" fill="#e05030"/>
      <line x1="200" y1="248" x2="185" y2="295" stroke="#e05030" stroke-width="8" stroke-linecap="round"/>
      <line x1="200" y1="248" x2="215" y2="295" stroke="#e05030" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Art area top fade -->
  <rect x="20" y="60" width="360" height="30" fill="url(#bgGrad9)" opacity="0.5" clip-path="url(#cardClip9)"/>

  <!-- Art-to-info divider -->
  <rect x="20" y="337" width="360" height="2" fill="#e05030" opacity="0.4"/>

  <!-- Bottom info section -->
  <rect x="20" y="339" width="360" height="205" fill="url(#bottomGrad9)" clip-path="url(#cardClip9)"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="360" height="42" fill="url(#bgGrad9)" opacity="0.9" clip-path="url(#cardClip9)"/>
  <line x1="20" y1="62" x2="380" y2="62" stroke="#e05030" stroke-width="1" opacity="0.5"/>

  <!-- Card number top-left -->
  <text x="34" y="46" font-family="monospace" font-size="13" font-weight="bold"
        fill="rgb(255,128,77)" opacity="0.75" letter-spacing="1">#009</text>

  <!-- Type icon top-right -->
  <text x="355" y="47" font-family="serif" font-size="18" text-anchor="middle"
        fill="#e05030">⚔</text>

  <!-- Type label -->
  <text x="290" y="46" font-family="monospace" font-size="10" text-anchor="end"
        fill="#e05030" opacity="0.6" letter-spacing="2">ATTACK</text>

  <!-- Rarity dots -->
  <circle cx="176" cy="46" r="4" fill="#aa44ff" opacity="0.6"/><circle cx="188" cy="46" r="4" fill="#aa44ff" opacity="0.6799999999999999"/><circle cx="200" cy="46" r="4" fill="#aa44ff" opacity="0.76"/>

  <!-- Name bar -->
  <rect x="24" y="345" width="352" height="40" rx="4" fill="url(#nameBarGrad9)"/>
  <line x1="24" y1="345" x2="376" y2="345" stroke="#e05030" stroke-width="0.5" opacity="0.4"/>

  <!-- Card name -->
  <text x="200" y="372" font-family="'Arial Black', sans-serif" font-size="22"
        font-weight="900" text-anchor="middle" fill="rgb(255,128,77)" letter-spacing="3"
        style="text-transform:uppercase">BERSERK</text>

  <!-- Divider -->
  <line x1="36" y1="392" x2="364" y2="392" stroke="#e05030" stroke-width="0.5" opacity="0.4"/>

  <!-- Effect label -->
  <text x="36" y="410" font-family="monospace" font-size="9" fill="#e05030" opacity="0.6"
        letter-spacing="2">EFFECT</text>
  <text x="364" y="410" font-family="monospace" font-size="9" fill="#e05030" opacity="0.6"
        text-anchor="end" letter-spacing="1">RARITY: RARE</text>

  <!-- Effect text -->
  <text x="200" y="430" font-family="'Arial', sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="rgb(255,128,77)" letter-spacing="1">Rage atk</text>

  <!-- Lore divider -->
  <line x1="36" y1="445" x2="364" y2="445" stroke="#e05030" stroke-width="0.5" opacity="0.3"/>

  <!-- Lore text (italic, small) -->
  <text x="200" y="463" font-family="Georgia, serif" font-size="11"
          font-style="italic" text-anchor="middle" fill="rgb(255,128,77)" opacity="0.65"
          letter-spacing="0.5">No mind, only red</text>

  <!-- Bottom logo -->
  <text x="200" y="536" font-family="monospace" font-size="9" text-anchor="middle"
        fill="#e05030" opacity="0.4" letter-spacing="3">0xARK · SOLANA ZK PvP</text>

  <!-- Card border -->
  <rect x="18" y="18" width="364" height="524" rx="14"
        fill="none" stroke="#aa44ff" stroke-width="2.5"/>

  <!-- Inner border -->
  <rect x="22" y="22" width="356" height="516" rx="12"
        fill="none" stroke="rgb(255,128,77)" stroke-width="0.5" opacity="0.15"/>

  
  
</svg>