<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bgGrad44" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(19,25,28)"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="artBgGrad44" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100818"/>
      <stop offset="100%" stop-color="#180e28"/>
    </linearGradient>
    <linearGradient id="bottomGrad44" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgb(19,25,28)"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="nameBarGrad44" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a0d0e8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#a0d0e8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a0d0e8" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="cardClip44">
      <rect x="16" y="16" width="368" height="528" rx="14"/>
    </clipPath>
    
    
    
  </defs>

  <!-- Card body -->
  <rect x="16" y="16" width="368" height="528" rx="14" fill="url(#bgGrad44)"/>

  <!-- Art area background -->
  <rect x="20" y="60" width="360" height="280" fill="url(#artBgGrad44)" clip-path="url(#cardClip44)"/>

  <!-- Subtle grid lines in art area -->
  <g opacity="0.07" clip-path="url(#cardClip44)">
    <line x1="20" y1="100" x2="380" y2="100" stroke="#a0d0e8" stroke-width="0.5"/>
    <line x1="20" y1="160" x2="380" y2="160" stroke="#a0d0e8" stroke-width="0.5"/>
    <line x1="20" y1="220" x2="380" y2="220" stroke="#a0d0e8" stroke-width="0.5"/>
    <line x1="20" y1="280" x2="380" y2="280" stroke="#a0d0e8" stroke-width="0.5"/>
    <line x1="100" y1="60" x2="100" y2="340" stroke="#a0d0e8" stroke-width="0.5"/>
    <line x1="200" y1="60" x2="200" y2="340" stroke="#a0d0e8" stroke-width="0.5"/>
    <line x1="300" y1="60" x2="300" y2="340" stroke="#a0d0e8" stroke-width="0.5"/>
  </g>

  <!-- Ambient glow blob behind art -->
  <ellipse cx="200" cy="200" rx="100" ry="90" fill="#a0d0e8" opacity="0.06" clip-path="url(#cardClip44)"/>

  <!-- Card art -->
  <g clip-path="url(#cardClip44)">
    <g opacity="0.9">
      <line x1="200" y1="145" x2="200" y2="295" stroke="#a0d0e8" stroke-width="3"/>
      <line x1="145" y1="200" x2="255" y2="200" stroke="#a0d0e8" stroke-width="3"/>
      <line x1="157" y1="157" x2="243" y2="243" stroke="#a0d0e8" stroke-width="3"/>
      <line x1="243" y1="157" x2="157" y2="243" stroke="#a0d0e8" stroke-width="3"/>
      <line x1="200" y1="155" x2="185" y2="168" stroke="rgb(255,255,255)" stroke-width="1.5"/>
      <line x1="200" y1="155" x2="215" y2="168" stroke="rgb(255,255,255)" stroke-width="1.5"/>
      <line x1="200" y1="285" x2="185" y2="272" stroke="rgb(255,255,255)" stroke-width="1.5"/>
      <line x1="200" y1="285" x2="215" y2="272" stroke="rgb(255,255,255)" stroke-width="1.5"/>
      <line x1="152" y1="200" x2="165" y2="185" stroke="rgb(255,255,255)" stroke-width="1.5"/>
      <line x1="152" y1="200" x2="165" y2="215" stroke="rgb(255,255,255)" stroke-width="1.5"/>
      <line x1="248" y1="200" x2="235" y2="185" stroke="rgb(255,255,255)" stroke-width="1.5"/>
      <line x1="248" y1="200" x2="235" y2="215" stroke="rgb(255,255,255)" stroke-width="1.5"/>
      <circle cx="200" cy="200" r="18" fill="rgb(48,62,70)" stroke="#a0d0e8" stroke-width="2"/>
      <circle cx="200" cy="200" r="8" fill="#a0d0e8"/>
    </g>
  </g>

  <!-- Art area top fade -->
  <rect x="20" y="60" width="360" height="30" fill="url(#bgGrad44)" opacity="0.5" clip-path="url(#cardClip44)"/>

  <!-- Art-to-info divider -->
  <rect x="20" y="337" width="360" height="2" fill="#a0d0e8" opacity="0.4"/>

  <!-- Bottom info section -->
  <rect x="20" y="339" width="360" height="205" fill="url(#bottomGrad44)" clip-path="url(#cardClip44)"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="360" height="42" fill="url(#bgGrad44)" opacity="0.9" clip-path="url(#cardClip44)"/>
  <line x1="20" y1="62" x2="380" y2="62" stroke="#a0d0e8" stroke-width="1" opacity="0.5"/>

  <!-- Card number top-left -->
  <text x="34" y="46" font-family="monospace" font-size="13" font-weight="bold"
        fill="rgb(255,255,255)" opacity="0.75" letter-spacing="1">#044</text>

  <!-- Type icon top-right -->
  <text x="355" y="47" font-family="serif" font-size="18" text-anchor="middle"
        fill="#a0d0e8">★</text>

  <!-- Type label -->
  <text x="290" y="46" font-family="monospace" font-size="10" text-anchor="end"
        fill="#a0d0e8" opacity="0.6" letter-spacing="2">MAGIC</text>

  <!-- Rarity dots -->
  <circle cx="176" cy="46" r="4" fill="#aa44ff" opacity="0.6"/><circle cx="188" cy="46" r="4" fill="#aa44ff" opacity="0.6799999999999999"/><circle cx="200" cy="46" r="4" fill="#aa44ff" opacity="0.76"/>

  <!-- Name bar -->
  <rect x="24" y="345" width="352" height="40" rx="4" fill="url(#nameBarGrad44)"/>
  <line x1="24" y1="345" x2="376" y2="345" stroke="#a0d0e8" stroke-width="0.5" opacity="0.4"/>

  <!-- Card name -->
  <text x="200" y="372" font-family="'Arial Black', sans-serif" font-size="19"
        font-weight="900" text-anchor="middle" fill="rgb(255,255,255)" letter-spacing="3"
        style="text-transform:uppercase">BLIZZARD</text>

  <!-- Divider -->
  <line x1="36" y1="392" x2="364" y2="392" stroke="#a0d0e8" stroke-width="0.5" opacity="0.4"/>

  <!-- Effect label -->
  <text x="36" y="410" font-family="monospace" font-size="9" fill="#a0d0e8" opacity="0.6"
        letter-spacing="2">EFFECT</text>
  <text x="364" y="410" font-family="monospace" font-size="9" fill="#a0d0e8" opacity="0.6"
        text-anchor="end" letter-spacing="1">RARITY: RARE</text>

  <!-- Effect text -->
  <text x="200" y="430" font-family="'Arial', sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="rgb(255,255,255)" letter-spacing="1">Freeze area</text>

  <!-- Lore divider -->
  <line x1="36" y1="445" x2="364" y2="445" stroke="#a0d0e8" stroke-width="0.5" opacity="0.3"/>

  <!-- Lore text (italic, small) -->
  <text x="200" y="463" font-family="Georgia, serif" font-size="11"
          font-style="italic" text-anchor="middle" fill="rgb(255,255,255)" opacity="0.65"
          letter-spacing="0.5">Even memories freeze in it</text>

  <!-- Bottom logo -->
  <text x="200" y="536" font-family="monospace" font-size="9" text-anchor="middle"
        fill="#a0d0e8" opacity="0.4" letter-spacing="3">0xARK · SOLANA ZK PvP</text>

  <!-- Card border -->
  <rect x="18" y="18" width="364" height="524" rx="14"
        fill="none" stroke="#aa44ff" stroke-width="2.5"/>

  <!-- Inner border -->
  <rect x="22" y="22" width="356" height="516" rx="12"
        fill="none" stroke="rgb(255,255,255)" stroke-width="0.5" opacity="0.15"/>

  
  
</svg>