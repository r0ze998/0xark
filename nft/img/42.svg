<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bgGrad42" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(24,22,8)"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="artBgGrad42" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100818"/>
      <stop offset="100%" stop-color="#180e28"/>
    </linearGradient>
    <linearGradient id="bottomGrad42" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgb(24,22,8)"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="nameBarGrad42" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8b840" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#c8b840" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8b840" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="cardClip42">
      <rect x="16" y="16" width="368" height="528" rx="14"/>
    </clipPath>
    
    
    
  </defs>

  <!-- Card body -->
  <rect x="16" y="16" width="368" height="528" rx="14" fill="url(#bgGrad42)"/>

  <!-- Art area background -->
  <rect x="20" y="60" width="360" height="280" fill="url(#artBgGrad42)" clip-path="url(#cardClip42)"/>

  <!-- Subtle grid lines in art area -->
  <g opacity="0.07" clip-path="url(#cardClip42)">
    <line x1="20" y1="100" x2="380" y2="100" stroke="#c8b840" stroke-width="0.5"/>
    <line x1="20" y1="160" x2="380" y2="160" stroke="#c8b840" stroke-width="0.5"/>
    <line x1="20" y1="220" x2="380" y2="220" stroke="#c8b840" stroke-width="0.5"/>
    <line x1="20" y1="280" x2="380" y2="280" stroke="#c8b840" stroke-width="0.5"/>
    <line x1="100" y1="60" x2="100" y2="340" stroke="#c8b840" stroke-width="0.5"/>
    <line x1="200" y1="60" x2="200" y2="340" stroke="#c8b840" stroke-width="0.5"/>
    <line x1="300" y1="60" x2="300" y2="340" stroke="#c8b840" stroke-width="0.5"/>
  </g>

  <!-- Ambient glow blob behind art -->
  <ellipse cx="200" cy="200" rx="100" ry="90" fill="#c8b840" opacity="0.06" clip-path="url(#cardClip42)"/>

  <!-- Card art -->
  <g clip-path="url(#cardClip42)">
    <g opacity="0.9">
      <circle cx="200" cy="210" r="60" fill="none" stroke="#c8b840" stroke-width="3"/>
      <circle cx="200" cy="210" r="45" fill="none" stroke="#c8b840" stroke-width="1.5" opacity="0.6"/>
      <line x1="145" y1="178" x2="175" y2="195" stroke="rgb(255,255,115)" stroke-width="3" stroke-linecap="round"/>
      <line x1="255" y1="178" x2="225" y2="195" stroke="rgb(255,255,115)" stroke-width="3" stroke-linecap="round"/>
      <line x1="145" y1="242" x2="175" y2="225" stroke="rgb(255,255,115)" stroke-width="3" stroke-linecap="round"/>
      <line x1="255" y1="242" x2="225" y2="225" stroke="rgb(255,255,115)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="200" cy="210" r="18" fill="#c8b840" opacity="0.7"/>
      <circle cx="200" cy="210" r="8" fill="rgb(255,255,115)" opacity="0.8"/>
    </g>
  </g>

  <!-- Art area top fade -->
  <rect x="20" y="60" width="360" height="30" fill="url(#bgGrad42)" opacity="0.5" clip-path="url(#cardClip42)"/>

  <!-- Art-to-info divider -->
  <rect x="20" y="337" width="360" height="2" fill="#c8b840" opacity="0.4"/>

  <!-- Bottom info section -->
  <rect x="20" y="339" width="360" height="205" fill="url(#bottomGrad42)" clip-path="url(#cardClip42)"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="360" height="42" fill="url(#bgGrad42)" opacity="0.9" clip-path="url(#cardClip42)"/>
  <line x1="20" y1="62" x2="380" y2="62" stroke="#c8b840" stroke-width="1" opacity="0.5"/>

  <!-- Card number top-left -->
  <text x="34" y="46" font-family="monospace" font-size="13" font-weight="bold"
        fill="rgb(255,255,102)" opacity="0.75" letter-spacing="1">#042</text>

  <!-- Type icon top-right -->
  <text x="355" y="47" font-family="serif" font-size="18" text-anchor="middle"
        fill="#c8b840">★</text>

  <!-- Type label -->
  <text x="290" y="46" font-family="monospace" font-size="10" text-anchor="end"
        fill="#c8b840" opacity="0.6" letter-spacing="2">MAGIC</text>

  <!-- Rarity dots -->
  <circle cx="176" cy="46" r="4" fill="#4488ff" opacity="0.6"/><circle cx="188" cy="46" r="4" fill="#4488ff" opacity="0.6799999999999999"/>

  <!-- Name bar -->
  <rect x="24" y="345" width="352" height="40" rx="4" fill="url(#nameBarGrad42)"/>
  <line x1="24" y1="345" x2="376" y2="345" stroke="#c8b840" stroke-width="0.5" opacity="0.4"/>

  <!-- Card name -->
  <text x="200" y="372" font-family="'Arial Black', sans-serif" font-size="22"
        font-weight="900" text-anchor="middle" fill="rgb(255,255,102)" letter-spacing="3"
        style="text-transform:uppercase">STATIC</text>

  <!-- Divider -->
  <line x1="36" y1="392" x2="364" y2="392" stroke="#c8b840" stroke-width="0.5" opacity="0.4"/>

  <!-- Effect label -->
  <text x="36" y="410" font-family="monospace" font-size="9" fill="#c8b840" opacity="0.6"
        letter-spacing="2">EFFECT</text>
  <text x="364" y="410" font-family="monospace" font-size="9" fill="#c8b840" opacity="0.6"
        text-anchor="end" letter-spacing="1">RARITY: UNCOMMON</text>

  <!-- Effect text -->
  <text x="200" y="430" font-family="'Arial', sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="rgb(255,255,102)" letter-spacing="1">Stun 1T</text>

  <!-- Lore divider -->
  <line x1="36" y1="445" x2="364" y2="445" stroke="#c8b840" stroke-width="0.5" opacity="0.3"/>

  <!-- Lore text (italic, small) -->
  <text x="200" y="463" font-family="Georgia, serif" font-size="11"
          font-style="italic" text-anchor="middle" fill="rgb(255,255,102)" opacity="0.65"
          letter-spacing="0.5">The air before a strike</text>

  <!-- Bottom logo -->
  <text x="200" y="536" font-family="monospace" font-size="9" text-anchor="middle"
        fill="#c8b840" opacity="0.4" letter-spacing="3">0xARK · SOLANA ZK PvP</text>

  <!-- Card border -->
  <rect x="18" y="18" width="364" height="524" rx="14"
        fill="none" stroke="#4488ff" stroke-width="1.5"/>

  <!-- Inner border -->
  <rect x="22" y="22" width="356" height="516" rx="12"
        fill="none" stroke="rgb(255,255,102)" stroke-width="0.5" opacity="0.15"/>

  
  
</svg>