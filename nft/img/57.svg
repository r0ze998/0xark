<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bgGrad57" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(29,23,8)"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="artBgGrad57" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181008"/>
      <stop offset="100%" stop-color="#281808"/>
    </linearGradient>
    <linearGradient id="bottomGrad57" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgb(29,23,8)"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="nameBarGrad57" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0c040" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#f0c040" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0c040" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="cardClip57">
      <rect x="16" y="16" width="368" height="528" rx="14"/>
    </clipPath>
    
    
  <filter id="epicGlow57">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
    
  </defs>

  <!-- Card body -->
  <rect x="16" y="16" width="368" height="528" rx="14" fill="url(#bgGrad57)"/>

  <!-- Art area background -->
  <rect x="20" y="60" width="360" height="280" fill="url(#artBgGrad57)" clip-path="url(#cardClip57)"/>

  <!-- Subtle grid lines in art area -->
  <g opacity="0.07" clip-path="url(#cardClip57)">
    <line x1="20" y1="100" x2="380" y2="100" stroke="#f0c040" stroke-width="0.5"/>
    <line x1="20" y1="160" x2="380" y2="160" stroke="#f0c040" stroke-width="0.5"/>
    <line x1="20" y1="220" x2="380" y2="220" stroke="#f0c040" stroke-width="0.5"/>
    <line x1="20" y1="280" x2="380" y2="280" stroke="#f0c040" stroke-width="0.5"/>
    <line x1="100" y1="60" x2="100" y2="340" stroke="#f0c040" stroke-width="0.5"/>
    <line x1="200" y1="60" x2="200" y2="340" stroke="#f0c040" stroke-width="0.5"/>
    <line x1="300" y1="60" x2="300" y2="340" stroke="#f0c040" stroke-width="0.5"/>
  </g>

  <!-- Ambient glow blob behind art -->
  <ellipse cx="200" cy="200" rx="100" ry="90" fill="#f0c040" opacity="0.06" clip-path="url(#cardClip57)"/>

  <!-- Card art -->
  <g clip-path="url(#cardClip57)">
    <g opacity="0.95">
      <path d="M175,155 L225,155 L240,215 Q245,235 200,245 Q155,235 160,215Z" fill="rgb(72,58,19)" stroke="#f0c040" stroke-width="2"/>
      <ellipse cx="200" cy="245" rx="45" ry="12" fill="#f0c040" opacity="0.6"/>
      <ellipse cx="200" cy="215" rx="30" ry="10" fill="rgb(255,255,115)" opacity="0.4"/>
      <rect x="188" y="245" width="24" height="35" rx="2" fill="rgb(72,58,19)" stroke="#f0c040" stroke-width="1.5"/>
      <rect x="175" y="278" width="50" height="12" rx="4" fill="#f0c040"/>
      <path d="M175,155 Q165,155 162,168 Q175,175 200,178 Q225,175 238,168 Q235,155 225,155Z" fill="#f0c040" opacity="0.6"/>
    </g>
  </g>

  <!-- Art area top fade -->
  <rect x="20" y="60" width="360" height="30" fill="url(#bgGrad57)" opacity="0.5" clip-path="url(#cardClip57)"/>

  <!-- Art-to-info divider -->
  <rect x="20" y="337" width="360" height="2" fill="#f0c040" opacity="0.4"/>

  <!-- Bottom info section -->
  <rect x="20" y="339" width="360" height="205" fill="url(#bottomGrad57)" clip-path="url(#cardClip57)"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="360" height="42" fill="url(#bgGrad57)" opacity="0.9" clip-path="url(#cardClip57)"/>
  <line x1="20" y1="62" x2="380" y2="62" stroke="#f0c040" stroke-width="1" opacity="0.5"/>

  <!-- Card number top-left -->
  <text x="34" y="46" font-family="monospace" font-size="13" font-weight="bold"
        fill="rgb(255,255,102)" opacity="0.75" letter-spacing="1">#057</text>

  <!-- Type icon top-right -->
  <text x="355" y="47" font-family="serif" font-size="18" text-anchor="middle"
        fill="#f0c040">◎</text>

  <!-- Type label -->
  <text x="290" y="46" font-family="monospace" font-size="10" text-anchor="end"
        fill="#f0c040" opacity="0.6" letter-spacing="2">RECOVERY</text>

  <!-- Rarity dots -->
  <circle cx="176" cy="46" r="4" fill="#ffcc00" opacity="0.6"/><circle cx="188" cy="46" r="4" fill="#ffcc00" opacity="0.6799999999999999"/><circle cx="200" cy="46" r="4" fill="#ffcc00" opacity="0.76"/><circle cx="212" cy="46" r="4" fill="#ffcc00" opacity="0.84"/>

  <!-- Name bar -->
  <rect x="24" y="345" width="352" height="40" rx="4" fill="url(#nameBarGrad57)"/>
  <line x1="24" y1="345" x2="376" y2="345" stroke="#f0c040" stroke-width="0.5" opacity="0.4"/>

  <!-- Card name -->
  <text x="200" y="372" font-family="'Arial Black', sans-serif" font-size="22"
        font-weight="900" text-anchor="middle" fill="rgb(255,255,102)" letter-spacing="3"
        style="text-transform:uppercase">ELIXIR</text>

  <!-- Divider -->
  <line x1="36" y1="392" x2="364" y2="392" stroke="#f0c040" stroke-width="0.5" opacity="0.4"/>

  <!-- Effect label -->
  <text x="36" y="410" font-family="monospace" font-size="9" fill="#f0c040" opacity="0.6"
        letter-spacing="2">EFFECT</text>
  <text x="364" y="410" font-family="monospace" font-size="9" fill="#f0c040" opacity="0.6"
        text-anchor="end" letter-spacing="1">RARITY: EPIC</text>

  <!-- Effect text -->
  <text x="200" y="430" font-family="'Arial', sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="rgb(255,255,102)" letter-spacing="1">Cure all</text>

  <!-- Lore divider -->
  <line x1="36" y1="445" x2="364" y2="445" stroke="#f0c040" stroke-width="0.5" opacity="0.3"/>

  <!-- Lore text (italic, small) -->
  <text x="200" y="463" font-family="Georgia, serif" font-size="11"
          font-style="italic" text-anchor="middle" fill="rgb(255,255,102)" opacity="0.65"
          letter-spacing="0.5">What alchemists dreamed of</text>

  <!-- Bottom logo -->
  <text x="200" y="536" font-family="monospace" font-size="9" text-anchor="middle"
        fill="#f0c040" opacity="0.4" letter-spacing="3">0xARK · SOLANA ZK PvP</text>

  <!-- Card border -->
  <rect x="18" y="18" width="364" height="524" rx="14"
        fill="none" stroke="#ffcc00" stroke-width="2.5"/>

  <!-- Inner border -->
  <rect x="22" y="22" width="356" height="516" rx="12"
        fill="none" stroke="rgb(255,255,102)" stroke-width="0.5" opacity="0.15"/>

  
  
  <rect x="18" y="18" width="364" height="524" rx="14"
    fill="none" stroke="#f0c040" stroke-width="2.5"
    filter="url(#epicGlow57)" opacity="0.85"/>
</svg>