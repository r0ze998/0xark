<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(26,11,8)"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="artBgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#2a0e0e"/>
    </linearGradient>
    <linearGradient id="bottomGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgb(26,11,8)"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="nameBarGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d85840" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#d85840" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d85840" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="cardClip3">
      <rect x="16" y="16" width="368" height="528" rx="14"/>
    </clipPath>
    
    
    
  </defs>

  <!-- Card body -->
  <rect x="16" y="16" width="368" height="528" rx="14" fill="url(#bgGrad3)"/>

  <!-- Art area background -->
  <rect x="20" y="60" width="360" height="280" fill="url(#artBgGrad3)" clip-path="url(#cardClip3)"/>

  <!-- Subtle grid lines in art area -->
  <g opacity="0.07" clip-path="url(#cardClip3)">
    <line x1="20" y1="100" x2="380" y2="100" stroke="#d85840" stroke-width="0.5"/>
    <line x1="20" y1="160" x2="380" y2="160" stroke="#d85840" stroke-width="0.5"/>
    <line x1="20" y1="220" x2="380" y2="220" stroke="#d85840" stroke-width="0.5"/>
    <line x1="20" y1="280" x2="380" y2="280" stroke="#d85840" stroke-width="0.5"/>
    <line x1="100" y1="60" x2="100" y2="340" stroke="#d85840" stroke-width="0.5"/>
    <line x1="200" y1="60" x2="200" y2="340" stroke="#d85840" stroke-width="0.5"/>
    <line x1="300" y1="60" x2="300" y2="340" stroke="#d85840" stroke-width="0.5"/>
  </g>

  <!-- Ambient glow blob behind art -->
  <ellipse cx="200" cy="200" rx="100" ry="90" fill="#d85840" opacity="0.06" clip-path="url(#cardClip3)"/>

  <!-- Card art -->
  <g clip-path="url(#cardClip3)">
    <g opacity="0.95">
      <ellipse cx="200" cy="165" rx="20" ry="23" fill="rgb(86,35,26)" stroke="#d85840" stroke-width="2"/>
      <rect x="190" y="188" width="20" height="55" rx="3" fill="rgb(86,35,26)" stroke="#d85840" stroke-width="1.5"/>
      <ellipse cx="170" cy="235" rx="18" ry="22" fill="#d85840" opacity="0.7"/>
      <ellipse cx="230" cy="235" rx="18" ry="22" fill="#d85840" opacity="0.7"/>
      <ellipse cx="170" cy="235" rx="10" ry="13" fill="rgb(255,141,102)" opacity="0.6"/>
      <ellipse cx="230" cy="235" rx="10" ry="13" fill="rgb(255,141,102)" opacity="0.6"/>
      <path d="M170,213 Q160,200 170,190 Q175,210 170,213Z" fill="rgb(255,141,102)"/>
      <path d="M230,213 Q240,200 230,190 Q225,210 230,213Z" fill="rgb(255,141,102)"/>
    </g>
  </g>

  <!-- Art area top fade -->
  <rect x="20" y="60" width="360" height="30" fill="url(#bgGrad3)" opacity="0.5" clip-path="url(#cardClip3)"/>

  <!-- Art-to-info divider -->
  <rect x="20" y="337" width="360" height="2" fill="#d85840" opacity="0.4"/>

  <!-- Bottom info section -->
  <rect x="20" y="339" width="360" height="205" fill="url(#bottomGrad3)" clip-path="url(#cardClip3)"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="360" height="42" fill="url(#bgGrad3)" opacity="0.9" clip-path="url(#cardClip3)"/>
  <line x1="20" y1="62" x2="380" y2="62" stroke="#d85840" stroke-width="1" opacity="0.5"/>

  <!-- Card number top-left -->
  <text x="34" y="46" font-family="monospace" font-size="13" font-weight="bold"
        fill="rgb(255,141,102)" opacity="0.75" letter-spacing="1">#003</text>

  <!-- Type icon top-right -->
  <text x="355" y="47" font-family="serif" font-size="18" text-anchor="middle"
        fill="#d85840">⚔</text>

  <!-- Type label -->
  <text x="290" y="46" font-family="monospace" font-size="10" text-anchor="end"
        fill="#d85840" opacity="0.6" letter-spacing="2">ATTACK</text>

  <!-- Rarity dots -->
  <circle cx="176" cy="46" r="4" fill="#aa44ff" opacity="0.6"/><circle cx="188" cy="46" r="4" fill="#aa44ff" opacity="0.6799999999999999"/><circle cx="200" cy="46" r="4" fill="#aa44ff" opacity="0.76"/>

  <!-- Name bar -->
  <rect x="24" y="345" width="352" height="40" rx="4" fill="url(#nameBarGrad3)"/>
  <line x1="24" y1="345" x2="376" y2="345" stroke="#d85840" stroke-width="0.5" opacity="0.4"/>

  <!-- Card name -->
  <text x="200" y="372" font-family="'Arial Black', sans-serif" font-size="22"
        font-weight="900" text-anchor="middle" fill="rgb(255,141,102)" letter-spacing="3"
        style="text-transform:uppercase">IGNIS</text>

  <!-- Divider -->
  <line x1="36" y1="392" x2="364" y2="392" stroke="#d85840" stroke-width="0.5" opacity="0.4"/>

  <!-- Effect label -->
  <text x="36" y="410" font-family="monospace" font-size="9" fill="#d85840" opacity="0.6"
        letter-spacing="2">EFFECT</text>
  <text x="364" y="410" font-family="monospace" font-size="9" fill="#d85840" opacity="0.6"
        text-anchor="end" letter-spacing="1">RARITY: RARE</text>

  <!-- Effect text -->
  <text x="200" y="430" font-family="'Arial', sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="rgb(255,141,102)" letter-spacing="1">Burn card</text>

  <!-- Lore divider -->
  <line x1="36" y1="445" x2="364" y2="445" stroke="#d85840" stroke-width="0.5" opacity="0.3"/>

  <!-- Lore text (italic, small) -->
  <text x="200" y="463" font-family="Georgia, serif" font-size="11"
          font-style="italic" text-anchor="middle" fill="rgb(255,141,102)" opacity="0.65"
          letter-spacing="0.5">Fire that never drowns</text>

  <!-- Bottom logo -->
  <text x="200" y="536" font-family="monospace" font-size="9" text-anchor="middle"
        fill="#d85840" opacity="0.4" letter-spacing="3">0xARK · SOLANA ZK PvP</text>

  <!-- Card border -->
  <rect x="18" y="18" width="364" height="524" rx="14"
        fill="none" stroke="#aa44ff" stroke-width="2.5"/>

  <!-- Inner border -->
  <rect x="22" y="22" width="356" height="516" rx="12"
        fill="none" stroke="rgb(255,141,102)" stroke-width="0.5" opacity="0.15"/>

  
  
</svg>