<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bgGrad29" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(9,24,18)"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="artBgGrad29" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081408"/>
      <stop offset="100%" stop-color="#0e1e0e"/>
    </linearGradient>
    <linearGradient id="bottomGrad29" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgb(9,24,18)"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="nameBarGrad29" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48c898" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#48c898" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#48c898" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="cardClip29">
      <rect x="16" y="16" width="368" height="528" rx="14"/>
    </clipPath>
    
    
    
  </defs>

  <!-- Card body -->
  <rect x="16" y="16" width="368" height="528" rx="14" fill="url(#bgGrad29)"/>

  <!-- Art area background -->
  <rect x="20" y="60" width="360" height="280" fill="url(#artBgGrad29)" clip-path="url(#cardClip29)"/>

  <!-- Subtle grid lines in art area -->
  <g opacity="0.07" clip-path="url(#cardClip29)">
    <line x1="20" y1="100" x2="380" y2="100" stroke="#48c898" stroke-width="0.5"/>
    <line x1="20" y1="160" x2="380" y2="160" stroke="#48c898" stroke-width="0.5"/>
    <line x1="20" y1="220" x2="380" y2="220" stroke="#48c898" stroke-width="0.5"/>
    <line x1="20" y1="280" x2="380" y2="280" stroke="#48c898" stroke-width="0.5"/>
    <line x1="100" y1="60" x2="100" y2="340" stroke="#48c898" stroke-width="0.5"/>
    <line x1="200" y1="60" x2="200" y2="340" stroke="#48c898" stroke-width="0.5"/>
    <line x1="300" y1="60" x2="300" y2="340" stroke="#48c898" stroke-width="0.5"/>
  </g>

  <!-- Ambient glow blob behind art -->
  <ellipse cx="200" cy="200" rx="100" ry="90" fill="#48c898" opacity="0.06" clip-path="url(#cardClip29)"/>

  <!-- Card art -->
  <g clip-path="url(#cardClip29)">
    <g opacity="0.9">
      <ellipse cx="240" cy="168" rx="18" ry="20" fill="rgb(22,60,46)" stroke="#48c898" stroke-width="2"/>
      <rect x="230" y="188" width="16" height="48" rx="3" fill="rgb(22,60,46)" stroke="#48c898" stroke-width="1.5"/>
      <line x1="238" y1="236" x2="222" y2="290" stroke="#48c898" stroke-width="6" stroke-linecap="round"/>
      <line x1="246" y1="236" x2="262" y2="290" stroke="#48c898" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="200" cy="168" rx="18" ry="20" fill="#48c898" opacity="0.4"/>
      <rect x="190" y="188" width="16" height="48" rx="3" fill="#48c898" opacity="0.35"/>
      <ellipse cx="163" cy="168" rx="18" ry="20" fill="#48c898" opacity="0.2"/>
      <rect x="153" y="188" width="16" height="48" rx="3" fill="#48c898" opacity="0.15"/>
      <path d="M163,168 L240,168" stroke="rgb(130,255,255)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    </g>
  </g>

  <!-- Art area top fade -->
  <rect x="20" y="60" width="360" height="30" fill="url(#bgGrad29)" opacity="0.5" clip-path="url(#cardClip29)"/>

  <!-- Art-to-info divider -->
  <rect x="20" y="337" width="360" height="2" fill="#48c898" opacity="0.4"/>

  <!-- Bottom info section -->
  <rect x="20" y="339" width="360" height="205" fill="url(#bottomGrad29)" clip-path="url(#cardClip29)"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="360" height="42" fill="url(#bgGrad29)" opacity="0.9" clip-path="url(#cardClip29)"/>
  <line x1="20" y1="62" x2="380" y2="62" stroke="#48c898" stroke-width="1" opacity="0.5"/>

  <!-- Card number top-left -->
  <text x="34" y="46" font-family="monospace" font-size="13" font-weight="bold"
        fill="rgb(115,255,243)" opacity="0.75" letter-spacing="1">#029</text>

  <!-- Type icon top-right -->
  <text x="355" y="47" font-family="serif" font-size="18" text-anchor="middle"
        fill="#48c898">●</text>

  <!-- Type label -->
  <text x="290" y="46" font-family="monospace" font-size="10" text-anchor="end"
        fill="#48c898" opacity="0.6" letter-spacing="2">FLEE</text>

  <!-- Rarity dots -->
  <circle cx="176" cy="46" r="4" fill="#aa44ff" opacity="0.6"/><circle cx="188" cy="46" r="4" fill="#aa44ff" opacity="0.6799999999999999"/><circle cx="200" cy="46" r="4" fill="#aa44ff" opacity="0.76"/>

  <!-- Name bar -->
  <rect x="24" y="345" width="352" height="40" rx="4" fill="url(#nameBarGrad29)"/>
  <line x1="24" y1="345" x2="376" y2="345" stroke="#48c898" stroke-width="0.5" opacity="0.4"/>

  <!-- Card name -->
  <text x="200" y="372" font-family="'Arial Black', sans-serif" font-size="22"
        font-weight="900" text-anchor="middle" fill="rgb(115,255,243)" letter-spacing="3"
        style="text-transform:uppercase">BLINK</text>

  <!-- Divider -->
  <line x1="36" y1="392" x2="364" y2="392" stroke="#48c898" stroke-width="0.5" opacity="0.4"/>

  <!-- Effect label -->
  <text x="36" y="410" font-family="monospace" font-size="9" fill="#48c898" opacity="0.6"
        letter-spacing="2">EFFECT</text>
  <text x="364" y="410" font-family="monospace" font-size="9" fill="#48c898" opacity="0.6"
        text-anchor="end" letter-spacing="1">RARITY: RARE</text>

  <!-- Effect text -->
  <text x="200" y="430" font-family="'Arial', sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="rgb(115,255,243)" letter-spacing="1">Teleport</text>

  <!-- Lore divider -->
  <line x1="36" y1="445" x2="364" y2="445" stroke="#48c898" stroke-width="0.5" opacity="0.3"/>

  <!-- Lore text (italic, small) -->
  <text x="200" y="463" font-family="Georgia, serif" font-size="11"
          font-style="italic" text-anchor="middle" fill="rgb(115,255,243)" opacity="0.65"
          letter-spacing="0.5">Here and gone and here</text>

  <!-- Bottom logo -->
  <text x="200" y="536" font-family="monospace" font-size="9" text-anchor="middle"
        fill="#48c898" opacity="0.4" letter-spacing="3">0xARK · SOLANA ZK PvP</text>

  <!-- Card border -->
  <rect x="18" y="18" width="364" height="524" rx="14"
        fill="none" stroke="#aa44ff" stroke-width="2.5"/>

  <!-- Inner border -->
  <rect x="22" y="22" width="356" height="516" rx="12"
        fill="none" stroke="rgb(115,255,243)" stroke-width="0.5" opacity="0.15"/>

  
  
</svg>