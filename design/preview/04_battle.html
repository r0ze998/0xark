<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>0xARK — Battle</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { margin:0; background:#222; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .battle-bg { position:absolute; inset:0;
    background:
      linear-gradient(180deg, #1c3868 0 50%, #c89060 50% 100%);
  }
  .opponent { position:absolute; left:300px; top:40px; width:64px; height:64px;
    background: linear-gradient(180deg, #882060 0 30%, #e040a0 30% 75%, #181028 75% 100%);
    border:2px solid #181028;
    box-shadow: inset -6px -6px 0 #5c0040, inset 6px 6px 0 #ff70b0;
  }
  .opponent-tag {
    position:absolute; left:80px; top:40px; background:#3858a0; color:#f8f8e8;
    border:2px solid #181028; box-shadow: inset 0 0 0 2px #ffd860;
    padding:4px 10px; font:14px var(--font-pixel); min-width:160px;
  }
  .opponent-tag .nm { color:#ff70b0; font-size:16px; }
  .player-card { position:absolute; left:60px; top:160px; width:72px; height:72px;
    background: linear-gradient(180deg, #c82828 0 25%, #f8e8c0 25% 55%, #4880c8 55% 90%, #181028 90% 100%);
    border:2px solid #181028;
    box-shadow: inset -4px -4px 0 #802820, inset 4px 4px 0 #fff8e0;
  }
  .player-tag {
    position:absolute; right:8px; top:155px; background:#3858a0; color:#f8f8e8;
    border:2px solid #181028; box-shadow: inset 0 0 0 2px #ffd860;
    padding:4px 10px; font:14px var(--font-pixel); min-width:140px;
  }
  .player-tag .nm { color:#ffd860; font-size:16px; }
  .bar { height: 6px; background:#181028; padding:1px; margin-top:3px; }
  .bar > i { display:block; height:100%; background:#58c068; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); }
</style></head>
<body>
<div class="gba-viewport battle-bg" data-screen-label="Battle">
  <div class="hud">
    <span>BATTLE · ROUND 04</span>
    <span style="margin-left:auto">COMMIT-REVEAL</span>
  </div>

  <div class="opponent-tag">
    <div class="nm">VEGA  L.12</div>
    <div class="bar"><i style="width:62%"></i></div>
    <div style="font-size:8px; color:#a8a8c0; margin-top:3px">HAND: ?? ?? ??</div>
  </div>
  <div class="opponent"></div>

  <div class="player-card"></div>
  <div class="player-tag">
    <div class="nm">YOU  L.10</div>
    <div class="bar"><i style="width:78%; background:#58c068"></i></div>
    <div style="font-size:8px; color:#a8a8c0; margin-top:3px">5 CARDS · 1 SCROLL</div>
  </div>

  <ul class="action-menu">
    <li class="sel">DRAW</li>
    <li>STEAL</li>
    <li>BARRIER</li>
    <li>SCOUT</li>
    <li>USE CARD</li>
  </ul>

  <div class="dialog-bottom" style="right:140px">
    <span class="cur">►</span>What will you commit?<br>(your choice is sealed)
  </div>
</div>
</body></html>
