<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>0xARK — Town</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { margin:0; background:#222; min-height:100vh; display:flex; align-items:center; justify-content:center; }

  /* Stage: render the whole town at native 240×160 then 2× scale so pixels stay crisp
     and coordinates stay clean. */
  .map {
    position:absolute; left:0; top:0; width:240px; height:160px;
    transform: scale(2); transform-origin: top left;
    image-rendering: pixelated;
  }

  /* ───────── Simple, easy-to-read background ───────── */
  /* Flat grass with a very subtle 16×16 tile hint — no tufts, no checker overlay */
  .grass-base {
    position:absolute; inset:0;
    background:#58c068;
    background-image:
      linear-gradient(0deg,  rgba(40,120,64,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(40,120,64,0.15) 1px, transparent 1px);
    background-size: 16px 16px;
  }

  /* --- Tree tile (16x16) --- */
  .tree {
    position:absolute; width:16px; height:16px;
    background:#287840;
    box-shadow:
      inset -2px -2px 0 #1c5028,
      inset 2px 2px 0 #58c068,
      0 0 0 1px #181028;
  }

  /* --- Path tile: solid tan with dark outline --- */
  .path {
    position:absolute;
    background:#d8a868;
    box-shadow: inset 0 0 0 1px #805028;
  }

  /* --- Water --- */
  .water {
    position:absolute;
    background:#4880c8;
    box-shadow:
      inset 0 4px 0 rgba(28,56,104,0.5),
      inset 0 -2px 0 #1c3868,
      inset 0 0 0 1px #1c3868;
  }

  /* --- Sand --- */
  .sand { position:absolute; background:#e8c878; }
  .dock {
    position:absolute;
    background: repeating-linear-gradient(90deg, #805028 0 3px, #5c3818 3px 4px, #805028 4px 8px);
    box-shadow: inset 0 0 0 1px #181028;
  }

  /* --- House (FRLG-style) --- */
  .house { position:absolute; image-rendering: pixelated; }
  .house .roof {
    position:absolute; top:0; left:-4px; right:-4px; height:18px;
    background:#d04030;
    border: 2px solid #181028;
    box-shadow:
      inset 0 3px 0 #e86050,
      inset 0 -3px 0 #902818;
  }
  .house .roof::before {
    content:''; position:absolute; left:0; right:0; top:5px; height:2px;
    background:#902818;
  }
  .house .roof::after {
    content:''; position:absolute; top:-6px; right:8px;
    width:4px; height:8px; background:#805028;
    border:2px solid #181028; border-bottom:none;
  }
  .house .body {
    position:absolute; top:18px; left:0; right:0; bottom:0;
    background:#d8d0c0;
    border:2px solid #181028;
    box-shadow: inset 0 -3px 0 #a0a090;
  }
  .house .body::before,
  .house .body::after {
    content:''; position:absolute; top:4px;
    width:8px; height:7px;
    background: linear-gradient(180deg, #4880c8 0 50%, #1c3868 50% 100%);
    border:1px solid #181028;
  }
  .house .body::before { left:3px; }
  .house .body::after  { right:3px; }
  .door {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:8px; height:10px;
    background:#805028;
    border:2px solid #181028;
    border-bottom:none;
  }
  .door::after {
    content:''; position:absolute; top:4px; right:1px;
    width:1px; height:1px; background:#ffd860;
  }
  .house.gacha  .roof { background:#7040a0; box-shadow: inset 0 3px 0 #a060c0, inset 0 -3px 0 #401868; }
  .house.gacha  .roof::before { background:#401868; }
  .house.harbor .roof { background:#3858a0; box-shadow: inset 0 3px 0 #4880c8, inset 0 -3px 0 #1c3868; }
  .house.harbor .roof::before { background:#1c3868; }
  .house.barn   .roof { background:#c8a868; box-shadow: inset 0 3px 0 #e8c878, inset 0 -3px 0 #805028; }
  .house.barn   .roof::before { background:#805028; }

  /* Sign posts */
  .sign {
    position:absolute;
    background:#f8e8c0;
    border:1px solid #181028;
    color:#181028;
    font: 6px var(--font-pixel);
    letter-spacing:0.05em;
    text-align:center; line-height: 8px;
    padding: 0 2px;
    box-shadow: inset 0 -2px 0 #d8a868;
    z-index: 3;
  }

  /* Flowers / bushes */
  .flower { position:absolute; width:3px; height:3px; background:#ff70b0; }
  .flower.y { background:#ffd860; }
  .flower.w { background:#f8e8c0; }
  .bush { position:absolute; width:8px; height:6px; background:#287840; border:1px solid #181028; box-shadow: inset 1px 1px 0 #58c068; }

  /* Fence */
  .fence { position:absolute; height:5px;
    background: repeating-linear-gradient(90deg, #805028 0 3px, transparent 3px 6px), #a07040;
    border-top: 1px solid #181028; border-bottom: 1px solid #181028;
  }

  /* Sprites — render in the native map coordinate space */
  .npc {
    position:absolute; width:12px; height:14px; z-index:6;
    image-rendering:pixelated;
  }
  .npc.sailor {
    background:
      linear-gradient(180deg,
        #181028   0 3px,   /* hat */
        #f8e8c0   3px 6px, /* face */
        #c82828   6px 10px,/* shirt */
        #1c3868  10px 13px,/* pants */
        #181028  13px 14px); /* feet */
    box-shadow: 0 0 0 1px #181028;
  }
  .npc.player {
    width:12px; height:14px;
    background:
      linear-gradient(180deg,
        #c82828   0 3px,
        #f8e8c0   3px 6px,
        #ffd860   6px 10px,
        #1c3868  10px 13px,
        #181028  13px 14px);
    box-shadow: 0 0 0 1px #181028;
  }

  /* HUD / banner / dialog — these live OUTSIDE the scaled map so text stays sharp */
</style></head>
