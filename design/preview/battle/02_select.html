<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Battle · select</title>
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="../battle.css">
<style>body{margin:0;background:#222;min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head><body>
<div class="gba-viewport" data-screen-label="Battle select">
  <div class="arena-bg"></div>
  <div class="bhud">
    <span class="round">ROUND 04</span>
    <span>COMMIT</span>
    <span class="rival-id vega" style="margin-left:auto">VEGA · thinking...</span>
  </div>

  <div class="hpbox vega" style="left:8px; top:40px; min-width:140px">
    <div class="nm">VEGA  L.12</div>
    <div class="bar"><i style="width:62%"></i></div>
    <div class="meta" style="font-size:8px; margin-top:3px">HAND ?? ?? ??</div>
  </div>
  <div class="hpbox you" style="right:8px; top:40px; min-width:140px">
    <div class="nm">YOU  L.10</div>
    <div class="bar"><i style="width:78%"></i></div>
    <div class="meta" style="font-size:8px; margin-top:3px">5 CARDS · 1 SCROLL</div>
  </div>

  <div class="combatant rival"></div>
  <div class="combatant you"></div>

  <div class="act-menu">
    <div class="title">CHOOSE ACTION</div>
    <ul>
      <li class="sel"><span class="glyph">+</span>DRAW</li>
      <li><span class="glyph">⚔</span>STEAL</li>
      <li><span class="glyph">◈</span>BARRIER</li>
      <li><span class="glyph">✦</span>SCOUT</li>
      <li><span class="glyph">★</span>USE CARD</li>
    </ul>
  </div>

  <div class="dialog-bottom" style="right:190px">
    <span class="cur">►</span>What will you commit?<br>
    <span style="font-size:8px; color:#ffd860; letter-spacing:0.1em">ZK-HIDDEN UNTIL REVEAL</span>
  </div>
</div>
</body></html>
