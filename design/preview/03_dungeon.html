<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>0xARK — Dungeon</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { margin:0; background:#222; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .wall { position:absolute; background:#482818; border:2px solid #181028; box-shadow: inset 0 -4px 0 #281008, inset 0 4px 0 #6c4828; }
  .stairs { position:absolute; width:48px; height:24px; background:#181028; border:2px solid #6c4828;
    background: repeating-linear-gradient(90deg, #181028 0 6px, #6c4828 6px 12px); }
  .player { left:208px; top:172px; }
  .vega-pulse {
    position:absolute; left:120px; top:120px; width:16px; height:16px;
    box-shadow: 0 0 0 3px rgba(255,112,176,0.7);
    animation: dpulse 0.8s infinite step-end;
  }
  @keyframes dpulse { 50% { box-shadow: 0 0 0 6px rgba(255,112,176,0.4); } }
</style></head>
<body>
<div class="gba-viewport bg-dungeon" data-screen-label="Dungeon">
  <div class="hud">
    <span>♥ 64/100</span>
    <span class="vega">V: B3 ●</span>
    <span class="mira">M: B5</span>
    <span style="margin-left:auto">B3F · CARDS 18/60</span>
  </div>

  <div class="wall" style="left:0; top:32px; width:60px; height:80px"></div>
  <div class="wall" style="right:0; top:32px; width:80px; height:60px"></div>
  <div class="wall" style="left:0; bottom:60px; width:48px; height:60px"></div>
  <div class="wall" style="right:0; bottom:60px; width:120px; height:60px"></div>
  <div class="stairs" style="left:140px; top:60px"></div>

  <div class="banner-floor" style="top:42px">~ B3 SUNKEN HOLD ~</div>

  <div class="vega-pulse">
    <div class="sprite sprite-vega" style="position:relative"></div>
  </div>
  <div class="sprite sprite-player player"></div>

  <div class="bg-fog"></div>

  <div class="dialog-bottom">
    <span class="cur">►</span>A presence stalks the floor.<br>VEGA is near...
  </div>
</div>
</body></html>
