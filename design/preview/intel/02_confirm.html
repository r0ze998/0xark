<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Intel Shop · confirm</title>
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="../intel.css">
<style>body{margin:0;background:#222;min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head><body>
<div class="gba-viewport" data-screen-label="Intel Shop · confirm">
  <div class="shop-interior">
    <div class="wall"></div>
    <div class="floor"></div>
  </div>
  <div class="lantern"></div>
  <div class="merchant" style="filter: brightness(0.65)">
    <div class="hood"></div>
    <div class="face">
      <div class="eye l"></div>
      <div class="eye r"></div>
    </div>
    <div class="clasp"></div>
    <div class="robe"></div>
  </div>
  <div class="counter" style="filter: brightness(0.65)"></div>

  <!-- Darkening overlay -->
  <div style="position:absolute; inset:0; background:rgba(12,8,24,0.5); z-index:5"></div>

  <div class="confirm-modal">
    <div class="nm">► /intel/hand</div>
    <div class="price-big">$0.003</div>
    <div class="chain-hint">USDC · SOLANA · x402</div>
    <div style="font-size:14px; margin:6px 0 12px; color:#181028">Unseal rival's hand?</div>
    <div class="choices">
      <span class="sel">YES</span>
      <span class="dim">NO</span>
    </div>
  </div>
</div>
</body></html>
