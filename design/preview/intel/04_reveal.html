<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Intel Shop · reveal</title>
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="../intel.css">
<style>body{margin:0;background:#222;min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head><body>
<div class="gba-viewport" data-screen-label="Intel Shop · reveal">
  <div class="shop-interior">
    <div class="wall"></div>
    <div class="floor"></div>
  </div>
  <div class="lantern"></div>

  <!-- Scroll centered with candle glow behind -->
  <div style="position:absolute; inset:0; background: radial-gradient(ellipse at 50% 50%, rgba(240,184,40,0.3) 0%, transparent 60%); z-index:1"></div>

  <div class="intel-scroll">
    <div class="stamp">UNSEALED</div>
    <div class="hdr">
      <span class="path">/intel/hand</span>
      <span>VEGA</span>
    </div>
    <div class="data">
      <div><span class="label">HAND:</span>  <span class="val">STEAL · BARRIER · DRAW</span></div>
      <div><span class="label">DECK:</span>  <span class="val">17 / 24</span></div>
      <div><span class="label">HP:</span>    <span class="val">62%</span></div>
      <div><span class="label">SCRLS:</span> <span class="val">1 SEALED</span></div>
      <div style="margin-top:4px" class="dim">TTL: THIS ROUND ONLY · NOT STORED ON-CHAIN</div>
    </div>
    <div class="footer">
      <span>valid until reveal</span>
      <span class="tx">tx: 8kP4…b12f</span>
    </div>
  </div>

  <div class="dialog-bottom" style="z-index:15">
    <span class="cur">►</span>The cloaked dealer nods, satisfied.<br>
    <span style="font-size:8px; color:#ffd860">Press Z to continue</span>
  </div>
</div>
</body></html>
