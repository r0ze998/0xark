<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Intel Shop · paywall breaking</title>
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="../intel.css">
<style>body{margin:0;background:#222;min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head><body>
<div class="gba-viewport" data-screen-label="Intel Shop · paywall breaking">
  <!-- Near-black backdrop so the gold shatter POPS -->
  <div style="position:absolute; inset:0; background:#0c0818; z-index:0"></div>

  <!-- Shockwave ring -->
  <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
              width:360px; height:360px; border-radius:50%;
              border:6px solid #ffd860;
              box-shadow: 0 0 0 2px #181028, inset 0 0 0 2px #181028, 0 0 40px rgba(240,184,40,0.6);
              opacity:0.6;
              z-index:1;
              clip-path: polygon(0 45%, 100% 45%, 100% 55%, 0 55%);"></div>

  <div class="paywall breaking">
    <div class="slab"></div>
    <div class="lock">
      <div class="shackle"></div>
      <div class="body"></div>
    </div>
    <div class="shard s1"></div>
    <div class="shard s2"></div>
    <div class="shard s3"></div>
    <div class="shard s4"></div>
    <div class="shard s5"></div>
    <div class="shard s6"></div>
    <div class="shard s7"></div>
    <div class="shard s8"></div>
  </div>

  <!-- HUD label -->
  <div style="position:absolute; left:50%; bottom:40px; transform:translateX(-50%);
              font:24px var(--font-pixel); color:#ffd860;
              text-shadow: 2px 2px 0 #c82828, -1px -1px 0 #181028;
              letter-spacing:0.1em; z-index:10;">
    PAYWALL BROKEN!
  </div>
  <div style="position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
              font:8px var(--font-pixel); color:#a8a8c0;
              letter-spacing:0.2em; z-index:10;">
    x402 · PAYMENT REQUIRED · 0.003 USDC · SETTLED
  </div>
</div>
</body></html>
