<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Intel Shop · menu</title>
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="../intel.css">
<style>body{margin:0;background:#222;min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head><body>
<div class="gba-viewport" data-screen-label="Intel Shop · menu">
  <div class="shop-interior">
    <div class="wall"></div>
    <div class="floor"></div>
  </div>
  <div class="lantern"></div>

  <div class="merchant">
    <div class="hood"></div>
    <div class="face">
      <div class="eye l"></div>
      <div class="eye r"></div>
    </div>
    <div class="clasp"></div>
    <div class="robe"></div>
  </div>

  <div class="counter"></div>

  <!-- Banner -->
  <div class="banner-floor" style="top:12px">x402 INTEL DEALER</div>

  <!-- Product menu -->
  <div class="intel-menu">
    <div class="title">
      <span>WARES</span>
      <span class="x402">x402 · USDC · SOLANA</span>
    </div>
    <ul>
      <li class="sel">
        <span class="path">/intel/hand</span>
        <span class="price">$0.003</span>
      </li>
      <li>
        <span class="path">/intel/location</span>
        <span class="price">$0.002</span>
      </li>
      <li>
        <span class="path">/intel/strategy</span>
        <span class="price">$0.005</span>
      </li>
      <li>
        <span class="path">/intel/market</span>
        <span class="price free">FREE</span>
      </li>
    </ul>
    <div class="hint">
      <span>▲▼ CHOOSE</span>
      <span style="color:#ffd860">Z · BUY</span>
    </div>
  </div>
</div>
</body></html>
