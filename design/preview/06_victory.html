<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>0xARK — Victory</title>
<link rel="stylesheet" href="kit.css">
<style>
  body { margin:0; background:#222; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .vbg { position:absolute; inset:0;
    background: radial-gradient(circle at 50% 60%, #f0b828 0%, #c82828 40%, #1c3868 100%);
  }
  .star { position:absolute; color:#ffd860; font:24px var(--font-pixel); }
  .panel {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:#3858a0; color:#f8f8e8;
    border:2px solid #181028; box-shadow: inset 0 0 0 2px #ffd860;
    padding:14px 22px;
    text-align:center;
    font:16px var(--font-pixel);
    min-width:280px;
  }
  .panel h1 { font:32px var(--font-pixel); color:#ffd860; text-shadow: 2px 2px 0 #181028; margin:0 0 8px; letter-spacing:0.06em; }
  .panel .row { display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dashed #58587a; }
  .panel .row:last-of-type { border-bottom:none; margin-bottom:6px; }
  .panel .gold { color:#ffd860; }
  .panel .btn {
    display:inline-block; margin-top:8px;
    background:#c82828; color:#ffd860; border:2px solid #181028;
    padding:4px 12px; font:16px var(--font-pixel);
    box-shadow: inset 0 0 0 2px #ffd860;
  }
</style></head>
<body>
<div class="gba-viewport vbg" data-screen-label="Victory">
  <div class="star" style="left:30px; top:40px">✦</div>
  <div class="star" style="right:50px; top:60px; font-size:16px">✦</div>
  <div class="star" style="left:80px; bottom:70px; font-size:32px">✦</div>
  <div class="star" style="right:30px; bottom:50px">✦</div>

  <div class="panel">
    <h1>VICTORY!</h1>
    <div class="row"><span>CARDS</span><span class="gold">60 / 60</span></div>
    <div class="row"><span>SEASON</span><span class="gold">14d 02h</span></div>
    <div class="row"><span>BATTLES</span><span class="gold">37 W · 4 L</span></div>
    <div class="row"><span>PRIZE POOL</span><span class="gold">1.425 ◎</span></div>
    <div class="btn">► CLAIM PRIZE</div>
  </div>
</div>
</body></html>
