name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy solana/client as Pages root
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Copy only solana/client/ to a temp dir and push it as gh-pages root
          mkdir -p /tmp/pages-deploy
          cp -r solana/client/. /tmp/pages-deploy/

          cd /tmp/pages-deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "gh-pages: deploy solana/client @ ${GITHUB_SHA}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
