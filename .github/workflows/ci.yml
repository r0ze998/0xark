name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── Node.js card engine + battle mechanics tests ────────────────────────────
  node-tests:
    name: Node.js Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run card engine tests
        run: node tests/card-engine.test.js

      - name: Run battle mechanics tests
        run: node tests/battle-mechanics.test.js

  # ─── Rust Anchor tests (litesvm, no validator needed) ────────────────────────
  anchor-tests:
    name: Anchor Rust Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/oxark/target
            ~/.local/share/solana
            ~/.cache/solana
          key: ${{ runner.os }}-cargo-sbf-${{ hashFiles('solana/oxark/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sbf-
            ${{ runner.os }}-cargo-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Solana CLI (Agave stable)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # The litesvm tests run target/deploy/oxark.so via include_bytes! —
      # the SBF build MUST precede cargo test (same ordering as `make test`).
      - name: Build SBF program
        working-directory: solana/oxark
        run: make build

      - name: Run all Anchor tests
        working-directory: solana/oxark
        run: cargo test -- --nocapture 2>&1

  # ─── TypeScript build (React wallet UI) ──────────────────────────────────────
  react-build:
    name: React Wallet UI Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: solana/client/react/package-lock.json

      - name: Install dependencies
        working-directory: solana/client/react
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        working-directory: solana/client/react
        run: npx tsc --noEmit

      - name: Build React UI
        working-directory: solana/client/react
        run: npm run build

  # ─── Game client build ────────────────────────────────────────────────────────
  game-build:
    name: Game Client Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build game client (concatenate modules → index.html)
        working-directory: solana/client
        run: node build.js

      - name: Verify output size
        run: |
          SIZE=$(wc -l < solana/client/index.html)
          echo "index.html: $SIZE lines"
          if [ "$SIZE" -lt 30000 ]; then
            echo "ERROR: build output too small ($SIZE lines) — likely missing v3.0-plus modules"
            exit 1
          fi

  # ─── AI Agent tests ───────────────────────────────────────────────────────────
  ai-agent-test:
    name: AI Agent Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI agent dependencies
        working-directory: tools/ai-agent
        run: npm ci

      - name: Run AI agent unit tests (decision model)
        working-directory: tools/ai-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node tests/test_basic_decisions.js
          node tests/test_burn_decisions.js
          node tests/test_evolve_decisions.js
          node tests/test_imprint_strategy.js
          node tests/test_steal_decisions.js
