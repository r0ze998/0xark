name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── Node.js card engine + battle mechanics tests ────────────────────────────
  node-tests:
    name: Node.js Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run card engine tests
        run: node tests/card-engine.test.js

      - name: Run battle mechanics tests
        run: node tests/battle-mechanics.test.js

  # ─── Rust Anchor tests (litesvm, no validator needed) ────────────────────────
  anchor-tests:
    name: Anchor Rust Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/oxark/target
            ~/.local/share/solana
            ~/.cache/solana
          key: ${{ runner.os }}-cargo-sbf-${{ hashFiles('solana/oxark/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sbf-
            ${{ runner.os }}-cargo-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Solana CLI (Agave stable)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # The litesvm tests run target/deploy/oxark.so via include_bytes! —
      # the SBF build MUST precede cargo test (same ordering as `make test`).
      - name: Build SBF program
        working-directory: solana/oxark
        run: make build

      - name: Run all Anchor tests
        working-directory: solana/oxark
        run: cargo test -- --nocapture 2>&1

  # ─── Game client syntax check ─────────────────────────────────────────────────
  # The Phase 15 client has no build step (app.js + components loaded directly);
  # the previous "node build.js" concatenation job and the React wallet UI job
  # referenced files removed in 49183d7 (legacy UI removal).
  game-client-check:
    name: Game Client Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check all client modules
        working-directory: solana/client
        run: |
          STATUS=0
          while IFS= read -r f; do
            node --check "$f" || STATUS=1
          done < <(find . -name '*.js' -not -path './react/*' -not -path '*/node_modules/*')
          exit $STATUS

  # ─── AI Agent tests ───────────────────────────────────────────────────────────
  ai-agent-test:
    name: AI Agent Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI agent dependencies
        working-directory: tools/ai-agent
        run: npm ci

      - name: Run AI agent unit tests (decision model)
        working-directory: tools/ai-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node tests/test_basic_decisions.js
          node tests/test_burn_decisions.js
          node tests/test_evolve_decisions.js
          node tests/test_imprint_strategy.js
          node tests/test_steal_decisions.js
