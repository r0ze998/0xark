name: design-lint

# Canonical client design/source guard, identical to the local command.
# Includes extracted src/style/*.js; round-hardcode and bare-import are enforced.

on:
  pull_request:
    paths:
      - 'solana/client/**'
      - 'scripts/design-lint.py'
      - 'DESIGN.md'
      - '.github/workflows/design-lint.yml'
  push:
    branches: [main]

jobs:
  design-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Client design and source guard
        run: python3 scripts/design-lint.py -v
