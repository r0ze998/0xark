<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="50%" style="stop-color:#0d0820"/>
      <stop offset="100%" style="stop-color:#050510"/>
    </linearGradient>
    <linearGradient id="glowH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9945FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#9945FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#9945FF;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="60%" style="stop-color:#c8a8ff"/>
      <stop offset="100%" style="stop-color:#9945FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#9945FF" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing horizontal accent line -->
  <rect x="0" y="310" width="1200" height="1" fill="url(#glowH)" opacity="0.5"/>

  <!-- Purple orb top-right -->
  <circle cx="1050" cy="120" r="180" fill="#9945FF" opacity="0.04"/>
  <circle cx="1050" cy="120" r="100" fill="#9945FF" opacity="0.06"/>

  <!-- Purple orb bottom-left -->
  <circle cx="150" cy="520" r="140" fill="#14F195" opacity="0.03"/>

  <!-- Card silhouettes (decorative) -->
  <g opacity="0.12">
    <!-- Card 1 -->
    <rect x="880" y="160" width="70" height="100" rx="6" fill="none" stroke="#9945FF" stroke-width="1.5" transform="rotate(-12, 915, 210)"/>
    <!-- Card 2 -->
    <rect x="960" y="180" width="70" height="100" rx="6" fill="none" stroke="#c8a8ff" stroke-width="1.5" transform="rotate(-4, 995, 230)"/>
    <!-- Card 3 -->
    <rect x="1030" y="170" width="70" height="100" rx="6" fill="none" stroke="#9945FF" stroke-width="1.5" transform="rotate(6, 1065, 220)"/>
  </g>

  <!-- ZK circuit nodes (decorative) -->
  <g opacity="0.15" fill="none" stroke="#14F195" stroke-width="1">
    <circle cx="80" cy="200" r="4"/>
    <circle cx="130" cy="160" r="3"/>
    <circle cx="170" cy="220" r="4"/>
    <circle cx="110" cy="250" r="3"/>
    <line x1="80" y1="200" x2="130" y2="160"/>
    <line x1="130" y1="160" x2="170" y2="220"/>
    <line x1="80" y1="200" x2="110" y2="250"/>
    <line x1="110" y1="250" x2="170" y2="220"/>
  </g>

  <!-- Main title: 0xARK -->
  <text
    x="120"
    y="310"
    font-family="'Courier New', 'VT323', monospace"
    font-size="148"
    font-weight="900"
    fill="url(#titleGrad)"
    filter="url(#glow)"
    letter-spacing="-4"
  >0xARK</text>

  <!-- Subtitle -->
  <text
    x="120"
    y="380"
    font-family="'Courier New', monospace"
    font-size="28"
    fill="#c8a8ff"
    opacity="0.85"
    letter-spacing="3"
  >ZK CARD PvP · SOLANA ON-CHAIN</text>

  <!-- Divider line -->
  <rect x="120" y="404" width="400" height="2" fill="#9945FF" opacity="0.5" rx="1"/>

  <!-- Tag pills -->
  <!-- ZK -->
  <rect x="120" y="430" width="90" height="32" rx="16" fill="#9945FF" opacity="0.2" stroke="#9945FF" stroke-width="1"/>
  <text x="165" y="451" font-family="'Courier New', monospace" font-size="14" fill="#c8a8ff" text-anchor="middle">ZK PROOF</text>

  <!-- COMMIT-REVEAL -->
  <rect x="224" y="430" width="150" height="32" rx="16" fill="#9945FF" opacity="0.2" stroke="#9945FF" stroke-width="1"/>
  <text x="299" y="451" font-family="'Courier New', monospace" font-size="14" fill="#c8a8ff" text-anchor="middle">COMMIT-REVEAL</text>

  <!-- x402 -->
  <rect x="388" y="430" width="80" height="32" rx="16" fill="#14F195" opacity="0.1" stroke="#14F195" stroke-width="1"/>
  <text x="428" y="451" font-family="'Courier New', monospace" font-size="14" fill="#14F195" text-anchor="middle">x402 AI</text>

  <!-- 60 CARDS -->
  <rect x="482" y="430" width="100" height="32" rx="16" fill="#9945FF" opacity="0.2" stroke="#9945FF" stroke-width="1"/>
  <text x="532" y="451" font-family="'Courier New', monospace" font-size="14" fill="#c8a8ff" text-anchor="middle">60 CARDS</text>

  <!-- Bottom flavor text -->
  <text
    x="120"
    y="540"
    font-family="'Courier New', monospace"
    font-size="20"
    fill="#ffffff"
    opacity="0.4"
    letter-spacing="1"
  >60 CARDS. ONE PRIZE POOL. INFORMATION ASYMMETRY IS THE ULTIMATE WEAPON.</text>

  <!-- Solana logo area (wordmark) -->
  <text
    x="1080"
    y="600"
    font-family="'Courier New', monospace"
    font-size="18"
    fill="#9945FF"
    opacity="0.6"
    text-anchor="end"
    letter-spacing="2"
  >BUILT ON SOLANA</text>

  <!-- Program ID (small) -->
  <text
    x="120"
    y="600"
    font-family="'Courier New', monospace"
    font-size="13"
    fill="#ffffff"
    opacity="0.25"
  >2gMYzenV6HQoTJA2899XxnLgzTbaWdVmegLqL7nMpVS3</text>
</svg>
