          });
        }else{
          // NEW GAME
          clearSave();fogClear();
          pl[0].cd=[1,3,0,0,0];pl[0].cc=2;pl[0].x=15;pl[0].y=13;pl[0].dir=0;pl[0].step=0;pl[0].visualX=15*TW;pl[0].visualY=13*TH;pl[0].walkFrame=0;
          pl[1].cd=[2,5,0,0,0];pl[1].cc=2;pl[1].x=19;pl[1].y=14;pl[1].dir=2;pl[1].step=0;pl[1].visualX=19*TW;pl[1].visualY=14*TH;pl[1].walkFrame=0;
          pl[2].cd=[4,0,0,0,0];pl[2].cc=1;pl[2].x=6;pl[2].y=11;pl[2].dir=0;pl[2].step=0;pl[2].visualX=6*TW;pl[2].visualY=11*TH;pl[2].walkFrame=0;
          sp.s=3;sp.b=2;sp.c=1;rd=1;stepCounter=0;randomEventTimer=0;
          rivalMaps=[0,0];lg.length=0;lg.push('Game started. Collect all 5 card types to win!');
          treasures.forEach(t=>t.collected=false);
          tutorialFlags={firstStep:false,firstGrass:false,gotFirstCard:false,firstMapChange:false};
          fadeOut(()=>{sc='map';currentMap=0;showBanner('PORT TOWN','Crystal & Shadow cards found here');
            fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
            fadeIn();twSet('Welcome to 0xARK! Walk into tall grass to find cards. Collect all 5 types to win!');});
        }
      }
    }else{
      if(e.code==='KeyZ'){
        sfxConfirm();
        fadeOut(()=>{sc='map';currentMap=0;showBanner('PORT TOWN','Crystal & Shadow cards found here');
          fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
          fadeIn();twSet('Welcome to 0xARK! Walk into tall grass to find cards. Collect all 5 types to win!');});
      }
    }
    return;
  }

  // NPC Dialog handling
  if(npcDialogActive){
    if(e.code==='KeyZ'||e.code==='Space'){
      npcDialogIdx+=2;
      if(npcDialogIdx>=npcDialogLines.length){npcDialogActive=false;npcDialogIdx=0;}
      else sfxSelect();
    }
    if(e.code==='KeyX'){npcDialogActive=false;sfxBack();}
    return;
  }

  // Signpost dialog handling
  if(signpostActive){
    if(e.code==='KeyZ'||e.code==='Space'||e.code==='KeyX'){signpostActive=false;sfxBack();}
    return;
  }

  // Card Shop handling
  if(shopActive){
    const filled=getPlayerFilledSlots();
    if(shopPhase==='list'){
      if(filled.length>0){
        if(e.code==='ArrowUp'){shopSelectedIdx=Math.max(0,shopSelectedIdx-1);sfxMove();}
        if(e.code==='ArrowDown'){shopSelectedIdx=Math.min(filled.length-1,shopSelectedIdx+1);sfxMove();}
        if(e.code==='KeyZ'){shopPhase='confirm';sfxSelect();}
      }
      if(e.code==='KeyX'){shopActive=false;sfxBack();}
    }else if(shopPhase==='confirm'){
      if(e.code==='KeyZ'){doShopTrade();}
      if(e.code==='KeyX'){shopPhase='list';sfxBack();}
    }else if(shopPhase==='result'){
      if(e.code==='KeyZ'){shopPhase='list';shopSelectedIdx=0;sfxSelect();}
      if(e.code==='KeyX'){shopActive=false;sfxBack();}
    }
    return;
  }

  // Random event dismiss
  if(randomEventActive){
    if(e.code==='KeyZ'||e.code==='Space'){randomEventActive=false;}
    return;
  }

  // Discard overlay handling
  if(discardActive){
    if(e.code==='ArrowUp'){discardSelIdx=Math.max(0,discardSelIdx-1);sfxMove();}
    if(e.code==='ArrowDown'){discardSelIdx=Math.min(4,discardSelIdx+1);sfxMove();}
    if(e.code==='KeyZ'){
      const slot=discardSelIdx;
      if(pl[0].cd[slot]>0){
        sfxConfirm();
        const discarded=pl[0].cd[slot];
        if(discardPendingCard>0){
          pl[0].cd[slot]=discardPendingCard;
          lg.push('Discarded '+CD[discarded-1].n+', got '+CD[discardPendingCard-1].n+'!');
          discardActive=false;
          if(discardSource==='wild'||discardSource==='menu'){startCardAcquisition(discardPendingCard-1);}
          discardPendingCard=-1;discardSource='';
          if(playerHasAllFive()){setTimeout(()=>{fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});},500);}
        }else{
          // Menu discard: just remove the card
          pl[0].cd[slot]=0;pl[0].cc=Math.max(0,pl[0].cc-1);
          lg.push('Discarded '+CD[discarded-1].n+'!');
          discardActive=false;discardPendingCard=-1;discardSource='';
        }
      }else{sfxBack();}
    }
    if(e.code==='KeyX'){
      sfxBack();
      if(discardPendingCard>0){
        // Canceling means rejecting the new card
        lg.push('Skipped '+CD[discardPendingCard-1].n+' (hand full).');
      }
      discardActive=false;discardPendingCard=-1;discardSource='';
      if(wildEncounterActive){wildEncounterActive=false;cardAcqDone=true;}
    }
    return;
  }

  // Wild encounter - wait
  if(wildEncounterActive)return;

  // Battle encounter exclamation or wipe - wait
  if(encounterExclActive||battleWipeActive)return;

  if(sc==='map'){
    if(e.code==='Space'){mo=!mo;mi=0;menuOpenFrame=0;sfxSelect();return;}
    if(mo){
      if(e.code==='ArrowUp'){mi=Math.max(0,mi-1);sfxMove();}
      if(e.code==='ArrowDown'){mi=Math.min(7,mi+1);sfxMove();}
      if(e.code==='KeyZ'){
        sfxConfirm();const s=['crd','map','act','log'];
        if(mi===7)mo=false;
        else if(mi===4){
          // DISCARD
          const filled=[];for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
          if(filled.length>0){
            discardActive=true;discardSelIdx=0;discardPendingCard=-1;discardSource='menu';
            mo=false;menuOpenFrame=0;
          }else{twSet('No cards to discard!');mo=false;menuOpenFrame=0;}
        }
        else if(mi===5){
          // SAVE
          saveGame();
          twSet('Game saved!');
          mo=false;menuOpenFrame=0;
        }
        else if(mi===6){
          // NEW GAME: reset all state
          clearSave();fogClear();
          pl[0].cd=[1,3,0,0,0];pl[0].cc=2;pl[0].x=15;pl[0].y=13;pl[0].dir=0;pl[0].step=0;pl[0].visualX=15*TW;pl[0].visualY=13*TH;pl[0].walkFrame=0;
          pl[1].cd=[2,5,0,0,0];pl[1].cc=2;pl[1].x=19;pl[1].y=14;pl[1].dir=2;pl[1].step=0;pl[1].visualX=19*TW;pl[1].visualY=14*TH;pl[1].walkFrame=0;
          pl[2].cd=[4,0,0,0,0];pl[2].cc=1;pl[2].x=6;pl[2].y=11;pl[2].dir=0;pl[2].step=0;pl[2].visualX=6*TW;pl[2].visualY=11*TH;pl[2].walkFrame=0;
          edgeCacheDirty=true;fogCacheDirty=true;
          sp.s=3;sp.b=2;sp.c=1;rd=1;currentMap=0;
          stepCounter=0;randomEventTimer=0;
          rivalMaps=[0,0];lg.length=0;lg.push('New game started!');
          treasures.forEach(t=>t.collected=false);
          tutorialFlags={firstStep:false,firstGrass:false,gotFirstCard:false,firstMapChange:false};
          fadeOut(()=>{sc='title';mo=false;fadeIn();ub();});
        }
        else{fadeOut(()=>{sc=s[mi];mo=false;if(sc==='act'){actEnterFrame=fr;battlePhase='vs_splash';bpFrame=fr;}fadeIn();ub();});}
      }
      if(e.code==='KeyX'){mo=false;menuOpenFrame=0;sfxBack();}
    }else{
      // Z = interact with NPC or signpost
      if(e.code==='KeyZ'){
        if(checkNPCInteraction())return;
        if(checkSignpostInteraction())return;
      }

      const p=pl[0];let nx=p.x,ny=p.y;
      if(e.code==='ArrowUp'){ny--;p.dir=2;}
      if(e.code==='ArrowDown'){ny++;p.dir=0;}
      if(e.code==='ArrowLeft'){nx--;p.dir=1;}
      if(e.code==='ArrowRight'){nx++;p.dir=3;}
      if(nx!==p.x||ny!==p.y){
        const m=getMap();
        if(nx>=0&&nx<MW&&ny>=0&&ny<MH&&WALKABLE.has(m[ny]?.[nx])){
          p.x=nx;p.y=ny;p.step++;p.walkFrame=(p.walkFrame+1)%4;sfxMove();sfxStep();
          stepCounter++;
          edgeCacheDirty=true;
          // Reveal fog around new position
          fogRevealRadius(currentMap,nx,ny,2);
          fogSave();
          const newTile=m[ny]?.[nx];
          if(newTile===1||newTile===7||newTile===11){spawnGrassParticles(nx*TW,ny*TH);sfxGrassRustle();}
          // Tutorial triggers
          if(!tutorialFlags.firstStep){tutorialFlags.firstStep=true;tutorialMsg='Collect all 5 card types to win! Explore the island.';tutorialMsgTimer=240;}
          if(newTile===11&&!tutorialFlags.firstGrass){tutorialFlags.firstGrass=true;tutorialMsg='Walk through tall grass to find cards!';tutorialMsgTimer=180;}
          // Water proximity sound
          if(newTile!==0){const adj=[[nx-1,ny],[nx+1,ny],[nx,ny-1],[nx,ny+1]];if(adj.some(([ax,ay])=>ax>=0&&ax<MW&&ay>=0&&ay<MH&&m[ay]?.[ax]===0))sfxWaterNear();}

          // Random map event every 200 steps
          randomEventTimer++;
          if(randomEventTimer>=200&&!randomEventActive&&!wildEncounterActive&&!cardAcqActive){
            randomEventTimer=0;
            triggerRandomEvent();
          }

          // Check exit
          const exit=checkExitTile(nx,ny);
          if(exit){doMapTransition(exit);return;}

          // Check treasure
          checkTreasure();

          // Check wild encounter
          if(!cardAcqActive&&!randomEventActive)tryWildEncounter();
        }
      }
    }
  }

  if(sc==='act'){
    if(battlePhase==='select'&&bpCardSelectActive){
      // Card selection for USE CARD
      const filled=[];for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
      if(e.code==='ArrowUp'){bpCardSelectIdx=Math.max(0,bpCardSelectIdx-1);sfxMove();}
      if(e.code==='ArrowDown'){bpCardSelectIdx=Math.min(filled.length-1,bpCardSelectIdx+1);sfxMove();}
      if(e.code==='KeyZ'){
        sfxConfirm();
        bpAction=4;bpCardSelectActive=false;
        // Store which slot to use
        bpSelectedCardSlot=filled[bpCardSelectIdx];
        battlePhase='confirming';bpFrame=fr;
      }
      if(e.code==='KeyX'){bpCardSelectActive=false;sfxBack();}
    }else if(battlePhase==='select'&&bpTargetSelectActive){
      // Target selection for STEAL/SCOUT
      if(e.code==='ArrowUp'||e.code==='ArrowDown'){bpTargetSelectIdx=bpTargetSelectIdx===1?2:1;sfxMove();}
      if(e.code==='KeyZ'){
        sfxConfirm();bpTargetSelectActive=false;
        bpAction=bpPendingAction;bpSelectedTarget=bpTargetSelectIdx;
        battlePhase='confirming';bpFrame=fr;
      }
      if(e.code==='KeyX'){bpTargetSelectActive=false;sfxBack();}
    }else if(battlePhase==='select'){
      // 2x2 grid navigation: 0=DRAW(TL), 1=STEAL(TR), 2=BARRIER(BL), 3=SCOUT(BR), 4=USE CARD(below)
      if(e.code==='ArrowUp'){
        if(ai===4){ai=2;sfxMove();}
        else if(ai>=2){ai-=2;sfxMove();}
      }
      if(e.code==='ArrowDown'){
        if(ai<2){ai+=2;sfxMove();}
        else if(ai<4){ai=4;sfxMove();}
      }
      if(e.code==='ArrowLeft'){
        if(ai===1){ai=0;sfxMove();}
        else if(ai===3){ai=2;sfxMove();}
      }
      if(e.code==='ArrowRight'){
        if(ai===0){ai=1;sfxMove();}
        else if(ai===2){ai=3;sfxMove();}
      }
      if(e.code==='KeyZ'){
        if(!isActionAvailable(ai)){sfxBack();return;}
        if(ai===4){
          // USE CARD: open card selection
          bpCardSelectActive=true;bpCardSelectIdx=0;sfxSelect();
        }else if(ai===1||ai===3){
          // STEAL or SCOUT: open target selection
          bpTargetSelectActive=true;bpTargetSelectIdx=1;bpPendingAction=ai;sfxSelect();
        }else{
          sfxConfirm();bpAction=ai;
          battlePhase='confirming';bpFrame=fr;
        }
      }
    }else if(battlePhase==='result'){
      if(e.code==='KeyZ'){
        sfxConfirm();rd++;
        // Check if there's a pending draw card needing discard
        if(bpResolveQueue&&bpResolveQueue._pendingDrawCard>0){
          const pendCard=bpResolveQueue._pendingDrawCard;
          bpResolveQueue._pendingDrawCard=0;
          discardActive=true;discardSelIdx=0;discardPendingCard=pendCard;discardSource='wild';
        }
        saveGame();
        if(playerHasAllFive()){fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});}
        else if(rd>30){fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});}
        else if(!discardActive){fadeOut(()=>{sc='map';mo=false;battlePhase='select';fadeIn();ub();});}
      }
    }
  }

  if(sc==='victory'){
    if((fr-victoryFrame)>170){
      if(e.code==='KeyZ'){
        // Play again - reset all state
        sfxConfirm();
        clearSave();fogClear();
        pl[0].cd=[0,0,0,0,0];pl[0].cc=0;pl[0].x=15;pl[0].y=13;pl[0].dir=0;pl[0].step=0;pl[0].visualX=15*TW;pl[0].visualY=13*TH;pl[0].walkFrame=0;
        pl[1].cd=[0,0,0,0,0];pl[1].cc=0;pl[1].x=19;pl[1].y=14;pl[1].dir=2;pl[1].step=0;pl[1].visualX=19*TW;pl[1].visualY=14*TH;pl[1].walkFrame=0;
        pl[2].cd=[0,0,0,0,0];pl[2].cc=0;pl[2].x=6;pl[2].y=11;pl[2].dir=0;pl[2].step=0;pl[2].visualX=6*TW;pl[2].visualY=11*TH;pl[2].walkFrame=0;
        sp.s=3;sp.b=2;sp.c=1;rd=1;currentMap=0;stepCounter=0;randomEventTimer=0;
        rivalMaps=[0,0];lg.length=0;lg.push('New game started!');
        treasures.forEach(t=>t.collected=false);
        tutorialFlags={firstStep:false,firstGrass:false,gotFirstCard:false,firstMapChange:false};
        edgeCacheDirty=true;fogCacheDirty=true;
        fadeOut(()=>{sc='map';mo=false;showBanner('PORT TOWN','Crystal & Shadow cards found here');
          fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
          fadeIn();twSet('Welcome back! Collect all 5 card types to win!');ub();});
      }
      if(e.code==='KeyX'){sfxBack();fadeOut(()=>{sc='title';fadeIn();ub();});}
    }
    return;
  }

  if(e.code==='KeyX'&&sc!=='title'&&sc!=='victory'){
    if(sc==='act'&&battlePhase!=='select')return;
    sfxBack();fadeOut(()=>{sc='map';mo=false;battlePhase='select';fadeIn();ub();});
  }
});

function ss(s){sfxSelect();fadeOut(()=>{sc=s;mo=false;if(s==='act'){actEnterFrame=fr;battlePhase='vs_splash';bpFrame=fr;}fadeIn();ub();});}
function ub(){document.querySelectorAll('.b').forEach((b,i)=>b.classList.toggle('a',['map','act','crd','log'][i]===sc));}

// ═══════════════════════════════════════
// SAVE / LOAD SYSTEM
// ═══════════════════════════════════════
const SAVE_KEY='oxark_save';

function saveGame(){
  try{
    const data={
      px:pl[0].x, py:pl[0].y, pdir:pl[0].dir, pstep:pl[0].step,
      pcd:[...pl[0].cd], pcc:pl[0].cc,
      r1x:pl[1].x, r1y:pl[1].y, r1dir:pl[1].dir, r1cd:[...pl[1].cd], r1cc:pl[1].cc,
      r2x:pl[2].x, r2y:pl[2].y, r2dir:pl[2].dir, r2cd:[...pl[2].cd], r2cc:pl[2].cc,
      sps:sp.s, spb:sp.b, spc:sp.c,
      rd:rd, stepCounter:stepCounter,
      currentMap:currentMap,
      rivalMaps:[...rivalMaps],
      log:lg.slice(-20),
      treasures:treasures.map(t=>t.collected),
      sc:sc,
      tutorialFlags:{...tutorialFlags},
      randomEventTimer:randomEventTimer
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    saveIndicatorTimer=60;
  }catch(e){}
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    pl[0].x=d.px;pl[0].y=d.py;pl[0].dir=d.pdir;pl[0].step=d.pstep;
    pl[0].cd=[...d.pcd];pl[0].cc=d.pcc;
    pl[0].visualX=d.px*TW;pl[0].visualY=d.py*TH;pl[0].walkFrame=0;
    pl[1].x=d.r1x;pl[1].y=d.r1y;pl[1].dir=d.r1dir;pl[1].cd=[...d.r1cd];pl[1].cc=d.r1cc;
    pl[1].visualX=d.r1x*TW;pl[1].visualY=d.r1y*TH;pl[1].walkFrame=0;
    pl[2].x=d.r2x;pl[2].y=d.r2y;pl[2].dir=d.r2dir;pl[2].cd=[...d.r2cd];pl[2].cc=d.r2cc;
    pl[2].visualX=d.r2x*TW;pl[2].visualY=d.r2y*TH;pl[2].walkFrame=0;
    sp.s=d.sps;sp.b=d.spb;sp.c=d.spc;
    rd=d.rd;stepCounter=d.stepCounter;
    currentMap=d.currentMap;
    rivalMaps=[...d.rivalMaps];
    lg.length=0;d.log.forEach(l=>lg.push(l));
    d.treasures.forEach((c,i)=>{if(treasures[i])treasures[i].collected=c;});
    if(d.tutorialFlags)tutorialFlags={...tutorialFlags,...d.tutorialFlags};
    if(d.randomEventTimer!==undefined)randomEventTimer=d.randomEventTimer;
    // Sync card counts from actual data to prevent drift
    syncCardCount(0);syncCardCount(1);syncCardCount(2);
    fogLoad();
    camX=pl[0].visualX-W/2;camY=pl[0].visualY-H/2;
    camTargetX=camX;camTargetY=camY;
    edgeCacheDirty=true;fogCacheDirty=true;
    return true;
  }catch(e){return false;}
}

function hasSave(){
  try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}
}

function clearSave(){
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

// ═══════════════════════════════════════
// TOUCH CONTROLS
// ═══════════════════════════════════════
const isTouchDevice=('ontouchstart' in window)||(navigator.maxTouchPoints>0);

function simulateKey(code){
  document.dispatchEvent(new KeyboardEvent('keydown',{code:code,bubbles:true}));
}

function haptic(){try{if(navigator.vibrate)navigator.vibrate(10);}catch(e){}}

if(isTouchDevice){
  document.getElementById('touch-overlay').classList.add('active');
  // Also resume audio on touch
  document.addEventListener('touchstart',resumeAudio,{once:false});

  const btnMap={
    'dpad-up':'ArrowUp','dpad-down':'ArrowDown','dpad-left':'ArrowLeft','dpad-right':'ArrowRight',
    'btn-a':'KeyZ','btn-b':'KeyX','btn-start':'Space'
  };
  Object.keys(btnMap).forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{
      e.preventDefault();
      el.classList.add('pressed');
      haptic();
      simulateKey(btnMap[id]);
    },{passive:false});
    el.addEventListener('touchend',e=>{
      e.preventDefault();
      el.classList.remove('pressed');
    },{passive:false});
    el.addEventListener('touchcancel',e=>{
      el.classList.remove('pressed');
    });
  });

  // Swipe detection on canvas
  let touchStartX=0,touchStartY=0,touchStartTime=0;
  c.addEventListener('touchstart',e=>{
    if(e.touches.length===1){
      const t=e.touches[0];
      touchStartX=t.clientX;touchStartY=t.clientY;
      touchStartTime=Date.now();
    }
  },{passive:true});
  c.addEventListener('touchend',e=>{
    const elapsed=Date.now()-touchStartTime;
    if(elapsed>300)return; // too slow for swipe
    const ct=e.changedTouches[0];
    const dx=ct.clientX-touchStartX,dy=ct.clientY-touchStartY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<20){
      // Tap: move toward tapped position
      const rect=c.getBoundingClientRect();
      const scaleX=W/rect.width,scaleY=H/rect.height;
      const cx_=(ct.clientX-rect.left)*scaleX;
      const cy_=(ct.clientY-rect.top)*scaleY;
      if(sc==='map'&&!mo){
        const worldX=cx_+camX,worldY=cy_+camY;
        const tileX=Math.floor(worldX/TW),tileY=Math.floor(worldY/TH);
        const pdx=tileX-pl[0].x,pdy=tileY-pl[0].y;
        if(Math.abs(pdx)>=Math.abs(pdy)){
          simulateKey(pdx>0?'ArrowRight':'ArrowLeft');
        }else{
          simulateKey(pdy>0?'ArrowDown':'ArrowUp');
        }
      }
    }else{
      // Swipe
      if(Math.abs(dx)>Math.abs(dy)){
        simulateKey(dx>0?'ArrowRight':'ArrowLeft');
      }else{
        simulateKey(dy>0?'ArrowDown':'ArrowUp');
      }
    }
    haptic();
  },{passive:true});
}

requestAnimationFrame(loop);
</script>
</body>
</html>
