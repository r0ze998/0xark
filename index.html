<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0xARK — Succession War of Elyon</title>

  <!-- PWA / OG meta -->
  <meta name="description" content="On-chain TCG × ZK × x402 × AI agents on Solana">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="manifest" href="/0xark/manifest.json">
  <meta property="og:title" content="0xARK — Succession War of Elyon">
  <meta property="og:description" content="60 cards. One Prize Pool. Steal cards from rivals you can't see.">
  <meta property="og:image" content="https://r0ze998.github.io/0xark/og-image.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <!-- Design system -->
  <link rel="stylesheet" href="src/style/sprite-seas.css">

  <!-- Solana Web3 + on-chain wiring (non-module, loaded before the app module) -->
  <script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>

  <style>
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #03060f;
    }
    #app { flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="solana/client/onchain.js"></script>
  <script src="solana/client/src/01-magicblock.js"></script>

  <script type="module">
    // ── Wave 1 ────────────────────────────────────────────────
    import { mount as mountTitleA,  unmount as unmountTitleA  } from './src/screens/title-a.js';
    import { mount as mountM1,      unmount as unmountM1      } from './src/screens/m1-lobby.js';
    import { mount as mountM3,      unmount as unmountM3      } from './src/screens/m3-duel-open.js';
    import { mount as mountM2,      unmount as unmountM2      } from './src/screens/m2-duel-board.js';
    import { mount as mountM4,      unmount as unmountM4      } from './src/screens/m4-victory.js';

    // ── Wave 2 ────────────────────────────────────────────────
    import { mount as mountS1,      unmount as unmountS1      } from './src/screens/s1-menu.js';
    import { mount as mountS8,      unmount as unmountS8      } from './src/screens/s8-defeat.js';
    import { mount as mountS3,      unmount as unmountS3      } from './src/screens/s3-bourse.js';
    import { mount as mountS2,      unmount as unmountS2      } from './src/screens/s2-deck-editor.js';

    // ── Wave 3 ────────────────────────────────────────────────
    import { mount as mountM5,      unmount as unmountM5      } from './src/screens/m5-card-detail.js';
    import { mount as mountS4,      unmount as unmountS4      } from './src/screens/s4-agent-hub.js';
    import { mount as mountS5,      unmount as unmountS5      } from './src/screens/s5-lore.js';
    import { mount as mountS6,      unmount as unmountS6      } from './src/screens/s6-settings.js';
    import { mount as mountS7,      unmount as unmountS7      } from './src/screens/s7-howtoplay.js';

    // ── Wave 4 ────────────────────────────────────────────────
    import { mount as mountTitleB,  unmount as unmountTitleB  } from './src/screens/title-b.js';
    import { mount as mountTitleC,  unmount as unmountTitleC  } from './src/screens/title-c.js';

    const app = document.getElementById('app');

    // ── Router ────────────────────────────────────────────────
    let currentUnmount = null;

    function navigate(screenName, detail = {}) {
      if (currentUnmount) currentUnmount(app);

      switch (screenName) {
        // Wave 1
        case 'title-a':        mountTitleA(app);         currentUnmount = unmountTitleA; break;
        case 'm1-lobby':       mountM1(app, detail);     currentUnmount = unmountM1;     break;
        case 'm3-duel-open':   mountM3(app, detail);     currentUnmount = unmountM3;     break;
        case 'm2-duel-board':  mountM2(app, detail);     currentUnmount = unmountM2;     break;
        case 'm4-victory':     mountM4(app, detail);     currentUnmount = unmountM4;     break;

        // Wave 2
        case 's1-menu':        mountS1(app, detail);     currentUnmount = unmountS1;     break;
        case 's8-defeat':      mountS8(app, detail);     currentUnmount = unmountS8;     break;
        case 's3-bourse':      mountS3(app, detail);     currentUnmount = unmountS3;     break;
        case 's2-deck-editor': mountS2(app, detail);     currentUnmount = unmountS2;     break;

        // Wave 3
        case 'm5-card-detail': mountM5(app, detail);     currentUnmount = unmountM5;     break;
        case 's4-agent-hub':   mountS4(app, detail);     currentUnmount = unmountS4;     break;
        case 's5-lore':        mountS5(app, detail);     currentUnmount = unmountS5;     break;
        case 's6-settings':    mountS6(app, detail);     currentUnmount = unmountS6;     break;
        case 's7-howtoplay':   mountS7(app, detail);     currentUnmount = unmountS7;     break;

        // Wave 4
        case 'title-b':        mountTitleB(app, detail); currentUnmount = unmountTitleB; break;
        case 'title-c':        mountTitleC(app, detail); currentUnmount = unmountTitleC; break;

        default:
          app.innerHTML = `<div style="color:#c9a227;font-family:VT323,monospace;font-size:28px;padding:40px;">[${screenName}] — SCREEN NOT FOUND</div>`;
          currentUnmount = null;
      }
    }

    // ── Navigation events ─────────────────────────────────────

    // Wallet / entry
    document.addEventListener('wallet:connected', (e) => {
      navigate('m1-lobby', e.detail);
    });
    document.addEventListener('nav:title', () => {
      navigate('title-a');
    });
    document.addEventListener('nav:title-b', () => {
      navigate('title-b');
    });
    document.addEventListener('nav:title-c', () => {
      navigate('title-c');
    });

    // Lobby / menu
    document.addEventListener('nav:lobby', (e) => {
      navigate('m1-lobby', e.detail ?? {});
    });
    document.addEventListener('nav:menu', (e) => {
      navigate('s1-menu', e.detail ?? {});
    });

    // ── ER status banner ─────────────────────────────────────────────────────
    function showErBanner(msg, color) {
      const b = document.createElement('div');
      b.style.cssText = [
        'position:fixed', 'top:16px', 'left:50%', 'transform:translateX(-50%)',
        `background:${color}`, 'color:#0a0e1a', 'font-family:VT323,monospace',
        'font-size:20px', 'padding:8px 28px', 'border-radius:3px',
        'z-index:9999', 'pointer-events:none', 'letter-spacing:1px',
      ].join(';');
      b.textContent = msg;
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 4000);
    }

    // Duel flow
    document.addEventListener('nav:matchmaking', async () => {
      const baseDetail = { round: 1, maxRounds: 5, playerName: 'CAPT. VEGA', playerClan: 'black-flag' };

      if (window.oxarkOnchain && window.solana?.publicKey) {
        const gameId = Date.now() % 1000000;
        let erActive = false;
        try {
          const result = await window.oxarkOnchain.startGameMB(gameId);
          erActive = result.erActive ?? false;
          if (erActive) {
            showErBanner('ER ACTIVE — MagicBlock routing enabled', '#00e87a');
          } else {
            showErBanner('ER UNAVAILABLE — base layer only', '#ff6b35');
          }
        } catch (e) {
          console.warn('[matchmaking] on-chain start failed, continuing offline:', e.message);
          showErBanner('ER UNAVAILABLE — base layer only', '#ff6b35');
        }
        navigate('m3-duel-open', { ...baseDetail, gameId, erActive });
      } else {
        navigate('m3-duel-open', baseDetail);
      }
    });
    document.addEventListener('zk:committed', () => {
      navigate('m2-duel-board', { round: 1, maxRounds: 5, phase: 'COMMIT' });
    });
    document.addEventListener('duel:locked', () => {
      navigate('m4-victory', {
        opponent: 'IRON COMMANDER', opponentClan: 'iron-circle',
        cardsWon: ['PHANTOM PISTOL', "CROW'S EYE"],
        txHash: '4xK2mNpQrSt8vWxy', solEarned: 0.005,
      });
    });
    document.addEventListener('duel:defeat', (e) => {
      navigate('s8-defeat', {
        opponent:     e.detail?.opponent     ?? 'IRON COMMANDER',
        opponentClan: e.detail?.opponentClan ?? 'iron-circle',
        cardsLost:    e.detail?.cardsLost    ?? ['PHANTOM PISTOL'],
        txHash:       e.detail?.txHash       ?? '7zN3pKqRsXt2mVwA',
        solLost:      e.detail?.solLost      ?? 0.005,
      });
    });

    // Collection / market
    document.addEventListener('nav:deck-editor', (e) => {
      navigate('s2-deck-editor', e.detail ?? {});
    });
    document.addEventListener('nav:shop', (e) => {
      navigate('s3-bourse', e.detail ?? {});
    });
    document.addEventListener('nav:card-detail', (e) => {
      navigate('m5-card-detail', e.detail ?? {});
    });

    // Meta screens
    document.addEventListener('nav:agent', (e) => {
      navigate('s4-agent-hub', e.detail ?? {});
    });
    document.addEventListener('nav:lore', (e) => {
      navigate('s5-lore', e.detail ?? {});
    });
    document.addEventListener('nav:settings', (e) => {
      navigate('s6-settings', e.detail ?? {});
    });
    document.addEventListener('nav:howtoplay', () => {
      navigate('s7-howtoplay');
    });

    // ── Boot ──────────────────────────────────────────────────
    navigate('title-a');
  </script>
</body>
</html>
