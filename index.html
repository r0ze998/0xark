<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0xARK — Succession War of Elyon</title>

  <!-- PWA / OG meta -->
  <meta name="description" content="On-chain TCG × ZK × x402 × AI agents on Solana">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="manifest" href="/0xark/manifest.json">
  <meta property="og:title" content="0xARK — Succession War of Elyon">
  <meta property="og:description" content="60 cards. One Prize Pool. Steal cards from rivals you can't see.">
  <meta property="og:image" content="https://r0ze998.github.io/0xark/og-image.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <!-- Design system -->
  <link rel="stylesheet" href="src/style/sprite-seas.css">

  <style>
    /* Centering shell for non-1024 viewports */
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #03060f;
    }
    #app { flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { mount as mountTitleA, unmount as unmountTitleA } from './src/screens/title-a.js';
    import { mount as mountM1, unmount as unmountM1 } from './src/screens/m1-lobby.js';

    const app = document.getElementById('app');

    // ── Router ────────────────────────────────────────────
    let currentUnmount = null;

    function navigate(screenName, detail = {}) {
      if (currentUnmount) currentUnmount(app);

      switch (screenName) {
        case 'title-a':
          mountTitleA(app);
          currentUnmount = unmountTitleA;
          break;
        case 'm1-lobby':
          mountM1(app, detail);
          currentUnmount = unmountM1;
          break;
        default:
          app.innerHTML = `<div style="color:#c9a227;font-family:VT323,monospace;font-size:28px;padding:40px;">[${screenName}] — COMING IN WAVE 1</div>`;
          currentUnmount = null;
      }
    }

    // ── Navigation events ─────────────────────────────────
    document.addEventListener('wallet:connected', (e) => {
      navigate('m1-lobby', e.detail);
    });

    document.addEventListener('nav:howtoplay', () => {
      navigate('s7-howtoplay');
    });

    document.addEventListener('nav:lobby', (e) => {
      navigate('m1-lobby', e.detail);
    });

    document.addEventListener('nav:title', () => {
      navigate('title-a');
    });

    // ── Boot ──────────────────────────────────────────────
    navigate('title-a');
  </script>
</body>
</html>
