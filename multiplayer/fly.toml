# fly.toml — 0xARK Multiplayer + x402 relay
# Deploy from repository root: fly deploy --config multiplayer/fly.toml --dockerfile multiplayer/Dockerfile
# r0ze runs: fly deploy — final trigger

app = "oxark-multiplayer"
primary_region = "nrt"   # Tokyo — closest to Solana devnet latency

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Secrets (set via: fly secrets set KEY=value)
# SOLANA_RPC_URL  — Solana devnet RPC endpoint for this release
# TREASURY_PUBKEY — SOL address receiving x402 micropayments
# REDIS_URL      — persistent replay store; required in production
# ANTHROPIC_API_KEY — optional AI advice/delegation (503 when absent)
# Missing required secrets abort startup. NODE_ENV=development is local only.
