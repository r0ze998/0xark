<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111118;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;font-family:'VT323',monospace;overflow:hidden}
#emu{background:linear-gradient(145deg,#2a2a3e,#1c1c2c);padding:20px 24px 16px;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.6);border:2px solid #333350}
#lbl{text-align:center;color:#444460;font-size:10px;letter-spacing:6px;margin-bottom:8px}
#sw{background:#080810;padding:4px;border-radius:4px;border:2px solid #1a1a30;box-shadow:inset 0 0 0 2px #2a2a48,inset 0 0 0 4px #0c0c18}
canvas{display:block;width:960px;height:640px;image-rendering:pixelated;image-rendering:crisp-edges}
/* #g.desktop-hidden no longer needed — game canvas shown directly */
#pixi-wrap{position:relative;width:960px;height:640px;overflow:hidden}
#pixi-wrap canvas{width:960px;height:640px;touch-action:none}
#ctrls{display:flex;justify-content:center;gap:6px;margin-top:10px}
.b{padding:4px 12px;background:#222238;color:#555570;border:1px solid #333350;border-radius:12px;font:14px 'VT323',monospace;cursor:pointer;transition:all .15s}
.b:hover{background:#2a2a44;color:#8888aa}.b.a{background:#3848a0;color:#dde;border-color:#5060c0;box-shadow:0 0 6px rgba(56,72,160,.3)}
#h{color:#2a2a40;font-size:10px;text-align:center;margin-top:6px;letter-spacing:1px}
@media(max-width:1000px){canvas{width:100vw!important;height:calc(100vw*2/3)!important}#emu{padding:4px;border-radius:0}#pixi-wrap{width:100vw!important;height:calc(100vw*2/3)!important}}
/* Touch Controls Overlay */
#touch-overlay{display:none;position:fixed;bottom:0;left:0;right:0;height:180px;z-index:100;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#touch-overlay.active{display:block}
#touch-overlay *{pointer-events:auto}
.touch-btn{position:absolute;width:52px;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(30,30,50,.7);color:rgba(255,255,255,.8);font:16px 'VT323',monospace;display:flex;align-items:center;justify-content:center;transition:background .05s;-webkit-tap-highlight-color:transparent}
.touch-btn.pressed{background:rgba(80,80,140,.85);border-color:rgba(255,255,255,.5)}
/* D-pad: bottom-left */
#dpad-up{left:64px;bottom:148px}
#dpad-down{left:64px;bottom:38px}
#dpad-left{left:8px;bottom:93px}
#dpad-right{left:120px;bottom:93px}
/* A/B buttons: bottom-right */
#btn-a{right:20px;bottom:118px;width:56px;height:56px;background:rgba(0,180,200,.5);border-color:rgba(0,220,255,.5);font-size:16px}
#btn-a.pressed{background:rgba(0,180,200,.8)}
#btn-b{right:84px;bottom:58px;width:56px;height:56px;background:rgba(200,50,60,.5);border-color:rgba(255,80,80,.5);font-size:16px}
#btn-b.pressed{background:rgba(200,50,60,.8)}
/* START button: bottom-center */
#btn-start{left:50%;transform:translateX(-50%);bottom:10px;width:72px;height:28px;border-radius:14px;font-size:12px}
</style>
</head>
<body>
<div id="emu">
<div id="lbl">0 x A R K</div>
<div id="sw"><div id="pixi-wrap"><canvas id="g" width="960" height="640" style="display:none"></canvas></div></div>
<div id="ctrls">
<button class="b a" onclick="ss('map')">MAP</button>
<button class="b" onclick="ss('crd')">CARDS</button>
<button class="b" onclick="ss('log')">LOG</button>
<button class="b" onclick="ss('stats')">STATS</button>
</div>
<div id="h">ARROWS move / SPACE menu / Z select / X back / M sound / F fps</div>
</div>
<div id="touch-overlay">
<div class="touch-btn" id="dpad-up">&uarr;</div>
<div class="touch-btn" id="dpad-down">&darr;</div>
<div class="touch-btn" id="dpad-left">&larr;</div>
<div class="touch-btn" id="dpad-right">&rarr;</div>
<div class="touch-btn" id="btn-a">A</div>
<div class="touch-btn" id="btn-b">B</div>
<div class="touch-btn" id="btn-start">START</div>
</div>
<!-- GAME_SCRIPT -->

<!-- React UI: wallet / lobby / NFT inventory (mounted into #react-root) -->
<div id="react-root"></div>

<style>
/* ── 0xARK React UI overlay ─────────────────────────────────── */
#react-root{position:fixed;top:12px;right:12px;z-index:200;display:flex;flex-direction:column;gap:0;pointer-events:auto}
.oxark-ui{display:flex;flex-direction:column;gap:6px;font-family:'VT323',monospace}
/* Wallet panel */
.wallet-panel{display:flex;align-items:center;gap:8px;background:rgba(10,10,24,.92);border:1px solid #2a2a4a;border-radius:10px;padding:6px 10px;backdrop-filter:blur(8px)}
.wallet-info{display:flex;align-items:center;gap:6px}
.wallet-address{font-size:13px;color:#8888cc;letter-spacing:.5px}
.btn-disconnect{background:none;border:none;color:#555;cursor:pointer;font-size:16px;padding:0 2px;line-height:1}
.btn-disconnect:hover{color:#aa4444}
/* Override wallet-adapter button */
.wallet-adapter-button{font-family:'VT323',monospace!important;font-size:15px!important;height:34px!important;padding:0 14px!important;border-radius:8px!important;background:#232342!important}
.wallet-adapter-button:hover{background:#2e2e58!important}
/* Tabs */
.ui-tabs{display:flex;gap:2px;background:rgba(10,10,24,.85);border:1px solid #2a2a4a;border-radius:8px;padding:3px}
.tab{flex:1;padding:4px 10px;border:none;border-radius:6px;background:transparent;color:#666;font:15px 'VT323',monospace;cursor:pointer;letter-spacing:.5px;transition:all .1s}
.tab.active{background:#1e1e42;color:#aaaaee}
/* Panel */
.ui-panel{background:rgba(10,10,24,.92);border:1px solid #2a2a4a;border-radius:10px;padding:10px 12px;backdrop-filter:blur(8px);max-height:70vh;overflow-y:auto;min-width:220px}
/* Lobby */
.lobby-title{font-size:18px;color:#8888cc;margin-bottom:8px}
.game-info{background:#111126;border-radius:6px;padding:6px 8px;margin-bottom:8px;font-size:13px}
.info-row{display:flex;justify-content:space-between;color:#666;margin-bottom:2px}
.info-row span:last-child{color:#aaa}
.status-badge{color:#55cc88;font-size:12px}
.lobby-actions{display:flex;flex-direction:column;gap:6px}
.btn{padding:6px 12px;border:1px solid;border-radius:7px;font:15px 'VT323',monospace;cursor:pointer;letter-spacing:.5px;transition:all .1s}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:#1e2e6e;color:#aac;border-color:#3040aa}
.btn-primary:not(:disabled):hover{background:#2a3e8e}
.btn-secondary{background:#1e3e2e;color:#8ca;border-color:#2a6a4a;padding:6px 10px}
.btn-secondary:not(:disabled):hover{background:#2a5a3e}
.btn-stake{background:#4e2e0e;color:#fca;border-color:#8a5a1a;animation:pulse-stake .8s ease-in-out infinite alternate}
@keyframes pulse-stake{from{box-shadow:0 0 0 rgba(200,120,20,0)}to{box-shadow:0 0 8px rgba(200,120,20,.6)}}
.join-row{display:flex;gap:4px}
.game-id-input{flex:1;background:#0c0c20;border:1px solid #2a2a4a;border-radius:6px;color:#aaa;padding:5px 8px;font:14px 'VT323',monospace}
.game-id-input::placeholder{color:#444}
.error-msg{color:#cc4444;font-size:13px;margin-top:4px}
/* Inventory */
.inventory-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.inventory-title{font-size:17px;color:#8888cc}
.btn-refresh{background:none;border:1px solid #333;border-radius:5px;color:#666;cursor:pointer;padding:2px 6px;font-size:14px}
.btn-refresh:hover{color:#aaa}
.collection-progress{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.progress-bar-track{flex:1;height:5px;background:#1a1a32;border-radius:3px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#3344cc,#66aaff);border-radius:3px;transition:width .4s}
.progress-label{font-size:12px;color:#666;min-width:36px;text-align:right}
.legendary-badge{font-size:12px;color:#fbbf24;margin-bottom:6px;letter-spacing:.5px}
.empty-inventory{color:#444;font-size:13px;text-align:center;padding:12px 0}
.card-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.card-slot{background:#0e0e22;border:1px solid;border-radius:5px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .1s,background .1s}
.card-slot:hover{background:#1a1a34;transform:scale(1.05)}
.card-slot.selected{background:#1e1e40;box-shadow:0 0 6px rgba(100,120,255,.4)}
.card-id{font-size:11px;color:#aaa}
.card-rarity{font-size:11px;font-weight:bold}
.card-detail{background:#0e0e22;border-radius:6px;padding:8px;border:1px solid #2a2a4a}
.card-detail-header{display:flex;justify-content:space-between;margin-bottom:4px}
.card-detail-header strong{color:#ccc;font-size:14px}
.card-detail-rarity{font-size:13px}
.card-detail-desc{color:#555;font-size:12px;margin-bottom:6px}
.card-detail-link{color:#6688cc;font-size:12px;text-decoration:none}
.card-detail-link:hover{color:#88aaee}
/* Scrollbar */
.ui-panel::-webkit-scrollbar{width:4px}.ui-panel::-webkit-scrollbar-track{background:transparent}.ui-panel::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
</style>

<link rel="stylesheet" href="react-dist/oxark-ui.css">
<script src="react-dist/oxark-ui.iife.js" defer></script>
</body>
</html>
