// PMD-STYLE FLOOR TITLE CARD (v164 dramatic rewrite)
// ═══════════════════════════════════════
let floorTitleFrame=0,floorTitleActive=false,floorTitleFloor=0;
const FLOOR_TITLE_DURATION=200; // ~3.3s at 60fps

const FLOOR_THEMES=[
  null, // 0=town
  {danger:1,sub:'SUNKEN GALLERIES',note:'Scattered cards. Watch your step.',accent:'#6090e0',bg:'#0a0c20',stripe:'#1a2048'},
  {danger:2,sub:'DROWNED ARCHIVES',note:'The archives whisper. MIRA was here.',accent:'#8060c0',bg:'#0c0820',stripe:'#241840'},
  {danger:3,sub:'ECHO CHAMBERS',note:'Echoes of the crew. Proceed carefully.',accent:'#b050a0',bg:'#100820',stripe:'#2c1040'},
  {danger:4,sub:'THE DEEP VAULT',note:'The vault trembles. VEGA hunts below.',accent:'#d04060',bg:'#120608',stripe:'#301020'},
  {danger:5,sub:'ARK CORE',note:'The ARK Core. One heir. No mercy.',accent:'#e0a020',bg:'#120800',stripe:'#301000'},
];

function showFloorTitle(floorNum){
  floorTitleActive=true;
  floorTitleFrame=0;
  floorTitleFloor=floorNum;
}

function updateFloorTitle(){
  if(!floorTitleActive)return;
  floorTitleFrame++;
  if(floorTitleFrame>FLOOR_TITLE_DURATION)floorTitleActive=false;
}

function drawFloorTitle(){
  if(!floorTitleActive)return;
  const t=floorTitleFrame;
  const dur=FLOOR_TITLE_DURATION;
  const theme=FLOOR_THEMES[floorTitleFloor]||FLOOR_THEMES[1];
  const f=floorTitleFloor;

  // ── Phase timing ──
  // 0-15: full-screen wipe (horizontal bars slide in from right)
  // 15-50: hold full-screen with pulsing floor number
  // 50-80: floor name types in letter by letter
  // 80-160: hold with scanlines, danger stars appear
  // 160-200: fade out
  let globalAlpha=1;
  if(t<10)globalAlpha=t/10;
  else if(t>160)globalAlpha=Math.max(0,1-(t-160)/40);

  // ── Full-screen black overlay ──
  g.globalAlpha=globalAlpha*0.88;
  g.fillStyle=theme.bg;
  g.fillRect(0,0,W,H);

  // ── Animated stripe bars (PMD-style horizontal bands) ──
  const STRIPE_H=6,STRIPE_GAP=18;
  g.globalAlpha=globalAlpha*0.18;
  g.fillStyle=theme.stripe;
  for(let sy=0;sy<H;sy+=STRIPE_GAP){
    const slideX=t<20?W*(1-t/20):0;
    g.fillRect(slideX,sy,W,STRIPE_H);
  }

  // ── Accent top bar ──
  g.globalAlpha=globalAlpha*(t<15?t/15:1);
  const barGrad=g.createLinearGradient(0,0,W,0);
  barGrad.addColorStop(0,'rgba(0,0,0,0)');
  barGrad.addColorStop(0.3,theme.accent);
  barGrad.addColorStop(0.7,theme.accent);
  barGrad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=barGrad;g.fillRect(0,H/2-56,W,3);

  // ── Accent bottom bar ──
  g.fillRect(0,H/2+52,W,3);

  // ── FLOOR NUMBER (giant, centered, glowing) ──
  const floorNums=['','B1','B2','B3','B4','B5'];
  const flNum=floorNums[f]||('B'+f);
  const numAlpha=t<20?Math.max(0,(t-10)/10):1;
  const numPulse=1+Math.sin(t*0.08)*0.04;
  // Glow shadow
  g.globalAlpha=globalAlpha*numAlpha*0.4;
  g.font=`bold ${Math.floor(72*numPulse)}px monospace`;
  g.textAlign='center';
  g.fillStyle=theme.accent;
  g.fillText(flNum,W/2+2,H/2+26+2);
  // Main text
  g.globalAlpha=globalAlpha*numAlpha;
  g.fillStyle='#ffffff';
  g.fillText(flNum,W/2,H/2+26);
  g.textAlign='left';

  // ── SUB LABEL (typewriter effect, starts at t=50) ──
  if(t>=50){
    const charCount=Math.floor((t-50)/1.5);
    const subStr=theme.sub.slice(0,charCount);
    const subAlpha=Math.min(1,(t-50)/10);
    g.globalAlpha=globalAlpha*subAlpha;
    g.font='bold 8px monospace';g.textAlign='center';
    g.fillStyle=theme.accent;
    g.fillText(subStr,W/2,H/2-38);
    g.textAlign='left';
  }

  // ── DANGER LEVEL (bar-style, appears at t=80) ──
  if(t>=80){
    const dangerAlpha=Math.min(1,(t-80)/15);
    const d=theme.danger;
    const barW=80,barH=5,barX=W/2-barW/2,barY=H/2+42;
    // Background track
    g.globalAlpha=globalAlpha*dangerAlpha*0.35;
    g.fillStyle='#ffffff';g.fillRect(barX,barY,barW,barH);
    // Filled portion
    g.globalAlpha=globalAlpha*dangerAlpha;
    const fillGrad=g.createLinearGradient(barX,0,barX+barW,0);
    fillGrad.addColorStop(0,'#50c0ff');
    fillGrad.addColorStop(0.4,theme.accent);
    fillGrad.addColorStop(1,'#ff3030');
    g.fillStyle=fillGrad;
    const fillW=Math.min(barW,barW*(d/5)*(t<95?(t-80)/15:1));
    g.fillRect(barX,barY,fillW,barH);
    // Label
    g.globalAlpha=globalAlpha*dangerAlpha*0.7;
    g.font='5px monospace';g.textAlign='center';
    g.fillStyle='#c8c8d8';
    g.fillText('DANGER  '+('■'.repeat(d))+'□'.repeat(5-d),W/2,barY+barH+8);
    g.textAlign='left';
  }

  // ── FLAVOR TEXT (appears at t=100) ──
  if(t>=100){
    const noteAlpha=Math.min(1,(t-100)/20);
    g.globalAlpha=globalAlpha*noteAlpha*0.65;
    g.font='6px monospace';g.textAlign='center';
    g.fillStyle='#a8a8b8';
    g.fillText(theme.note,W/2,H/2+68);
    g.textAlign='left';
  }

  // ── Corner decorations ──
  g.globalAlpha=globalAlpha*(t<20?t/20:1)*0.5;
  g.strokeStyle=theme.accent;g.lineWidth=1;
  const cd=12; // corner decoration size
  // top-left
  g.beginPath();g.moveTo(32,H/2-60);g.lineTo(32,H/2-60+cd);g.moveTo(32,H/2-60);g.lineTo(32+cd,H/2-60);g.stroke();
  // top-right
  g.beginPath();g.moveTo(W-32,H/2-60);g.lineTo(W-32,H/2-60+cd);g.moveTo(W-32,H/2-60);g.lineTo(W-32-cd,H/2-60);g.stroke();
  // bottom-left
  g.beginPath();g.moveTo(32,H/2+56);g.lineTo(32,H/2+56-cd);g.moveTo(32,H/2+56);g.lineTo(32+cd,H/2+56);g.stroke();
  // bottom-right
  g.beginPath();g.moveTo(W-32,H/2+56);g.lineTo(W-32,H/2+56-cd);g.moveTo(W-32,H/2+56);g.lineTo(W-32-cd,H/2+56);g.stroke();

  g.globalAlpha=1;
}

// ═══════════════════════════════════════
// LOCATION BANNER (FRLG style)
// ═══════════════════════════════════════
function updateBanner(){
  if(!bannerText)return;
  bannerTimer++;
  if(bannerPhase===0&&bannerTimer>20)bannerPhase=1;
  if(bannerPhase===1&&bannerTimer>110)bannerPhase=2;
  if(bannerPhase===2&&bannerTimer>140){bannerText='';bannerSubText='';bannerTimer=0;bannerPhase=0;}
}

function drawBanner(){
  if(!bannerText)return;
  let slideX=0;
  if(bannerPhase===0){
    const t=Math.min(1,bannerTimer/20);
    slideX=-W*(1-t*t*(3-2*t)); // smooth ease
  }else if(bannerPhase===1){
    slideX=0;
  }else{
    const t=Math.min(1,(bannerTimer-110)/30);
    slideX=W*t*t;
  }
  // Dark bar with gradient tint
  const barH=bannerSubText?40:28;
  g.fillStyle='rgba(20,16,24,.88)';
  g.fillRect(slideX,8,W,barH);
  // Accent lines
  g.fillStyle='rgba(240,200,100,.35)';
  g.fillRect(slideX,7,W,1);g.fillRect(slideX,8+barH,W,1);
  g.fillStyle='rgba(200,180,140,.15)';
  g.fillRect(slideX,9,W,1);
  // Text with shadow
  txShadow(bannerText,slideX+W/2-bannerText.length*5,26,10,'#f8f0e0','rgba(0,0,0,.6)');
  if(bannerSubText)txShadow(bannerSubText,slideX+W/2-bannerSubText.length*3,40,6,'#c8b880','rgba(0,0,0,.4)');
}

// MINIMAP
// ═══════════════════════════════════════
function drawMinimap(){
  const mmW=130,mmH=88;
  const mx=W-mmW-10,my=H-HUD_HEIGHT-mmH-16;
  const sx=mmW/MW,sy=mmH/MH;

  // ── BASE LAYER: tile colors + fog — updated every 10 frames or on map change ──
  if(currentMap!==_mmBaseMap||fr-_mmBaseFrame>=10){
    const _mc=g;g=mmBaseCtx;
    // Background
    g.clearRect(0,0,mmW,mmH);
    g.fillStyle='rgba(20,20,30,.88)';g.fillRect(0,0,mmW,mmH);
    const m=getMap();
    for(let ty=0;ty<MH;ty+=2){
      for(let tx_=0;tx_<MW;tx_+=2){
        const revealed=fogRevealed[currentMap][ty]?.[tx_]||
                       fogRevealed[currentMap][ty]?.[tx_+1]||
                       fogRevealed[currentMap][ty+1]?.[tx_]||
                       fogRevealed[currentMap][ty+1]?.[tx_+1];
        if(!revealed){bx(tx_*sx,ty*sy,Math.max(1,sx*2),Math.max(1,sy*2),'#080810');continue;}
        const t=m[ty]?.[tx_];
        let col;
        if(t===0||t===17)col='#3070b8';
        else if(t===1||t===7||t===11)col='#48a850';
        else if(t===3||t===13)col='#2a6828';
        else if(t===2)col='#a08050';
        else if(t===4||t===10||t===14)col='#d8c060';
        else if(t===5||t===15||t===16)col='#c04848';
        else if(t===18||t===8)col='#686878';
        else if(t===22||t===23)col='#585860';
        else if(t===25)col='#c04020';
        else if(t===24||t===26)col='#60c0d0';
        else col='#48a850';
        bx(tx_*sx,ty*sy,Math.max(1,sx*2),Math.max(1,sy*2),col);
      }
    }
    g=_mc;
    _mmBaseMap=currentMap;_mmBaseFrame=fr;
  }

  // ── ANIM LAYER: encounter shimmer — updated every 4 frames ──
  if(fr-_mmAnimFrame>=4){
    const _mc=g;g=mmAnimCtx;
    g.clearRect(0,0,mmW,mmH);
    if(inDungeon){
      const m=getMap();
      for(let ty=0;ty<MH;ty+=2){
        for(let tx_=0;tx_<MW;tx_+=2){
          const rev2=fogRevealed[currentMap][ty]?.[tx_]||
                     fogRevealed[currentMap][ty]?.[tx_+1]||
                     fogRevealed[currentMap][ty+1]?.[tx_]||
                     fogRevealed[currentMap][ty+1]?.[tx_+1];
          if(!rev2)continue;
          const t2=m[ty]?.[tx_];
          let encRate=0;
          if(t2===11)encRate=0.30;
          else if(t2===1)encRate=0.15;
          if(encRate===0)continue;
          const phase=(tx_*3+ty*7)&15;
          const shimmer=Math.sin(fr*0.07+phase*0.39)*0.5+0.5;
          const alpha=(encRate>0.25?0.22:0.12)*shimmer;
          const eCol=encRate>0.25?`rgba(255,160,30,${alpha})`:`rgba(180,240,80,${alpha})`;
          bx(tx_*sx,ty*sy,Math.max(1,sx*2),Math.max(1,sy*2),eCol);
        }
      }
    }
    g=_mc;
    _mmAnimFrame=fr;
  }

  // ── BLIT both cached layers ──
  g.drawImage(mmBaseCanvas,mx,my);
  g.drawImage(mmAnimCanvas,mx,my);

  // ── FRLG-style window border (cheap, always per-frame) ──
  g.fillStyle='#484058';
  g.fillRect(mx,my-1,mmW,1);g.fillRect(mx-1,my,1,mmH);
  g.fillRect(mx+mmW,my,1,mmH);g.fillRect(mx,my+mmH,mmW,1);
  g.fillStyle='#686078';
  g.fillRect(mx+1,my,mmW-2,1);g.fillRect(mx,my+1,1,mmH-2);
  g.fillRect(mx+mmW-1,my+1,1,mmH-2);g.fillRect(mx+1,my+mmH-1,mmW-2,1);

  // ── Dungeon legend (static text, cheap) ──
  if(inDungeon){
    bx(mx+2,my+mmH-9,4,4,'rgba(255,160,30,0.65)');
    txShadow('30%',mx+7,my+mmH-5,4,'rgba(220,160,60,0.7)','rgba(0,0,0,.3)');
    bx(mx+26,my+mmH-9,4,4,'rgba(180,240,80,0.55)');
    txShadow('15%',mx+31,my+mmH-5,4,'rgba(160,200,80,0.7)','rgba(0,0,0,.3)');
  }

  // ── Dynamic dots: exits, NPCs, traps, rivals, player (all cheap, per-frame) ──
  const exitPulse=Math.sin(fr*0.15)*0.4+0.6;
  exits.forEach(e=>{
    if(e.fromMap===currentMap){
      e.tiles.forEach(([ex,ey])=>{
        if(fogRevealed[currentMap][ey]?.[ex]){
          g.globalAlpha=exitPulse;
          bx(mx+ex*sx,my+ey*sy,Math.max(1,sx),Math.max(1,sy),'#fff');
          g.globalAlpha=1;
        }
      });
    }
  });
  npcs.forEach(npc=>{
    if(npc.map===currentMap&&fogRevealed[currentMap][npc.y]?.[npc.x])
      bx(mx+npc.x*sx,my+npc.y*sy,Math.max(1,sx),Math.max(1,sy),'#f0d040');
  });
  triggeredTraps.forEach(key=>{
    const parts=key.split('-');
    const tMap=parseInt(parts[0]),tx_=parseInt(parts[1]),ty_=parseInt(parts[2]);
    if(tMap===currentMap)bx(mx+tx_*sx,my+ty_*sy,Math.max(1,sx),Math.max(1,sy),'#ff3030');
  });
  pl.slice(1).forEach((rp,idx)=>{
    if(rivalMaps[idx]===currentMap&&(isVisibleThroughFog(rp.x,rp.y,3)||crystalRevealTimer>0)){
      const rpx=mx+rp.x*sx,rpy=my+rp.y*sy;
      bx(rpx,rpy,2,2,rp.c);
      if(crystalRevealTimer>0){
        const ai=rivalAI[idx];
        const gdx=ai.goalX-rp.x,gdy=ai.goalY-rp.y;
        if(gdx!==0||gdy!==0){
          const len=Math.sqrt(gdx*gdx+gdy*gdy);
          g.strokeStyle=rp.c;g.lineWidth=1;
          g.beginPath();g.moveTo(rpx+1,rpy+1);g.lineTo(rpx+1+gdx/len*4,rpy+1+gdy/len*4);g.stroke();
        }
      }
    }
  });
  if(inDungeon){
    exits.forEach(ex=>{
      if(ex.fromMap!==currentMap)return;
      ex.tiles.forEach(([etx,ety])=>{
        const col=ex.isGoal?'#ffe060':ex.isEscape?'#40e060':'#e0c040';
        g.globalAlpha=0.8+Math.sin(fr*0.1)*0.2;
        bx(mx+etx*sx,my+ety*sy,Math.max(2,sx),Math.max(2,sy),col);
        g.globalAlpha=1;
      });
    });
  }
  const playerPulse=Math.sin(fr*0.2)*0.3+0.7;
  g.globalAlpha=playerPulse;
  bx(mx+pl[0].x*sx-1,my+pl[0].y*sy-1,3,3,'#fff');bx(mx+pl[0].x*sx,my+pl[0].y*sy,1,1,'#40f040');
  g.globalAlpha=1;
  txShadow(mapNames[currentMap],mx,my-5,4,mapColors[currentMap],'rgba(0,0,0,.4)');
}

// WILD CARD ENCOUNTER (tall grass)
// ═══════════════════════════════════════
function tryWildEncounter(){
  // GDD v1.0: encounters only happen in dungeon (town is safe zone)
  if(!inDungeon)return;
  const m=getMap();
  const tile=m[pl[0].y]?.[pl[0].x];
  // Base rates: Tall grass 25%, regular grass 12%
  // Streak bonus: +5% per streak level
  // Danger LOW: +5% bonus to encounter rate
  const streakBonus=Math.min(streakCount*0.05,0.25); // cap at +25%
  const dangerBonus=areaDanger[currentMap]<DANGER_LOW_THRESH?0.05:0;
  // Rubber-banding: +10% encounter rate when behind on unique cards (fewer than rivals)
  const playerUnique=hasUniqueCards(0).size;
  const maxRivalUnique=Math.max(hasUniqueCards(1).size,hasUniqueCards(2).size);
  const rubberBand=playerUnique<maxRivalUnique?0.10:0;
  if(tile===11){
    if(Math.random()>(0.30+streakBonus+dangerBonus+rubberBand))return; // tall grass: 30% base
  }else if(tile===1){
    if(Math.random()>(0.15+streakBonus+dangerBonus+rubberBand))return; // regular grass: 15% base
  }else{
    return;
  }

  // Determine card based on current dungeon floor pool
  const floorPool=AREA_CARDS[currentMap]||AREA_CARDS[1];
  let cardIdx;
  // Streak 5+: pick an unowned card from the floor pool (guaranteed new unique if possible)
  if(streakCount>=5){
    const owned=hasUniqueCards(0);
    const needed=floorPool.filter(cid=>!owned.has(cid));
    if(needed.length>0){cardIdx=needed[Math.floor(Math.random()*needed.length)]-1;}
    else{cardIdx=floorPool[Math.floor(Math.random()*floorPool.length)]-1;}
  }else{
    // Normal: prefer vault-new card from floor pool
    const vault_w=pl[0].vault||new Set();
    const wNewPool=floorPool.filter(id=>!vault_w.has(id));
    const wPool=wNewPool.length>0?wNewPool:floorPool;
    cardIdx=wPool[Math.floor(Math.random()*wPool.length)]-1;
  }

  wildEncounterActive=true;
  wildEncounterCard=cardIdx;
  wildEncounterFrame=fr;
  sfxEncounter();
  flash();
}

function drawWildEncounter(){
  if(!wildEncounterActive)return;
  const t=fr-wildEncounterFrame;

  if(t<30){
    // v119: Dramatic silhouette reveal — rarity-hinted card appearance
    const wCr=CD[wildEncounterCard];
    const wRar=(wCr&&wCr.r)||1;
    const wRarCols=['','#888898','#50d060','#6090f0','#c060e0','#fff8a0'];
    const wRcol=wRarCols[wRar]||'#f0c830';
    const prog=Math.min(1,t/24);
    const pulse=0.5+Math.sin(t*0.35)*0.5;
    // Dim overlay
    g.globalAlpha=Math.min(0.85,prog*0.85);
    bx(0,0,W,H,'rgba(0,0,0,1)');
    g.globalAlpha=1;
    // Card silhouette rising from bottom
    const silW=64,silH=90;
    const riseY=H-70-Math.round(prog*(H/2+20));
    g.globalAlpha=prog;
    bx(W/2-silW/2-2,riseY-2,silW+4,silH+4,wRcol); // rarity border glow
    bx(W/2-silW/2,riseY,silW,silH,'#06061a'); // dark body
    // Inner details (rarity color seeps in)
    g.globalAlpha=prog*pulse*0.4;
    bx(W/2-silW/2+4,riseY+4,silW-8,Math.round(silH*0.6),wRcol);
    g.globalAlpha=prog;
    // "?" on silhouette
    txShadow('?',W/2-9,riseY+silH/2+8,20,'#1c1c48','rgba(0,0,0,.5)');
    // Orbiting rarity sparks
    for(let oi=0;oi<wRar+3;oi++){
      const ang=t*0.2+oi*(Math.PI*2/(wRar+3));
      const dist=38+Math.sin(t*0.18+oi)*8;
      g.globalAlpha=prog*pulse*0.8;
      bx(W/2+Math.cos(ang)*dist-2,riseY+silH/2+Math.sin(ang)*dist-2,5,5,wRcol);
    }
    g.globalAlpha=prog;
    // Text panel just below silhouette
    win(W/2-148,riseY+silH+10,296,36);
    txShadow('Wild card appeared!',W/2-116,riseY+silH+34,11,'#c04040','rgba(200,180,140,.3)');
    g.globalAlpha=1;
  }else if(t<40){
    // Brief pause
  }else if(!cardAcqActive&&t>=40&&t<42){
    // Start card acquisition
    const cr=CD[wildEncounterCard];
    // Find empty slot
    const wildCardId=wildEncounterCard+1;
    const wasInVault=pl[0].vault&&pl[0].vault.has(wildCardId);
    const wAdded=addCardToPlayer(0,wildCardId); // updates vault + hand
    if(wAdded){
      startCardAcquisition(wildEncounterCard);
      lg.push('Wild: Found '+cr.n+' in '+mapNames[currentMap]+'!');
      // Streak: new unique card
      if(!wasInVault){streakCount++;streakDisplayTimer=60;sfxStreakUp();}
      // Tutorial: first card
      if(!tutorialFlags.gotFirstCard){tutorialFlags.gotFirstCard=true;tutorialMsg='Check your cards with SPACE > CARDS';tutorialMsgTimer=180;}
    }else{
      // Hand full - offer discard (vault already updated by addCardToPlayer)
      discardActive=true;discardSelIdx=0;discardPendingCard=wildCardId;discardSource='wild';
    }
  }else if(discardActive){
    // Wait for discard dialog
  }else if(t>150||cardAcqDone){
    wildEncounterActive=false;
    cardAcqDone=false;
    // Check win after acquiring a card
    checkWinAndTransition(500);
  }
}

function checkTreasure(){
  for(const t of treasures){
    if(t.collected)continue;
    if(t.map===currentMap&&t.x===pl[0].x&&t.y===pl[0].y){
      t.collected=true;
      const cr=CD[t.card];
      const treasureCardId=t.card+1;
      const tAdded=addCardToPlayer(0,treasureCardId); // updates vault + hand
      if(tAdded){
        startCardAcquisition(t.card);
        twSet('You found a hidden '+cr.n+' card!');
        lg.push('Found hidden '+cr.n+'!');
        checkWinAndTransition(2000);
      }else{
        // Hand full - offer discard (vault already updated by addCardToPlayer)
        discardActive=true;discardSelIdx=0;discardPendingCard=treasureCardId;discardSource='wild';
        twSet('Found a '+cr.n+' card! Discard one to keep it.');
      }
      return;
    }
  }
}

function checkNPCInteraction(){
  const p=pl[0];
  for(const npc of npcs){
    if(npc.map!==currentMap)continue;
    // Check if adjacent
    const dx=Math.abs(p.x-npc.x),dy=Math.abs(p.y-npc.y);
    if(dx+dy===1){
      // NPC faces the player
      if(p.x<npc.x)npc.dir=1;else if(p.x>npc.x)npc.dir=3;
      else if(p.y<npc.y)npc.dir=2;else npc.dir=0;

      // Player auto-faces the NPC
      if(npc.x<p.x)p.dir=1;else if(npc.x>p.x)p.dir=3;
      else if(npc.y<p.y)p.dir=2;else if(npc.y>p.y)p.dir=0;

      // Gacha Keeper opens the gacha
      if(npc.name==='Gacha Keeper'){
        gachaActive=true;gachaPhase='menu';gachaSelectedTier=0;gachaResultCard=-1;gachaSpinFrame=0;
        if(!tutorialFlags.firstGacha){tutorialFlags.firstGacha=true;setTimeout(()=>{tutorialMsg='Gacha: Z=Draw, X=Cancel. Higher tiers = rarer cards!';tutorialMsgTimer=200;},100);}
        sfxShopOpen();
        return true;
      }
      // Card Merchant opens marketplace
      if(npc.name==='Card Merchant'){
        marketActive=true;marketTab=0;marketPage=0;
        sfxShopOpen();
        return true;
      }
      // v74: Alchemist opens synthesis
      if(npc.name==='Alchemist'){
        synthActive=true;synthPhase='pick';synthSelected=[];synthRarityFilter=1;synthResultCard=-1;
        sfxShopOpen();
        return true;
      }
      npcDialogActive=true;
      npcDialogLines=getNPCDialog(npc); // v82: context-aware dialog
      npcDialogIdx=0;
      npcDialogName=npc.name;
      npcDialogOpenFrame=fr;
      sfxConfirm();
      return true;
    }
  }
  return false;
}

function openCardShop(){
  shopActive=true;

  shopResultText='';
  shopOpenFrame=fr;
  sfxShopOpen();

function getPlayerFilledSlots(){
  const slots=[];
  for(let i=0;i<HAND_SIZE;i++){if(pl[0].cd[i]>0)slots.push(i);}
  return slots;
}

function doShopTrade(){
  const filled=getPlayerFilledSlots();
  if(filled.length===0)return;
  const slot=filled[shopSelectedIdx];
  const oldCard=pl[0].cd[slot];
  const oldName=CD[oldCard-1].n;
  // Prioritize cards not yet in vault (new uniques) for progression
  const ownedInHand=new Set(pl[0].cd.filter(c=>c>0));
  const vault=pl[0].vault||new Set();
  const vaultNew=[]; // never collected
  const vaultOwned=[]; // in vault but not in hand
  for(let i=1;i<=60;i++){
    if(i===oldCard)continue; // don't give back the same card
    if(!vault.has(i)) vaultNew.push(i);
    else if(!ownedInHand.has(i)) vaultOwned.push(i);
  }
  let newCard;
  if(vaultNew.length>0){
    // Always give a card the player has never owned
    newCard=vaultNew[Math.floor(Math.random()*vaultNew.length)];
  }else if(vaultOwned.length>0){
    // Fall back to vault-owned cards not in hand
    newCard=vaultOwned[Math.floor(Math.random()*vaultOwned.length)];
  }else{
    // All 60 collected — pick any card different from old
    do{ newCard=Math.floor(Math.random()*60)+1; }while(newCard===oldCard);
  }
  // Check if new card is a first-time unique before adding
  const isNewUnique=pl[0].vault&&!pl[0].vault.has(newCard);
  // Use proper card management: clear old slot then add new card
  pl[0].cd[slot]=0;cardTimers[slot]=0;
  syncCardCount(0);
  // Add new card via addCardToPlayer so vault is updated properly
  addCardToPlayer(0,newCard);
  const newName=CD[newCard-1].n;
  shopResultText='Traded '+oldName+' for '+newName+'!'+(isNewUnique?' NEW UNIQUE!':'');
  shopResultFrame=fr;
  shopPhase='result';
  startCardAcquisition(newCard-1);
  sfxShopTrade();
  lg.push('Shop: Traded '+oldName+' → '+newName+(isNewUnique?' (NEW UNIQUE!)':'')+'!');
  checkWinAndTransition(2000);
}

function doSynthesis(){
  // Validate: 3 cards of same rarity selected
  if(synthSelected.length!==3)return;
  const cards=synthSelected.map(slot=>pl[0].cd[slot]);
  const rarities=cards.map(cid=>CD[cid-1]?.r||1);
  const r=rarities[0];
  if(!rarities.every(rv=>rv===r))return;
  if(r>=5)return; // can't upgrade legendary
  const targetRarity=r+1;
  // Pool of target rarity cards not yet in vault
  const vault_=pl[0].vault||new Set();
  const targetPool=[];
  for(let i=1;i<=60;i++){const cr=CD[i-1];if(cr&&cr.r===targetRarity&&!vault_.has(i))targetPool.push(i);}
  // Fallback: any card of target rarity
  const anyPool=[];
  for(let i=1;i<=60;i++){const cr=CD[i-1];if(cr&&cr.r===targetRarity)anyPool.push(i);}
  const pool=targetPool.length>0?targetPool:anyPool;
  if(pool.length===0){synthPhase='result';synthResultCard=-1;synthResultFrame=fr;return;}
  // Consume the 3 cards (sorted descending to avoid index shift issues)
  const sortedSlots=[...synthSelected].sort((a,b)=>b-a);
  sortedSlots.forEach(slot=>{removeCardFromPlayer(0,slot);cardTimers[slot]=0;});
  // Give new card
  const newId=pool[Math.floor(Math.random()*pool.length)];
  const added=addCardToPlayer(0,newId);
  if(!added){discardActive=true;discardSelIdx=0;discardPendingCard=newId;discardSource='wild';}
  synthResultCard=newId;
  synthPhase='result';synthResultFrame=fr;
  const cr=CD[newId-1];
  lg.push('[SYNTHESIS] Fused 3x '+RARITY_LABEL[r]+' → '+cr.n+' ('+RARITY_LABEL[cr.r]+')!');
  const _synthRarCols=['','#888898','#50d060','#b060e0','#e0a020','#ffe080'];
  sfxCardGet();screenShake(cr.r>=3?cr.r:3,cr.r>=3?cr.r*3:6);
  triggerCardGetBurst(pl[0].visualX-camX,pl[0].visualY-camY-8,_synthRarCols[cr.r]||'#f0c030');
  if(cr.r>=3)hitPause(cr.r>=4?4:3);
  checkWinAndTransition(2000); // v149: card 60 could come from synthesis
}

  const floorEvents=[
    [], // Town
    [{text:'A trail of footprints leads to a hidden card!', action:'card'}],   // Floor 1
    [{text:'Mushroom spores fill the air... you feel sluggish.', action:'tension'}],  // Floor 2
    [{text:'Ancient runes flare! Spell energy restored.', action:'spell_restore'}],   // Floor 3
    [{text:'A dark force drains your cards faster! Beware.', action:'decay_warn'}],  // Floor 4

     {text:'VEGA\'s voice echoes: "This floor is mine."', action:'rival_taunt'},
     {text:'MIRA\'s voice: "The legendary cards end here."', action:'rival_taunt'}],
  ];
  const floorExtra=floorEvents[currentFloor]||[];

  randomEventActive=true;
  randomEventText=ev.text;

  sfxEventAlert();

  if(ev.action==='card'){

    const pool=AREA_CARDS[currentMap]||AREA_CARDS[1];
    const vault_=pl[0].vault||new Set();
    const newPool_=pool.filter(id=>!vault_.has(id));
    const usePool_=newPool_.length>0?newPool_:pool;
    const cardId=usePool_[Math.floor(Math.random()*usePool_.length)]; // 1-indexed
    const cardIdx=cardId-1; // 0-indexed for CD[]
    const evAdded=addCardToPlayer(0,cardId); // updates vault + hand
    if(evAdded){
      startCardAcquisition(cardIdx);
      lg.push('Event: Found a '+CD[cardIdx].n+' in a forgotten stash!');

    flash();

    // Alert effect
    rivalAlert=60;rivalAlertName='Scout';
    lg.push('Event: A rival scout was spotted nearby!');
  }else if(ev.action==='tension'){
    // Atmospheric — tension music spike
    screenShake(1,3);
    lg.push('Event: You sense a presence nearby...');
  }else if(ev.action==='decay_warn'){
    // Speed up decay on the oldest hand card by 20s as penalty
    let oldest=-1,oldestAge=0;
    for(let i=0;i<HAND_SIZE;i++){
      if(cardTimers[i]>0){const age=Date.now()-cardTimers[i];if(age>oldestAge){oldestAge=age;oldest=i;}}
    }
    if(oldest>=0){cardTimers[oldest]-=20000;sfxDangerAlert();}
    lg.push('Event: Dark energy accelerated card decay!');
  }else if(ev.action==='spell_restore'){
    // Restore 1 of each depleted spell type
    let restored=false;
    if(sp.s<3){sp.s++;restored=true;}
    if(sp.b<3){sp.b++;restored=true;}
    if(sp.c<3){sp.c++;restored=true;}
    if(restored){sfxCrystal();lg.push('Event: Ancient runes restored spell energy!');}
  }else if(ev.action==='rival_taunt'){
    // Just a flavor event — tension shake
    screenShake(2,3);flash();
    lg.push('Event: A rival\'s voice echoes from the deep...');
  }
}

function wrapText(text,maxChars){
  if(text.length<=maxChars)return[text];
  const words=text.split(' ');
  const lines=[];
  let cur='';
  for(const w of words){
    if(cur.length+w.length+1>maxChars){
      if(cur)lines.push(cur);
      cur=w;
    }else{
      cur=cur?cur+' '+w:w;
    }
  }
  if(cur)lines.push(cur);
  return lines;
}

function drawEdgeBlending(startTX,startTY,endTX,endTY){
  const m=getMap();
  for(let y=startTY;y<=endTY;y++){
    for(let x=startTX;x<=endTX;x++){
      const px=x*TW-camX,py=y*TH-camY;
      if(px<-TW||px>W||py<-TH||py>H)continue;
      const t=m[y]?.[x];
      if(t===undefined)continue;
      const gt=groundType(t);
      const tUp=getNeighborType(m,x,y,0,-1),tDn=getNeighborType(m,x,y,0,1);
      const tLf=getNeighborType(m,x,y,-1,0),tRt=getNeighborType(m,x,y,1,0);
      const h=tileHash(x,y);
      // Check each neighbor for different terrain
      const dirs=[[tUp,0,-1],[tDn,0,1],[tLf,-1,0],[tRt,1,0]];
      for(const [nt,dx,dy] of dirs){
        if(nt<0)continue;
        const ngt=groundType(nt);
        if(ngt===gt)continue;
        // Edge position
        const isTop=dy===-1,isBot=dy===1,isLft=dx===-1,isRgt=dx===1;
        // Grass-to-Water
        if(gt==='grass'&&ngt==='water'){
          if(isTop){for(let i=0;i<TW;i++){if(thRand(x,y,i+100)>.4)bx(px+i,py,1,2,'#3c8c3c');if(thRand(x,y,i+115)>.75)bx(px+i,py,1,1,'#4878a0');}}
          if(isBot){for(let i=0;i<TW;i++){if(thRand(x,y,i+120)>.4)bx(px+i,py+TH-2,1,2,'#3c8c3c');if(thRand(x,y,i+135)>.75)bx(px+i,py+TH-1,1,1,'#4878a0');}}
          if(isLft){for(let i=0;i<TH;i++){if(thRand(x,y,i+140)>.4)bx(px,py+i,2,1,'#3c8c3c');if(thRand(x,y,i+155)>.75)bx(px,py+i,1,1,'#4878a0');}}
          if(isRgt){for(let i=0;i<TH;i++){if(thRand(x,y,i+160)>.4)bx(px+TW-2,py+i,2,1,'#3c8c3c');if(thRand(x,y,i+175)>.75)bx(px+TW-1,py+i,1,1,'#4878a0');}}
        }
        // Water-to-Sand (foam/surf line)
        if(gt==='water'&&ngt==='sand'){
          if(isTop){for(let i=0;i<TW;i++){if(thRand(x,y,i+180)>.3)bx(px+i,py,1,1,(wt+i)%3===0?'rgba(255,255,255,.5)':'rgba(180,220,240,.4)');}}
          if(isBot){for(let i=0;i<TW;i++){if(thRand(x,y,i+190)>.3)bx(px+i,py+TH-1,1,1,(wt+i)%3===0?'rgba(255,255,255,.5)':'rgba(180,220,240,.4)');}}
          if(isLft){for(let i=0;i<TH;i++){if(thRand(x,y,i+200)>.3)bx(px,py+i,1,1,(wt+i)%3===0?'rgba(255,255,255,.5)':'rgba(180,220,240,.4)');}}
          if(isRgt){for(let i=0;i<TH;i++){if(thRand(x,y,i+210)>.3)bx(px+TW-1,py+i,1,1,(wt+i)%3===0?'rgba(255,255,255,.5)':'rgba(180,220,240,.4)');}}
        }
        // Sand-to-Water (foam from sand side)
        if(gt==='sand'&&ngt==='water'){
          if(isTop){bx(px,py,TW,2,'rgba(180,220,240,.15)');for(let i=0;i<TW;i++){if((wt+i+x)%4===0)bx(px+i,py,1,1,'rgba(255,255,255,.35)');}}
          if(isBot){bx(px,py+TH-2,TW,2,'rgba(180,220,240,.15)');for(let i=0;i<TW;i++){if((wt+i+x)%4===0)bx(px+i,py+TH-1,1,1,'rgba(255,255,255,.35)');}}
          if(isLft){bx(px,py,2,TH,'rgba(180,220,240,.15)');for(let i=0;i<TH;i++){if((wt+i+y)%4===0)bx(px,py+i,1,1,'rgba(255,255,255,.35)');}}
          if(isRgt){bx(px+TW-2,py,2,TH,'rgba(180,220,240,.15)');for(let i=0;i<TH;i++){if((wt+i+y)%4===0)bx(px+TW-1,py+i,1,1,'rgba(255,255,255,.35)');}}
        }
        // Grass-to-Sand
        if(gt==='grass'&&ngt==='sand'){

// v192: Town ambient screen-space particles — deterministic, no state required
// Golden motes: card magic rising from ARK vaults. Cyan wisps: sea breeze from the harbor.
function drawTownAmbientParticles(){
  const visH=H-HUD_HEIGHT;
  const tf=fr; // frame counter, used for time

  // 14 golden magic motes — float upward with sinusoidal sway
  for(let i=0;i<14;i++){
    const h1=(i*2237+1873)>>>0;
    const startX=((h1*7481)>>>0)%W;
    const period=140+((h1*1021)>>>0)%60; // 140..199 frames per cycle
    const phase=(tf+i*37)%period;
    const prog=phase/period;
    const x=startX+Math.sin(tf*0.018+i*1.7)*16;
    // Rise from bottom half, fade in/out
    const y=visH*0.85-prog*visH*0.7;
    if(y<0||y>visH)continue;
    const edgeFade=Math.min(1,Math.min(prog*4,((1-prog)*4)));
    const alpha=(0.12+0.06*Math.sin(tf*0.025+i*0.9))*edgeFade;
    const sz=1+((h1*1033)>>>0)%2;
    g.globalAlpha=alpha;
    g.fillStyle='#f8d840';
    g.fillRect(x,y,sz,sz);
    g.globalAlpha=1;
  }

  // 8 sea-breeze wisps — drift sideways, very faint cyan
  for(let i=0;i<8;i++){
    const h2=((i*1777+7919)>>>0);
    const startY=40+((h2*3761)>>>0)%(visH-80);
    const period2=100+((h2*901)>>>0)%50;
    const phase2=(tf+i*53)%period2;
    const prog2=phase2/period2;
    const x2=(prog2*W+((h2*877)>>>0)%120)%W;
    const edgeFade2=Math.min(1,Math.min(prog2*5,(1-prog2)*5));
    const alpha2=(0.09+0.04*Math.sin(tf*0.02+i*1.1))*edgeFade2;
    g.globalAlpha=alpha2;
    g.fillStyle='#b8d8f0';
    g.fillRect(x2,startY+Math.sin(tf*0.015+i*0.8)*8,2,1);
    g.globalAlpha=1;
  }
}

// v183: Dungeon ambient particles — screen-space, deterministic, per-floor visual identity
function drawDungeonAmbientParticles(){
  const depth=currentFloor;
  const visH=H-HUD_HEIGHT;
  // [count, color, vx/frame, vy/frame, sway amplitude, particle width, particle height, base alpha]
  const CFG=[
    null,
    // B1 SUNKEN GALLERIES: seawater dripping from hull seams — thin vertical streaks, fall fast
    {n:16,col:'#6090b8',vx:0.05,vy:1.1,sway:3,sw:1,sh:4,a:0.20},
    // B2 DROWNED ARCHIVES: ancient paper motes — drift sideways, slow tumble
    {n:20,col:'#c8b888',vx:0.35,vy:0.08,sway:5,sw:2,sh:1,a:0.18},
    // B3 ECHO CHAMBERS: crystal resonance sparks — rise upward, pulse size
    {n:18,col:'#c080ff',vx:-0.08,vy:-0.85,sway:4,sw:2,sh:2,a:0.28},
    // B4 DEEP VAULT: ember ash — diagonal fall, flicker
    {n:22,col:'#d05020',vx:0.22,vy:0.65,sway:6,sw:2,sh:2,a:0.24},
    // B5 ARK CORE: void wisps — nearly static, appear/disappear, larger
    {n:14,col:'#8030c0',vx:0.04,vy:-0.15,sway:9,sw:3,sh:3,a:0.22},
  ];
  const c=CFG[depth];if(!c)return;

  for(let i=0;i<c.n;i++){
    // Deterministic seed per particle (large primes for good distribution)
    const h0=((i*2239+3571)>>>0)%10007;
    const h1=((i*1889+7127)>>>0)%10007;
    const h2=((i*1277+5381)>>>0)%10007;
    // Base position — spread across full screen
    const baseX=(h0/10007)*W;
    const baseY=(h1/10007)*visH;
    const phase=h2/10007*Math.PI*2;

    // Animated position — wrap modulo screen size
    const px=((baseX+c.vx*fr)%W+W)%W;
    const py=((baseY+c.vy*fr+c.sway*Math.sin(fr*0.028+phase))%visH+visH)%visH;

    // Void wisps (B5): pulse in/out instead of steady glow
    let alpha=c.a;
    if(depth===5){alpha=c.a*(0.4+0.6*Math.abs(Math.sin(fr*0.05+phase*2)));}
    else if(depth===3){alpha=c.a*(0.5+0.5*Math.sin(fr*0.09+phase));}// crystal pulse
    else if(depth===4&&fr%6===0){alpha=c.a*(0.3+Math.random()*0.7);}// ember flicker

    g.globalAlpha=alpha;
    // B3 crystal sparks: draw cross shape for sparkle feel
    if(depth===3){
      bx(px|0,py|0,c.sw,c.sh,c.col);
      if(alpha>0.2){bx((px-1)|0,(py+c.sh/2)|0,c.sw+2,1,'rgba(220,180,255,.4)');}
    }else if(depth===1){
      // Water drip: thin streak
      bx(px|0,py|0,1,c.sh,c.col);
      g.globalAlpha=alpha*0.4;
      bx(px|0,(py+c.sh)|0,1,1,c.col);// drip tail fade
    }else{
      bx(px|0,py|0,c.sw,c.sh,c.col);
    }
    g.globalAlpha=1;
  }
}

// v186: Per-floor dungeon vignette — colored edge glow using canvas gradient strips
// Each floor has a distinctive border color that immediately signals depth
const DUNGEON_VIGNETTE_COL=[
  null,
  'rgba(80,140,200,',  // B1: blue-grey seawater glow
  'rgba(60,140,80,',   // B2: moss-green mold light
  'rgba(140,60,200,',  // B3: crystal purple resonance
  'rgba(200,80,20,',   // B4: ember orange heat
  'rgba(100,20,160,',  // B5: void purple darkness
];
function drawDungeonVignette(){
  const depth=currentFloor;
  const col=DUNGEON_VIGNETTE_COL[depth];if(!col)return;
  const visH=H-HUD_HEIGHT;
  const pulse=0.30+0.08*Math.sin(fr*(0.02+depth*0.008));
  const edgeW=44;
  // No save/restore needed — only fillStyle changes (no transforms or clip)
  const gT=g.createLinearGradient(0,0,0,edgeW);
  gT.addColorStop(0,col+pulse+')');gT.addColorStop(1,col+'0)');
  g.fillStyle=gT;g.fillRect(0,0,W,edgeW);
  const gB=g.createLinearGradient(0,visH,0,visH-edgeW);
  gB.addColorStop(0,col+pulse+')');gB.addColorStop(1,col+'0)');
  g.fillStyle=gB;g.fillRect(0,visH-edgeW,W,edgeW);
  const gL=g.createLinearGradient(0,0,edgeW,0);
  gL.addColorStop(0,col+pulse+')');gL.addColorStop(1,col+'0)');
  g.fillStyle=gL;g.fillRect(0,0,edgeW,visH);
  const gR=g.createLinearGradient(W,0,W-edgeW,0);
  gR.addColorStop(0,col+pulse+')');gR.addColorStop(1,col+'0)');
  g.fillStyle=gR;g.fillRect(W-edgeW,0,edgeW,visH);
}

// v212: Pre-parsed fog RGB per map index for floor-colored fog edges
const _FOG_RGB=FOG_COLORS.map(h=>{const r=parseInt(h.slice(1,3),16),g_=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return[r,g_,b];});
// v219: Pre-computed fog gradient color strings per map — avoids template literal creation every frame
const _FOG_GRAD_COLS=_FOG_RGB.map(([r,g_,b])=>{
  const steps=8;
  return Array.from({length:steps},(_,s)=>`rgba(${r},${g_},${b},${(0.06+s*0.1).toFixed(2)})`);
});
function drawFogOverlay(startTX,startTY,endTX,endTY){
  const fogC=FOG_COLORS[currentMap];
  const gradCols=_FOG_GRAD_COLS[currentMap]||_FOG_GRAD_COLS[0];
  for(let y=startTY;y<=endTY;y++){
    for(let x=startTX;x<=endTX;x++){
      const px=x*TW-camX,py=y*TH-camY;
      if(px<-TW||px>W||py<-TH||py>H)continue;
      if(fogRevealed[currentMap][y]&&fogRevealed[currentMap][y][x]){
        // Revealed tile: check edges for fog gradient
        const dirs=[[0,-1],[0,1],[-1,0],[1,0]]; // up,down,left,right
        for(const [dx,dy] of dirs){
          const nx=x+dx,ny=y+dy;
          const neighborHidden=(nx<0||nx>=MW||ny<0||ny>=MH||!fogRevealed[currentMap][ny]?.[nx]);
          if(neighborHidden){
            // v212: 8-step gradient with floor-specific fog color (v219: pre-computed strings)
            for(let s=0;s<8;s++){
              const col=gradCols[s];
              if(dy===-1){bx(px,py+s,TW,1,col);}
              else if(dy===1){bx(px,py+TH-1-s,TW,1,col);}
              else if(dx===-1){bx(px+s,py,1,TH,col);}
              else if(dx===1){bx(px+TW-1-s,py,1,TH,col);}
            }
          }
        }
      }else{
        // Hidden tile: solid fog with subtle noise texture
        g.fillStyle=fogC;
        g.fillRect(px,py,TW,TH);
        // Add sparse noise texture for atmosphere
        const n1=fogNoise(x,y,0),n2=fogNoise(x,y,1),n3=fogNoise(x,y,2);
        if(n1>0.7){
          const nPx=px+Math.floor(n2*12)+1,nPy=py+Math.floor(n3*10)+1;
          g.fillStyle='rgba(20,20,40,0.6)';
          g.fillRect(nPx,nPy,1,1);
        }
        if(n2>0.8){
          const nPx2=px+Math.floor(n1*10)+2,nPy2=py+Math.floor(n3*8)+2;
          g.fillStyle='rgba(30,30,50,0.4)';
          g.fillRect(nPx2,nPy2,1,1);
        }
        if(n3>0.85){
          const nPx3=px+Math.floor(n2*8)+3,nPy3=py+Math.floor(n1*7)+3;
          g.fillStyle='rgba(15,15,30,0.5)';
          g.fillRect(nPx3,nPy3,2,1);
        }
      }
    }
  }
}

// v204: World-space fog ambient motes — cached to fogAmbCanvas, rebuilt every 3 frames
function _drawFogAmbientMotes(ambCol,ambCount,ambVY,ambSz){
  const seed=fr*0.02;
  for(let i=0;i<ambCount;i++){
    const px=((i*1237+fr*3)%1000/1000)*MW*TW;
    const py=((i*4321+fr*2)%1000/1000)*MH*TH;
    const dpy=py+Math.sin(seed+i*1.3)*20+fr*ambVY*(1+i%3)*0.3;
    const dpyWrapped=((dpy%MH*TH)+MH*TH)%(MH*TH);
    const sx=px-camX,sy=dpyWrapped-camY;
    if(sx<-4||sx>W+4||sy<-4||sy>H+4)continue;
    const tileX=Math.floor(px/TW),tileY=Math.floor(dpyWrapped/TH);
    if(tileX<0||tileX>=MW||tileY<0||tileY>=MH)continue;
    if(!fogRevealed[currentMap][tileY]?.[tileX])continue;
    g.globalAlpha=(0.5+0.5*Math.sin(seed*1.5+i*2.1))*0.7;
    g.fillStyle=ambCol;
    g.fillRect(sx,sy,ambSz,ambSz);
  }
  g.globalAlpha=1;
}

function drawFogParticles(){
  const atmos=FLOOR_ATMOS[inDungeon?currentFloor:0]||FLOOR_ATMOS[0];
  const [fogCol,ambCol,ambCount,ambVY,ambSz]=atmos;
  // Update particle positions and draw fog overlay dots — batch globalAlpha: set once per particle, reset once at end
  fogParticles.forEach((p,i)=>{
    p.x+=p.vx;
    p.y+=Math.sin(fr*0.015+p.phase)*0.1+p.vy;
    if(p.x>MW*TW)p.x=0;
    if(p.y<0)p.y=MH*TH;
    if(p.y>MH*TH)p.y=0;
    const sx=p.x-camX,sy=p.y-camY;
    if(sx>0&&sx<W&&sy>0&&sy<H-HUD_HEIGHT){
      const tileX=Math.floor(p.x/TW),tileY=Math.floor(p.y/TH);
      if(tileX>=0&&tileX<MW&&tileY>=0&&tileY<MH&&!fogRevealed[currentMap][tileY]?.[tileX]){
        g.globalAlpha=Math.max(0,0.15+Math.sin(fr*0.02+i*0.7)*0.1);
        g.fillStyle=fogCol;
        g.fillRect(sx,sy,1,1);
      }
    }
  });
  g.globalAlpha=1;
  // Floor-specific ambient motes — cached to fogAmbCanvas, rebuilt every 3 frames
  if(!inDungeon||ambCount===0)return;
  if(fr-_fogAmbFrame>=3||_fogAmbFloor!==currentFloor){
    fogAmbCtx.clearRect(0,0,W,H);
    const _mc=g;g=fogAmbCtx;
    _drawFogAmbientMotes(ambCol,ambCount,ambVY,ambSz);
    g=_mc;
    _fogAmbFrame=fr;_fogAmbFloor=currentFloor;
  }
  g.drawImage(fogAmbCanvas,0,0,W,H);
}

function drawRivalAlertAnim(p,px,py){
  if(!p._alertTimer)p._alertTimer=0;
  if(p._alertTimer>0){
    p._alertTimer-=dt;
    const bounceY=Math.sin(p._alertTimer*0.3)*5;
    const alpha=Math.min(1,p._alertTimer/15);
    g.globalAlpha=alpha;
    bx(px+8,py-36+bounceY,16,20,'#f0c830');
    bx(px+10,py-34+bounceY,12,15,'#f8e060');
    bx(px+13,py-16+bounceY,4,4,'#f0c830');
    g.globalAlpha=1;
  }
}

function isVisibleThroughFog(tileX,tileY,playerDist){
  // Must be on a revealed tile AND within playerDist tiles of player
  if(!fogRevealed[currentMap][tileY]?.[tileX])return false;
  const dx=Math.abs(tileX-pl[0].x),dy=Math.abs(tileY-pl[0].y);
  return(dx+dy)<=playerDist;
}

// Y-sorted craftpix tree rendering: only draws tiles whose row is in [tyMin, tyMax).
// Called twice from dMap() — once before sprites (bg pass) and once after (fg pass).
function drawCpxTreesInRange(tyMin,tyMax){
  if(cpxForestLoaded===0)return;
  const isJungle=(currentMap===1);
  const fogMap=fogRevealed[currentMap];
  const mt=getMap();
  const txMin=Math.max(0,Math.floor((camX-72)/TW));
  const txMax=Math.min(MW-1,Math.ceil((camX+W)/TW));
  const tyMinC=Math.max(tyMin,Math.max(0,Math.floor((camY-72)/TH)));
  const tyMaxC=Math.min(tyMax-1,Math.min(MH-1,Math.ceil((camY+H)/TH)));
  if(tyMinC>tyMaxC)return;
  g.imageSmoothingEnabled=true;
  for(let ty=tyMinC;ty<=tyMaxC;ty++){
    for(let tx=txMin;tx<=txMax;tx++){
      if(!fogMap[ty]?.[tx])continue;
      const tt=mt[ty]?.[tx];
      const th=tileHash(tx,ty);
      const tpx=tx*TW-camX,tpy=ty*TH-camY;
      // Deterministic per-tile wind phase for natural-looking sway
      const windPhase=(th*0.137)%(Math.PI*2);
      const windShear=Math.sin(fr*0.022+windPhase)*0.035; // subtle ±3.5% shear
      if(isJungle){
        if(tt!==3&&tt!==7&&tt!==12)continue;
        if(th%4!==1)continue;
        const jIdx=((th>>>2)+3)%CPX_FOREST.length;
        const jImg=CPX_FOREST[jIdx];
        if(!jImg.complete||!jImg.naturalWidth)continue;
        const isMega=jImg.naturalWidth===256;
        const jdW=isMega?80:64;
        const jpx=tpx+TW/2,jpy=tpy+TH; // pivot: base center
        g.save();g.translate(jpx,jpy);g.transform(1,0,windShear,1,0,0);
        g.globalAlpha=0.9;
        g.drawImage(jImg,-jdW/2,-jdW,jdW,jdW);
        g.globalAlpha=1;
        g.restore();
      }else{
        if((tt===3||tt===7||tt===12)&&th%3===0){
          const tIdx=(th>>>2)%CPX_FOREST.length;
          const tImg=CPX_FOREST[tIdx];
          if(!tImg.complete||!tImg.naturalWidth)continue;
          const isMega=tImg.naturalWidth===256;
          const tdW=isMega?72:56;
          const tpivX=tpx+TW/2,tpivY=tpy+TH; // pivot: base center
          g.save();g.translate(tpivX,tpivY);g.transform(1,0,windShear,1,0,0);
          g.globalAlpha=0.88;
          g.drawImage(tImg,-tdW/2,-tdW,tdW,tdW);
          g.globalAlpha=1;
          g.restore();
        }else if(tt===11&&th%9===0){
          const mIdx=(th>>>3)%CPX_MUSHROOMS.length;
          const mImg=CPX_MUSHROOMS[mIdx];
          if(!mImg.complete||!mImg.naturalWidth)continue;
          const mdW=16;
          g.globalAlpha=0.82;
          g.drawImage(mImg,tpx+(TW-mdW)/2+((th&3)-1)*5,tpy+TH-mdW,mdW,mdW);
          g.globalAlpha=1;
        }
      }
    }
  }
  g.imageSmoothingEnabled=false;
}

function dMap(){
  updateCamera();

  const startTX=Math.max(0,Math.floor(camX/TW));
  const startTY=Math.max(0,Math.floor(camY/TH));
  const endTX=Math.min(MW-1,Math.ceil((camX+W)/TW));
  const endTY=Math.min(MH-1,Math.ceil((camY+H)/TH));

  // ── MIDJOURNEY BACKGROUND LAYER ── drawn first, tiles + fog overlay on top
  drawMapBg(currentMap);

  // ── TILE LAYER CACHE ── only redraw tiles when camera moves or map changes
  {
    const camMoved=Math.abs(camX-tileCacheLastCamX)>0.5||Math.abs(camY-tileCacheLastCamY)>0.5;
    const mapChanged=currentMap!==tileCacheLastMap;
    if(tileCacheDirty||camMoved||mapChanged){
      tileCtx.clearRect(0,0,W,H);
      const mainCtx=g;
      g=tileCtx;
      g.imageSmoothingEnabled=false;
      for(let y=startTY;y<=endTY;y++){
        for(let x=startTX;x<=endTX;x++){
          if(!fogRevealed[currentMap][y]?.[x]){
            let anyNeighborRevealed=false;
            for(let dy=-1;dy<=1&&!anyNeighborRevealed;dy++){
              for(let dx=-1;dx<=1&&!anyNeighborRevealed;dx++){
                const ny=y+dy,nx=x+dx;
                if(ny>=0&&ny<MH&&nx>=0&&nx<MW&&fogRevealed[currentMap][ny]?.[nx])anyNeighborRevealed=true;
              }
            }
            if(!anyNeighborRevealed)continue;
          }
          drawTile(x,y);
        }
      }
      g=mainCtx;
      tileCacheLastCamX=camX;tileCacheLastCamY=camY;tileCacheLastMap=currentMap;
      tileCacheDirty=false;
    }
    g.imageSmoothingEnabled=false;
    // When Midjourney bg is loaded: skip tile layer (bg IS the ground)
    // Only draw tiles when there's no bg (fallback procedural rendering)
    if(!getBgSheet(currentMap)){
      g.drawImage(tileCanvas,0,0,W,H);
    }
    // Animated dungeon tile overlays — drawn on main canvas every frame (bypass static tile cache)
    if(inDungeon){
      drawDungeonStairGlows(startTX,startTY,endTX,endTY);
      drawDungeonAnimatedOverlays(startTX,startTY,endTX,endTY);
    }
    // v215: Animated town tile overlays (water sparkles/waves — every other frame for perf)
    if(!inDungeon&&fr%2===0){drawTownAnimatedOverlays(startTX,startTY,endTX,endTY);}
  }

  // Edge blending post-pass (cached to offscreen canvas)
  // Skip entirely if frame rate is very low (dt > 2 means < 30fps)
  if(dt<=2){
    const camMoved=Math.abs(camX-edgeCacheLastCamX)>0.5||Math.abs(camY-edgeCacheLastCamY)>0.5;
    if(edgeCacheDirty||camMoved){
      edgeCtx.clearRect(0,0,W,H);
      const mainCtx=g;
      g=edgeCtx;
      drawEdgeBlending(startTX,startTY,endTX,endTY);
      g=mainCtx;
      edgeCacheLastCamX=camX;edgeCacheLastCamY=camY;
      edgeCacheDirty=false;
    }
    g.drawImage(edgeCanvas,0,0,W,H);
  }

  // ── FOG OF WAR OVERLAY ── (cached to offscreen canvas)
  {
    const camMoved=Math.abs(camX-fogCacheLastCamX)>0.5||Math.abs(camY-fogCacheLastCamY)>0.5;
    if(fogCacheDirty||camMoved){
      fogCtx.clearRect(0,0,W,H);
      const mainCtx=g;
      g=fogCtx;
      drawFogOverlay(startTX,startTY,endTX,endTY);
      g=mainCtx;
      fogCacheLastCamX=camX;fogCacheLastCamY=camY;
      fogCacheDirty=false;
    }
    g.drawImage(fogCanvas,0,0,W,H);
  }
  // ── CIRCULAR VISIBILITY (dungeon only) — cached to offscreen canvas ──
  if(inDungeon){
    const _vpx=pl[0].visualX-camX+TW/2, _vpy=pl[0].visualY-camY+TH/2;
    if(Math.abs(_vpx-_dvLastPX)>1||Math.abs(_vpy-_dvLastPY)>1||currentFloor!==_dvLastFloor){
      dungeonVigCtx.clearRect(0,0,W,H);
      const innerR=120,outerR=320;
      const grad=dungeonVigCtx.createRadialGradient(_vpx,_vpy,innerR,_vpx,_vpy,outerR);
      const floorTint=['rgba(0,0,0','rgba(15,5,35','rgba(25,5,40','rgba(35,8,28','rgba(40,5,8','rgba(50,0,0'][currentFloor]||'rgba(0,0,0';
      grad.addColorStop(0,'rgba(0,0,0,0)');
      grad.addColorStop(0.15,'rgba(0,0,0,0)');
      grad.addColorStop(0.3,'rgba(0,0,0,0.05)');

// Draw battle sprite (front-facing for opponent, back-facing for player)
function drawBattleSprite(p,cx,cy,scale,facingAway){
  const s=scale;
  // Idle breathing bob — each character breathes out of phase
  const breathPhase=p===pl[0]?0:p===pl[1]?1.1:2.3;
  const breathAmp=scale*0.5;
  cy=cy+Math.round(Math.sin(fr*0.055+breathPhase)*breathAmp);
  const w=14*s,h=20*s;
  const ox=cx-w/2,oy=cy-h/2;
  // Shadow
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(cx,oy+h+2*s,w*.5,h*.12,0,0,Math.PI*2);g.fill();

  // === KENNEY BATTLE SPRITE ===
  if(pirateSheetLoaded){
    const kChar=p===pl[0]?K.captain:(p===pl[1]?K.pirate2:K.pirate3);
    // Glow aura
    const glowC=p===pl[0]?'rgba(40,88,200,.22)':p===pl[1]?'rgba(200,32,40,.22)':'rgba(40,180,160,.22)';
    g.fillStyle=glowC;g.beginPath();g.ellipse(cx,cy,w*.45,h*.55,0,0,Math.PI*2);g.fill();
    // Scale the 16px sprite to battle size (scale*2 for tile size = 32px baseline)
    const tileScale=s/1.0; // s=3 → 48px sprite
    const sprW=16*tileScale*2, sprH=16*tileScale*2;
    const sx=cx-sprW/2, sy=cy-sprH/2;
    if(facingAway){
      // Player faces away: flip vertically (mirror top-to-bottom look, not perfect but readable)
      g.save();g.translate(sx+sprW,sy);g.scale(-1,1);
      drawKenneyTile(kChar[0],kChar[1],0,0,tileScale*2);
      // Back overlay to distinguish from front
      g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,0,sprW,sprH*0.4);
      g.restore();
    }else{
      drawKenneyTile(kChar[0],kChar[1],sx,sy,tileScale*2);
    }
    return;
  }

  // === FALLBACK FILLRECT BATTLE SPRITE ===
  let shirtC,shirtH,hairC,hairH;
  if(p===pl[0]){shirtC='#4080d0';shirtH='#5090e0';hairC='#282830';hairH='#383840';}
  else if(p===pl[1]){shirtC='#d060a0';shirtH='#e070b0';hairC='#804020';hairH='#905030';}
  else{shirtC='#d0a030';shirtH='#e0b040';hairC='#585040';hairH='#686058';}
  bx(ox+2*s,oy+17*s,4*s,3*s,'#383030');bx(ox+8*s,oy+17*s,4*s,3*s,'#383030');
  bx(ox+3*s,oy+14*s,8*s,4*s,'#4050a0');
  bx(ox+2*s,oy+8*s,10*s,7*s,shirtC);bx(ox+3*s,oy+9*s,8*s,5*s,shirtH);
  bx(ox-1*s,oy+9*s,4*s,6*s,shirtC);bx(ox+11*s,oy+9*s,4*s,6*s,shirtC);
  bx(ox-1*s,oy+14*s,3*s,2*s,'#e8d0b0');bx(ox+12*s,oy+14*s,3*s,2*s,'#e8d0b0');
  bx(ox+3*s,oy+1*s,8*s,8*s,'#f0dcc0');bx(ox+4*s,oy+2*s,6*s,6*s,'#e8d0b0');
  if(facingAway){
    bx(ox+3*s,oy,8*s,6*s,hairC);bx(ox+4*s,oy+s,6*s,5*s,hairH);
    bx(ox+2*s,oy+s,2*s,3*s,hairC);bx(ox+10*s,oy+s,2*s,3*s,hairC);
    bx(ox+4*s,oy+10*s,6*s,3*s,'#305080');bx(ox+5*s,oy+11*s,4*s,1*s,'#4070a0');
  }else{
    bx(ox+4*s,oy+4*s,2*s,2*s,'#181820');bx(ox+8*s,oy+4*s,2*s,2*s,'#181820');
    bx(ox+4*s,oy+4*s,s,s,'#fff');bx(ox+8*s,oy+4*s,s,s,'#fff');
    bx(ox+6*s,oy+7*s,2*s,s,'#c0a090');
    if(p===pl[1]){
      bx(ox+3*s,oy,8*s,3*s,hairC);bx(ox+2*s,oy+s,2*s,7*s,hairC);bx(ox+10*s,oy+s,2*s,7*s,hairC);
      bx(ox+4*s,oy-s,6*s,2*s,hairC);
    }else if(p===pl[2]){
      bx(ox+2*s,oy,10*s,3*s,'#d0a030');bx(ox+s,oy+2*s,12*s,s,'#b08820');
    }else{
      bx(ox+3*s,oy,8*s,3*s,hairC);bx(ox+2*s,oy,2*s,2*s,hairC);bx(ox+10*s,oy,2*s,2*s,hairC);
    }
  }
}

    const rivalNameCol=vsRivalIdx===1?'#f080c0':'#f0c830';
    const rivalPersonality=vsRivalIdx===1?'THE HUNTER':'THE COLLECTOR';
    const rivalNameX=W-220;
    txShadow(vsSplashRival.n,rivalNameX,H/2-60,14,rivalNameCol,'rgba(0,0,0,.6)');
    txShadow(rivalPersonality,rivalNameX,H/2-42,8,'rgba(255,255,255,.5)','rgba(0,0,0,.4)');

    // v106: rival power + advantage label
    const rivalPwr=vsSplashRival.cd.reduce((s,id)=>s+(id>0?CD[id-1]?.r||0:0),0);
    txShadow('PWR:'+rivalPwr,rivalNameX,H/2-12,7,rivalNameCol,'rgba(0,0,0,.35)');
    g.globalAlpha=1;
  }

  // v106: power assessment label — appears between power scores
  if(t>20){
    const assAlpha=Math.min(1,(t-20)/10);
    g.globalAlpha=assAlpha;
    const yourPwr2=pl[0].cd.reduce((s,id)=>s+(id>0?CD[id-1]?.r||0:0),0);
    const rivalPwr2=vsSplashRival.cd.reduce((s,id)=>s+(id>0?CD[id-1]?.r||0:0),0);

    else if(diff<=-4){assLabel='OUTMATCHED';assCol='#d04040';}
    else{assLabel='BALANCED';assCol='#d0c040';}
    const assW=assLabel.length*9+16;
    bx(W/2-assW/2,H/2-80,assW,20,'rgba(0,0,0,.5)');
    txShadow(assLabel,W/2-assW/2+8,H/2-64,10,assCol,'rgba(0,0,0,.5)');
    g.globalAlpha=1;
  }

  // VS text with pop-in scale + glow pulse
  if(t===16){hitPause(3);}
  if(t>15){
    const vsA=Math.min(1,(t-15)/8);

    txShadow('VS',W/2-28,H/2+14,36,'#f0c830','#000');

    g.globalAlpha=1;
  }

  if(t>=60){
    battlePhase='select';bpFrame=fr;bpRdIncremented=false;bpActionsGenerated=false;bpScoutedCards=[null,null];
    generateRivalTells(); // pre-generate rival actions + tells for this round
    if(!tutorialFlags.firstBattle){

      tutorialMsg='Battle vs '+rName+'! Watch their body language — tells hint at their move!';
      tutorialMsgTimer=260;
    }
  }
}

function isActionAvailable(i){
  if(i===1&&sp.s<=0)return false;
  if(i===2&&sp.b<=0)return false;
  if(i===3&&sp.c<=0)return false;
  if(i===4&&cardCount(pl[0])<=0)return false;
  return true;
}

// Phase banner colors and text
const PHASE_COLORS={select:'#3060b0',confirming:'#d8b028',resolving:'#c04040',result:'#308030'};
const PHASE_LABELS={select:'COMMIT PHASE',confirming:'REVEALING...',resolving:'RESOLVING!',result:'COMPLETE'};

function drawPhaseBanner(phase){
  const col=PHASE_COLORS[phase]||'#383830';
  const label=PHASE_LABELS[phase]||'';
  bx(0,0,W,28,col);
  bx(0,0,W,1,'rgba(255,255,255,.2)');
  // Round info on left
  txShadow('BATTLE '+rd,6,20,10,'#fff','rgba(0,0,0,.5)');
  // Phase label centered (bigger, bold-like with shadow)
  const labelW=label.length*10;
  txShadow(label,W/2-labelW/2,20,16,'#fff','rgba(0,0,0,.5)');
  // Area on right
  txShadow(mapNames[currentMap],W-160,20,8,'rgba(255,255,255,.8)','rgba(0,0,0,.4)');
  // TX indicator when on-chain mode active
  if(walletConnected){
    const txLabel=onchainLastTxSig?'TX:'+onchainLastTxSig.slice(0,8)+'..':'TX:--';
    txShadow(txLabel,W-160,38,5,'#40d080','rgba(0,0,0,.5)');
  }
  // Commit hash display during commit phase (wallet integration)
  if(walletConnected&&walletLastCommitHash&&(phase==='confirming'||phase==='resolving')){
    txShadow('Hash: '+walletLastCommitHash,W/2-100,38,5,'#80c0ff','rgba(0,0,0,.5)');
  }
  // v101: Battle momentum strip — card gain/loss net balance shown as a tug-of-war bar
  bx(0,26,W,3,'rgba(0,0,0,.55)');
  if(battleRoundHistory.length>0){
    const net=battleRoundHistory.reduce((s,h)=>s+(h.got?1:0)-(h.lost?1:0),0);
    const norm=Math.max(-1,Math.min(1,net/Math.max(1,battleRoundHistory.length)));
    if(norm>0){bx(W/2,26,(W/2)*norm,3,'#40b0e8');}
    else if(norm<0){bx(W/2+(W/2)*norm,26,-(W/2)*norm,3,'#d04040');}
    const ta=0.35+Math.sin(fr*0.12)*0.25;
    g.globalAlpha=ta;bx(W/2-1,26,2,3,'#ffffff');g.globalAlpha=1;
  }else{
    bx(W/2-1,26,2,3,'rgba(255,255,255,.2)');
  }
}

        const arrowLen2=Math.floor(40*arrowProg2);
        bx(flowX+70,flowY+11,arrowLen2,2,'#9945FF');
        if(arrowProg2>=1){
          bx(flowX+114,flowY+4,14,14,'#9945FF');bx(flowX+116,flowY+6,10,10,'#14F195');
          txShadow('verified',flowX+134,flowY+14,5,'#40d080','rgba(0,0,0,.3)');
        }
      }else{
        // Resolve phase
        txShadow('TX FLOW:',flowX,flowY-4,6,'#686068','rgba(0,0,0,.3)');
        // chain icon
        bx(flowX,flowY+4,14,14,'#9945FF');bx(flowX+2,flowY+6,10,10,'#14F195');
        // arrow to result
        bx(flowX+18,flowY+11,40,2,'#f0c830');
        txShadow('\u25B6',flowX+52,flowY+14,6,'#f0c830','rgba(0,0,0,.3)');
        txShadow('result',flowX+62,flowY+14,5,'#f0c830','rgba(0,0,0,.3)');
        // arrows to all players
        bx(flowX+100,flowY+11,30,2,'#48b8e8');
        txShadow('ALL',flowX+134,flowY+14,5,'#48b8e8','rgba(0,0,0,.3)');
      }
    }
  }else{
    if(t<40)txShadow('You chose '+actionNames[bpAction]+'!',16,H-38,14,'#303028','rgba(200,180,140,.3)');
    else if(t<60){const sp_=['|','/','-','\\'][Math.floor(t/4)%4];txShadow('Computing Poseidon hash... '+sp_,16,H-38,12,'#9945FF','rgba(0,0,0,.3)');}
    else if(t<80){
      const sp_=['|','/','-','\\'][Math.floor(t/3)%4];
      txShadow('ZK proof: '+zkProofStatus+' '+sp_,16,H-38,12,zkProofStatus==='verified'?'#40d080':'#14F195','rgba(0,0,0,.3)');
      if(walletLastCommitHash)txShadow(walletLastCommitHash,16,H-18,7,'#80c0ff','rgba(0,0,0,.3)');
    }
    else{txShadow('Resolving'+'.'.repeat((Math.floor(t/12)%3)+1),16,H-38,14,'#686068','rgba(200,180,140,.3)');}
  }
  // Commit phase: on-chain TX + ZK proof (both paths)
  if(t===1&&walletConnected){
    onchainCommitPhase=true;
    onchainCommit(rd,bpAction,encounterExclTarget||0).then(result=>{
      if(result){
        walletLastCommitHash=result.hash;
        logOnchain('Commit: '+result.hash.slice(0,10)+'..'+'  TX:'+result.txSig.slice(0,8)+'..');
        // Generate ZK proof using the same salt that was committed on-chain
        if(onchainPendingSalt){
          zkProofStatus='generating';
          zkGenerateProof(bpAction+1, encounterExclTarget||0, onchainPendingSalt);
        }
      }
      onchainCommitPhase=false;
    }).catch(()=>{onchainCommitPhase=false;});
  }
  if(t===1&&!walletConnected){
    const salt=generateSalt();
    computeCommitHash(bpAction,new Uint8Array(32),salt).then(hash=>{
      walletLastCommitHash=hexFromBytes(hash);
      lg.push('Commit hash: '+walletLastCommitHash.slice(0,10)+'..');
    }).catch(()=>{});
    // ZK proof: proves knowledge of action preimage without wallet
    zkGenerateProof(bpAction+1, encounterExclTarget||0, salt);
  }
  // On-chain reveal phase
  if(t===70&&walletConnected&&onchainPendingSalt){
    onchainRevealPhase=true;
    onchainReveal(rd,bpAction,encounterExclTarget||0,onchainPendingSalt).then(result=>{
      if(result){
        logOnchain('Reveal TX:'+result.txSig.slice(0,8)+'..');
      }
      onchainRevealPhase=false;onchainPendingSalt=null;
    }).catch(()=>{onchainRevealPhase=false;});
  }
  if(t>=120){battlePhase='resolving';bpFrame=fr;bpResolveIdx=0;bpResolveQueue=generateResolveEvents();}
}

// Dungeon floor card drop tables (GDD v1.0)
// Town (map 0): no drops. Dungeon floors 1-5: progressively rarer cards
// Floor 1: Common (1-2 per type), Floor 2: Uncommon, Floor 3: Rare, Floor 4: Epic, Floor 5: Legendary
const DUNGEON_FLOOR_CARDS=[
  [],                                           // map 0 = Town: no drops
  [4,5,13,14,25,26,39,40,49,50],              // Floor 1: Common/Uncommon
  [6,7,15,16,27,28,41,42,51,52],              // Floor 2: Uncommon
  [3,8,9,10,17,18,19,29,30,31,43,44,45,53,54,55], // Floor 3: Rare (16 cards — IGNIS added)
  [11,20,21,22,32,33,34,46,47,56,57,58],     // Floor 4: Epic
  [1,2,12,23,24,35,36,37,38,48,59,60],       // Floor 5: Legendary (including originals)
];
// AREA_CARDS: 1-indexed card pools per map (same as DUNGEON_FLOOR_CARDS, used by encounters/rocks)
const AREA_CARDS=[
  [4,5,13,14,25,26,39,40,49,50],    // map 0 Town (fallback only — encounters blocked in town)
  [4,5,13,14,25,26,39,40,49,50],    // map 1 Floor 1: Common/Uncommon
  [6,7,15,16,27,28,41,42,51,52],    // map 2 Floor 2: Uncommon
  [3,8,9,10,17,18,19,29,30,31,43,44,45,53,54,55], // map 3 Floor 3: Rare
  [11,20,21,22,32,33,34,46,47,56,57,58], // map 4 Floor 4: Epic
  [1,2,12,23,24,35,36,37,38,48,59,60],  // map 5 Floor 5: Legendary
];
function pickAreaCardForMap(mapIdx){
  const ac=DUNGEON_FLOOR_CARDS[mapIdx];
  if(!ac||ac.length===0)return 1+(Math.floor(Math.random()*60)); // fallback: any card
  return ac[Math.floor(Math.random()*ac.length)];
}
function cardCount(p){ return cdCount(p.cd); }
function syncCardCount(pIdx){
  const p=pl[pIdx];
  if(pIdx===0&&p.vault){p.cc=p.vault.size;}
  else{p.cc=cardCount(p);}
}
function addCardToPlayer(pIdx,cardId){
  const p=pl[pIdx];
  const handLimit=(pIdx===0)?HAND_SIZE:5;
  const hadVaultBefore=pIdx===0&&p.vault?p.vault.has(cardId):null;
  // Add to vault (player only) — tracks all unique cards ever collected
  if(pIdx===0&&p.vault&&!p.vault.has(cardId)){
    cardAcqWasNew=true; // v96: flag for NEW badge in acquisition animation
    p.vault.add(cardId);
    sfxUniqueCardSting();triggerProgressPulse();
    stats.cardsCollected++;
    // v79: track new_cards mission
    if(runMission&&runMission.type==='new_cards'&&!runMission.completed){
      runMission.progress++;if(runMission.progress>=runMission.goal){runMission.completed=true;sfxStreakUp();}
    }
    // Vault milestone celebrations
    const ms=p.vault.size;
    const milestones={10:'10 CARDS!',20:'20 CARDS!',30:'HALFWAY THERE!',40:'40 CARDS!',50:'50 CARDS! SO CLOSE!',55:'55 CARDS!',59:'ONE MORE!'};
    if(milestones[ms]){
      setTimeout(()=>{
        tutorialMsg='\u2605 '+milestones[ms]+' '+ms+'/60 collected!';tutorialMsgTimer=260;
        if(ms>=50)screenShake(2,4);
      },400);
    }
  }
  // Add to hand if room
  for(let i=0;i<handLimit;i++){
    if(p.cd[i]===0){
      p.cd[i]=cardId;syncCardCount(pIdx);
      if(pIdx===0){cardTimers[i]=inDungeon?Date.now():0;decayWarn[i]=0;if(hadVaultBefore===null)stats.cardsCollected++;}
      return true;
    }
  }
  syncCardCount(pIdx);
  return false; // hand full (but vault already updated)
}
function removeCardFromPlayer(pIdx,slotOrRandom){
  const p=pl[pIdx];
  const handLimit=(pIdx===0)?HAND_SIZE:5;
  if(slotOrRandom===-1){// random
    const filled=[];for(let i=0;i<handLimit;i++){if(p.cd[i]>0)filled.push(i);}
    if(filled.length===0)return 0;
    const slot=filled[Math.floor(Math.random()*filled.length)];
    const card=p.cd[slot];p.cd[slot]=0;if(pIdx===0){cardTimers[slot]=0;decayWarn[slot]=0;stats.cardsLost++;}syncCardCount(pIdx);return card;
  }
  const card=p.cd[slotOrRandom];if(card>0){p.cd[slotOrRandom]=0;if(pIdx===0){cardTimers[slotOrRandom]=0;decayWarn[slotOrRandom]=0;stats.cardsLost++;}syncCardCount(pIdx);}return card;
}
function hasUniqueCards(pIdx){
  // For player: return vault (all ever collected); for rivals: derive from hand
  if(pIdx===0&&pl[0].vault)return pl[0].vault;
  const s=new Set();pl[pIdx].cd.forEach(c=>{if(c>0)s.add(c);});return s;
}
function playerHasAllSixty(){return pl[0].vault&&pl[0].vault.size>=60;}
let _winTransitionPending=false; // guard against double-win transition
function checkWinAndTransition(delayMs){
  if(!playerHasAllSixty()||_winTransitionPending)return;
  _winTransitionPending=true;
  // Record best clear (elapsed from season start)
  const clearTime=Math.floor(getPlayElapsed()/1000);
  if(stats.bestClearRounds===0||rd<stats.bestClearRounds){stats.bestClearRounds=rd;}
  if(stats.bestClearTime===0||clearTime<stats.bestClearTime){stats.bestClearTime=clearTime;}
  const d=(delayMs!==undefined)?delayMs:500;
  if(d>0){setTimeout(()=>{gameOverTimesUp=false;stats.gamesPlayed++;saveStats();fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});},d);}
  else{gameOverTimesUp=false;stats.gamesPlayed++;saveStats();fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});}
}

// Rival AI: choose an action index (0=Draw,1=Steal,2=Barrier,3=Scout)
function rivalChooseAction(rIdx){
  const r=pl[rIdx];
  const aiIdx=rIdx-1;
  const ai=rivalAI[aiIdx];
  const rCardCount=cardCount(r);
  if(rCardCount<2)return 0;// Draw if low
  const roll=Math.random();
  const rUnique=hasUniqueCards(rIdx);

  if(ai.personality==='hunter'){
    // Aggressive: mostly Steal + Scout
    if(rUnique.size>=4){
      if(roll<0.4)return 2;// barrier to protect lead
      if(roll<0.7)return 1;// steal
      return 3;// scout
    }
    if(cardCount(pl[0])>=2){
      if(roll<0.5)return 1;// steal from player
      if(roll<0.75)return 3;// scout player
      return 0;// draw
    }
    if(roll<0.4)return 1;if(roll<0.7)return 0;return 3;
  }else{
    // Collector: mostly Draw + Barrier, but will steal when behind
    if(rUnique.size>=4){
      if(roll<0.5)return 2;// barrier to protect lead
      if(roll<0.8)return 0;// draw to complete set
      return 3;// scout to plan
    }
    // Steal if player has cards collector needs and collector has 3+ cards
    const playerCards=hasUniqueCards(0);
    const needsFromPlayer=rCardCount>=3&&playerCards.size>rUnique.size;
    if(needsFromPlayer&&roll<0.20)return 1;// opportunistic steal (20%)
    if(roll<0.45)return 0;// draw (45%)
    if(roll<0.75)return 2;// barrier (30%)
    if(roll<0.90)return 3;// scout (15%)
    return 0;// draw fallback
  }
}

let bpPlayerBarrier=false; // track if player used barrier this round
let bpRivalActions=[0,0]; // track rival actions this round (pre-generated at select start)
let bpRivalTells=['','']; // body-language tells shown during select phase
let bpTellWasAccurate=[false,false]; // whether each rival's tell matched actual action
let bpRdIncremented=false; // guard: prevent double-increment of rd when pending discard
let bpActionsGenerated=false; // guard: only generate once per round
let bpScoutedCards=[null,null]; // [{round,cards:[{n,r,t}]}, null] — persists until battle ends
let battleRoundHistory=[]; // v90: [{rd,pa,r1a,r2a,outcome}] per round (pa=playerAction 0-4)

// Rival tells: atmospheric body-language hints (65% accurate, 35% misleading)
const RIVAL_BATTLE_TELLS=[
  // VEGA (index 0) — physical, predatory
  {
    0:['VEGA scans the dungeon floor...','VEGA reaches into the ether.','VEGA draws from the dark.'],
    1:['VEGA\'s eyes lock onto your hand.','VEGA steps forward hungrily.','VEGA narrows their eyes.'],
    2:['VEGA plants both feet firmly.','VEGA braces, arms crossed.','VEGA shields their cards.'],
    3:['VEGA tilts their head, watching.','VEGA studies the battlefield.','VEGA assesses the odds.'],
  },
  // MIRA (index 1) — calculated, collector
  {
    0:['MIRA reaches toward the pile...','MIRA is adding to her set.','MIRA scans the floor carefully.'],
    1:['MIRA steps forward, purposeful.','MIRA watches your cards closely.','MIRA calculates the exchange.'],
    2:['MIRA folds her arms.','MIRA builds a quiet wall.','MIRA shields her collection.'],
    3:['MIRA glances between both hands.','MIRA notes something quietly.','MIRA evaluates everything.'],
  },
];

function generateRivalTells(){
  bpRivalActions[0]=rivalChooseAction(1);
  bpRivalActions[1]=rivalChooseAction(2);
  bpActionsGenerated=true;
  for(let ri=0;ri<2;ri++){
    const actualAct=bpRivalActions[ri];
    const tells=RIVAL_BATTLE_TELLS[ri];
    let actForTell=actualAct;
    const isMisdirect=Math.random()<0.35;
    // 35% misdirection: pick a different action's tells
    if(isMisdirect){
      const others=[0,1,2,3].filter(a=>a!==actualAct);
      actForTell=others[Math.floor(Math.random()*others.length)];
    }
    bpTellWasAccurate[ri]=!isMisdirect;
    const pool=tells[actForTell]||tells[0];
    bpRivalTells[ri]=pool[Math.floor(Math.random()*pool.length)];
  }
}
let bpCardSelectActive=false, bpCardSelectIdx=0; // USE CARD selection
let bpTargetSelectActive=false, bpTargetSelectIdx=1; // STEAL/SCOUT target selection
let bpPendingAction=-1; // action waiting for target/card selection
let bpSelectedCardSlot=0; // which card slot to consume for USE CARD
let bpSelectedTarget=1; // which player index to target for STEAL/SCOUT

function generateResolveEvents(){
  const actionNames=['DRAW','STEAL','BARRIER','SCOUT','USE CARD'];const events=[];
  bpPlayerBarrier=(bpAction===2);
  // Rival AI actions: use pre-generated (from generateRivalTells at select start)
  // If not pre-generated yet (edge case), generate now without tells
  if(!bpActionsGenerated){bpRivalActions[0]=rivalChooseAction(1);bpRivalActions[1]=rivalChooseAction(2);}
  const rivalBarriers=[bpRivalActions[0]===2,bpRivalActions[1]===2];

  // ── PLAYER ACTION ──
  if(bpAction===0){// DRAW
    const cardId=pickAreaCardForMap(currentMap);const cr=CD[cardId-1];
    events.push({type:'action',who:'You',action:'DRAW',text:'You used DRAW!',effect:'none'});
    const wasInHandBefore=pl[0].cd.some(c=>c===cardId); // capture before addCardToPlayer modifies hand
    if(addCardToPlayer(0,cardId)){
      events.push({type:'result',text:'You obtained '+cr.n+'!',effect:'card_get',cardName:cr.n,cardId:cardId});
      lg.push('R'+rd+': You drew '+cr.n+'!');
      // Streak: new unique type (not already in hand before this draw)
      if(!wasInHandBefore){streakCount++;streakDisplayTimer=60;sfxStreakUp();}
    }else{
      // Hand full - store drawn card for discard prompt after resolve
      events.push({type:'result',text:'Hand full! You drew '+cr.n+' - discard one after battle.',effect:'none'});
      events._pendingDrawCard=cardId;
      lg.push('R'+rd+': Drew '+cr.n+' but hand full!');
    }
  }else if(bpAction===1){// STEAL
    sp.s=Math.max(0,sp.s-1);stats.stealsAttempted++;
    const tgt=bpSelectedTarget; // 1=Rival, 2=Hunter
    const tgtBarrier=rivalBarriers[tgt-1];
    events.push({type:'action',who:'You',action:'STEAL',text:'You used STEAL on '+pl[tgt].n+'!',effect:'slash',target:tgt});
    if(tgtBarrier){
      stats.stealsBlocked++;
      events.push({type:'result',text:pl[tgt].n+"'s BARRIER blocked your steal!",effect:'shield_block'});
      lg.push('R'+rd+': Steal on '+pl[tgt].n+' - BLOCKED!');
    }else if(pl[tgt].cc<=0){
      events.push({type:'result',text:pl[tgt].n+' has no cards to steal!',effect:'none'});
      lg.push('R'+rd+': Steal failed - '+pl[tgt].n+' has no cards!');
    }else{
      const stolen=removeCardFromPlayer(tgt,-1);
      if(stolen>0&&addCardToPlayer(0,stolen)){
        const stolenCard=CD[stolen-1];
        // Successful steal → target loses 1 HP
        bpHP[tgt]=Math.max(0,bpHP[tgt]-1);bpHPDmgAnim[tgt]=20;
        if(tgt===1&&bpHP[1]<=0)events._rival1KO=true;
        if(tgt===2&&bpHP[2]<=0)events._rival2KO=true;
        events.push({type:'result',text:'You stole '+stolenCard.n+' from '+pl[tgt].n+'! (-1 HP)',effect:'steal_get',target:tgt,isCritical:true,stolenId:stolen,rarity:stolenCard.r,dmg:1});
        lg.push('R'+rd+': Stole '+stolenCard.n+' from '+pl[tgt].n+'! ('+RARITY_LABEL[stolenCard.r]+') -HP');
        streakCount++;streakDisplayTimer=60;sfxStreakUp();
        // v79: track steal_win mission
        if(runMission&&runMission.type==='steal_win'&&!runMission.completed){runMission.progress=1;runMission.completed=true;}
      }else if(stolen>0){
        // Hand full — queue discard prompt so stolen card isn't lost
        const stolenCard=CD[stolen-1];
        bpHP[tgt]=Math.max(0,bpHP[tgt]-1);bpHPDmgAnim[tgt]=20;
        if(tgt===1&&bpHP[1]<=0)events._rival1KO=true;
        if(tgt===2&&bpHP[2]<=0)events._rival2KO=true;
        events.push({type:'result',text:'You stole '+stolenCard.n+' but hand full! Discard one after battle.',effect:'steal_get',target:tgt,isCritical:true,stolenId:stolen,rarity:stolenCard.r,dmg:1});
        events._pendingDrawCard=stolen;
        lg.push('R'+rd+': Stole '+stolenCard.n+' - hand full! -HP');
        streakCount++;streakDisplayTimer=60;sfxStreakUp();
      }else{
        events.push({type:'result',text:'Steal failed!',effect:'none'});
        lg.push('R'+rd+': Steal failed!');
      }
    }
  }else if(bpAction===2){// BARRIER
    sp.b=Math.max(0,sp.b-1);
    events.push({type:'action',who:'You',action:'BARRIER',text:'You raised a BARRIER!',effect:'shield'});
    lg.push('R'+rd+': You raised a Barrier!');
  }else if(bpAction===3){// SCOUT
    sp.c=Math.max(0,sp.c-1);stats.scoutUses++;
    const tgt=bpSelectedTarget;
    events.push({type:'action',who:'You',action:'SCOUT',text:'You used SCOUT on '+pl[tgt].n+'!',effect:'scout_reveal',scoutTarget:tgt});
    const rCards=pl[tgt].cd.filter(c=>c>0).map(c=>CD[c-1]);
    const rCardNames=rCards.map(c=>c.n);
    const scoutMsg=rCardNames.length>0?pl[tgt].n+' has: '+rCardNames.join(', '):pl[tgt].n+' has no cards!';
    events.push({type:'result',text:scoutMsg,effect:'none'});
    lg.push('R'+rd+': Scout > '+scoutMsg);
    // Persist scout intel in opponent info box
    bpScoutedCards[tgt-1]={round:rd,cards:rCards.map(c=>({n:c.n,r:c.r,t:c.t}))};
  }else if(bpAction===4){// USE CARD
    // Consume selected card in hand for effect based on card TYPE (not ID)
    const filled=[];for(let i=0;i<HAND_SIZE;i++){if(pl[0].cd[i]>0)filled.push(i);}
    // Safety: if selected slot is now empty (decayed between select and resolve), fallback to any filled slot
    const safeSlot=(pl[0].cd[bpSelectedCardSlot]>0)?bpSelectedCardSlot:(filled[0]??-1);
    if(filled.length>0&&safeSlot>=0){
      const slot=safeSlot;const card=removeCardFromPlayer(0,slot);
      if(!card||!CD[card-1]){events.push({type:'result',text:'Your card vanished before use!',effect:'none'});lg.push('R'+rd+': USE CARD — card gone');
      }else{
      const cr=CD[card-1];
      events.push({type:'action',who:'You',action:'USE CARD',text:'You consumed '+cr.n+'!',effect:'none'});
      const tgt=bpSelectedTarget;
      // Effect scales with rarity (r=1 common, r=5 legendary)
      if(cr.t==='attack'){
        // Attack: deal 1 HP damage + force steal (ignore barrier) — power scales with rarity
        const dmg=Math.min(2,1+Math.floor((cr.r-1)/2));
        bpHP[tgt]=Math.max(0,bpHP[tgt]-dmg);bpHPDmgAnim[tgt]=20;
        if(tgt===1&&bpHP[1]<=0)events._rival1KO=true;
        if(tgt===2&&bpHP[2]<=0)events._rival2KO=true;
        if(Math.random()<0.2+cr.r*0.15){
          const stolen=removeCardFromPlayer(tgt,-1);
          if(stolen>0&&addCardToPlayer(0,stolen)){
            const sc_=CD[stolen-1];
            events.push({type:'result',text:cr.n+': -'+dmg+' HP! Power steal! Got '+sc_.n+'!',effect:'steal_get',target:tgt,isCritical:true,stolenId:stolen,rarity:sc_.r,dmg});
            lg.push('R'+rd+': '+cr.n+' -'+dmg+'HP power steal → '+sc_.n+'! ('+RARITY_LABEL[sc_.r]+')');streakCount++;streakDisplayTimer=60;sfxStreakUp();
          }else if(stolen>0){
            events._pendingDrawCard=stolen;
            const sc_=CD[stolen-1];
            events.push({type:'result',text:cr.n+': -'+dmg+' HP! Stole '+sc_.n+'! Hand full.',effect:'steal_get',target:tgt,isCritical:true,stolenId:stolen,rarity:sc_.r,dmg});
          }else{events.push({type:'result',text:cr.n+': -'+dmg+' HP damage! '+pl[tgt].n+' has no cards.',effect:'none'});}
        }else{
          events.push({type:'result',text:cr.n+': Strike landed but foe dodged!',effect:'slash',target:tgt});
          lg.push('R'+rd+': '+cr.n+' strike — missed steal!');
        }
      }else if(cr.t==='defense'){
        // Defense: barrier + restore spell energy + heal 1 HP
        bpPlayerBarrier=true;
        const restore=Math.min(2,Math.ceil(cr.r/2));
        sp.b=Math.min(5,sp.b+restore);
        const healed=bpHP[0]<BATTLE_HP_MAX;
        if(healed)bpHP[0]=Math.min(BATTLE_HP_MAX,bpHP[0]+1);
        events.push({type:'result',text:cr.n+': Barrier! +'+restore+' charge.'+(healed?' Restored 1 HP!':''),effect:'shield',heal:healed?1:0});
        lg.push('R'+rd+': '+cr.n+' barrier +'+restore+(healed?' +HP':'')+'!');
      }else if(cr.t==='flee'){
        // Flee: escape battle immediately (no card loss)
        events.push({type:'result',text:cr.n+': ESCAPED! No cards lost this round!',effect:'shield'});
        lg.push('R'+rd+': '+cr.n+' — escaped battle!');
        events._escaped=true; // signal battle result handler to skip to map immediately
      }else if(cr.t==='magic'){
        // Magic: strip all barriers + 2 HP damage to both rivals + guaranteed steal
        rivalBarriers[0]=false;rivalBarriers[1]=false;bpPlayerBarrier=false;
        bpHP[1]=Math.max(0,bpHP[1]-2);bpHP[2]=Math.max(0,bpHP[2]-1);
        bpHPDmgAnim[1]=20;bpHPDmgAnim[2]=20;
        const stolen=removeCardFromPlayer(tgt,-1);
        if(stolen>0&&addCardToPlayer(0,stolen)){
          events.push({type:'result',text:cr.n+': Magic! -2 HP all rivals. Stole '+CD[stolen-1].n+'!',effect:'damage',target:tgt,isCritical:true,dmg:2});

        }else{

        if(bpHP[2]<=0){events._rival2KO=true;}
      }else if(cr.t==='recovery'){
        // Recovery: restore all spell energy + 1 HP
        sp.s=Math.min(5,sp.s+Math.ceil(cr.r/2));
        sp.b=Math.min(5,sp.b+1);
        sp.c=Math.min(3,sp.c+1);
        bpHP[0]=Math.min(BATTLE_HP_MAX,bpHP[0]+1);
        events.push({type:'result',text:cr.n+': Recovery! +'+Math.ceil(cr.r/2)+' Steal, +1 Barrier, +1 Scout. +1 HP!',effect:'card_get',heal:1});
        lg.push('R'+rd+': '+cr.n+' restored energy + HP!');
      }
      } // end else(card valid)
    }else{
      events.push({type:'action',who:'You',action:'USE CARD',text:'No cards to use!',effect:'none'});
    }
  }

  // ── RIVAL 1 ACTION ──
  const r1Act=bpRivalActions[0];

      removeCardFromPlayer(1,-1);
      addCardToPlayer(1,cardId);
      events.push({type:'action',who:pl[1].n,action:'DRAW',text:pl[1].n+' swapped a card for '+cr.n+'!',effect:'card_get_rival',cardId,rivalIdx:0});

    }
  }else if(r1Act===1){// Rival steals from player

    }else if(pl[0].cc<=0){
      events.push({type:'result',text:'You had no cards to steal!',effect:'none'});
      lg.push('R'+rd+': '+pl[1].n+' Steal failed - you have no cards!');
    }else{

      }else{
        events.push({type:'result',text:'You had no cards to steal!',effect:'none'});
        lg.push('R'+rd+': '+pl[1].n+' Steal failed - hand empty!');
      }
    }
  }else if(r1Act===2){// Rival barrier (already tracked)
    events.push({type:'action',who:pl[1].n,action:'BARRIER',text:pl[1].n+' raised a BARRIER!',effect:'shield'});
    lg.push('R'+rd+': '+pl[1].n+' raised Barrier!');
  }else{// Scout
    events.push({type:'action',who:pl[1].n,action:'SCOUT',text:pl[1].n+' used SCOUT on you!',effect:'rival_scout',scoutSource:1});
    lg.push('R'+rd+': '+pl[1].n+' scouted you!');
  }

  // ── RIVAL 2 (HUNTER) ACTION ──
  const r2Act=bpRivalActions[1];
  if(r2Act===0){
    const cardId=pickAreaCardForMap(rivalMaps[1]);const cr=CD[cardId-1];
    if(addCardToPlayer(2,cardId)){

    }else{
      removeCardFromPlayer(2,-1);

    events.push({type:'action',who:pl[2].n,action:'STEAL',text:pl[2].n+' tried STEAL!',effect:'slash',target:0});
    if(bpPlayerBarrier){
      events.push({type:'result',text:'Your BARRIER blocked it!',effect:'shield_block'});
    }else if(pl[0].cc<=0){
      events.push({type:'result',text:'You had no cards!',effect:'none'});
    }else{
      const stolen=removeCardFromPlayer(0,-1);
      if(stolen>0){
        if(!addCardToPlayer(2,stolen)){
          removeCardFromPlayer(2,-1);
          addCardToPlayer(2,stolen);
        }
        // Rival steal success → player loses 1 HP
        bpHP[0]=Math.max(0,bpHP[0]-1);bpHPDmgAnim[0]=20;
        if(bpHP[0]<=0)events._playerDefeated=true;

      }else{
        events.push({type:'result',text:'You had no cards to steal!',effect:'none'});
        lg.push('R'+rd+': '+pl[2].n+' Steal failed - hand empty!');
      }
    }
  }else if(r2Act===2){
    events.push({type:'action',who:pl[2].n,action:'BARRIER',text:pl[2].n+' raised a BARRIER!',effect:'shield'});
  }else{
    events.push({type:'action',who:pl[2].n,action:'SCOUT',text:pl[2].n+' used SCOUT!',effect:'rival_scout',scoutSource:2});
  }

  return events;
}

function dAct(){
  if(battlePhase==='vs_splash')drawVsSplash();

function drawCardAcquisition(){
  if(!cardAcqActive)return;
  const t=fr-cardAcqFrame,totalFrames=120;
  if(t>=totalFrames){cardAcqActive=false;cardAcqDone=true;return;}
  const cr=CD[cardAcqCard];if(!cr)return;
  // v222: Rarity-specific visual effects
  const rar=cr.r-1; // 0=common,1=uncommon,2=rare,3=epic,4=legendary
  const rarCol=CARD_RARITY_COL[rar]||'#f0c830';
  const isEpicPlus=rar>=3;

  let cx_,cy_,scale,alpha=1;
  if(t<50){
    const p=t/50,ease=1-Math.pow(1-p,3);
    cx_=W/2;cy_=H+30-ease*(H/2+30);scale=.2+ease*.8;
  }else if(t<90){
    cx_=W/2;cy_=H/2-20;scale=1;
    if(t%3===0){
      const angle=Math.random()*Math.PI*2,speed=1+Math.random()*2;
      // v222: Particle colors based on rarity
      const pc=isEpicPlus?(Math.random()>.5?rarCol:'#fff'):(Math.random()>.5?'#fff':'#f0c830');
      cardAcqParticles.push({x:cx_,y:cy_,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:20+Math.random()*10,c:pc});
      // Epic/Legendary: extra burst particles at card edges
      if(isEpicPlus&&t%6===0){
        const bAng=Math.random()*Math.PI*2,bSpd=2+Math.random()*3;
        cardAcqParticles.push({x:cx_+(Math.random()-.5)*40,y:cy_+(Math.random()-.5)*56,vx:Math.cos(bAng)*bSpd,vy:Math.sin(bAng)*bSpd,life:14+Math.random()*8,c:rarCol});
      }
    }
  }else{
    const p=(t-90)/30,ease=p*p;
    cx_=W/2+(280-W/2)*ease;cy_=(H/2-20)+(H-40-(H/2-20))*ease;scale=1-ease*.85;
  }

  // v222: Background dim overlay during card display (frames 20-110)
  if(t>=20&&t<110){
    const dimA=Math.min(0.55,(t<30?(t-20)/10*0.55:(t>100?(110-t)/10*0.55:0.55)));
    g.globalAlpha=dimA;bx(0,0,W,H,'#000');g.globalAlpha=1;
  }

  const cw=60*scale,ch=84*scale;

  // v222: Rarity glow ring behind card during hold phase
  if(t>=50&&t<90){
    const ringPulse=0.6+0.4*Math.sin(fr*0.2);
    const ringR=48+Math.sin(fr*0.15)*4;
    g.globalAlpha=ringPulse*(isEpicPlus?0.55:0.3);
    g.fillStyle=rarCol;
    g.beginPath();g.arc(cx_,cy_,ringR+6,0,Math.PI*2);g.fill();
    g.globalAlpha=ringPulse*(isEpicPlus?0.35:0.18);
    g.beginPath();g.arc(cx_,cy_,ringR+14,0,Math.PI*2);g.fill();
    // Spinning sparkle dots for epic/legendary
    if(isEpicPlus){
      for(let si=0;si<6;si++){
        const sang=fr*0.07+si*(Math.PI/3);
        const sx=cx_+Math.cos(sang)*(ringR+4),sy=cy_+Math.sin(sang)*(ringR+4);
        g.globalAlpha=0.7*ringPulse;bx(sx-1,sy-1,3,3,rarCol);
      }
    }
    g.globalAlpha=1;
  }

  g.globalAlpha=alpha;
  drawCardFrame(cx_-cw/2,cy_-ch/2,cw,ch,cardAcqCard,scale>.6);
  g.globalAlpha=1;

  if(t>=50&&t<90){
    win(W/2-150,cy_+ch/2+12,300,40);
    txShadow('You obtained '+cr.n+'!',W/2-130,cy_+ch/2+38,14,'#303028','rgba(200,180,140,.3)');
    // v96: NEW card badge — shown when first time in vault
    if(cardAcqIsNew){
      const newBadgeAlpha=t<60?(t-50)/10:t>82?(90-t)/8:1;

    const p=cardAcqParticles[i];p.x+=p.vx;p.y+=p.vy;p.life--;

    g.globalAlpha=Math.min(1,p.life/10);bx(p.x,p.y,2,2,p.c);g.globalAlpha=1;
  }

}
