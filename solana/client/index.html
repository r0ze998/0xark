// Procedural dungeon floor generator — PMD Red Rescue Team style
// BSP sector-based room placement, 1-tile corridors, dedicated stair tiles
function generateDungeonFloor(floorNum,seed){
  const map=[];
  const rng=(n)=>{let h=seed^(n*2654435761+floorNum*40503);h^=h>>>16;h=(h*0x45d9f3b)>>>0;h^=h>>>16;return(h&0xFFFF)/65535;};
  // Fill with walls
  for(let y=0;y<MH;y++){map[y]=[];for(let x=0;x<MW;x++)map[y][x]=18;}

  // ── FLOOR-SPECIFIC DECOR FUNCTION ──
  function addRoomDecor(r){
    for(let ry=r.y+1;ry<r.y+r.h-1;ry++){
      for(let rx=r.x+1;rx<r.x+r.w-1;rx++){
        if(r.isBoss&&rx===r.cx&&ry===r.cy){map[ry][rx]=27;continue;} // boss room altar center
        const rv=rng(ry*100+rx+floorNum*7777);
        if(floorNum===1){
          if(rv<0.05)map[ry][rx]=7;
          else if(rv>0.96)map[ry][rx]=26;
        }else if(floorNum===2){
          if(rv<0.05)map[ry][rx]=28;
          else if(rv>0.95)map[ry][rx]=26;
        }else if(floorNum===3){
          if(rv<0.04)map[ry][rx]=27;
          else if(rv>0.95)map[ry][rx]=26;
          else if(rv>0.90&&rv<0.92)map[ry][rx]=28;
        }else if(floorNum===4){
          if(rv<0.06)map[ry][rx]=25;
          else if(rv>0.94)map[ry][rx]=27;
        }else if(floorNum===5){
          if(rv<0.08)map[ry][rx]=25;
          else if(rv>0.94)map[ry][rx]=27;
          else if(rv>0.90&&rv<0.92)map[ry][rx]=26;
        }
      }
    }
  }

  // ── BSP SECTOR GRID ──
  const ENTRY_X=3,ENTRY_Y=14;
  const DESCEND_X=36,DESCEND_Y=14;
  const GCOLS=floorNum<=2?4:5; // 4 or 5 sector columns
  const GROWS=3;               // always 3 sector rows
  const SW=Math.floor((MW-2)/GCOLS);
  const SH=Math.floor((MH-2)/GROWS);
  const rooms=[];

  for(let sr=0;sr<GROWS;sr++){
    for(let sc=0;sc<GCOLS;sc++){
      const si=sr*GCOLS+sc;
      // Always place room in first and last sector; 15% skip elsewhere
      if(si>0&&si<GCOLS*GROWS-1&&rng(si*100+floorNum*13)<0.15)continue;
      // Room size: PMD-style small-medium rooms (4-9 wide, 3-6 tall)
      const rw=4+Math.floor(rng(si*10+1+floorNum)*5);
      const rh=3+Math.floor(rng(si*10+2+floorNum)*3);
      // Position within sector
      const sx=1+sc*SW;const sy=1+sr*SH;
      const maxRX=Math.min(MW-rw-2,sx+SW-rw-1);
      const maxRY=Math.min(MH-rh-2,sy+SH-rh-1);
      if(maxRX<sx||maxRY<sy)continue;
      const rx=sx+Math.floor(rng(si*10+3+floorNum)*(maxRX-sx+1));
      const ry=sy+Math.floor(rng(si*10+4+floorNum)*(maxRY-sy+1));
      if(rx<1||ry<1||rx+rw>=MW-1||ry+rh>=MH-1)continue;
      rooms.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2),si});
    }
  }

  // Floor 5: Special large boss room in center
  if(floorNum===5){
    const bw=10,bh=7;
    const bx_=Math.floor(MW/2-bw/2),by_=Math.floor(MH/2-bh/2);
    if(bx_>1&&by_>1&&bx_+bw<MW-1&&by_+bh<MH-1){
      rooms.push({x:bx_,y:by_,w:bw,h:bh,cx:Math.floor(bx_+bw/2),cy:Math.floor(by_+bh/2),isBoss:true,si:999});
    }
  }

  // Carve rooms (PMD: interior is walkable, no separate edge type — walls are the uncarved tiles)
  for(const r of rooms){
    for(let ry=r.y;ry<r.y+r.h;ry++)
      for(let rx=r.x;rx<r.x+r.w;rx++)
        map[ry][rx]=1;
    if(!r.isBoss)addRoomDecor(r);
  }

  // 1-tile wide L-shaped corridors connecting rooms
  function carveCorridor(x1,y1,x2,y2,si_){
    // Alternate H-first vs V-first per sector for variety
    const hFirst=rng(si_*17+x1+y2)<0.5;
    if(hFirst){
      for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)if(map[y1][x]===18)map[y1][x]=2;
      for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)if(map[y][x2]===18)map[y][x2]=2;
    }else{
      for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)if(map[y][x1]===18)map[y][x1]=2;
      for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)if(map[y2][x]===18)map[y2][x]=2;
    }
  }

  // Connect rooms in sector order (chain + cross-connect for loops)
  if(rooms.length>1){
    const sorted=[...rooms].sort((a,b)=>a.si-b.si);
    for(let i=0;i<sorted.length-1;i++){
      carveCorridor(sorted[i].cx,sorted[i].cy,sorted[i+1].cx,sorted[i+1].cy,sorted[i].si);
    }
    // Extra connection for larger floors (prevents dead ends)
    if(rooms.length>=4){
      const a=sorted[0],b=sorted[Math.floor(sorted.length/2)];
      carveCorridor(a.cx,a.cy,b.cx,b.cy,a.si+500);
    }
  }

  // ── FIXED STAIR POSITIONS ──
  // Carve entry area (up-stairs / escape)
  for(let dy=-1;dy<=1;dy++)for(let dx=0;dx<=2;dx++){
    const ex=Math.max(1,Math.min(MW-2,ENTRY_X+dx));
    const ey=Math.max(1,Math.min(MH-2,ENTRY_Y+dy));
    map[ey][ex]=2;
  }
  map[ENTRY_Y][ENTRY_X]=32; // tile 32 = STAIRS_UP (dedicated)
  // Carve descend area (down-stairs)
  for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=0;dx++){
    const ex=Math.max(1,Math.min(MW-2,DESCEND_X+dx));
    const ey=Math.max(1,Math.min(MH-2,DESCEND_Y+dy));
    map[ey][ex]=2;
  }
  map[DESCEND_Y][DESCEND_X]=31; // tile 31 = STAIRS_DOWN (dedicated)
  // Connect entry/descend to nearest room
  if(rooms.length>0){
    const nearEntry=rooms.reduce((a,b)=>Math.abs(b.cx-ENTRY_X)+Math.abs(b.cy-ENTRY_Y)<Math.abs(a.cx-ENTRY_X)+Math.abs(a.cy-ENTRY_Y)?b:a);
    carveCorridor(ENTRY_X+2,ENTRY_Y,nearEntry.cx,nearEntry.cy,0);
    const nearDesc=rooms.reduce((a,b)=>Math.abs(b.cx-DESCEND_X)+Math.abs(b.cy-DESCEND_Y)<Math.abs(a.cx-DESCEND_X)+Math.abs(a.cy-DESCEND_Y)?b:a);
    carveCorridor(DESCEND_X-2,DESCEND_Y,nearDesc.cx,nearDesc.cy,GCOLS*GROWS-1);
  }

  // Treasure chest in a mid room (not the boss room)
  const midRooms=rooms.filter(r=>!r.isBoss&&r.si!==0&&r.si!==GCOLS*GROWS-1);
  if(midRooms.length>0){
    const mid=midRooms[Math.floor(midRooms.length/2)];
    if(mid.y+2<mid.y+mid.h-1&&mid.x+2<mid.x+mid.w-1)map[mid.y+2][mid.x+2]=30;
  }

  return {map,rooms};
}

function fogRevealAll(mapIdx){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)fogRevealed[mapIdx][y][x]=true;
  fogCacheDirty=true;

function fogRevealRadius(mapIdx,cx,cy,radius){
  let changed=false;
  const newlyRevealed=[];
  for(let dy=-radius;dy<=radius;dy++){
    for(let dx=-radius;dx<=radius;dx++){
      if(Math.abs(dx)+Math.abs(dy)<=radius){
        const nx=cx+dx,ny=cy+dy;
        if(nx>=0&&nx<MW&&ny>=0&&ny<MH){
          if(!fogRevealed[mapIdx][ny][nx]){
            fogRevealed[mapIdx][ny][nx]=true;changed=true;
            // v218: Only spawn sparkles on outer edge of reveal radius (newly exposed tiles)
            if(Math.abs(dx)+Math.abs(dy)===radius)newlyRevealed.push([nx,ny]);
          }
        }
      }
    }
  }
  if(changed){
    fogCacheDirty=true;
    // v218: Fog-reveal sparkle particles — brief shimmer on newly uncovered tiles
    if(particles&&newlyRevealed.length>0&&newlyRevealed.length<30){
      newlyRevealed.forEach(([rx,ry])=>{
        if(Math.random()>0.5)return; // sparse, not every tile
        particles.push({
          x:rx*TW+TW/2,y:ry*TH+TH/2,
          vx:(Math.random()-.5)*0.8,vy:-Math.random()*0.6-0.2,
          life:14+Math.random()*8,c:'rgba(180,220,255,1)'
        });
      });
    }
  }
}

// Reveal every tile inside a given room object {x,y,w,h}
function fogRevealRoom(mapIdx,room){
  if(!room)return;
  let changed=false;
  let newRoomTiles=0;
  for(let ry=room.y;ry<room.y+room.h;ry++){
    for(let rx=room.x;rx<room.x+room.w;rx++){
      if(rx>=0&&rx<MW&&ry>=0&&ry<MH&&!fogRevealed[mapIdx][ry][rx]){
        fogRevealed[mapIdx][ry][rx]=true;changed=true;newRoomTiles++;
      }
    }
  }
  // Also reveal 1-tile border around room (catches corridors leading in)
  for(let ry=room.y-1;ry<=room.y+room.h;ry++){
    for(let rx=room.x-1;rx<=room.x+room.w;rx++){
      if(rx>=0&&rx<MW&&ry>=0&&ry<MH&&!fogRevealed[mapIdx][ry][rx]){
        fogRevealed[mapIdx][ry][rx]=true;changed=true;
      }
    }
  }
  if(changed){
    fogCacheDirty=true;
    // v218: Room discovery burst — sprinkle sparkle particles across newly revealed room
    if(particles&&newRoomTiles>=4){
      const roomCX=(room.x+room.w/2)*TW,roomCY=(room.y+room.h/2)*TH;
      const burstCount=Math.min(10,newRoomTiles);
      for(let bi=0;bi<burstCount;bi++){
        const bx_=room.x*TW+Math.random()*room.w*TW;
        const by_=room.y*TH+Math.random()*room.h*TH;
        const ang=(bi/burstCount)*Math.PI*2;
        particles.push({
          x:bx_,y:by_,
          vx:Math.cos(ang)*1.1*(0.5+Math.random()),
          vy:Math.sin(ang)*0.7*(0.5+Math.random())-0.8,
          life:18+Math.random()*12,c:'rgba(220,240,255,1)'
        });
      }
    }
  }
}

// Check if player is inside a dungeon room; if so reveal the whole room
function fogRevealCurrentRoom(mapIdx,px,py){
  const rooms=dungeonRooms[mapIdx];
  if(!rooms)return;
  for(const r of rooms){
    if(px>=r.x&&px<r.x+r.w&&py>=r.y&&py<r.y+r.h){
      fogRevealRoom(mapIdx,r);
      return;
    }
  }
  // Not in a room — corridor: just do radius reveal
  fogRevealRadius(mapIdx,px,py,2);
}

function fogSave(){
  try{
    const compact=[];
    for(let m=0;m<FOG_MAP_COUNT;m++){
      compact[m]=[];
      for(let y=0;y<MH;y++){
        let row='';
        for(let x=0;x<MW;x++) row+=fogRevealed[m]&&fogRevealed[m][y]&&fogRevealed[m][y][x]?'1':'0';
        compact[m][y]=row;
      }
    }
    localStorage.setItem('oxark_fog',JSON.stringify(compact));
  }catch(e){}
}

function fogLoad(){
  try{
    const data=localStorage.getItem('oxark_fog');
    if(!data)return false;
    const compact=JSON.parse(data);
    for(let m=0;m<FOG_MAP_COUNT;m++){
      if(!compact[m])continue;
      for(let y=0;y<MH;y++){
        for(let x=0;x<MW;x++){
          if(fogRevealed[m]&&fogRevealed[m][y])fogRevealed[m][y][x]=compact[m][y]&&compact[m][y][x]==='1';
        }
      }
    }
    return true;
  }catch(e){return false;}
}

function fogClear(){
  for(let m=0;m<FOG_MAP_COUNT;m++)
    for(let y=0;y<MH;y++)
      for(let x=0;x<MW;x++){if(fogRevealed[m]&&fogRevealed[m][y])fogRevealed[m][y][x]=false;}
  fogSave();
}

function fogExploredPercent(mapIdx){
  const m=maps[mapIdx];
  let total=0,revealed=0;
  for(let y=0;y<MH;y++){
    for(let x=0;x<MW;x++){
      if(WALKABLE.has(m[y]?.[x])){
        total++;
        if(fogRevealed[mapIdx][y][x])revealed++;
      }
    }
  }
  return total===0?0:Math.round((revealed/total)*100);
}

// Find a walkable tile near (x,y) on mapIdx for rival goal
function findWalkableTile(mapIdx,nearX,nearY,radius){
  const m=maps[mapIdx];
  for(let attempt=0;attempt<40;attempt++){
    const rx=nearX+Math.floor(Math.random()*radius*2)-radius;
    const ry=nearY+Math.floor(Math.random()*radius*2)-radius;
    if(rx>=1&&rx<MW-1&&ry>=1&&ry<MH-1&&WALKABLE.has(m[ry]?.[rx])){
      return{x:rx,y:ry};
    }
  }
  return null;
}

// Find tall grass patches on a map
function findGrassPatch(mapIdx){
  const m=maps[mapIdx];
  const patches=[];
  for(let y=2;y<MH-2;y++){
    for(let x=2;x<MW-2;x++){
      if(m[y][x]===11)patches.push({x,y});
    }
  }
  if(patches.length===0)return null;
  return patches[Math.floor(Math.random()*patches.length)];
}

// Find which dungeon floor map has cards a rival needs
function findCardMap(rIdx){
  const r=pl[rIdx];
  const has=new Set(r.cd.filter(c=>c>0));
  // Score each floor map (1-5) by how many cards it offers that rival doesn't have
  const scored=[];
  for(let m=1;m<=MAX_DUNGEON_FLOORS;m++){
    const pool=AREA_CARDS[m]||[];
    const score=pool.filter(c=>!has.has(c)).length;
    scored.push({map:m,score});
  }
  scored.sort((a,b)=>b.score-a.score);
  // Go to the floor with most needed cards; fallback to random dungeon floor
  if(scored[0]&&scored[0].score>0)return scored[0].map;
  return 1+Math.floor(Math.random()*MAX_DUNGEON_FLOORS);
}

// Find exit from current map to target map
function findExitToMap(fromMap,toMap){
  for(const ex of exits){
    if(ex.fromMap===fromMap&&ex.targetMap===toMap){
      return{x:ex.tiles[0][0],y:ex.tiles[0][1],targetMap:ex.targetMap,targetX:ex.targetX,targetY:ex.targetY};
    }
  }
  return null;
}

// Simple step toward goal: reduce dx or dy by 1, prefer walkable+path tiles
function stepToward(rIdx,goalX,goalY){
  const p=pl[rIdx];
  const mapIdx=rivalMaps[rIdx-1];
  const m=maps[mapIdx];
  const dx=goalX-p.x;
  const dy=goalY-p.y;
  if(dx===0&&dy===0)return false;

  // Candidate steps in priority order
  const candidates=[];
  if(Math.abs(dx)>=Math.abs(dy)){
    if(dx!==0)candidates.push({nx:p.x+(dx>0?1:-1),ny:p.y});
    if(dy!==0)candidates.push({nx:p.x,ny:p.y+(dy>0?1:-1)});
    // Diagonal alternatives
    if(dx!==0&&dy!==0){
      candidates.push({nx:p.x,ny:p.y+(dy>0?1:-1)});
      candidates.push({nx:p.x+(dx>0?1:-1),ny:p.y});
    }
  }else{
    if(dy!==0)candidates.push({nx:p.x,ny:p.y+(dy>0?1:-1)});
    if(dx!==0)candidates.push({nx:p.x+(dx>0?1:-1),ny:p.y});
    if(dx!==0&&dy!==0){
      candidates.push({nx:p.x+(dx>0?1:-1),ny:p.y});
      candidates.push({nx:p.x,ny:p.y+(dy>0?1:-1)});
    }
  }
  // Random perpendicular as last resort
  if(candidates.length<3){
    const perp=[{nx:p.x+1,ny:p.y},{nx:p.x-1,ny:p.y},{nx:p.x,ny:p.y+1},{nx:p.x,ny:p.y-1}];
    perp.sort(()=>Math.random()-0.5);
    perp.forEach(c=>candidates.push(c));
  }

  // Pick best walkable candidate, preferring path tiles
  for(const c of candidates){
    if(c.nx>=0&&c.nx<MW&&c.ny>=0&&c.ny<MH&&WALKABLE.has(m[c.ny]?.[c.nx])){
      // Set direction
      const sdx=c.nx-p.x,sdy=c.ny-p.y;
      if(sdy>0)p.dir=0;else if(sdx<0)p.dir=1;
      else if(sdy<0)p.dir=2;else if(sdx>0)p.dir=3;
      p.x=c.nx;p.y=c.ny;p.step++;
      return true;
    }
  }
  return false;
}

// x402-enhanced rival AI: periodically fetch strategy from broker
let x402RivalStrategyTimer=[0,0];
let x402RivalLastAdvice=['',''];
function x402MaybeEnhanceRival(aiIdx){
  if(!x402Available)return;
  x402RivalStrategyTimer[aiIdx]++;
  // Check every ~15 seconds (900 frames)
  if(x402RivalStrategyTimer[aiIdx]<900)return;
  x402RivalStrategyTimer[aiIdx]=0;
  const rIdx=aiIdx+1;
  x402FetchIntel('/intel/strategy?player='+rIdx).then(data=>{
    if(!data||!data.recommendedAction)return;
    x402RivalLastAdvice[aiIdx]=data.recommendedAction;
    const ai=rivalAI[aiIdx];
    // Map GDD v1.0 broker floor names to map indices
    const floorNameToIdx={'Town':0,'B1':1,'B2':2,'B3':3,'B4':4,'B5':5};
    // MOVE: navigate to the broker-recommended floor
    if(data.recommendedAction==='MOVE'&&data.recommendedFloor){
      const targetMap=floorNameToIdx[data.recommendedFloor]??-1;
      if(targetMap>0&&targetMap!==rivalMaps[aiIdx]){
        const ex=findExitToMap(rivalMaps[aiIdx],targetMap);
        if(ex){ai.goalX=ex.x;ai.goalY=ex.y;ai.state='exploring';}
      }
    }
    // STEAL: hunter becomes more aggressive
    if(data.recommendedAction==='STEAL'&&ai.personality==='hunter'){
      ai.moveInterval=Math.max(6,ai.moveInterval-2);
    }
    // DRAW: seek tall grass on current floor
    if(data.recommendedAction==='DRAW'){
      const grass=findGrassPatch(rivalMaps[aiIdx]);
      if(grass){ai.goalX=grass.x;ai.goalY=grass.y;ai.state='exploring';}
    }
  }).catch(()=>{});
}

// Rival picks a new goal based on personality
function pickRivalGoal(aiIdx){
  const ai=rivalAI[aiIdx];
  const rIdx=aiIdx+1; // pl index
  const r=pl[rIdx];
  const rMap=rivalMaps[aiIdx];
  const rCards=r.cd.filter(c=>c>0).length;

  if(ai.personality==='hunter'){
    // The Hunter - Aggressive
    // Priority 1: If knows player location, move toward them
    if(ai.lastKnownPlayerMap>=0&&ai.lastKnownPlayerMap===rMap){
      ai.goalX=ai.lastKnownPlayerX;
      ai.goalY=ai.lastKnownPlayerY;
      ai.goalMap=rMap;
      ai.state='hunting';
      return;
    }
    // Priority 2: If < 3 cards, go get cards
    if(rCards<3){
      const needMap=findCardMap(rIdx);
      if(needMap!==rMap){
        // Navigate to exit
        const ex=findExitToMap(rMap,needMap);
        if(ex){ai.goalX=ex.x;ai.goalY=ex.y;ai.goalMap=rMap;ai.state='exploring';return;}
      }
      const grass=findGrassPatch(rMap);
      if(grass){ai.goalX=grass.x;ai.goalY=grass.y;ai.goalMap=rMap;ai.state='exploring';return;}
    }
    // Priority 3: Has 3+ cards, hunt the player
    if(ai.lastKnownPlayerMap>=0&&ai.lastKnownPlayerMap!==rMap){
      const ex=findExitToMap(rMap,ai.lastKnownPlayerMap);
      if(ex){ai.goalX=ex.x;ai.goalY=ex.y;ai.goalMap=rMap;ai.state='hunting';return;}
    }
    // Default: explore randomly
    const t=findWalkableTile(rMap,Math.floor(MW/2),Math.floor(MH/2),15);
    if(t){ai.goalX=t.x;ai.goalY=t.y;ai.goalMap=rMap;}
    ai.state='exploring';
  }else{
    // The Collector - Strategic
    // Priority 1: Go to area with missing cards
    const needMap=findCardMap(rIdx);
    if(needMap!==rMap){
      // Avoid the hunter rival's floor if possible (VEGA = rivalAI[0] = pl[1])
      const hunterMap=rivalMaps[0];
      if(needMap===hunterMap&&rCards>=2){
        // Try alternate dungeon floor (1-MAX_DUNGEON_FLOORS, avoiding current and hunter's floor)
        const altMaps=[];
        for(let m=1;m<=MAX_DUNGEON_FLOORS;m++){if(m!==rMap&&m!==hunterMap)altMaps.push(m);}
        const has=new Set(r.cd.filter(c=>c>0));
        const altNeed=altMaps.find(m=>{const pool=AREA_CARDS[m]||[];return pool.some(c=>!has.has(c));});
        if(altNeed!==undefined){
          const ex=findExitToMap(rMap,altNeed);
          if(ex){ai.goalX=ex.x;ai.goalY=ex.y;ai.goalMap=rMap;ai.state='exploring';return;}
        }
      }
      const ex=findExitToMap(rMap,needMap);
      if(ex){ai.goalX=ex.x;ai.goalY=ex.y;ai.goalMap=rMap;ai.state='exploring';return;}
    }
    // Priority 2: Walk to tall grass
    const grass=findGrassPatch(rMap);
    if(grass){ai.goalX=grass.x;ai.goalY=grass.y;ai.goalMap=rMap;ai.state='exploring';return;}
    // Default: explore
    const t=findWalkableTile(rMap,Math.floor(MW/2),Math.floor(MH/2),15);
    if(t){ai.goalX=t.x;ai.goalY=t.y;ai.goalMap=rMap;}
    ai.state='exploring';
  }
}

// v155: Turn-based single step for a rival in dungeon (bypasses real-time timer)
function dungeonTurnStep(aiIdx){
  const ai=rivalAI[aiIdx];
  const rIdx=aiIdx+1;
  const r=pl[rIdx];
  const rMap=rivalMaps[aiIdx];
  if(encounterCooldown>0)return;
  if(ai.huntCooldown>0)ai.huntCooldown--;
  // Update detection based on distance
  if(rMap===currentMap){
    const dist=Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y);
    // Always track player position when on same floor (needed for hunting)
    ai.lastKnownPlayerMap=currentMap;
    ai.lastKnownPlayerX=pl[0].x;ai.lastKnownPlayerY=pl[0].y;
    // Hunter: redirect to player once huntCooldown expires (any distance on same floor)
    if(ai.personality==='hunter'&&ai.huntCooldown<=0){
      ai.goalX=pl[0].x;ai.goalY=pl[0].y;ai.goalMap=rMap;ai.state='hunting';ai.moveInterval=5;
    }
    // Collector: flee when player is within 6 tiles
    if(ai.personality==='collector'&&dist<=6&&ai.state!=='fleeing'){
      if(Math.random()<0.7){
        ai.state='fleeing';ai.stateTimer=8;ai.moveInterval=5;
        const fdx=r.x-pl[0].x;const fdy=r.y-pl[0].y;
        const fx=r.x+(fdx>0?10:-10);const fy=r.y+(fdy>0?10:-10);
        const clamped=findWalkableTile(rMap,Math.max(2,Math.min(MW-3,fx)),Math.max(2,Math.min(MH-3,fy)),6);
        if(clamped){ai.goalX=clamped.x;ai.goalY=clamped.y;ai.goalMap=rMap;}
      } else {
        // 30% chance MIRA also hunts (she has enough cards)
        if(ai.huntCooldown<=0){ai.goalX=pl[0].x;ai.goalY=pl[0].y;ai.state='hunting';ai.moveInterval=6;}
      }
    }
  }
  if(ai.state==='fleeing'){
    ai.stateTimer--;if(ai.stateTimer<=0){ai.state='exploring';ai.moveInterval=ai.personality==='hunter'?8:12;pickRivalGoal(aiIdx);}
  }
  const atGoal=Math.abs(r.x-ai.goalX)<=1&&Math.abs(r.y-ai.goalY)<=1;
  if(atGoal){
    for(const ex of exits){
      if(ex.fromMap===rMap){
        for(const [etx,ety] of ex.tiles){
          if(r.x===etx&&r.y===ety){
            const oldMap=rMap;rivalMaps[aiIdx]=ex.targetMap;
            r.x=ex.targetX;r.y=ex.targetY;r.visualX=ex.targetX*TW;r.visualY=ex.targetY*TH;
            if(ex.targetMap===currentMap&&oldMap!==currentMap){
              rivalAlert=90;rivalAlertName=r.n;flash();beep(660,.04,.06);
              lg.push('You sense movement... '+r.n+' entered the area!');
            }
            if(inDungeon&&ex.targetMap>0){
              const flNums=['','I','II','III','IV','V'];
              const dir=ex.targetMap>oldMap?'descended to':'retreated to';
              rivalNewsQueue.push({text:r.n+' '+dir+' FLOOR '+(flNums[ex.targetMap]||ex.targetMap),rivalIdx:aiIdx,rarity:0});
            }
            pickRivalGoal(aiIdx);return;
          }
        }
      }
    }
    ai.moveInterval=ai.personality==='hunter'?8:12;pickRivalGoal(aiIdx);
  }
  const moved=stepToward(rIdx,ai.goalX,ai.goalY);
  if(moved){
    footprints.push({map:rMap,x:r.x,y:r.y,age:0,ri:rIdx});
    const m=maps[rMap];const tile=m[r.y]?.[r.x];
    let encounterChance=0;
    if(tile===11)encounterChance=0.25;else if(tile===1)encounterChance=0.12;
    if(encounterChance>0&&Math.random()<encounterChance){
      const cardId=pickAreaCardForMap(rMap);
      if(addCardToPlayer(rIdx,cardId)&&rMap===currentMap)lg.push(r.n+' found a card nearby...');
    }
  }else{pickRivalGoal(aiIdx);}
}

// Update single rival AI each frame
function updateRivalAI(aiIdx){
  const ai=rivalAI[aiIdx];
  const rIdx=aiIdx+1;
  const r=pl[rIdx];
  const rMap=rivalMaps[aiIdx];

  // v155: In dungeon, rivals move per-turn (called by processDungeonTurn), not real-time
  if(inDungeon)return;

  // Freeze all rival movement while encounter cooldown is active (map transition grace period).
  // This prevents rivals from walking toward the player entry point during the 8s safe window.
  if(encounterCooldown>0)return;

  // x402-enhanced AI: periodically consult broker for smarter decisions
  x402MaybeEnhanceRival(aiIdx);

  // Decrement move timer
  ai.moveTimer--;
  if(ai.moveTimer>0)return;
  ai.moveTimer=ai.moveInterval+Math.floor(Math.random()*4); // 8-14 frames

  // Countdown per-rival hunt cooldown (prevents immediate hunting after grace period)
  if(ai.huntCooldown>0)ai.huntCooldown--;

  // If player is on same map and nearby, update last known
  if(rMap===currentMap){
    const dist=Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y);
    // Hunter: track if within 6 tiles (reduced from 10 to avoid instant detection at spawn)
    if(ai.personality==='hunter'&&dist<=6){
      ai.lastKnownPlayerMap=currentMap;
      ai.lastKnownPlayerX=pl[0].x;
      ai.lastKnownPlayerY=pl[0].y;
    }
    // Collector: only track if within 5 tiles
    if(ai.personality==='collector'&&dist<=5){
      ai.lastKnownPlayerMap=currentMap;
      ai.lastKnownPlayerX=pl[0].x;
      ai.lastKnownPlayerY=pl[0].y;
    }

    // Hunter chases player if within 4 tiles AND hunt cooldown has expired
    // (reduced from 7 to 4 — player must actually be nearby before being hunted)
    if(ai.personality==='hunter'&&dist<=4&&ai.huntCooldown<=0){
      ai.goalX=pl[0].x;ai.goalY=pl[0].y;ai.goalMap=rMap;
      ai.state='hunting';
      ai.moveInterval=6; // faster when chasing
    }

    // Collector flees if player within 4 tiles (70% chance)
    if(ai.personality==='collector'&&dist<=4&&ai.state!=='fleeing'){
      if(Math.random()<0.7){
        ai.state='fleeing';
        ai.stateTimer=6; // flee for 6 steps
        // Move away from player
        const fdx=r.x-pl[0].x;const fdy=r.y-pl[0].y;
        const fx=r.x+(fdx>0?8:-8);const fy=r.y+(fdy>0?8:-8);
        const clamped=findWalkableTile(rMap,Math.max(2,Math.min(MW-3,fx)),Math.max(2,Math.min(MH-3,fy)),5);
        if(clamped){ai.goalX=clamped.x;ai.goalY=clamped.y;ai.goalMap=rMap;}
        ai.moveInterval=6; // flee fast
      }
    }
  }

  // Fleeing countdown
  if(ai.state==='fleeing'){
    ai.stateTimer--;
    if(ai.stateTimer<=0){
      ai.state='exploring';
      ai.moveInterval=ai.personality==='hunter'?8:12;
      pickRivalGoal(aiIdx);
    }
  }

  // Check if at goal
  const atGoal=Math.abs(r.x-ai.goalX)<=1&&Math.abs(r.y-ai.goalY)<=1;
  if(atGoal){
    // Check if standing on exit tile
    for(const ex of exits){
      if(ex.fromMap===rMap){
        for(const [etx,ety] of ex.tiles){
          if(r.x===etx&&r.y===ety){
            // Transition rival to new map
            const oldMap=rMap;
            rivalMaps[aiIdx]=ex.targetMap;
            r.x=ex.targetX;r.y=ex.targetY;
            r.visualX=ex.targetX*TW;r.visualY=ex.targetY*TH;
            // Alert if entered player's map
            if(ex.targetMap===currentMap&&oldMap!==currentMap){
              rivalAlert=90;rivalAlertName=r.n;
              flash();beep(660,.04,.06);
              lg.push('You sense movement... '+r.n+' entered the area!');
            }
            // v73: News ticker for floor transitions
            if(inDungeon&&ex.targetMap>0){
              const flNums=['','I','II','III','IV','V'];
              const dir=ex.targetMap>oldMap?'descended to':'retreated to';
              rivalNewsQueue.push({text:r.n+' '+dir+' FLOOR '+(flNums[ex.targetMap]||ex.targetMap),rivalIdx:aiIdx,rarity:0});
            }
            pickRivalGoal(aiIdx);
            return;
          }
        }
      }
    }
    // Not on exit, pick new goal
    ai.moveInterval=ai.personality==='hunter'?8:12;
    pickRivalGoal(aiIdx);
  }

  // Take a step toward goal
  const moved=stepToward(rIdx,ai.goalX,ai.goalY);
  if(moved){
    // Add footprint
    footprints.push({map:rMap,x:r.x,y:r.y,age:0,ri:rIdx});

    // Card encounter from grass (same chances as player)
    const m=maps[rMap];
    const tile=m[r.y]?.[r.x];
    let encounterChance=0;
    if(tile===11)encounterChance=0.25;
    else if(tile===1)encounterChance=0.12;
    if(encounterChance>0&&Math.random()<encounterChance){
      const cardId=pickAreaCardForMap(rMap);
      if(addCardToPlayer(rIdx,cardId)){
        // Log if player is on same map
        if(rMap===currentMap){
          lg.push(r.n+' found a card nearby...');
        }
      }
    }
  }else{
    // Stuck: pick new goal
    pickRivalGoal(aiIdx);
  }
}

// Update proximity tension based on rival distances
// Rival background activity: rivals collect cards from dungeon floors when player is also in dungeon
// This creates a genuine race feeling — rivals aren't static outside of battle
function updateRivalActivity(){
  if(sc!=='map'||!inDungeon)return;
  for(let ri=0;ri<2;ri++){
    if(rivalBgTimer[ri]>0){rivalBgTimer[ri]--;continue;}
    // Timer expired: rival collects a card from their current floor
    const rMap=rivalMaps[ri];
    if(rMap<=0){rivalBgTimer[ri]=3600;continue;} // rival in town, long wait
    const pool=DUNGEON_FLOOR_CARDS[rMap];
    if(!pool||pool.length===0){rivalBgTimer[ri]=1800;continue;}
    const cardId=pool[Math.floor(Math.random()*pool.length)];
    const cr=CD[cardId-1];
    const rName=pl[ri+1].n;
    const rivalHandCount=pl[ri+1].cd.filter(c=>c>0).length;
    // Only collect if they have room or swap
    if(rivalHandCount<5){
      addCardToPlayer(ri+1,cardId);
    }else{
      removeCardFromPlayer(ri+1,-1);
      addCardToPlayer(ri+1,cardId);
    }
    // Log this as a world event (with color hint in text)
    const floorName='Floor '+rMap;
    lg.push('['+rName+'] found '+cr.n+' on '+floorName+'! ('+RARITY_LABEL[cr.r]+')');
    // v73: Push to rival intel ticker for all finds
    const floorNums=['','I','II','III','IV','V'];
    rivalNewsQueue.push({
      text:rName+' seized '+cr.n+' on FLOOR '+(floorNums[rMap]||rMap),
      rivalIdx:ri,rarity:cr.r
    });
    // Show HUD hint for rare+ rival finds (keep existing fallback)
    if(cr.r>=4&&(!tutorialMsg||tutorialMsgTimer<40)){
      const rarLabel=RARITY_LABEL[cr.r]||'';
      tutorialMsg=rName+' found '+cr.n+'! ('+rarLabel+')';tutorialMsgTimer=140;
    }
    // Contextual commentary based on rival personality and situation
    const newCount=pl[ri+1].cd.filter(c=>c>0).length;
    if(newCount>=4){
      lg.push('[WARNING] '+rName+' is stacking cards. Intercept them!');
      if(!rivalWinWarningShown){sfxDangerAlert();}
      // v73: Danger alert in ticker
      rivalNewsQueue.push({text:'⚠ '+rName+' holds '+newCount+' cards — INTERCEPT!',rivalIdx:ri,rarity:5});
    }
    // Next background collection: 45-75 seconds (2700-4500 frames) — varies by personality
    const baseDelay=ri===0?2700:3600; // VEGA more aggressive/frequent
    rivalBgTimer[ri]=baseDelay+Math.floor(Math.random()*1800);
  }
}

function updateProximityTension(){
  let maxDanger=0;
  for(let i=0;i<2;i++){
    if(rivalMaps[i]!==currentMap)continue;
    const r=pl[i+1];
    const dist=Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y);
    let danger=1; // same map
    if(dist<=8)danger=2;
    if(dist<=5)danger=3;
    if(dist<=2)danger=4;
    if(danger>maxDanger)maxDanger=danger;
  }
  proximityDangerLevel=maxDanger;

  // Danger drone audio
  if(proximityDangerLevel>=3){
    startDangerDrone();
    if(dangerDroneGain){
      const targetVol=proximityDangerLevel===4?0.06:0.03;
      try{dangerDroneGain.gain.linearRampToValueAtTime(targetVol,AC.currentTime+0.1);}catch(e){}
    }
  }else{
    stopDangerDrone();
  }

  // "!" alert when rival first gets within 2 tiles
  if(proximityDangerLevel>=4&&!rivalDangerAlertShown){
    rivalDangerAlertShown=true;
    sfxDangerAlert();screenShake(2,4);
    lg.push('! Something is very close!');
  }
  if(proximityDangerLevel<4)rivalDangerAlertShown=false;

  // Proximity taunt: when danger >= 3 (within 5 tiles), rivals occasionally speak
  if(proximityDangerLevel>=3&&proximityTauntTimer<=0&&proximityTauntText===''){
    // Find the closest rival on this map
    let closestDist=999,closestRivalIdx=-1;
    for(let i=0;i<2;i++){
      if(rivalMaps[i]!==currentMap)continue;
      const r=pl[i+1];
      const dist=Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y);
      if(dist<closestDist){closestDist=dist;closestRivalIdx=i;}
    }
    if(closestRivalIdx>=0){
      const taunts=PROXIMITY_TAUNTS[closestRivalIdx];
      proximityTauntText=taunts[Math.floor(Math.random()*taunts.length)];
      proximityTauntRival=closestRivalIdx+1; // pl index 1 or 2
      proximityTauntFrame=fr;
      proximityTauntTimer=360; // 6s cooldown between taunts
    }
  }
  if(proximityTauntTimer>0)proximityTauntTimer--;
  if(proximityTauntText!==''&&fr-proximityTauntFrame>90)proximityTauntText=''; // 1.5s display
  if(proximityDangerLevel<3){proximityTauntText='';proximityTauntTimer=0;}
}

// NPC wander system — town NPCs slowly pace within 2 tiles of home
function updateNPCWander(){
  if(inDungeon||npcDialogActive||sc!=='map')return;
  const m=maps[0]; // town map only
  npcs.forEach(npc=>{
    if(npc.map!==0)return;
    // Smooth visual walk
    const dx=npc.x*TW-npc.visualX,dy=npc.y*TH-npc.visualY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>1){
      npc.visualX+=dx*0.15;npc.visualY+=dy*0.15;
      npc.walking=true;npc.walkFrame+=0.25;
    }else{
      npc.visualX=npc.x*TW;npc.visualY=npc.y*TH;npc.walking=false;
    }
    // Wander timer
    if(npc.moveTimer>0){npc.moveTimer--;return;}
    // Choose new position within wander radius of home
    const dirs=[[0,-1],[0,1],[-1,0],[1,0],[0,0],[0,0]]; // bias toward staying
    const d=dirs[Math.floor(Math.random()*dirs.length)];
    const nx=npc.x+d[0],ny=npc.y+d[1];
    // Must stay within 2 tiles of home, on walkable tile, not on player or other NPC
    const withinHome=Math.abs(nx-npc.homeX)<=2&&Math.abs(ny-npc.homeY)<=2;
    const walkable=WALKABLE.has(m[ny]?.[nx]);
    const onPlayer=(nx===pl[0].x&&ny===pl[0].y);
    const onNpc=npcs.some(o=>o!==npc&&o.x===nx&&o.y===ny);
    if(withinHome&&walkable&&!onPlayer&&!onNpc){
      // Face movement direction (dir: 0=down,1=left,2=up,3=right — matches player/rival convention)
      if(d[0]<0)npc.dir=1;
      else if(d[0]>0)npc.dir=3;
      else if(d[1]<0)npc.dir=2;
      else if(d[1]>0)npc.dir=0;
      npc.x=nx;npc.y=ny;
    }else if(d[0]===0&&d[1]===0){
      // Idle: occasionally turn to face a random direction
      if(Math.random()<0.4)npc.dir=Math.floor(Math.random()*4);
    }
    npc.moveTimer=180+Math.floor(Math.random()*300); // 3-8 seconds between moves
  });
  // v82: proximity ambient speech bubbles (2-3 tiles away, not adjacent — adjacent opens dialog/UI)
  if(!npcDialogActive&&currentMap===0&&!inDungeon){
    npcs.forEach(npc=>{
      if(npc.map!==0)return;
      if(npc.bubbleTimer>0){npc.bubbleTimer--;return;}
      if(npc.bubbleCooldown>0){npc.bubbleCooldown--;return;}
      const bdx=Math.abs(pl[0].x-npc.x),bdy=Math.abs(pl[0].y-npc.y);
      const dist=bdx+bdy;
      if(dist>=2&&dist<=3){
        const pool=getNPCAmbientLines(npc);
        if(pool.length>0){
          npc.bubbleText=pool[Math.floor(Math.random()*pool.length)];
          npc.bubbleTimer=170;
          npc.bubbleCooldown=500+Math.floor(Math.random()*300);
        }
      }
    });
  }
}

      vgr.addColorStop(0,'rgba(190,200,210,0)');

      _weatherCtx.fillStyle=vgr;_weatherCtx.fillRect(0,0,W,H);

    for(let i=0;i<22;i++){

      g.beginPath();g.arc(mx,my,ms,0,Math.PI*2);g.fill();
    }
    g.globalAlpha=1;
    g.restore();
  }
}

function drawDayNightOverlay(){
  // Dungeon atmosphere: pre-built per-floor canvas
  if(inDungeon){
    g.drawImage(_buildDungeonAtmosGrad(currentFloor),0,0);
    return;
  }
  const dn=getDayNightPhase();
  const townH=H-HUD_HEIGHT;
  // Atmosphere canvas: only redraw when camera moves or phase changes
  const camMoved=Math.abs(camX-_atmosLastCamX)>0.5||Math.abs(camY-_atmosLastCamY)>0.5;
  const phaseKey=dn.phase+Math.round(dn.t*8);
  if(_atmosDirty||camMoved||phaseKey!==_atmosLastPhase){
    atmosCtx.clearRect(0,0,W,H);
    // Lantern glow spots — cached to atmosCanvas
    if(currentMap===0){
      const lanternSpots=[
        {wx:8,wy:6,r:64,col:'255,200,80'},
        {wx:22,wy:6,r:56,col:'255,180,80'},
        {wx:14,wy:12,r:72,col:'255,160,60'},
        {wx:18,wy:18,r:60,col:'200,220,255'},
        {wx:26,wy:14,r:52,col:'255,200,100'},
      ];
      let lanternAlpha=0;
      if(dn.phase==='dusk')lanternAlpha=dn.t*0.18;
      else if(dn.phase==='night')lanternAlpha=0.20;
      else if(dn.phase==='dawn')lanternAlpha=(1-dn.t)*0.14;
      if(lanternAlpha>0){
        for(const ls of lanternSpots){
          const sx=ls.wx*TW-camX+TW/2,sy=ls.wy*TH-camY+TH/2;
          if(sx<-ls.r||sx>W+ls.r||sy<-ls.r||sy>townH+ls.r)continue;
          if(!fogRevealed[0]?.[ls.wy]?.[ls.wx])continue;
          const lg2=atmosCtx.createRadialGradient(sx,sy,0,sx,sy,ls.r);
          lg2.addColorStop(0,`rgba(${ls.col},${lanternAlpha})`);
          lg2.addColorStop(0.5,`rgba(${ls.col},${lanternAlpha*0.4})`);
          lg2.addColorStop(1,'rgba(0,0,0,0)');
          atmosCtx.fillStyle=lg2;atmosCtx.fillRect(Math.max(0,sx-ls.r),Math.max(0,sy-ls.r),ls.r*2,Math.min(townH,ls.r*2));
        }
      }
    }
    // v213: Phase sky gradients — richer horizon glow for dawn/dusk, tinted night
    if(dn.phase==='dawn'){
      // Warm amber horizon glow rising from bottom-center
      const da=0.08+dn.t*0.06;
      atmosCtx.fillStyle=`rgba(255,160,60,${da*0.6})`;atmosCtx.fillRect(0,0,W,townH);
      const dhg=atmosCtx.createLinearGradient(0,townH,0,0);
      dhg.addColorStop(0,`rgba(255,220,80,${da*0.55})`);
      dhg.addColorStop(0.25,`rgba(255,140,60,${da*0.25})`);
      dhg.addColorStop(0.55,'rgba(0,0,0,0)');
      atmosCtx.fillStyle=dhg;atmosCtx.fillRect(0,0,W,townH);
      // Subtle top-sky blue-violet tint
      const dth=atmosCtx.createLinearGradient(0,0,0,townH*0.5);
      dth.addColorStop(0,`rgba(40,30,80,${da*0.3})`);dth.addColorStop(1,'rgba(0,0,0,0)');
      atmosCtx.fillStyle=dth;atmosCtx.fillRect(0,0,W,townH*0.5);
    }else if(dn.phase==='dusk'){
      // Deep crimson-orange horizon + purple-blue sky above
      const dk=0.10+dn.t*0.10;
      const hg=atmosCtx.createLinearGradient(0,townH,0,0);
      hg.addColorStop(0,`rgba(240,80,20,${dk*0.85})`);
      hg.addColorStop(0.2,`rgba(220,60,30,${dk*0.5})`);
      hg.addColorStop(0.45,`rgba(160,40,60,${dk*0.25})`);
      hg.addColorStop(0.65,'rgba(0,0,0,0)');
      atmosCtx.fillStyle=hg;atmosCtx.fillRect(0,0,W,townH);
      // Top-sky darkening to violet-blue
      const tk=atmosCtx.createLinearGradient(0,0,0,townH*0.6);
      tk.addColorStop(0,`rgba(20,10,60,${dk*0.55})`);tk.addColorStop(1,'rgba(0,0,0,0)');
      atmosCtx.fillStyle=tk;atmosCtx.fillRect(0,0,W,townH*0.6);
    }else if(dn.phase==='night'){
      atmosCtx.fillStyle=`rgba(10,12,60,${0.22+dn.t*0.06})`;atmosCtx.fillRect(0,0,W,townH);
      if(currentMap===0){
        const townCX=15*TW-camX,townCY=12*TH-camY;
        const gc=atmosCtx.createRadialGradient(townCX,townCY,30,townCX,townCY,350);
        gc.addColorStop(0,'rgba(255,140,40,0.06)');gc.addColorStop(1,'rgba(0,0,0,0)');
        atmosCtx.fillStyle=gc;atmosCtx.fillRect(0,0,W,townH);
      }
    }else if(dn.phase==='day'){
      atmosCtx.fillStyle='rgba(255,250,220,0.04)';atmosCtx.fillRect(0,0,W,townH);
    }
    _atmosLastCamX=camX;_atmosLastCamY=camY;_atmosLastPhase=phaseKey;_atmosDirty=false;
  }
  g.drawImage(atmosCanvas,0,0,W,H);
  // Static overworld vignette blit (pre-built once)
  g.drawImage(_buildOverworldVig(),0,0);
}

let cardGetAnimTimer=0,cardGetAnimX=0,cardGetAnimY=0;

const statusSparkles=[];
function triggerCardGetAnim(px,py){cardGetAnimTimer=40;cardGetAnimX=px;cardGetAnimY=py;}
function triggerCardLostAnim(px,py){cardLostAnimTimer=40;cardLostAnimX=px;cardLostAnimY=py;for(let i=0;i<8;i++){particles.push({x:px+16,y:py+12,vx:(Math.random()-.5)*3,vy:-Math.random()*2-0.5,life:15+Math.random()*10,c:Math.random()>.3?'#d04040':'#ff6060'});}}
function triggerCardGetBurst(px,py,col){const cnt=12;for(let i=0;i<cnt;i++){const ang=(i/cnt)*Math.PI*2+Math.random()*0.4;const spd=1.8+Math.random()*2.8;particles.push({x:px,y:py,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,life:18+Math.random()*14,c:Math.random()>.35?col||'#f0c030':'#ffffff'});}}
function drawPlayerStatusEffects(){
  const p=pl[0];
  const px=p.visualX-camX,py=p.visualY-camY-16;
  if(px<-60||px>W+60||py<-60||py>H+60)return;

  // EXHAUSTED indicator
  if(sp.s<=0&&sp.b<=0&&sp.c<=0){
    const flicker=Math.sin(fr*0.2)*0.2+0.8;
    g.globalAlpha=flicker;
    txShadow('EXHAUSTED',px-32,py-16,5,'#d04040','rgba(0,0,0,.4)');
    g.globalAlpha=1;
  }

  // Sparkle particles when player has 4+ cards
  const cardCount=pl[0].cd.filter(c=>c>0).length;
  if(cardCount>=4){
    if(fr%6===0){
      statusSparkles.push({
        x:px+6+Math.random()*20,y:py+4+Math.random()*28,
        vx:(Math.random()-0.5)*0.6,vy:-0.5-Math.random()*0.4,
        life:18+Math.random()*10
      });
    }
    for(let i=statusSparkles.length-1;i>=0;i--){
      const s=statusSparkles[i];
      s.x+=s.vx;s.y+=s.vy;s.life--;
      if(s.life<=0){statusSparkles.splice(i,1);continue;}
      const sa=Math.min(1,s.life/8);
      g.globalAlpha=sa;
      const sc_=Math.floor(fr*0.3+i)%2===0?'#f0e860':'#fff';
      bx(s.x,s.y,2,2,sc_);
      g.globalAlpha=1;
    }
  }else{
    statusSparkles.length=0;
  }

  // "+" floating up animation after getting a card
  if(cardGetAnimTimer>0){
    const progress=1-cardGetAnimTimer/40;
    const floatY=cardGetAnimY-progress*24;
    g.globalAlpha=1-progress;
    txShadow('+',cardGetAnimX+8,floatY,8,'#40d040','rgba(0,0,0,.35)');
    g.globalAlpha=1;
    cardGetAnimTimer--;
  }
  if(cardLostAnimTimer>0){
    const progress=1-cardLostAnimTimer/40;
    const floatY=cardLostAnimY+progress*16;
    g.globalAlpha=1-progress;
    txShadow('-',cardLostAnimX+8,floatY,8,'#d04040','rgba(0,0,0,.35)');
    g.globalAlpha=1;
    cardLostAnimTimer--;
  }

  // v87: World-space player status bubble in dungeon
  if(inDungeon){
    const hc=pl[0].cd.filter(c=>c>0).length;
    // Find most critical decay
    let minRemaining=Infinity;
    for(let i=0;i<HAND_SIZE;i++){
      if(pl[0].cd[i]>0&&cardTimers[i]>0){
        const rem=CARD_DECAY_MS-(Date.now()-cardTimers[i]);
        if(rem<minRemaining)minRemaining=rem;
      }
    }
    const hasCritical=minRemaining<60000&&minRemaining>0;
    const isUrgent=minRemaining<20000&&minRemaining>0;
    const bubbleAlpha=isUrgent?(0.7+Math.sin(fr*0.3)*0.3):hasCritical?0.65:0.45;
    const bubbleCol=isUrgent?'#ff4040':hasCritical?'#e08030':'#506880';
    const cardStr='\u2660'+hc;
    const decStr=hasCritical?(' '+Math.ceil(minRemaining/1000)+'s'):'';
    const fullStr=cardStr+decStr;
    const bW=fullStr.length*5+12;
    const bX=px+16-bW/2,bY=py-36;
    g.globalAlpha=bubbleAlpha;
    bx(bX,bY,bW,13,'rgba(4,4,14,.88)');
    bx(bX,bY,bW,1,bubbleCol);
    txShadow(fullStr,bX+4,bY+11,5,isUrgent?'#ff8080':hasCritical?'#e8b060':'#90b0c0','rgba(0,0,0,.4)');
    g.globalAlpha=1;
  }
}

function gachaPickCard(tierIdx){
  const t=GACHA_TIERS[tierIdx];
  let r;
  // Pity system: guarantee rare (3+) after GACHA_PITY_THRESHOLD non-rare pulls
  const forcePity=gachaPityCount>=GACHA_PITY_THRESHOLD;
  if(forcePity){
    // Force rare+ from tier's available rarities
    const rareRarities=t.rarities.filter(rr=>rr>=3);
    r=rareRarities.length>0?rareRarities[Math.floor(Math.random()*rareRarities.length)]:t.rarities[t.rarities.length-1];
    gachaPityCount=0;gachaPityTriggered=true;
  }else{
    r=t.rarities[Math.floor(Math.random()*t.rarities.length)];
    gachaPityTriggered=false;
    if(r>=3)gachaPityCount=0; else gachaPityCount++;
  }
  const pool=CD.map((_,i)=>i+1).filter(id=>CD[id-1].r===r);
  if(pool.length===0)return 1+Math.floor(Math.random()*60);
  // Prefer cards player hasn't collected yet (vault-new)
  const vault_g=pl[0].vault||new Set();
  const newPool_g=pool.filter(id=>!vault_g.has(id));
  const usePool_g=newPool_g.length>0?newPool_g:pool;
  return usePool_g[Math.floor(Math.random()*usePool_g.length)];
}

async function x402PushState(){
  if(!x402Available)return;
  try{
    // Build 60-slot card arrays: player uses vault (full unique set), rivals use cd array
    const buildPlayerCards=(p,i)=>{
      if(i===0){
        // Player: vault is a Set of unique card IDs collected; expand to 60-slot array
        const arr=new Array(60).fill(0);
        if(p.vault instanceof Set){
          let slot=0;
          for(const cid of p.vault){if(cid>0&&cid<=60&&slot<60)arr[slot++]=cid;}
        } else {
          // fallback: use cd array
          for(let s=0;s<Math.min(p.cd.length,60);s++)arr[s]=p.cd[s]||0;
        }
        return arr;
      } else {
        // Rivals: cd is their hand (5 slots), pad to 60

function drawGrass(px,py,tx_,ty){
  // Dungeon floor — FRLG-style clean pixel art
  if(currentMap>0){
    const h=tileHash(tx_,ty);
    const depth=currentMap;
    const pal=DFLOOR[Math.min(depth,5)];
    // Base tile color with 4-way variation
    const bv=h&3;
    const baseC=bv===0?pal.l:bv===1?pal.d:bv===2?pal.b:pal.b;
    bx(px,py,TW,TH,baseC);
    // FRLG tile grid seams (right + bottom dark line, top+left light)
    bx(px,py,TW,1,'rgba(255,255,255,0.05)');
    bx(px,py,1,TH,'rgba(255,255,255,0.04)');
    bx(px+TW-2,py,2,TH,'rgba(0,0,0,0.20)');
    bx(px,py+TH-2,TW,2,'rgba(0,0,0,0.20)');
    // Crack detail (sparse, pixel art style)
    if((h&15)===0){
      const cx=3+((h>>4)&7)*3,cy=4+((h>>8)&7)*2;
      bx(px+cx,py+cy,5,1,pal.c);bx(px+cx+1,py+cy+1,3,1,pal.c);
    }
    if((h&23)===7){
      const vx=10+((h>>5)&5)*2,vy=6+((h>>9)&5)*2;
      bx(px+vx,py+vy,1,6,pal.c);
    }
    // Small highlight pebble (1-in-32 tiles)
    if((h&31)===5){bx(px+((h>>12)&12)+4,py+((h>>16)&12)+4,3,2,pal.l);bx(px+((h>>12)&12)+5,py+((h>>16)&12)+4,1,1,'rgba(255,255,255,0.25)');}
    // v213: North-wall shadow — darker strip at top of floor tiles directly south of a wall
    {const m_=getMap();const northT=m_[ty-1]?.[tx_];
    if(northT===18){// tile 18 = dungeon wall
      bx(px,py,TW,4,'rgba(0,0,0,0.38)');
      bx(px,py+4,TW,2,'rgba(0,0,0,0.18)');
      bx(px,py+6,TW,1,'rgba(0,0,0,0.07)');
    }}
    return;
  }
  // Overworld: zelda grass tile — unified art style
  const h=tileHash(tx_,ty);

function _parseHex(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return[r,g,b];}
function lighten(hex,amt){const[r,g,b]=_parseHex(hex);return`rgb(${Math.min(255,r+amt*255|0)},${Math.min(255,g+amt*255|0)},${Math.min(255,b+amt*255|0)})`;}
function darken(hex,amt){const[r,g,b]=_parseHex(hex);return`rgb(${Math.max(0,r-amt*255|0)},${Math.max(0,g-amt*255|0)},${Math.max(0,b-amt*255|0)})`;}

    }

    }
  }
  bx(px,py+2,TW,11,roofColor);bx(px+2,py+4,28,7,roofHighlight||lighten(roofColor,.15));
  bx(px,py+12,TW,2,darken(roofColor,.15));
  for(let rx=0;rx<TW;rx+=4){bx(px+rx,py+3,2,1,darken(roofColor,.1));bx(px+rx+2,py+6,2,1,darken(roofColor,.08));bx(px+rx,py+9,2,1,darken(roofColor,.06));}
  bx(px+10,py+18,12,14,'#483838');bx(px+12,py+20,8,12,'#382828');
  bx(px+18,py+24,2,2,'#d8c030');
  bx(px+10,py+TH-1,12,1,'#a06030');
  bx(px+10,py+18,12,2,'#584848');
  bx(px+2,py+16,7,7,'#90d8f0');bx(px+3,py+16,5,7,'#a8e0f8');
  bx(px+3,py+16,2,2,'#c8f0ff');
  bx(px+23,py+16,7,7,'#90d8f0');bx(px+24,py+16,5,7,'#a8e0f8');
  bx(px+24,py+16,2,2,'#c8f0ff');
  bx(px+2,py+19,7,1,'#686078');bx(px+23,py+19,7,1,'#686078');
  bx(px+5,py+16,1,7,'#686078');bx(px+26,py+16,1,7,'#686078');
  const r=tr(tx_,ty);
  if(r.a>.35){
    bx(px+24,py-2,5,6,'#805040');bx(px+25,py-1,3,4,'#906050');
    bx(px+24,py+4,5,2,'#705040');
    // v215: Chimney smoke — rising puff particles with wind drift
    {const csx=px+26,csy=py-2;
    const windX=Math.sin(fr*0.007+tx_)*1.2;
    for(let p=0;p<5;p++){
      const phase=(fr+p*11+tx_*7)%55;
      if(phase>53)continue;
      const prog=phase/53;
      const sx_=csx+windX*prog*14;
      const sy_=csy-prog*38;
      const sz=1+prog*5;
      const sa=0.38*(1-prog)*(0.7+0.3*Math.sin(fr*0.12+p));
      if(sa<0.02)continue;
      g.globalAlpha=sa;
      bx(sx_-sz*.5|0,sy_-sz*.5|0,sz|0,sz|0,p%2===0?'rgba(210,205,220,1)':'rgba(195,190,208,1)');
    }
    g.globalAlpha=1;}
  }
}

function drawMountain(px,py,tx_,ty){
  // Dungeon walls — FRLG-style solid rock: dark, consistent, pixel-art
  if(currentMap>0){
    const h=tileHash(tx_,ty);
    const depth=currentMap;
    const pal=DWALL[Math.min(depth,5)];
    // Base rock body
    bx(px,py,TW,TH,pal.s);
    bx(px,py,TW,TH-4,pal.b);
    // Upper highlight band (FRLG rock top-face illusion)
    bx(px,py,TW,6,pal.m);
    bx(px,py,TW,2,pal.t);
    // Vertical crack lines — pixel art rock texture
    const crX1=5+((h>>3)&11);
    bx(px+crX1,py+4,1,TH-6,pal.s);
    bx(px+crX1+1,py+4,1,TH-6,pal.m);
    if((h&7)<4){
      const crX2=16+((h>>6)&11);
      bx(px+crX2,py+8,1,TH-12,pal.s);
      bx(px+crX2+1,py+8,1,TH-12,pal.m);
    }
    // Horizontal fracture band
    const frY=7+((h>>8)&13);
    bx(px,py+frY,TW,1,pal.s);
    bx(px,py+frY+1,TW,1,pal.t);
    // Secondary fracture (deeper floors)
    if(depth>=3&&(h&5)===0){
      const frY2=frY+10+((h>>12)&7);
      if(frY2<TH-2){bx(px,py+frY2,TW,1,pal.s);bx(px,py+frY2+1,TW,1,pal.m);}
    }
    // Left/right shadow edges
    bx(px,py,1,TH,'rgba(0,0,0,0.35)');
    bx(px+TW-1,py,1,TH,'rgba(0,0,0,0.25)');
    bx(px+TW-2,py,1,TH,'rgba(0,0,0,0.12)');
    return;
  }
  // Zelda cliff tile
  if(drawZeldaOverTile(ZO.cliff[0],ZO.cliff[1],px,py,2)){
    if(ty<=3){bx(px+6,py,20,5,'#c8c8d0');bx(px+10,py,12,2,'#e0e0e8');}

  // Fallback: solid gray cliff
  bx(px,py,TW,TH,'#7a7888');
  if(ty<=3){bx(px+6,py,20,5,'#c8c8d0');bx(px+10,py,12,2,'#e0e0e8');}
}

// Animated stair glow overlays — drawn every frame OVER the tile cache (not inside it)
// Called from dMap() after tile cache drawImage
function drawDungeonStairGlows(startTX,startTY,endTX,endTY){
  const m=getMap();
  for(let y=startTY;y<=endTY;y++){
    for(let x=startTX;x<=endTX;x++){
      const t=m[y]?.[x];
      if(t!==31&&t!==32)continue;
      if(!fogRevealed[currentMap]?.[y]?.[x])continue;
      const px=x*TW-camX,py=y*TH-camY;
      if(px<-TW||px>W||py<-TH||py>H)continue;
      if(t===31){
        // Down staircase glow
        const pulse=Math.sin(fr*.07+x*2+y*3)*.25+.75;
        const glowA=currentMap>=5?`rgba(220,160,0,${pulse*.5})`:`rgba(80,40,180,${pulse*.45})`;
        const glowB=currentMap>=5?`rgba(255,220,40,${pulse*.3})`:`rgba(140,80,255,${pulse*.25})`;
        const arrowCol=currentMap>=5?`rgba(255,240,80,${pulse*.9})`:`rgba(200,160,255,${pulse*.8})`;
        g.fillStyle=glowA;g.beginPath();g.ellipse(px+16,py+24,7,4,0,0,Math.PI*2);g.fill();
        g.fillStyle=glowB;g.beginPath();g.ellipse(px+16,py+24,11,6,0,0,Math.PI*2);g.fill();
        g.fillStyle=arrowCol;
        g.beginPath();g.moveTo(px+16,py+26);g.lineTo(px+12,py+20);g.lineTo(px+20,py+20);g.closePath();g.fill();
      }else{
        // Up staircase glow
        const pulse=Math.sin(fr*.06+x*3+y*2)*.2+.8;
        g.fillStyle=`rgba(40,120,200,${pulse*.4})`;
        g.beginPath();g.ellipse(px+16,py+8,7,4,0,0,Math.PI*2);g.fill();
        g.fillStyle=`rgba(80,180,255,${pulse*.2})`;
        g.beginPath();g.ellipse(px+16,py+8,11,6,0,0,Math.PI*2);g.fill();
        g.fillStyle=`rgba(140,220,255,${pulse*.8})`;
        g.beginPath();g.moveTo(px+16,py+6);g.lineTo(px+12,py+12);g.lineTo(px+20,py+12);g.closePath();g.fill();
      }
    }
  }
}

// Animated dungeon decor overlays — glow tile, crystal sparkles, altar orb, campfire light
// Drawn every frame on main canvas (bypass static tile cache)
function drawDungeonAnimatedOverlays(startTX,startTY,endTX,endTY){
  if(!inDungeon)return;
  const m=getMap();
  for(let y=startTY;y<=endTY;y++){
    for(let x=startTX;x<=endTX;x++){
      const t=m[y]?.[x];
      if(t!==24&&t!==26&&t!==27&&t!==29&&t!==25)continue;
      if(!fogRevealed[currentMap]?.[y]?.[x])continue;
      const px=x*TW-camX,py=y*TH-camY;
      if(px<-TW*2||px>W+TW*2||py<-TH*2||py>H+TH*2)continue;
      if(t===29){
        // v211: Campfire — warm light pool on floor (large radial glow, flickering)
        const flick=0.55+Math.sin(fr*0.12+x*2.3+y*1.7)*0.28+Math.sin(fr*0.21+x+y*3)*0.1;
        const cx_=px+TW/2,cy_=py+TH*0.7,r=52+Math.sin(fr*0.08+x+y)*6;
        const grd=g.createRadialGradient(cx_,cy_,4,cx_,cy_,r);
        grd.addColorStop(0,`rgba(255,180,60,${(0.32*flick).toFixed(3)})`);
        grd.addColorStop(0.4,`rgba(220,120,30,${(0.18*flick).toFixed(3)})`);
        grd.addColorStop(1,'rgba(180,60,0,0)');
        g.fillStyle=grd;g.fillRect(cx_-r,cy_-r,r*2,r*2);
        continue;
      }
      if(t===25){
        // v211: Lava — eerie red-orange upward glow
        const lavaPulse=0.4+Math.sin(fr*0.06+x*1.8+y*2.1)*0.18;
        const lx_=px+TW/2,ly_=py+TH/2,lr=40;
        const lgrd=g.createRadialGradient(lx_,ly_,0,lx_,ly_,lr);
        lgrd.addColorStop(0,`rgba(255,100,20,${(lavaPulse*0.3).toFixed(3)})`);
        lgrd.addColorStop(1,'rgba(200,40,0,0)');
        g.fillStyle=lgrd;g.fillRect(lx_-lr,ly_-lr,lr*2,lr*2);
        continue;
      }
      if(t===24){
        // Glow tile: pulsing teal halo
        const pulse=Math.sin(fr*.06+x*2+y*3)*.35+.55;
        g.fillStyle=`rgba(40,200,160,${pulse*.22})`;
        g.beginPath();g.arc(px+TW/2,py+TH/2,15,0,Math.PI*2);g.fill();
      }else if(t===26){
        // Crystal: sparkle glint + glow halo
        const sparkle=Math.sin(fr*.1+x*5+y*7)>.45;
        if(sparkle){bx(px+15,py+8,3,2,'#fff');bx(px+10,py+15,2,2,'rgba(255,255,255,.8)');}
        g.fillStyle=`rgba(30,140,200,${.16+Math.sin(fr*.05+x+y)*.09})`;
        g.beginPath();g.arc(px+16,py+16,11,0,Math.PI*2);g.fill();
      }else if(t===27){
        // Altar: floating brass orb + pulse glow
        const pulse=Math.sin(fr*.04)*.3+.5;
        const orbY=py+4+Math.sin(fr*.05)*3;
        g.fillStyle=`rgba(200,164,72,${pulse*.65})`;
        g.beginPath();g.arc(px+16,orbY,5,0,Math.PI*2);g.fill();
        g.fillStyle=`rgba(240,200,80,${pulse*.22})`;
        g.beginPath();g.arc(px+16,orbY,10,0,Math.PI*2);g.fill();
        bx(px+10,py+12,12,3,`rgba(200,164,72,${pulse*.42})`);
        bx(px+8,py+22,4,2,`rgba(200,164,72,${pulse*.35})`);
        bx(px+20,py+22,4,2,`rgba(200,164,72,${pulse*.35})`);
        bx(px+14,py+24,4,1,`rgba(200,164,72,${pulse*.25})`);
      }
    }
  }
}

// v215: Town animated overlays — water sparkles + wave glints drawn each frame on main canvas
function drawTownAnimatedOverlays(startTX,startTY,endTX,endTY){
  if(inDungeon)return;
  const m=getMap();
  for(let y=startTY;y<=endTY;y++){
    for(let x=startTX;x<=endTX;x++){
      const t=m[y]?.[x];
      if(t!==0)continue; // only water (tile 0)
      const px=x*TW-camX,py=y*TH-camY;
      if(px<-TW||px>W+TW||py<-TH||py>H+TH)continue;
      // Wave shimmer strips — horizontal glints that sweep across tile
      const wavePhase=((fr*0.018+x*0.6+y*0.4))%(1);
      if(wavePhase<0.18){
        const wp=wavePhase/0.18;
        const wy=py+4+Math.floor(TH*0.3*wp);
        const wa=(Math.sin(wp*Math.PI)*0.22).toFixed(3);
        bx(px+2,wy,TW-4,1,`rgba(255,255,255,${wa})`);
      }
      // Sparkle glints: pseudo-random positions per tile+time
      const sphase=(fr*0.04+x*13+y*7);
      if((sphase|0)%11===0){
        const sx=px+((x*37+y*61+fr)%24)+4;
        const sy=py+((x*19+y*43+fr)%20)+4;
        const sa=0.35+0.25*Math.sin(fr*0.1+x+y);
        g.globalAlpha=sa;
        bx(sx,sy,2,1,'#c8e8ff');bx(sx,sy,1,2,'#c8e8ff');
        g.globalAlpha=1;
      }
    }
  }
  // v218: Ambient seabirds — 5 birds drift across the sky in screen space
  // Simple V-shape silhouettes: two 2px diagonal strokes from center
  {
    const BIRD_COUNT=5;
    const visH=H-72; // above HUD
    for(let bi=0;bi<BIRD_COUNT;bi++){
      const seed=bi*1637;
      // Each bird drifts at slightly different speed and altitude
      const speed=0.35+((seed*73)%100)/200;  // 0.35 – 0.85 px/frame
      const bx_=((seed*457+fr*speed)%(W+120))-60; // wraps left to right
      const by_=24+(seed%4)*22+Math.sin(fr*0.03+bi*1.1)*5;
      if(bx_<-8||bx_>W+4||by_<0||by_>visH*0.55)continue;
      // Wing flap: alternates between V-open and V-closed
      const flapPhase=Math.floor(fr*0.12+bi*2.3)%2;
      const wingY=flapPhase===0?-2:0; // wings up or neutral
      g.globalAlpha=0.38;
      g.fillStyle='#181828';
      // Left wing: 3 pixels diagonal up-left
      g.fillRect(bx_|0,(by_+wingY)|0,2,1);
      g.fillRect((bx_-2)|0,(by_+wingY-1)|0,2,1);
      // Right wing: 3 pixels diagonal up-right
      g.fillRect((bx_+2)|0,(by_+wingY)|0,2,1);
      g.fillRect((bx_+4)|0,(by_+wingY-1)|0,2,1);
      g.globalAlpha=1;
    }
  }
}

// Character identity palette
// pl[0] Protagonist: navy maritime coat + brass trim, dark hair
// pl[1] Vega rival:  deep crimson coat, auburn hair
// pl[2] Mira rival:  dark jade coat, silver-white hair
function drawSprite(p,isPlayer){
  const px=p.visualX-camX,py=p.visualY-camY-16;
  if(px<-48||px>W+48||py<-56||py>H+56)return;
  const wf=p.walkFrame%4;
  const bob=(wf===1||wf===3)?2:0;
  const d=p.dir;
  const isP0=p===pl[0],isP1=p===pl[1],isP2=p===pl[2];

  // Shadow
  g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.ellipse(px+16,py+46,12,4,0,0,Math.PI*2);g.fill();

  // Walk animation: frame 0=neutral, 1=left-stride, 2=neutral, 3=right-stride
  const zFrame=[1,0,1,2][wf];
  // Direction: 0=down, 1=left, 2=right, 3=up
  const zDir=[0,1,2,3][d]||0;
  const charIdx=isP0?0:isP1?1:2;

  // === ZELDA-LIKE CHARACTER SPRITES (best quality) ===
  if(zeldaCharLoaded){
    const glowC=isP0?'rgba(40,88,200,.18)':isP1?'rgba(200,32,40,.18)':'rgba(40,180,160,.18)';
    g.fillStyle=glowC;g.beginPath();g.ellipse(px+16,py+24+bob,18,24,0,0,Math.PI*2);g.fill();
    // Zelda sprites are 16x16 drawn at 2x = 32x32
    drawZeldaChar(charIdx,zDir,zFrame,px,py+bob,2);
    // CC badge
    if(isPlayer){
      const bx_=px+28,by_=py-10;win(bx_,by_,28,18);txShadow(p.cc+'',bx_+9,by_+15,8,'#c8b888','rgba(0,0,0,.4)');
    }else if(isVisibleThroughFog(p.x,p.y,3)){
      bx(px+28,py-8,22,16,'rgba(0,0,0,.4)');win(px+28,py-10,22,16);txShadow(p.cc+'',px+34,py+4,7,'#c8b888','rgba(0,0,0,.4)');
    }
    return;
  }

  // === KENNEY SPRITE PATH (fallback) ===
  if(pirateSheetLoaded){
    const kChar=isP0?K.captain:(isP1?K.pirate2:K.pirate3);
    // Glow aura behind sprite
    const glowC=isP0?'rgba(40,88,200,.18)':isP1?'rgba(200,32,40,.18)':'rgba(40,180,160,.18)';
    g.fillStyle=glowC;g.beginPath();g.ellipse(px+16,py+24+bob,18,24,0,0,Math.PI*2);g.fill();
    // Draw sprite: flip horizontally for d===1 (facing left)
    if(d===1){
      g.save();g.translate(px+32,py+bob);g.scale(-1,1);

    }

  // --- OUTFIT PALETTE ---

// Advance one dungeon turn: each rival takes one step
function processDungeonTurn(){
  if(!inDungeon)return;
  if(encounterCooldown>0)return; // let game loop decrement
  dungeonTurnStep(0);
  dungeonTurnStep(1);
  // Immediately check if any rival landed adjacent — fire encounter without waiting for next frame
  checkDungeonRivalEncounter();
}

// Check if a rival just stepped adjacent to the player; trigger encounter if so
// (mirrors the encounter check in the game loop but called explicitly after each turn)
function checkDungeonRivalEncounter(){
  if(!inDungeon||encounterCooldown>0||encounterExclActive||wildEncounterActive||mapTransitioning||mo||shadowStepsLeft>0)return;
  pl.slice(1).forEach((r,idx)=>{
    if(rivalMaps[idx]!==currentMap)return;
    if(encounterCooldown>0||encounterExclActive)return;
    const adjDist=Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y);
    if(adjDist===1){
      // Trigger encounter — set cooldown so game-loop check doesn't double-fire
      encounterCooldown=120;
      const ai=rivalAI[idx];
      // Dungeon encounters always battle — no collector flee
      encounterExclActive=true;encounterExclFrame=fr;
      encounterExclTarget=idx+1;
      encounterExclPlayerX=pl[0].visualX;encounterExclPlayerY=pl[0].visualY;
      encounterExclRivalX=r.visualX;encounterExclRivalY=r.visualY;
      sfxEncounterDramatic();hitPause(4);
      const rCards=r.cd.filter(c=>c>0).length;
      const isHunting=ai.state==='hunting';
      const vegaLines=['Hand over the cards. Now.','The ARK\'s legacy is mine.','No walls stop a hunter.','Cornered. Just like the crew.','Nowhere left to run.'];
      const miraLines=['Precisely where my model predicted.','Your card count fell below threshold. Engaging.','The calculation is complete.','The ARK crew fell to logic. So will you.'];
      encounterRivalLine=idx===0?vegaLines[Math.floor(Math.random()*vegaLines.length)]:miraLines[Math.floor(Math.random()*miraLines.length)];
      setTimeout(()=>{
        encounterExclActive=false;flash();
        twSet(isHunting?r.n+' ambushed you! Battle!':r.n+' appeared! Battle!');
        startWipe('mosaic',30,()=>{
          sc='act';battlePhase='vs_splash';bpFrame=fr;
          battleRoundHistory=[];
          bpHP=[BATTLE_HP_MAX,BATTLE_HP_MAX,BATTLE_HP_MAX];bpHPDmgAnim=[0,0,0];
          startWipe('mosaic_out',20);
          if(runMission&&runMission.type==='battle_rival'&&!runMission.completed){runMission.progress=1;runMission.completed=true;sfxStreakUp();}
        });
      },500);
    }
  });
}

// Place floor items in dungeon rooms (called on fresh dungeon generation)
function placeFloorItems(mapIdx,rooms){
  if(!rooms||rooms.length===0)return;
  floorItems[mapIdx]=[];
  const pool=AREA_CARDS[mapIdx]||AREA_CARDS[1]||[];
  if(pool.length===0)return;
  // Skip the first room (entrance area) and last room (near stairs)
  const eligible=rooms.slice(1,rooms.length-1);
  if(eligible.length===0)eligible.push(rooms[Math.floor(rooms.length/2)]);
  // Place 1-2 items per eligible room
  for(const r of eligible){
    const count=1+(mapIdx>=4?1:0); // deeper floors: more items
    for(let i=0;i<count&&i<2;i++){
      const ix=r.x+1+Math.floor(Math.random()*(r.w-2));
      const iy=r.y+1+Math.floor(Math.random()*(r.h-2));
      // Pick card from pool, biased toward rarer on deeper floors
      const cardId=pool[Math.floor(Math.random()*pool.length)];
      floorItems[mapIdx].push({x:ix,y:iy,cardId,glow:Math.random()*Math.PI*2});
    }
  }
}

// Check if player stepped on a floor item, auto-pick it up
function checkFloorItemPickup(nx,ny){
  const items=floorItems[currentMap];
  if(!items||items.length===0)return;
  const idx=items.findIndex(it=>it.x===nx&&it.y===ny);
  if(idx===-1)return;
  const it=items.splice(idx,1)[0];
  const cr=CD[it.cardId-1];if(!cr)return;
  // Add to player hand/vault
  const placed=addCardToPlayer(0,it.cardId);
  triggerCardGetBurst(nx*TW+TW/2,ny*TH+TH/2,cr.c||'#f0c030');
  hitPause(4);
  sfxCardGet();
  startCardAcquisition(it.cardId);
  checkWinAndTransition(1500);
  lg.push('Found '+cr.n+' on the floor!');
}

function checkExitTile(x,y){
  for(const ex of exits){
    if(ex.fromMap!==currentMap)continue;
    for(const [etx,ety] of ex.tiles){
      if(x===etx&&y===ety)return ex;
    }
  }
  return null;
}

function doMapTransition(exit){
  if(mapTransitioning)return;
  mapTransitioning=true;
  sfxDoorOpen();sfxMapChange();sfxAreaEntry();
  const targetMapName=mapNames[exit.targetMap];
  const targetCardDesc=AREA_CARD_DESC[exit.targetMap];
  fadeOut(()=>{
    currentMap=exit.targetMap;
    // Update dungeon state
    inDungeon=(currentMap>0);
    currentFloor=inDungeon?currentMap:0;
    pl[0].x=exit.targetX;
    pl[0].y=exit.targetY;
    pl[0].visualX=exit.targetX*TW;
    pl[0].visualY=exit.targetY*TH;
    // Snap camera
    camX=pl[0].visualX-W/2;camY=pl[0].visualY-H/2;
    camTargetX=camX;camTargetY=camY;
    tileCacheDirty=true;edgeCacheDirty=true;fogCacheDirty=true;
    particles.length=0;
    // Reveal starting area on new map (larger radius so entry area is immediately visible)
    if(inDungeon){fogRevealRadius(currentMap,pl[0].x,pl[0].y,4);fogSave();}
    else{fogRevealAll(currentMap);fogSave();}
    // When entering floor 1 from town, spread rivals to safe starting positions far from entrance.
    // This prevents immediate encounters caused by AI roaming during town/title time.
    if(exit.fromMap===0&&exit.targetMap===1){
      // v155: Regenerate all dungeon floors fresh every run (PMD-style: new dungeon each run)
      const runSeed=Date.now();
      dungeonSeedThisRun=runSeed;
      for(let f=1;f<=MAX_DUNGEON_FLOORS;f++){
        const result=generateDungeonFloor(f,runSeed+f*7919);
        maps[f]=result.map;
        dungeonRooms[f]=result.rooms;
        // Reset fog for this dungeon floor
        for(let ry=0;ry<MH;ry++)for(let rx=0;rx<MW;rx++)fogRevealed[f][ry][rx]=false;
        // Place floor items
        placeFloorItems(f,result.rooms);
      }
      fogCacheDirty=true;
      // Reveal starting area of floor 1 for the player
      fogRevealRadius(1,exit.targetX,exit.targetY,4);
      fogSave();

      // v72: Snapshot state at dungeon entry so we can show run summary on exit
      dungeonRunSnapshot={cards:[...pl[0].cd],vaultSize:pl[0].vault?pl[0].vault.size:0,deepestFloor:0};
      // v79: Generate a random run mission
      const _mDef=RUN_MISSION_DEFS[Math.floor(Math.random()*RUN_MISSION_DEFS.length)];
      runMission={..._mDef,progress:0,completed:false,rewardGiven:false};
      roundsThisRun=0;
      lg.push('MISSION: '+runMission.desc+' → '+runMission.reward);
      // Spawn rivals at actual room centers so they don't embed in walls
      {
        const fl1Rooms=dungeonRooms[1]||[];
        // Prefer rooms in the right half of the map (away from player entry at x=3)
        const rightRooms=fl1Rooms.filter(r=>r.cx>20);
        const allRight=rightRooms.length>0?rightRooms:fl1Rooms;
        const r1=allRight[0]||{cx:32,cy:10};
        const r2=allRight[allRight.length-1]||{cx:32,cy:20};
        pl[1].x=r1.cx;pl[1].y=r1.cy;pl[1].visualX=r1.cx*TW;pl[1].visualY=r1.cy*TH;
        pl[2].x=r2.cx;pl[2].y=r2.cy;pl[2].visualX=r2.cx*TW;pl[2].visualY=r2.cy*TH;
      }
      rivalMaps=[1,1];
      rivalAI[0].goalX=32;rivalAI[0].goalY=12;rivalAI[0].state='exploring';
      rivalAI[0].lastKnownPlayerMap=-1;rivalAI[0].lastKnownPlayerX=-1;rivalAI[0].lastKnownPlayerY=-1;
      rivalAI[0].huntCooldown=30; // v155: ~30 player steps grace (real-time handled by encounterCooldown)
      rivalAI[1].goalX=32;rivalAI[1].goalY=18;rivalAI[1].state='exploring';
      rivalAI[1].lastKnownPlayerMap=-1;rivalAI[1].lastKnownPlayerX=-1;rivalAI[1].lastKnownPlayerY=-1;
      rivalAI[1].huntCooldown=15; // v155: collector shorter grace
    }
    // For ANY dungeon floor transition: if a rival is on the destination floor and within 8 tiles
    // of the player entry point, push them to a safe position far from the entrance.
    // Player enters going DOWN at (3,14), UP at (36,14).
    // Push rivals to the OPPOSITE end of the floor from the player's entry point.
    if(inDungeon){
      const entryX=pl[0].x;const entryY=pl[0].y;
      const safeX=entryX<20?30:6; // if entering from left (x=3), push to right (x=30); vice versa
      for(let ri=0;ri<2;ri++){
        if(rivalMaps[ri]===currentMap){
          const dist=Math.abs(pl[ri+1].x-entryX)+Math.abs(pl[ri+1].y-entryY);
          if(dist<=8){
            // Rival is too close to entry — push them to the safe end
            const safeY=ri===0?10:18;
            pl[ri+1].x=safeX;pl[ri+1].y=safeY;
            pl[ri+1].visualX=safeX*TW;pl[ri+1].visualY=safeY*TH;
            rivalAI[ri].goalX=safeX;rivalAI[ri].goalY=safeY;rivalAI[ri].state='exploring';
            rivalAI[ri].huntCooldown=600; // 10s before rival can hunt on new floor
          }
        }
      }
    }
    // v155: PMD-style floor title card for dungeon floors; simple banner for town
    if(inDungeon){showFloorTitle(currentFloor);}
    else{showBanner(mapNames[currentMap],AREA_CARD_DESC[currentMap]);}
    // v72: Track deepest floor reached
    if(inDungeon&&dungeonRunSnapshot&&currentFloor>dungeonRunSnapshot.deepestFloor){
      dungeonRunSnapshot.deepestFloor=currentFloor;
    }
    // v79: Track reach_floor mission progress
    if(inDungeon&&runMission&&runMission.type==='reach_floor'&&!runMission.completed&&currentFloor>=runMission.goal){
      runMission.progress=currentFloor;runMission.completed=true;sfxStreakUp();
      lg.push('MISSION PROGRESS: Reached floor '+currentFloor+'!');
    }
    // v72: On town return, compute and show run summary
    if(!inDungeon&&dungeonRunSnapshot){
      const snap=dungeonRunSnapshot;
      const newVaultSize=pl[0].vault?pl[0].vault.size:0;
      const cardsGained=newVaultSize-snap.vaultSize;
      // Cards lost: cards that were in hand at entry and no longer present
      const nowCards=pl[0].cd;
      const lostCards=[];
      snap.cards.forEach((cid,i)=>{
        if(cid>0&&!nowCards.includes(cid)){
          const cr=CD[cid-1];if(cr)lostCards.push(cr);
        }
      });
      const deepest=snap.deepestFloor;
      if(deepest>0){// Only show if player actually entered a floor
        runSummaryData={cardsGained,lostCards,deepest};
        runSummaryActive=true;runSummaryFrame=0;
      }
      dungeonRunSnapshot=null;
    }
    // Town rest: restore spell energy to full when returning to safe zone
    if(!inDungeon){sp.s=2;sp.b=3;sp.c=2;lg.push('Back in town — spell energy restored!');}
    // v79: Apply run mission reward on town return
    if(!inDungeon&&runMission&&runMission.completed&&!runMission.rewardGiven){
      runMission.rewardGiven=true;
      const rk=runMission.rewardKey;
      if(rk==='stl1'){sp.s=Math.min(6,sp.s+1);}
      else if(rk==='bar1'){sp.b=Math.min(6,sp.b+1);}
      else if(rk==='sct1'){sp.c=Math.min(6,sp.c+1);}
      else if(rk==='stl2'){sp.s=Math.min(6,sp.s+2);}
      else if(rk==='refill'){sp.s=Math.max(sp.s,3);sp.b=Math.max(sp.b,4);sp.c=Math.max(sp.c,3);}
      else if(rk==='bonus_card'){
        const bPool=DUNGEON_FLOOR_CARDS[3]||DUNGEON_FLOOR_CARDS[2];
        const bVault=pl[0].vault||new Set();
        const bNew=bPool.filter(id=>!bVault.has(id));
        const bUsePool=bNew.length>0?bNew:bPool;
        const bCard=bUsePool[Math.floor(Math.random()*bUsePool.length)];
        addCardToPlayer(0,bCard);
        checkWinAndTransition(2000); // v149: card 60 could come from mission bonus_card
      }
      if(runSummaryData){runSummaryData.missionDesc=runMission.desc;runSummaryData.missionReward=runMission.reward;}
      lg.push('MISSION COMPLETE: '+runMission.desc+' → '+runMission.reward);
      sfxStreakUp();
    }
    if(!inDungeon){runMission=null;}
    // Pause/resume card timers based on dungeon state
    const now=Date.now();
    for(let i=0;i<HAND_SIZE;i++){
      if(pl[0].cd[i]>0){
        if(inDungeon&&cardTimers[i]===0)cardTimers[i]=now; // start decay in dungeon
        if(!inDungeon){cardTimers[i]=0;decayWarn[i]=0;} // pause decay in town, reset warnings
      }
    }
    if(!inDungeon){escapeUrgencyActive=false;escapeUrgencyPulse=0;}
    // Floor clear card reward: descending to deeper floor (not escaping back up)
    if(inDungeon&&!exit.isEscape&&exit.fromMap>0){
      const clearedFloor=exit.fromMap; // the floor we just cleared
      const pool=DUNGEON_FLOOR_CARDS[clearedFloor];
      if(pool&&pool.length>0){
        // Prefer vault-new cards from this floor's pool (helps progression)
        const vault_=pl[0].vault||new Set();
        const newPool=pool.filter(id=>!vault_.has(id));
        const rewardCard=(newPool.length>0?newPool:pool)[Math.floor(Math.random()*(newPool.length>0?newPool:pool).length)];
        setTimeout(()=>{
          const cr=CD[rewardCard-1];
          const isNewUnique=!(pl[0].vault&&pl[0].vault.has(rewardCard));
          const flAdded=addCardToPlayer(0,rewardCard); // vault sting fires inside if new unique
          const _fcRarCols=['','#888898','#50d060','#b060e0','#e0a020','#ffe080'];
          if(flAdded){
            objectInteractMsg='FLOOR '+clearedFloor+' CLEAR! Got '+cr.n+'!';
            objectInteractTimer=150;
            if(!isNewUnique)sfxCardGet(); // only play extra sound for duplicates (unique sting already fired)
            screenShake(cr.r>=3?cr.r:2,cr.r>=3?cr.r*3:4);
            triggerCardGetBurst(pl[0].visualX-camX,pl[0].visualY-camY-8,_fcRarCols[cr.r]||'#f0c030');
            lg.push('[FLOOR CLEAR] B'+clearedFloor+' cleared! Earned: '+cr.n+' ('+RARITY_LABEL[cr.r]+')');
          }else{
            // Hand full — still got it in vault; prompt discard
            discardActive=true;discardSelIdx=0;discardPendingCard=rewardCard;discardSource='wild';
            objectInteractMsg='FLOOR '+clearedFloor+' CLEAR! Got '+cr.n+' (discard to make room)!';
            objectInteractTimer=150;
            if(!isNewUnique)sfxCardGet(); // only play extra sound for duplicates
            screenShake(2,4);
            lg.push('[FLOOR CLEAR] B'+clearedFloor+' cleared! Earned: '+cr.n+' — hand full, discard one.');
          }
          // v85: floor-clear fanfare overlay
          floorFanfareActive=true;floorFanfareTimer=0;
          floorFanfareData={floor:clearedFloor,cardId:rewardCard,rarity:cr.r,isNew:isNewUnique};
          // v148: check win after floor-clear card (card 60 could arrive here)
          checkWinAndTransition(1500);
        },800);
      }
    }
    // ── GOAL EXIT: Floor 5 cleared — legendary card fanfare ──
    if(exit.isGoal){
      const legendPool=DUNGEON_FLOOR_CARDS[5]||[]; // floor 5 = legendary pool
      const vault_=pl[0].vault||new Set();
      const newPool=legendPool.filter(id=>!vault_.has(id));
      const usePool=newPool.length>0?newPool:legendPool;
      // Give 2 legendary cards as goal reward
      const reward1=usePool[Math.floor(Math.random()*usePool.length)];
      const reward2=usePool[Math.floor(Math.random()*usePool.length)];
      [reward1,reward2].forEach((rid,ri)=>{
        if(!rid)return;
        setTimeout(()=>{
          const cr=CD[rid-1];
          if(!cr)return;
          const isNew=!(pl[0].vault&&pl[0].vault.has(rid));
          addCardToPlayer(0,rid);
          triggerCardGetBurst(W/2,H/2,'#ffe080');
          screenShake(5,12);
          sfxStreakUp();
          lg.push('[DUNGEON CLEARED] Legendary reward: '+cr.n+'!');
          if(ri===0){
            objectInteractMsg='DUNGEON CLEARED! Legendary: '+cr.n+'!';
            objectInteractTimer=260;
          }
        },1200+ri*1800);
      });
      // Special goal fanfare screen
      setTimeout(()=>{
        floorFanfareActive=true;floorFanfareTimer=0;
        floorFanfareData={floor:5,cardId:reward1,rarity:5,isNew:!(pl[0].vault&&pl[0].vault.has(reward1)),isGoal:true};
      },600);
      checkWinAndTransition(4000);
    }
    saveGame();
    // Grace period: prevent encounters for 8 seconds after any map transition
    // This stops rivals from immediately ambushing the player on dungeon entry
    encounterCooldown=480;
    if(!tutorialFlags.firstMapChange){tutorialFlags.firstMapChange=true;tutorialMsg=inDungeon?'Dungeon! Cards decay here — escape to save them.':'Town! Cards are safe here.';tutorialMsgTimer=220;}
    // Floor-specific first-visit narrative messages
    if(inDungeon){
      const floorMsgs=[
        '','', // floor 0 and 1 handled by firstMapChange
        'Floor 2: Uncommon cards. Watch for mushroom spores and MIRA\'s traps.',
        'Floor 3: Rare cards. Ancient altars can restore or extend your cards!',
        'Floor 4: Epic cards dwell here. VEGA hunts aggressively — keep moving.',
        'Floor 5: LEGENDARY cards. The deepest floor. Lava destroys cards. Be quick.',
      ];
      const flagKeys=['','','firstFloor2','firstFloor3','firstFloor4','firstFloor5'];
      const fKey=flagKeys[currentFloor];
      if(fKey&&!tutorialFlags[fKey]){
        tutorialFlags[fKey]=true;
        tutorialMsg=floorMsgs[currentFloor];
        tutorialMsgTimer=280;
      }
    }
    // Show dramatic floor card for dungeon transitions
    if(inDungeon&&!exit.isEscape){
      showMapLoadScreen(mapNames[currentMap],AREA_CARD_DESC[currentMap],currentFloor);
    }else if(exit.isGoal){
      showBanner('DUNGEON CLEARED','All 5 floors conquered!');
    }
    fadeIn(()=>{mapTransitioning=false;});
  });
}
