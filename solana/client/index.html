// ═══════════════════════════════════════
function drawFogOverlay(startTX,startTY,endTX,endTY){
  const fogC=FOG_COLORS[currentMap];
  for(let y=startTY;y<=endTY;y++){
    for(let x=startTX;x<=endTX;x++){
      const px=x*TW-camX,py=y*TH-camY;
      if(px<-TW||px>W||py<-TH||py>H)continue;
      if(fogRevealed[currentMap][y]&&fogRevealed[currentMap][y][x]){
        // Revealed tile: check edges for fog gradient
        const dirs=[[0,-1],[0,1],[-1,0],[1,0]]; // up,down,left,right
        for(const [dx,dy] of dirs){
          const nx=x+dx,ny=y+dy;
          const neighborHidden=(nx<0||nx>=MW||ny<0||ny>=MH||!fogRevealed[currentMap][ny]?.[nx]);
          if(neighborHidden){
            // Draw gradient strip on this edge
            const gradSteps=4;
            for(let s=0;s<gradSteps;s++){
              const alpha=0.15+s*0.12; // increasing opacity toward hidden side
              if(dy===-1){
                // top edge foggy
                bx(px,py+s,TW,1,`rgba(10,10,20,${alpha})`);
              }else if(dy===1){
                // bottom edge foggy
                bx(px,py+TH-1-s,TW,1,`rgba(10,10,20,${alpha})`);
              }else if(dx===-1){
                // left edge foggy
                bx(px+s,py,1,TH,`rgba(10,10,20,${alpha})`);
              }else if(dx===1){
                // right edge foggy
                bx(px+TW-1-s,py,1,TH,`rgba(10,10,20,${alpha})`);
              }
            }
          }
        }
      }else{
        // Hidden tile: solid fog with subtle noise texture
        g.fillStyle=fogC;
        g.fillRect(px,py,TW,TH);
        // Add sparse noise texture for atmosphere
        const n1=fogNoise(x,y,0),n2=fogNoise(x,y,1),n3=fogNoise(x,y,2);
        if(n1>0.7){
          const nPx=px+Math.floor(n2*12)+1,nPy=py+Math.floor(n3*10)+1;
          g.fillStyle='rgba(20,20,40,0.6)';
          g.fillRect(nPx,nPy,1,1);
        }
        if(n2>0.8){
          const nPx2=px+Math.floor(n1*10)+2,nPy2=py+Math.floor(n3*8)+2;
          g.fillStyle='rgba(30,30,50,0.4)';
          g.fillRect(nPx2,nPy2,1,1);
        }
        if(n3>0.85){
          const nPx3=px+Math.floor(n2*8)+3,nPy3=py+Math.floor(n1*7)+3;
          g.fillStyle='rgba(15,15,30,0.5)';
          g.fillRect(nPx3,nPy3,2,1);
        }
      }
    }
  }
}

function drawFogParticles(){
  fogParticles.forEach((p,i)=>{
    p.x+=p.vx;
    p.y+=Math.sin(fr*0.015+p.phase)*0.1+p.vy;
    if(p.x>MW*TW)p.x=0;
    if(p.y<0)p.y=MH*TH;
    if(p.y>MH*TH)p.y=0;
    const sx=p.x-camX,sy=p.y-camY;
    if(sx>0&&sx<W&&sy>0&&sy<H-HUD_HEIGHT){
      // Only show particles over hidden tiles
      const tileX=Math.floor(p.x/TW),tileY=Math.floor(p.y/TH);
      if(tileX>=0&&tileX<MW&&tileY>=0&&tileY<MH&&!fogRevealed[currentMap][tileY]?.[tileX]){
        const a=0.15+Math.sin(fr*0.02+i*0.7)*0.1;
        g.globalAlpha=Math.max(0,a);
        g.fillStyle='#404060';
        g.fillRect(sx,sy,1,1);
        g.globalAlpha=1;
      }
    }
  });
}

function drawRivalAlertAnim(p,px,py){
  if(!p._alertTimer)p._alertTimer=0;
  if(p._alertTimer>0){
    p._alertTimer-=dt;
    const bounceY=Math.sin(p._alertTimer*0.3)*5;
    const alpha=Math.min(1,p._alertTimer/15);
    g.globalAlpha=alpha;
    bx(px+8,py-36+bounceY,16,20,'#f0c830');
    bx(px+10,py-34+bounceY,12,15,'#f8e060');
    bx(px+13,py-16+bounceY,4,4,'#f0c830');
    g.globalAlpha=1;
  }
}

function isVisibleThroughFog(tileX,tileY,playerDist){
  // Must be on a revealed tile AND within playerDist tiles of player
  if(!fogRevealed[currentMap][tileY]?.[tileX])return false;
  const dx=Math.abs(tileX-pl[0].x),dy=Math.abs(tileY-pl[0].y);
  return(dx+dy)<=playerDist;
}

      const rpx=rtx*TW-camX,rpy=rty*TH-camY;
      if(rpx>-TW&&rpx<W+TW&&rpy>-TW&&rpy<H+TW&&fogRevealed[0][rty]?.[rtx]){
        g.fillStyle='#a09060';g.beginPath();g.ellipse(rpx+16,rpy+22,6,4,0,0,Math.PI*2);g.fill();
        g.fillStyle='#b0a070';g.beginPath();g.ellipse(rpx+16,rpy+22,4,2,0,0,Math.PI*2);g.fill();
        bx(rpx+14,rpy+18,4,4,'#a09060');
      }
    });

    // Seagulls flying over water
    seagulls.forEach(sg=>{
      sg.x+=sg.vx;
      if(sg.x>42*TW)sg.x=-20;
      const sgPx=sg.x-camX;
      const sgPy=sg.y-camY+Math.sin(fr*0.04+sg.phase)*sg.arc;
      if(sgPx>-10&&sgPx<W+10&&sgPy>-10&&sgPy<H){
        // Body (white dot)
        bx(sgPx,sgPy,3,2,'#e8e8e8');
        // Wings (flapping)
        if(Math.sin(fr*0.12+sg.phase)>0){
          bx(sgPx-3,sgPy-1,3,1,'#d8d8d8');bx(sgPx+3,sgPy-1,3,1,'#d8d8d8');
        }else{
          bx(sgPx-3,sgPy+1,3,1,'#d8d8d8');bx(sgPx+3,sgPy+1,3,1,'#d8d8d8');
        }
      }
    });

  }else if(currentMap===1){
    // ── SMUGGLER'S JUNGLE DECORATIONS ──

    // Vine/hanging rope elements on some trees
    const m=getMap();
    for(let vy=Math.max(0,Math.floor(camY/TH));vy<=Math.min(MH-1,Math.ceil((camY+H)/TH));vy++){
      for(let vx=Math.max(0,Math.floor(camX/TW));vx<=Math.min(MW-1,Math.ceil((camX+W)/TW));vx++){
        if(m[vy]?.[vx]===3&&fogRevealed[1][vy]?.[vx]&&((vx*7+vy*13)%5===0)){
          const vpx=vx*TW-camX,vpy=vy*TH-camY;
          // Hanging vine
          const vineLen=12+((vx*3+vy*5)%8);
          for(let vi=0;vi<vineLen;vi++){
            const vox=Math.sin(fr*0.02+vi*0.3+vx)*1.5;
            bx(vpx+8+vox,vpy+14+vi*2,2,2,'#387830');
          }
          // Second vine on some trees
          if((vx+vy)%3===0){
            for(let vi=0;vi<vineLen-4;vi++){
              const vox2=Math.sin(fr*0.025+vi*0.25+vy)*1.2;
              bx(vpx+22+vox2,vpy+16+vi*2,1,2,'#306828');
            }
          }
        }
      }
    }

    // Hidden treasure chest (visible after fog reveal)
    // Place at a specific tile that looks good
    const chestTX=15,chestTY=8;
    if(fogRevealed[1][chestTY]?.[chestTX]){
      const cpx=chestTX*TW-camX,cpy=chestTY*TH-camY;
      if(cpx>-TW&&cpx<W+TW&&cpy>-TH&&cpy<H+TH){
        // Chest body
        bx(cpx+8,cpy+18,16,10,'#906828');bx(cpx+10,cpy+20,12,6,'#a07838');
        // Chest lid
        bx(cpx+8,cpy+14,16,5,'#805820');bx(cpx+10,cpy+15,12,3,'#906828');
        // Lock/latch
        bx(cpx+14,cpy+17,4,3,'#d0a030');bx(cpx+15,cpy+18,2,2,'#e0b040');
        // Sparkle (subtle hint)
        if(fr%60<20){
          const sparkA=(Math.sin(fr*0.15)*0.3+0.5);
          g.globalAlpha=sparkA;
          bx(cpx+16,cpy+12,2,2,'#f0d050');
          g.globalAlpha=1;
        }
      }
    }

    // Monkeys in trees
    monkeys.forEach(mk=>{
      mk.hopTimer--;
      if(mk.hopTimer<=0){
        mk.hopTimer=80+Math.floor(Math.random()*100);
        mk.hopDir=-mk.hopDir;
        mk.offsetX=Math.random()*12;
      }
      const mtx=mk.treeX,mty=mk.treeY;
      const mm=getMap();
      if(mm[mty]?.[mtx]!==3)return;
      if(!fogRevealed[1][mty]?.[mtx])return;
      const mpx=mtx*TW-camX+mk.offsetX,mpy=mty*TH-camY+4+mk.offsetY;
      if(mpx<-TW||mpx>W+TW||mpy<-TH||mpy>H+TH)return;
      const hopBob=mk.hopTimer<10?Math.abs(Math.sin(mk.hopTimer*0.5))*4:0;
      // Body
      bx(mpx+2,mpy+6-hopBob,6,5,'#8B5E3C');
      // Head
      bx(mpx+3,mpy+2-hopBob,4,4,'#A06B3F');
      // Face
      bx(mpx+4,mpy+3-hopBob,1,1,'#2a1a0a');bx(mpx+6,mpy+3-hopBob,1,1,'#2a1a0a');
      // Tail
      const tailCurl=Math.sin(fr*0.05+mtx)*2;
      bx(mpx+8,mpy+8-hopBob+tailCurl,1,3,'#8B5E3C');
      bx(mpx+9,mpy+10-hopBob+tailCurl,1,2,'#8B5E3C');
    });

  }else if(currentMap===2){
    // ── CURSED TEMPLE DECORATIONS ──

    // Skull decorations on walls
    const m=getMap();
    for(let sy=Math.max(0,Math.floor(camY/TH));sy<=Math.min(MH-1,Math.ceil((camY+H)/TH));sy++){
      for(let sx=Math.max(0,Math.floor(camX/TW));sx<=Math.min(MW-1,Math.ceil((camX+W)/TW));sx++){
        if(m[sy]?.[sx]===22&&fogRevealed[2][sy]?.[sx]&&((sx*11+sy*7)%7===0)){
          const spx=sx*TW-camX,spy=sy*TH-camY;
          // Skull shape
          bx(spx+12,spy+4,8,7,'#c8c0a8');bx(spx+13,spy+3,6,2,'#c8c0a8');
          // Eye sockets
          bx(spx+13,spy+6,2,2,'#383840');bx(spx+17,spy+6,2,2,'#383840');
          // Nose
          bx(spx+15,spy+8,2,1,'#a09888');
          // Jaw
          bx(spx+13,spy+10,6,2,'#b0a890');
          bx(spx+14,spy+11,1,1,'#383840');bx(spx+16,spy+11,1,1,'#383840');bx(spx+18,spy+11,1,1,'#383840');
          // Ghostly glow around skull
          const glowA=Math.sin(fr*0.04+sx*2+sy*3)*0.1+0.12;
          g.globalAlpha=glowA;
          g.fillStyle='#806090';g.beginPath();g.arc(spx+16,spy+8,10,0,Math.PI*2);g.fill();
          g.globalAlpha=1;
        }
      }
    }

    // Dripping water effect from ceiling tiles
    waterDrips.forEach(wd=>{
      if(!fogRevealed[2][wd.y]?.[wd.x])return;
      const m2=getMap();
      if(m2[wd.y]?.[wd.x]!==22)return;
      const wpx=wd.x*TW-camX+12+((wd.x*5)%12),wpy=wd.y*TH-camY+TH;
      if(wpx<-4||wpx>W+4||wpy<-40||wpy>H+4)return;
      wd.delay--;
      if(wd.delay>0)return;
      wd.dropY+=wd.speed;
      if(wd.dropY>24){
        wd.dropY=0;
        wd.delay=40+Math.floor(Math.random()*60);
      }
      // Water droplet
      bx(wpx,wpy+wd.dropY,2,3,'#4888c0');
      bx(wpx,wpy+wd.dropY,1,2,'#6aa8e0');
      // Splash at bottom
      if(wd.dropY>20){
        const splA=1-(wd.dropY-20)/4;
        g.globalAlpha=splA*0.5;
        bx(wpx-2,wpy+24,2,1,'#4888c0');bx(wpx+2,wpy+24,2,1,'#4888c0');
        g.globalAlpha=1;
      }
    });

    // Ghostly glow in darker areas (near lava/crystal tiles)
    for(let gy=Math.max(0,Math.floor(camY/TH));gy<=Math.min(MH-1,Math.ceil((camY+H)/TH));gy++){
      for(let gx=Math.max(0,Math.floor(camX/TW));gx<=Math.min(MW-1,Math.ceil((camX+W)/TW));gx++){
        const gt=m[gy]?.[gx];
        if((gt===25||gt===26)&&fogRevealed[2][gy]?.[gx]){
          const gpx=gx*TW-camX+16,gpy=gy*TH-camY+16;
          if(gpx>-20&&gpx<W+20&&gpy>-20&&gpy<H+20){
            const glowPulse=Math.sin(fr*0.03+gx*3+gy*5)*0.06+0.08;
            g.globalAlpha=glowPulse;
            g.fillStyle=gt===25?'#f08040':'#80c0f0';
            g.beginPath();g.arc(gpx,gpy,20,0,Math.PI*2);g.fill();
            g.globalAlpha=1;
          }
        }
      }
    }

    // Pirate flag on the altar (tile 27)
    for(let ay=Math.max(0,Math.floor(camY/TH));ay<=Math.min(MH-1,Math.ceil((camY+H)/TH));ay++){
      for(let ax=Math.max(0,Math.floor(camX/TW));ax<=Math.min(MW-1,Math.ceil((camX+W)/TW));ax++){
        if(m[ay]?.[ax]===27&&fogRevealed[2][ay]?.[ax]){
          const apx=ax*TW-camX,apy=ay*TH-camY;
          if(apx>-TW&&apx<W+TW&&apy>-TH-20&&apy<H+TH){
            // Flag pole
            bx(apx+22,apy-16,2,20,'#808088');
            // Pirate flag
            const fw=Math.sin(fr*0.05)*1;
            bx(apx+24,apy-14+fw,12,8,'#181820');
            // Skull and crossbones on flag
            bx(apx+28,apy-13+fw,2,2,'#c0c0b0');bx(apx+31,apy-13+fw,2,2,'#c0c0b0');
            bx(apx+29,apy-11+fw,3,1,'#c0c0b0');
            bx(apx+27,apy-9+fw,2,1,'#c0c0b0');bx(apx+33,apy-9+fw,2,1,'#c0c0b0');
          }
        }
      }
    }
  }
}

function dMap(){
  updateCamera();

  const startTX=Math.max(0,Math.floor(camX/TW));
  const startTY=Math.max(0,Math.floor(camY/TH));
  const endTX=Math.min(MW-1,Math.ceil((camX+W)/TW));
  const endTY=Math.min(MH-1,Math.ceil((camY+H)/TH));

  for(let y=startTY;y<=endTY;y++){
    for(let x=startTX;x<=endTX;x++){
      // Skip tiles fully hidden by fog (no adjacent revealed tiles)
      if(!fogRevealed[currentMap][y]?.[x]){
        let anyNeighborRevealed=false;
        for(let dy=-1;dy<=1&&!anyNeighborRevealed;dy++){
          for(let dx=-1;dx<=1&&!anyNeighborRevealed;dx++){
            const ny=y+dy,nx=x+dx;
            if(ny>=0&&ny<MH&&nx>=0&&nx<MW&&fogRevealed[currentMap][ny]?.[nx])anyNeighborRevealed=true;
          }
        }
        if(!anyNeighborRevealed)continue;
      }
      drawTile(x,y);
    }
  }

  // Edge blending post-pass (cached to offscreen canvas)
  // Skip entirely if frame rate is very low (dt > 2 means < 30fps)
  if(dt<=2){
    const camMoved=Math.abs(camX-edgeCacheLastCamX)>0.5||Math.abs(camY-edgeCacheLastCamY)>0.5;
    if(edgeCacheDirty||camMoved){
      edgeCtx.clearRect(0,0,W,H);
      const mainCtx=g;
      g=edgeCtx;
      drawEdgeBlending(startTX,startTY,endTX,endTY);
      g=mainCtx;
      edgeCacheLastCamX=camX;edgeCacheLastCamY=camY;
      edgeCacheDirty=false;
    }
    g.drawImage(edgeCanvas,0,0,W,H);
  }

  // ── FOG OF WAR OVERLAY ── (cached to offscreen canvas)
  {
    const camMoved=Math.abs(camX-fogCacheLastCamX)>0.5||Math.abs(camY-fogCacheLastCamY)>0.5;
    if(fogCacheDirty||camMoved){
      fogCtx.clearRect(0,0,W,H);
      const mainCtx=g;
      g=fogCtx;
      drawFogOverlay(startTX,startTY,endTX,endTY);
      g=mainCtx;
      fogCacheLastCamX=camX;fogCacheLastCamY=camY;
      fogCacheDirty=false;
    }
    g.drawImage(fogCanvas,0,0,W,H);
  }
  // ── CIRCULAR VISIBILITY (Iwayama Tunnel style) ──
  // Skip heavy gradient on mobile every other frame for perf
  if(!isTouchDevice||fr%2===0){
    const px=pl[0].visualX-camX+TW/2, py=pl[0].visualY-camY+TH/2;
    const innerR=80, outerR=200;
    const grad=g.createRadialGradient(px,py,innerR,px,py,outerR);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(0.6,'rgba(0,0,0,0.3)');
    grad.addColorStop(1,'rgba(0,0,0,0.7)');
    g.fillStyle=grad;
    g.fillRect(0,0,W,H);
  }
  // Fog particles only every other frame
  if(fr%2===0) drawFogParticles();

  drawParticles(camX,camY);
  drawBirds();
  drawPirateDecorations();

  // Draw footprints on revealed grass tiles
  footprints.forEach(fp=>{
    if(fp.map!==currentMap)return;
    if(!fogRevealed[currentMap][fp.y]?.[fp.x])return;
    const m=maps[currentMap];
    const tile=m[fp.y]?.[fp.x];
    if(tile!==1&&tile!==11&&tile!==7)return;
    const fpx=fp.x*TW-camX;const fpy=fp.y*TH-camY;
    if(fpx<-TW||fpx>W||fpy<-TH||fpy>H)return;
    const alpha=Math.max(0,1-fp.age/FOOTPRINT_MAX_AGE)*0.35;
    g.globalAlpha=alpha;
    bx(fpx+8,fpy+20,4,4,'#3a3828');
    bx(fpx+18,fpy+24,4,4,'#3a3828');
    g.globalAlpha=1;
  });

  // Draw NPCs on this map (only if on revealed tile)
  npcs.forEach(npc=>{
    if(npc.map===currentMap&&fogRevealed[currentMap][npc.y]?.[npc.x])drawNPCSprite(npc);
  });

  // Sprites sorted by Y (only draw rivals on same map AND visible through fog)
  const visiblePl=[pl[0]];
  if(rivalMaps[0]===currentMap){
    const rv=pl[1];
    if(isVisibleThroughFog(rv.x,rv.y,3)){
      if(!rv._wasVisible){rv._wasVisible=true;rv._alertTimer=30;sfxEncounter();}
      visiblePl.push(rv);
    }else{rv._wasVisible=false;}
  }else{pl[1]._wasVisible=false;}
  if(rivalMaps[1]===currentMap){
    const hv=pl[2];
    if(isVisibleThroughFog(hv.x,hv.y,3)){
      if(!hv._wasVisible){hv._wasVisible=true;hv._alertTimer=30;sfxEncounter();}
      visiblePl.push(hv);
    }else{hv._wasVisible=false;}
  }else{pl[2]._wasVisible=false;}
  const sorted=visiblePl.map((p,i)=>({p,i:pl.indexOf(p)}));
  sorted.sort((a,b)=>a.p.visualY-b.p.visualY);
  sorted.forEach(({p,i})=>{
    drawSprite(p,i===0);
    if(i!==0){
      const spx=p.visualX-camX,spy=p.visualY-camY-16;
      drawRivalAlertAnim(p,spx,spy);
    }
  });

  // Proximity heartbeat pulse on screen edges
  if(proximityDangerLevel>=1&&sc==='map'){
    const pulseSpeed=proximityDangerLevel>=4?0.25:proximityDangerLevel>=3?0.15:proximityDangerLevel>=2?0.08:0.04;
    const pulseAlpha=proximityDangerLevel>=4?0.18:proximityDangerLevel>=3?0.10:proximityDangerLevel>=2?0.05:0.02;
    const pulse=Math.sin(fr*pulseSpeed)*0.5+0.5;
    const a=pulse*pulseAlpha;
    if(a>0.005){
      g.globalAlpha=a;
      // Red vignette on edges
      const grad=g.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.7);
      grad.addColorStop(0,'rgba(0,0,0,0)');
      grad.addColorStop(1,'rgba(180,30,30,1)');
      g.fillStyle=grad;
      g.fillRect(0,0,W,H-HUD_HEIGHT);
      g.globalAlpha=1;
    }
  }

  // Darkness overlay for ruins
  if(currentMap===2){bx(0,0,W,H,'rgba(10,0,20,.12)');}

  // Atmospheric effects
  drawAtmosphere();

  // Multiplayer other players
  drawMPPlayers();

  // Player status effects (sparkle, exhausted, card get)
  drawPlayerStatusEffects();

  // Map edge gradient polish (darken edges when camera near map bounds)
  {
    const maxX=MW*TW-W,maxY=MH*TH-(H-HUD_HEIGHT);
    const edgeFade=20;
    // Left edge
    if(camX<edgeFade){
      const a=0.15*(1-camX/edgeFade);
      const gr=g.createLinearGradient(0,0,edgeFade,0);
      gr.addColorStop(0,'rgba(0,0,0,'+a+')');gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.fillRect(0,0,edgeFade,H-HUD_HEIGHT);
    }
    // Right edge
    if(camX>maxX-edgeFade){
      const a=0.15*Math.min(1,(camX-(maxX-edgeFade))/edgeFade);
      const gr=g.createLinearGradient(W-edgeFade,0,W,0);
      gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+a+')');
      g.fillStyle=gr;g.fillRect(W-edgeFade,0,edgeFade,H-HUD_HEIGHT);
    }
    // Top edge
    if(camY<edgeFade){
      const a=0.15*(1-camY/edgeFade);
      const gr=g.createLinearGradient(0,0,0,edgeFade);
      gr.addColorStop(0,'rgba(0,0,0,'+a+')');gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.fillRect(0,0,W,edgeFade);
    }
    // Bottom edge
    if(camY>maxY-edgeFade){
      const a=0.15*Math.min(1,(camY-(maxY-edgeFade))/edgeFade);
      const hud=H-HUD_HEIGHT;
      const gr=g.createLinearGradient(0,hud-edgeFade,0,hud);
      gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+a+')');
      g.fillStyle=gr;g.fillRect(0,hud-edgeFade,W,edgeFade);
    }
  }

  // Day/night overlay (after all rendering, before HUD)
  drawDayNightOverlay();

  // ── HUD BAR ──
  const hudY=H-HUD_HEIGHT;
  win(0,hudY,W,HUD_HEIGHT);
  // Season timer
  const _sr=getSeasonRemaining();const _srt=formatTimeRemaining(_sr);
  const _sCol=_sr<3600000?'#d04040':_sr<86400000?'#d0a030':'#40a040';
  tx(_srt,10,hudY+28,9,_sCol);
  tx('STL',100,hudY+22,8,'#b04040');tx(sp.s+'',142,hudY+22,9,'#c04848');
  tx('BAR',165,hudY+22,8,'#3060b0');tx(sp.b+'',207,hudY+22,9,'#3868c0');
  tx('SCT',230,hudY+22,8,'#308030');tx(sp.c+'',272,hudY+22,9,'#38a038');
  tx(`(${pl[0].x},${pl[0].y})`,10,hudY+52,7,'#989080');
  // Footstep counter
  tx('STEPS:'+stepCounter,100,hudY+52,7,'#989080');
  for(let i=0;i<5;i++){
    drawMiniCard(310+i*34,hudY+14,pl[0].cd[i]);
    // Card decay timer bar under each card
    if(pl[0].cd[i]>0&&cardTimers[i]>0){
      const elapsed=Date.now()-cardTimers[i];
      const remaining=Math.max(0,1-elapsed/CARD_DECAY_MS);
      const barX_=310+i*34, barY_=hudY+36, barW_=28, barH_=3;
      bx(barX_,barY_,barW_,barH_,'#1a1a30');
      const col_=remaining>0.5?'#40d040':remaining>0.25?'#d0c040':'#d04040';
      bx(barX_,barY_,Math.floor(barW_*remaining),barH_,col_);
      // Flash red in last 15 seconds
      if(CARD_DECAY_MS-elapsed<15000){
        const flashA=Math.sin(fr*0.3)*0.4+0.4;
        g.globalAlpha=flashA;
        bx(310+i*34-1,hudY+13,30,28,'#d04040');
        g.globalAlpha=1;
      }
    }
  }

  // Streak display
  if(streakCount>0){
    const streakCol=streakCount>=5?'#f0c830':streakCount>=3?'#e08040':'#c0c0c0';
    const popScale=streakDisplayTimer>0?1+Math.sin(streakDisplayTimer*0.3)*0.15:1;
    const sz=Math.floor(7*popScale);
    txShadow('STREAK:'+streakCount+'x',310,hudY+44,sz,streakCol,'rgba(0,0,0,.5)');
  }
  if(streakLostTimer>0){
    const la=streakLostTimer/60;
    g.globalAlpha=la;
    txShadow('STREAK LOST!',310,hudY+44,7,'#d04040','rgba(0,0,0,.5)');
    g.globalAlpha=1;
  }

  // Area Danger Level display
  const dangerVal=areaDanger[currentMap];
  const dangerLabel=dangerVal>=DANGER_HIGH_THRESH?'HIGH':dangerVal>=DANGER_LOW_THRESH?'MED':'LOW';
  const dangerCol=dangerVal>=DANGER_HIGH_THRESH?'#d04040':dangerVal>=DANGER_LOW_THRESH?'#d0a030':'#40a040';
  tx('DANGER:'+dangerLabel,420,hudY+44,6,dangerCol);
  // Danger meter bar
  bx(420,hudY+48,60,3,'#282838');
  bx(420,hudY+48,Math.floor(60*dangerVal),3,dangerCol);

  // Rival near-win warning (flashing)
  if(rivalWinWarning>0&&Math.floor(fr/15)%2===0){
    txShadow('RIVAL NEAR WIN!',520,hudY+44,6,'#d04040','rgba(0,0,0,.5)');
  }

  // Rival Threat Indicator (compass arrow at top of screen)
  for(let ri=0;ri<2;ri++){
    if(rivalMaps[ri]!==currentMap)continue;
    const r=pl[ri+1];
    const dx=r.x-pl[0].x, dy=r.y-pl[0].y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<1)continue;
    const angle=Math.atan2(dy,dx);
    // Color based on distance
    const arrowCol=dist<=5?'#d04040':dist<=12?'#d0a030':'#40a040';
    // Draw arrow at top center
    const arrowCX=W/2+(ri===0?-30:30), arrowCY=20;
    g.save();
    g.translate(arrowCX,arrowCY);
    g.rotate(angle);
    g.fillStyle=arrowCol;
    g.beginPath();
    g.moveTo(10,0);g.lineTo(-5,-5);g.lineTo(-5,5);
    g.closePath();g.fill();
    g.restore();
    // Label

// Draw FRLG-style card count bar (like HP bar) with rounded container and segmented fill
function drawCardBar(x,y,w,cards,maxCards){
  const filledCount=cards.filter(c=>c>0).length;
  // "CARDS" label to the left
  // (label is drawn by callers)
  // Rounded rectangle container
  const barH=10,r=3;
  // Outer border (rounded)
  g.fillStyle=FRLG.borderOuter;
  g.fillRect(x+r,y,w-r*2,barH);
  g.fillRect(x,y+r,r,barH-r*2);
  g.fillRect(x+w-r,y+r,r,barH-r*2);
  g.fillRect(x+1,y+1,r-1,r-1);g.fillRect(x+w-r,y+1,r-1,r-1);
  g.fillRect(x+1,y+barH-r,r-1,r-1);g.fillRect(x+w-r,y+barH-r,r-1,r-1);
  // Inner bg
  bx(x+2,y+2,w-4,barH-4,'#282820');
  // Segmented fill
  const segW=Math.floor((w-6)/maxCards);
  // Color based on card count: 0-2 = green, 3 = yellow, 4-5 = gold with glow
  const barColor=filledCount<=2?FRLG.hpGreen:filledCount===3?FRLG.hpYellow:'#F0C830';
  for(let i=0;i<maxCards;i++){
    const sx=x+3+i*segW;
    if(i<cards.length&&cards[i]>0){
      bx(sx,y+2,segW-1,barH-4,barColor);
      bx(sx,y+2,segW-1,Math.floor((barH-4)/2),'rgba(255,255,255,.25)');
      // Segment divider
      if(i<maxCards-1)bx(sx+segW-1,y+2,1,barH-4,'rgba(0,0,0,.3)');
    }else{
      bx(sx,y+2,segW-1,barH-4,'#1a1a18');
      if(i<maxCards-1)bx(sx+segW-1,y+2,1,barH-4,'rgba(0,0,0,.2)');
    }
  }
  // Gold glow for 4-5 cards
  if(filledCount>=4){
    const glow=Math.sin(fr*0.12)*0.15+0.15;
    g.globalAlpha=glow;
    bx(x-2,y-2,w+4,barH+4,'#F0C830');
    g.globalAlpha=1;
  }
}

// Draw battle sprite (front-facing for opponent, back-facing for player)

  bx(ox+2*s,oy+17*s,4*s,3*s,'#383030');bx(ox+8*s,oy+17*s,4*s,3*s,'#383030');

function drawVsSplash(){
  bx(0,0,W,H,'#181828');const t=fr-bpFrame;
  // Diagonal split
  const angle=W*1.2;
  g.save();
  g.fillStyle='#c04040';g.beginPath();g.moveTo(W/2-2,0);g.lineTo(W/2+angle/2,H);g.lineTo(W/2-2-angle/2,H);g.closePath();g.fill();
  g.fillStyle='#3060b0';g.beginPath();g.moveTo(W/2+2,0);g.lineTo(W/2+2+angle/2,0);g.lineTo(W/2+2+angle/2,H);g.lineTo(W/2+2-angle/2,H);g.closePath();g.fill();
  g.restore();
  // Sprites slide in (player from left back-facing, opponent from right front-facing)
  const pSlide=Math.min(1,t/30);
  const pX=-60+pSlide*(W/4+20);
  drawBattleSprite(pl[0],pX,H/2-10,3,true);
  const rSlide=Math.min(1,t/30);
  const rX=W+60-rSlide*(W/4+20);
  drawBattleSprite(pl[1],rX,H/2-10,3,false);

    g.globalAlpha=Math.min(1,(t-15)/10);

    txShadow('VS',W/2-28,H/2+14,36,'#f0c830','#000');
    g.globalAlpha=1;
  }
  // Flash
  if(t>=28&&t<=35){bx(0,0,W,H,`rgba(255,255,255,${(35-t)/7*.9})`);}
  // Area name
  if(t>20&&t<55){
    g.globalAlpha=Math.min(1,(t-20)/8,Math.max(0,(55-t)/8));
    txShadow(mapNames[currentMap],W/2-80,H/2+42,14,'#fff','rgba(0,0,0,.5)');

  }
  if(t>=60){
    battlePhase='select';bpFrame=fr;
    if(!tutorialFlags.firstBattle){tutorialFlags.firstBattle=true;tutorialMsg='Pick an action! DRAW cards, STEAL from rivals, or BARRIER to defend.';tutorialMsgTimer=240;}

}

function isActionAvailable(i){
  if(i===1&&sp.s<=0)return false;

  if(i===3&&sp.c<=0)return false;

}

// Area card tables: Port=[1,2](Aegis,Umbra), Forest=[3,4,5](Ignis,Tempest,Nihil), Ruins=[5,2,4](Nihil,Umbra,Tempest)
const AREA_CARDS=[[1,2],[3,4,5],[5,2,4]];
function pickAreaCard(){return pickAreaCardForMap(currentMap);}
function pickAreaCardForMap(mapIdx){const ac=AREA_CARDS[mapIdx]||[1,2];return ac[Math.floor(Math.random()*ac.length)];}
function syncCardCount(pIdx){const p=pl[pIdx];p.cc=p.cd.filter(c=>c>0).length;}
function addCardToPlayer(pIdx,cardId){
  const p=pl[pIdx];
  const hadBefore=pIdx===0?hasUniqueCards(0):null;
  for(let i=0;i<5;i++){if(p.cd[i]===0){p.cd[i]=cardId;syncCardCount(pIdx);if(pIdx===0){cardTimers[i]=Date.now();stats.cardsCollected++;if(hadBefore&&!hadBefore.has(cardId)){sfxUniqueCardSting();triggerProgressPulse();}}return true;}}
  return false;
}
function removeCardFromPlayer(pIdx,slotOrRandom){
  const p=pl[pIdx];
  if(slotOrRandom===-1){// random
    const filled=[];for(let i=0;i<5;i++){if(p.cd[i]>0)filled.push(i);}
    if(filled.length===0)return 0;
    const slot=filled[Math.floor(Math.random()*filled.length)];
    const card=p.cd[slot];p.cd[slot]=0;if(pIdx===0){cardTimers[slot]=0;stats.cardsLost++;}syncCardCount(pIdx);return card;
  }
  const card=p.cd[slotOrRandom];if(card>0){p.cd[slotOrRandom]=0;if(pIdx===0){cardTimers[slotOrRandom]=0;stats.cardsLost++;}syncCardCount(pIdx);}return card;
}
function hasUniqueCards(pIdx){const s=new Set();pl[pIdx].cd.forEach(c=>{if(c>0)s.add(c);});return s;}
function playerHasAllFive(){const s=hasUniqueCards(0);return s.has(1)&&s.has(2)&&s.has(3)&&s.has(4)&&s.has(5);}
function checkWinAndTransition(delayMs){
  if(!playerHasAllFive())return;
  // Record best clear (elapsed from season start)
  const clearTime=Math.floor(getPlayElapsed()/1000);
  if(stats.bestClearRounds===0||rd<stats.bestClearRounds){stats.bestClearRounds=rd;}
  if(stats.bestClearTime===0||clearTime<stats.bestClearTime){stats.bestClearTime=clearTime;}
  const d=(delayMs!==undefined)?delayMs:500;
  if(d>0){setTimeout(()=>{gameOverTimesUp=false;stats.gamesPlayed++;saveStats();fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});},d);}
  else{gameOverTimesUp=false;stats.gamesPlayed++;saveStats();fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});}
}

// Rival AI: choose an action index (0=Draw,1=Steal,2=Barrier,3=Scout)
function rivalChooseAction(rIdx){
  const r=pl[rIdx];
  const aiIdx=rIdx-1;
  const ai=rivalAI[aiIdx];
  const rCardCount=r.cd.filter(c=>c>0).length;
  if(rCardCount<2)return 0;// Draw if low
  const roll=Math.random();
  const rUnique=hasUniqueCards(rIdx);

  if(ai.personality==='hunter'){
    // Aggressive: mostly Steal + Scout
    if(rUnique.size>=4){
      if(roll<0.4)return 2;// barrier to protect lead
      if(roll<0.7)return 1;// steal
      return 3;// scout
    }
    if(pl[0].cd.filter(c=>c>0).length>=2){
      if(roll<0.5)return 1;// steal from player
      if(roll<0.75)return 3;// scout player
      return 0;// draw
    }
    if(roll<0.4)return 1;if(roll<0.7)return 0;return 3;
  }else{
    // Collector: mostly Draw + Barrier, but will steal when behind
    if(rUnique.size>=4){
      if(roll<0.5)return 2;// barrier to protect lead
      if(roll<0.8)return 0;// draw to complete set
      return 3;// scout to plan
    }
    // Steal if player has cards collector needs and collector has 3+ cards
    const playerCards=hasUniqueCards(0);
    const needsFromPlayer=rCardCount>=3&&playerCards.size>rUnique.size;
    if(needsFromPlayer&&roll<0.20)return 1;// opportunistic steal (20%)
    if(roll<0.45)return 0;// draw (45%)
    if(roll<0.75)return 2;// barrier (30%)
    if(roll<0.90)return 3;// scout (15%)
    return 0;// draw fallback
  }
}

let bpPlayerBarrier=false; // track if player used barrier this round
let bpRivalActions=[0,0]; // track rival actions this round
let bpCardSelectActive=false, bpCardSelectIdx=0; // USE CARD selection
let bpTargetSelectActive=false, bpTargetSelectIdx=1; // STEAL/SCOUT target selection

function generateResolveEvents(){
  const actionNames=['DRAW','STEAL','BARRIER','SCOUT','USE CARD'];const events=[];
  bpPlayerBarrier=(bpAction===2);
  // Rival AI actions
  bpRivalActions[0]=rivalChooseAction(1);
  bpRivalActions[1]=rivalChooseAction(2);
  const rivalBarriers=[bpRivalActions[0]===2,bpRivalActions[1]===2];

  // ── PLAYER ACTION ──
  if(bpAction===0){// DRAW
    const cardId=pickAreaCard();const cr=CD[cardId-1];
    events.push({type:'action',who:'You',action:'DRAW',text:'You used DRAW!',effect:'none'});
    if(addCardToPlayer(0,cardId)){
      events.push({type:'result',text:'You obtained '+cr.n+'!',effect:'card_get',cardName:cr.n});
      lg.push('R'+rd+': You drew '+cr.n+'!');
      // Streak: new unique type?
      const prevU=new Set();pl[0].cd.forEach(c=>{if(c>0&&c!==cardId)prevU.add(c);});
      if(!prevU.has(cardId)){streakCount++;streakDisplayTimer=60;sfxStreakUp();}
    }else{
      // Hand full - store drawn card for discard prompt after resolve
      events.push({type:'result',text:'Hand full! You drew '+cr.n+' - discard one after battle.',effect:'none'});
      events._pendingDrawCard=cardId;
      lg.push('R'+rd+': Drew '+cr.n+' but hand full!');
    }
  }else if(bpAction===1){// STEAL
    sp.s=Math.max(0,sp.s-1);stats.stealsAttempted++;
    const tgt=bpSelectedTarget; // 1=Rival, 2=Hunter
    const tgtBarrier=rivalBarriers[tgt-1];
    events.push({type:'action',who:'You',action:'STEAL',text:'You used STEAL on '+pl[tgt].n+'!',effect:'slash',target:tgt});
    if(tgtBarrier){
      stats.stealsBlocked++;
      events.push({type:'result',text:pl[tgt].n+"'s BARRIER blocked your steal!",effect:'shield_block'});
      lg.push('R'+rd+': Steal on '+pl[tgt].n+' - BLOCKED!');
    }else if(pl[tgt].cc<=0){
      events.push({type:'result',text:pl[tgt].n+' has no cards to steal!',effect:'none'});
      lg.push('R'+rd+': Steal failed - '+pl[tgt].n+' has no cards!');
    }else{
      const stolen=removeCardFromPlayer(tgt,-1);
      if(stolen>0&&addCardToPlayer(0,stolen)){
        events.push({type:'result',text:'You stole '+CD[stolen-1].n+' from '+pl[tgt].n+'!',effect:'damage',target:tgt,isCritical:true});
        lg.push('R'+rd+': Stole '+CD[stolen-1].n+' from '+pl[tgt].n+'!');
        streakCount++;streakDisplayTimer=60;sfxStreakUp();
      }else if(stolen>0){
        // Hand full — queue discard prompt so stolen card isn't lost
        events.push({type:'result',text:'You stole '+CD[stolen-1].n+' but hand full! Discard one after battle.',effect:'damage',target:tgt,isCritical:true});
        events._pendingDrawCard=stolen;
        lg.push('R'+rd+': Stole '+CD[stolen-1].n+' - hand full!');
        streakCount++;streakDisplayTimer=60;sfxStreakUp();
      }else{
        events.push({type:'result',text:'Steal failed!',effect:'none'});
        lg.push('R'+rd+': Steal failed!');
      }
    }
  }else if(bpAction===2){// BARRIER
    sp.b=Math.max(0,sp.b-1);
    events.push({type:'action',who:'You',action:'BARRIER',text:'You raised a BARRIER!',effect:'shield'});
    lg.push('R'+rd+': You raised a Barrier!');
  }else if(bpAction===3){// SCOUT
    sp.c=Math.max(0,sp.c-1);stats.scoutUses++;
    const tgt=bpSelectedTarget;
    events.push({type:'action',who:'You',action:'SCOUT',text:'You used SCOUT on '+pl[tgt].n+'!',effect:'none'});
    const rCards=pl[tgt].cd.filter(c=>c>0).map(c=>CD[c-1].n);
    const scoutMsg=rCards.length>0?pl[tgt].n+' has: '+rCards.join(', '):pl[tgt].n+' has no cards!';
    events.push({type:'result',text:scoutMsg,effect:'none'});
    lg.push('R'+rd+': Scout > '+scoutMsg);
  }else if(bpAction===4){// USE CARD
    // Consume selected card in hand for effect
    const filled=[];for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
    if(filled.length>0){
      const slot=bpSelectedCardSlot;const card=removeCardFromPlayer(0,slot);
      const cr=CD[card-1];
      events.push({type:'action',who:'You',action:'USE CARD',text:'You consumed '+cr.n+'!',effect:'none'});
      // Apply effect based on card type
      if(card===1){sp.s+=2;events.push({type:'result',text:'Aegis: +2 Steal charges!',effect:'card_get'});lg.push('R'+rd+': Used Aegis - +2 Steal!');}
      else if(card===2){events.push({type:'result',text:'Umbra: Invisible this turn!',effect:'shield'});bpPlayerBarrier=true;lg.push('R'+rd+': Used Umbra - invisible!');}
      else if(card===3){
        const ftgt=bpSelectedTarget;
        const burned=removeCardFromPlayer(ftgt,-1);
        if(burned>0){events.push({type:'result',text:'Ignis: Burned '+CD[burned-1].n+' from '+pl[ftgt].n+'!',effect:'damage',target:ftgt,isCritical:true});lg.push('R'+rd+': Used Ignis - burned '+CD[burned-1].n+'!');}
        else{events.push({type:'result',text:'Ignis: '+pl[ftgt].n+' had no cards to burn!',effect:'none'});lg.push('R'+rd+': Ignis fizzled!');}
      }
      else if(card===4){bpPlayerBarrier=false;events.push({type:'result',text:'Tempest: All barriers disabled this round!',effect:'none'});rivalBarriers[0]=false;rivalBarriers[1]=false;lg.push('R'+rd+': Used Tempest - barriers disabled!');}
      else if(card===5){
        // Copy: duplicate a random card from target
        const vtgt=bpSelectedTarget;
        const rFilled=[];for(let i=0;i<5;i++){if(pl[vtgt].cd[i]>0)rFilled.push(pl[vtgt].cd[i]);}
        if(rFilled.length>0){
          const copied=rFilled[Math.floor(Math.random()*rFilled.length)];
          if(addCardToPlayer(0,copied)){
            events.push({type:'result',text:'Nihil: Copied '+CD[copied-1].n+' from '+pl[vtgt].n+'!',effect:'card_get'});lg.push('R'+rd+': Used Nihil - copied '+CD[copied-1].n+'!');
          }else{
            events.push({type:'result',text:'Nihil: Copied '+CD[copied-1].n+' but hand full! Discard after battle.',effect:'none'});
            events._pendingDrawCard=copied;
            lg.push('R'+rd+': Nihil copied '+CD[copied-1].n+' - hand full!');
          }
        }
        else{events.push({type:'result',text:'Nihil: Nothing to copy!',effect:'none'});lg.push('R'+rd+': Nihil fizzled!');}
      }
    }else{
      events.push({type:'action',who:'You',action:'USE CARD',text:'No cards to use!',effect:'none'});
    }
  }

  // ── RIVAL 1 ACTION ──
  const r1Act=bpRivalActions[0];
  if(r1Act===0){// Rival draws
    const cardId=pickAreaCardForMap(rivalMaps[0]);const cr=CD[cardId-1];
    if(addCardToPlayer(1,cardId)){
      events.push({type:'action',who:pl[1].n,action:'DRAW',text:pl[1].n+' used DRAW and got '+cr.n+'!',effect:'card_get_rival'});
      lg.push('R'+rd+': '+pl[1].n+' drew '+cr.n+'!');
    }else{
      // Rival hand full - discard random then draw
      removeCardFromPlayer(1,-1);
      addCardToPlayer(1,cardId);
      events.push({type:'action',who:pl[1].n,action:'DRAW',text:pl[1].n+' swapped a card for '+cr.n+'!',effect:'card_get_rival'});
      lg.push('R'+rd+': '+pl[1].n+' swapped for '+cr.n+'!');
    }
  }else if(r1Act===1){// Rival steals from player
    events.push({type:'action',who:pl[1].n,action:'STEAL',text:pl[1].n+' used STEAL on you!',effect:'slash',target:0});
    if(bpPlayerBarrier){
      events.push({type:'result',text:'Your BARRIER blocked the steal!',effect:'shield_block'});
      lg.push('R'+rd+': '+pl[1].n+' Steal - BLOCKED!');
    }else if(pl[0].cc<=0){
      events.push({type:'result',text:'You had no cards to steal!',effect:'none'});
      lg.push('R'+rd+': '+pl[1].n+' Steal failed - you have no cards!');
    }else{
      const stolen=removeCardFromPlayer(0,-1);
      if(stolen>0){
        if(!addCardToPlayer(1,stolen)){
          // Rival hand full, discard their weakest then add
          removeCardFromPlayer(1,-1);
          addCardToPlayer(1,stolen);
        }
        events.push({type:'result',text:pl[1].n+' stole your '+CD[stolen-1].n+'!',effect:'damage',target:0,isCritical:true});
        lg.push('R'+rd+': '+pl[1].n+' stole your '+CD[stolen-1].n+'!');
        screenShake(4,10);
        if(streakCount>0){streakCount=0;streakLostTimer=60;sfxStreakLost();}
      }
    }
  }else if(r1Act===2){// Rival barrier (already tracked)
    events.push({type:'action',who:pl[1].n,action:'BARRIER',text:pl[1].n+' raised a BARRIER!',effect:'shield'});
    lg.push('R'+rd+': '+pl[1].n+' raised Barrier!');
  }else{// Scout
    events.push({type:'action',who:pl[1].n,action:'SCOUT',text:pl[1].n+' used SCOUT on you!',effect:'none'});
    lg.push('R'+rd+': '+pl[1].n+' scouted you!');
  }

  // ── RIVAL 2 (HUNTER) ACTION ──
  const r2Act=bpRivalActions[1];
  if(r2Act===0){
    const cardId=pickAreaCardForMap(rivalMaps[1]);const cr=CD[cardId-1];
    if(addCardToPlayer(2,cardId)){
      events.push({type:'action',who:pl[2].n,action:'DRAW',text:pl[2].n+' used DRAW and got '+cr.n+'!',effect:'card_get_rival'});
      lg.push('R'+rd+': '+pl[2].n+' drew '+cr.n+'!');
    }else{
      removeCardFromPlayer(2,-1);
      addCardToPlayer(2,cardId);
      events.push({type:'action',who:pl[2].n,action:'DRAW',text:pl[2].n+' swapped a card for '+cr.n+'!',effect:'card_get_rival'});
      lg.push('R'+rd+': '+pl[2].n+' swapped for '+cr.n+'!');
    }
  }else if(r2Act===1){
    events.push({type:'action',who:pl[2].n,action:'STEAL',text:pl[2].n+' tried STEAL!',effect:'slash',target:0});
    if(bpPlayerBarrier){
      events.push({type:'result',text:'Your BARRIER blocked it!',effect:'shield_block'});
    }else if(pl[0].cc<=0){
      events.push({type:'result',text:'You had no cards!',effect:'none'});
    }else{
      const stolen=removeCardFromPlayer(0,-1);
      if(stolen>0){
        if(!addCardToPlayer(2,stolen)){
          removeCardFromPlayer(2,-1);
          addCardToPlayer(2,stolen);
        }
        events.push({type:'result',text:pl[2].n+' stole your '+CD[stolen-1].n+'!',effect:'damage',target:0,isCritical:true});
        lg.push('R'+rd+': '+pl[2].n+' stole your '+CD[stolen-1].n+'!');
        screenShake(4,10);
        if(streakCount>0){streakCount=0;streakLostTimer=60;sfxStreakLost();}
      }
    }
  }else if(r2Act===2){
    events.push({type:'action',who:pl[2].n,action:'BARRIER',text:pl[2].n+' raised a BARRIER!',effect:'shield'});
  }else{
    events.push({type:'action',who:pl[2].n,action:'SCOUT',text:pl[2].n+' used SCOUT!',effect:'none'});
  }

  return events;
}

// Card effect animation helpers
function drawCrystalEffect(cx_,cy_,evT){
  // Blue energy spiral around player sprite, then lightning bolt
  if(evT===1)sfxCrystal();
  const a=Math.max(0,1-evT/35);
  g.save();g.globalAlpha=a;
  for(let i=0;i<8;i++){
    const ang=evT*0.2+i*(Math.PI*2/8);
    const dist=20+evT*1.5;
    const px_=cx_+Math.cos(ang)*dist;
    const py_=cy_+Math.sin(ang)*dist*0.6;
    bx(px_-2,py_-2,4,4,'#48b8e8');bx(px_-1,py_-1,2,2,'#a0e0ff');
  }
  // Lightning bolt at mid-animation
  if(evT>15&&evT<30){
    g.strokeStyle=`rgba(100,200,255,${(30-evT)/15})`;g.lineWidth=2;
    g.beginPath();g.moveTo(cx_,cy_-20);
    g.lineTo(cx_+10,cy_-5);g.lineTo(cx_-5,cy_+5);g.lineTo(cx_+15,cy_+25);
    g.stroke();
    g.strokeStyle=`rgba(200,240,255,${(30-evT)/20})`;g.lineWidth=1;
    g.beginPath();g.moveTo(cx_+2,cy_-18);
    g.lineTo(cx_+12,cy_-3);g.lineTo(cx_-3,cy_+7);g.lineTo(cx_+17,cy_+27);
    g.stroke();
  }
  g.globalAlpha=1;g.restore();
}

function drawShadowEffect(cx_,cy_,evT){
  if(evT===1)sfxShadow();
  // Player fades to semi-transparent with dark particles
  if(evT<25){
    const a=0.3+Math.sin(evT*0.3)*0.2;
    g.globalAlpha=a;
    bx(cx_-25,cy_-30,50,60,'rgba(80,40,120,.4)');
    g.globalAlpha=1;
  }
  // Dark particles rising
  for(let i=0;i<6;i++){
    const px_=cx_-15+i*6+Math.sin(evT*0.2+i)*4;
    const py_=cy_+20-evT*1.5-i*3;
    const pa=Math.max(0,1-evT/30);
    bx(px_,py_,3,3,`rgba(80,30,120,${pa})`);
    bx(px_+1,py_+1,1,1,`rgba(140,80,180,${pa})`);
  }
}

function drawFlameEffect(cx_,cy_,evT){
  if(evT===1)sfxFlame();
  // Fire particles erupting from center
  for(let i=0;i<12;i++){
    const ang=i*(Math.PI*2/12)+evT*0.05;
    const dist=evT*2+Math.sin(i*1.3)*8;
    const px_=cx_+Math.cos(ang)*dist;
    const py_=cy_+Math.sin(ang)*dist*0.5-evT*0.5;
    const pa=Math.max(0,1-evT/35);
    const sz=4-evT*0.08;
    if(sz>0){
      bx(px_-sz/2,py_-sz/2,sz,sz,`rgba(220,80,40,${pa})`);
      bx(px_-sz/4,py_-sz/4,sz/2,sz/2,`rgba(255,200,60,${pa})`);
    }
  }
  // Target flash red
  if(evT<10){
    g.globalAlpha=(10-evT)/10*0.4;
    bx(0,0,W,H,'#ff2020');
    g.globalAlpha=1;
  }
}

function drawStormEffect(evT){
  if(evT===1)sfxStorm();
  // Screen shake
  if(evT<20){
    const shk=Math.sin(evT*2)*(20-evT)*0.3;
    g.save();g.translate(shk,shk*0.5);
  }
  // Lightning bolts across top
  if(evT<25){
    const a=Math.max(0,1-evT/25);
    g.strokeStyle=`rgba(255,255,200,${a})`;g.lineWidth=3;
    for(let i=0;i<3;i++){
      const sx_=80+i*200+Math.sin(evT+i)*20;
      g.beginPath();g.moveTo(sx_,0);
      g.lineTo(sx_+15,40);g.lineTo(sx_-10,80);g.lineTo(sx_+20,120);
      g.stroke();
    }
    // Flash
    if(evT%4<2){g.globalAlpha=a*0.3;bx(0,0,W,H,'#fff');g.globalAlpha=1;}
  }
  if(evT<20)g.restore();
}

function drawVoidEffect(cx_,cy_,evT){
  if(evT===1)sfxVoid();
  // Purple vortex in center
  const a=Math.max(0,1-evT/35);
  g.save();g.globalAlpha=a;
  for(let i=0;i<10;i++){
    const ang=evT*0.3+i*(Math.PI*2/10);
    const dist=30-evT*0.3+Math.sin(evT*0.5+i)*5;
    const px_=cx_+Math.cos(ang)*dist;
    const py_=cy_+Math.sin(ang)*dist*0.6;
    bx(px_-2,py_-2,4,4,`rgba(100,50,160,${a})`);
    bx(px_-1,py_-1,2,2,`rgba(180,100,220,${a})`);
  }
  // Card shape flying
  if(evT>10&&evT<30){
    const t_=(evT-10)/20;
    const cardX=lerp(cx_+60,cx_-60,t_);
    const cardY=cy_-10+Math.sin(t_*Math.PI)*-20;
    bx(cardX-6,cardY-8,12,16,'#7858a0');bx(cardX-5,cardY-7,10,14,'#9878c0');
    tx('?',cardX-3,cardY+4,6,'#fff');
  }
  g.globalAlpha=1;g.restore();
}

function drawResolvingPhase(){
  drawBattleBG();
  drawPhaseBanner('resolving');
  drawBattleArena();
  drawOpponentInfoBox();
  drawPlayerInfoBox();
  const t=fr-bpFrame,eventDuration=50,currentIdx=Math.floor(t/eventDuration);
  if(currentIdx<bpResolveQueue.length){
    bpResolveIdx=currentIdx;const ev=bpResolveQueue[currentIdx];const evT=t%eventDuration;
    // Trigger QTE on critical events (Steal, Flame, Void) at frame 15
    if(ev.isCritical&&evT===15&&!qteActive&&qteEventIdx!==currentIdx){
      qteActive=true;qteFrame=0;qteKeyPressed=false;qteSuccess=false;
      qteEventIdx=currentIdx;
      qteType=(ev.target===0)?'defend':'attack';
      sfxQtePrompt();
    }
    // Typewriter text box at bottom
    const slideIn=Math.min(1,evT/12);const textX=W*(1-slideIn)+16*slideIn;
    win(4,H-70,W-8,64);
    txShadow(ev.text,textX,H-38,14,'#303028','rgba(200,180,140,.3)');
    // Brief pause indicator
    if(evT>38){
      const dotCount=Math.floor((evT-38)/4)%4;
      txShadow('.'.repeat(dotCount),textX+ev.text.length*14+4,H-38,14,'#a09080','rgba(0,0,0,.2)');
    }
    // === EFFECT ANIMATIONS ===
    const playerCX=160,playerCY=H-130;
    const oppCX=W-200,oppCY=130;
    if(ev.effect==='slash'&&evT<25){
      const tgtCX=ev.target===0?playerCX:oppCX;
      const tgtCY=ev.target===0?playerCY:oppCY;
      g.save();g.strokeStyle=`rgba(200,40,40,${1-evT/25})`;g.lineWidth=3;
      for(let i=0;i<4;i++){
        g.beginPath();
        g.moveTo(tgtCX-20+i*10,tgtCY-20+i*5);
        g.lineTo(tgtCX+20+i*10,tgtCY+20+i*5);
        g.stroke();
      }
      g.restore();if(evT===1)sfxSlash();
    }
    if(ev.effect==='shield'&&evT<30){
      const r_=evT*2.5,a_=1-evT/30;g.save();
      g.strokeStyle=`rgba(48,96,176,${a_})`;g.lineWidth=3;
      g.beginPath();g.arc(playerCX,playerCY,r_,0,Math.PI*2);g.stroke();
      g.strokeStyle=`rgba(100,160,240,${a_*.6})`;g.lineWidth=2;
      g.beginPath();g.arc(playerCX,playerCY,r_*.7,0,Math.PI*2);g.stroke();
      // Shield icon
      if(evT<15){
        g.globalAlpha=1-evT/15;
        bx(playerCX-8,playerCY-12,16,20,'rgba(60,120,200,.5)');
        bx(playerCX-6,playerCY-10,12,16,'rgba(100,180,255,.4)');
      }
      g.globalAlpha=1;g.restore();if(evT===1)sfxShield();
    }
    if(ev.effect==='shield_block'&&evT<30){
      const r_=evT*3,a_=1-evT/30;g.save();
      g.strokeStyle=`rgba(48,96,240,${a_})`;g.lineWidth=4;
      g.beginPath();g.arc(playerCX,playerCY,r_,0,Math.PI*2);g.stroke();
      if(evT<10){
        g.globalAlpha=(10-evT)/10*0.5;
        bx(playerCX-30,playerCY-30,60,60,'#6090ff');
        g.globalAlpha=1;
      }
      // "BLOCKED" text
      if(evT>5&&evT<25){
        g.globalAlpha=Math.min(1,(evT-5)/5)*Math.max(0,(25-evT)/10);
        txShadow('BLOCKED!',playerCX-50,playerCY-40,16,'#4080ff','rgba(0,0,30,.6)');
        g.globalAlpha=1;
      }
      g.restore();if(evT===1)sfxShield();
    }
    if(ev.effect==='damage'&&evT<20){
      bpShakeTarget=ev.target!==undefined?ev.target:0;bpShakeTimer=20-evT;
      if(evT===1)sfxDamage();
      // Flash on target
      if(evT<6&&evT%2===0){
        const tgtCX=ev.target===0?playerCX:oppCX;
        const tgtCY=ev.target===0?playerCY:oppCY;
        g.globalAlpha=0.5;bx(tgtCX-30,tgtCY-40,60,80,'#ff4040');g.globalAlpha=1;
      }
    }
    else if(ev.effect!=='damage'&&evT>20)bpShakeTimer=0;
    if(ev.effect==='card_get'&&evT<35){
      // Card rising with sparkles
      const cardY=playerCY+30-evT*2;const scale_=Math.min(1,evT/15);
      const cw_=40*scale_,ch_=56*scale_;
      bx(playerCX-cw_/2,cardY-ch_/2,cw_,ch_,'#d85840');
      bx(playerCX-cw_/2+2,cardY-ch_/2+2,cw_-4,ch_-4,'#e87060');
      if(scale_>.5)tx('\u25B2',playerCX-6,cardY+4,Math.floor(12*scale_),'#fff');
      for(let i=0;i<8;i++){
        const ang=i*(Math.PI*2/8)+evT*.15,dist=12+evT*.8;
        const pa=Math.max(0,1-evT/35);
        bx(playerCX+Math.cos(ang)*dist,cardY+Math.sin(ang)*dist,3,3,`rgba(255,255,200,${pa})`);
      }
      if(evT===1)sfxCardGet();
    }
    if(ev.effect==='card_get_rival'&&evT<25){
      const riseY=oppCY+20-evT*1.5;
      bx(oppCX-10,riseY-14,20,28,'#d85840');bx(oppCX-8,riseY-12,16,24,'#e87060');
      tx('\u25B2',oppCX-4,riseY+6,8,'#fff');
      if(evT===1)sfxCardGet();
    }
    // Card consumption effect animations based on card name in event text
    if(ev.text&&ev.text.includes('Aegis')&&ev.type==='result'&&evT<35){
      drawCrystalEffect(playerCX,playerCY,evT);
    }
    if(ev.text&&ev.text.includes('Umbra')&&ev.type==='result'&&evT<30){
      drawShadowEffect(playerCX,playerCY,evT);
    }
    if(ev.text&&ev.text.includes('Ignis')&&ev.type==='result'&&evT<35){
      drawFlameEffect(W/2,H/2-20,evT);
    }
    if(ev.text&&ev.text.includes('Tempest')&&ev.type==='result'&&evT<25){
      drawStormEffect(evT);
    }
    if(ev.text&&ev.text.includes('Nihil')&&ev.type==='result'&&evT<35){
      drawVoidEffect(W/2,H/2-20,evT);
    }
    // QTE overlay
    if(qteActive){
      const qteProgress=qteFrame/qteWindow;
      const qteAlpha=1-qteProgress*0.5;
      g.globalAlpha=qteAlpha;
      // Flash background
      if(qteFrame%4<2)bx(W/2-100,H/2-60,200,50,'rgba(200,40,40,.4)');
      // Prompt text
      const promptText=qteType==='defend'?'PRESS Z TO BLOCK!':'PRESS Z FOR BONUS!';
      txShadow(promptText,W/2-120,H/2-35,12,'#fff','rgba(200,40,40,.8)');
      // Timer bar
      bx(W/2-80,H/2-18,160,6,'#333');
      bx(W/2-80,H/2-18,Math.floor(160*(1-qteProgress)),6,qteProgress<0.5?'#40d040':'#d04040');
      g.globalAlpha=1;
    }
    // QTE result flash
    if(qteResultTimer>0){
      const ra=qteResultTimer/40;
      g.globalAlpha=ra;
      const rc=qteResultText==='BLOCKED!'||qteResultText==='BONUS!'?'#40d040':'#d04040';
      txShadow(qteResultText,W/2-50,H/2-35,14,rc,'rgba(0,0,0,.6)');
      g.globalAlpha=1;
    }
  }else{
    // Anti-softlock: if player has 0 cards and 0 spells after resolve, give a pity card
    if(pl[0].cd.filter(c=>c>0).length===0&&sp.s<=0&&sp.b<=0&&sp.c<=0){
      const pityCard=pickAreaCard();
      addCardToPlayer(0,pityCard);

function drawCardAcquisition(){
  if(!cardAcqActive)return;
  const t=fr-cardAcqFrame,totalFrames=120;
  if(t>=totalFrames){cardAcqActive=false;cardAcqDone=true;return;}
  const cr=CD[cardAcqCard];if(!cr)return;

  let cx_,cy_,scale,alpha=1;
  if(t<50){
    const p=t/50,ease=1-Math.pow(1-p,3);
    cx_=W/2;cy_=H+30-ease*(H/2+30);scale=.2+ease*.8;
  }else if(t<90){
    cx_=W/2;cy_=H/2-20;scale=1;
    if(t%3===0){
      const angle=Math.random()*Math.PI*2,speed=1+Math.random()*2;
      cardAcqParticles.push({x:cx_,y:cy_,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:20+Math.random()*10,c:Math.random()>.5?'#fff':'#f0c830'});
    }
  }else{
    const p=(t-90)/30,ease=p*p;
    cx_=W/2+(280-W/2)*ease;cy_=(H/2-20)+(H-40-(H/2-20))*ease;scale=1-ease*.85;
  }

  const cw=60*scale,ch=84*scale;
  g.globalAlpha=alpha;
  // Draw card frame with character
  drawCardFrame(cx_-cw/2,cy_-ch/2,cw,ch,cardAcqCard,scale>.6);
  g.globalAlpha=1;

  if(t>=50&&t<90){win(W/2-150,cy_+ch/2+12,300,40);txShadow('You obtained '+cr.n+'!',W/2-130,cy_+ch/2+38,14,'#303028','rgba(200,180,140,.3)');}

  for(let i=cardAcqParticles.length-1;i>=0;i--){
    const p=cardAcqParticles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0){cardAcqParticles.splice(i,1);continue;}
    g.globalAlpha=Math.min(1,p.life/10);bx(p.x,p.y,2,2,p.c);g.globalAlpha=1;
  }

}

function dLog(){
  // Dark background with subtle noise
  bx(0,0,W,H,'#0c0c18');

    const nx=(i*73+17)%W,ny=(i*41+23)%H;

  win(16,10,W-32,42);
  txShadow('BATTLE LOG',W/2-90,38,14,'#f0e8c0','rgba(0,0,0,.5)');

  // Scrollable log entries
  const entryH=32;
  const maxVisible=14;
  const padTop=60;
  const totalEntries=lg.length;
  const maxScroll=Math.max(0,totalEntries-maxVisible);
  logScrollOff=Math.max(0,Math.min(logScrollOff,maxScroll));
  const startIdx=Math.max(0,totalEntries-maxVisible-logScrollOff);
  const endIdx=Math.min(totalEntries,startIdx+maxVisible);
  const visibleLogs=lg.slice(startIdx,endIdx);

  // Single window for all entries
  win(16,padTop-8,W-32,maxVisible*entryH+16);

  visibleLogs.forEach((l,i)=>{
    const y=padTop+i*entryH+4;
    // Determine entry color
    let col='#888898';
    if(l.includes('Steal')||l.includes('Ignis')||l.includes('ambush')){col='#e06060';}
    else if(l.includes('Block')||l.includes('Barrier')){col='#6090d0';}
    else if(l.includes('drew')||l.includes('Scout')||l.includes('Found')){col='#60c060';}
    else if(l.includes('Umbra')){col='#a878c8';}
    else if(l.includes('Wild')||l.includes('Fishing')){col='#e0c040';}
    else if(l.startsWith('[ON-CHAIN]')){col='#50e090';}
    else if(l.includes('entered')){col='#d08050';}

    // Color dot + text — bright white text for readability
    bx(30,y+4,6,6,col);

    // Thin separator line
    if(i<visibleLogs.length-1) bx(30,y+entryH-2,W-76,1,'#1a1a30');
  });

  // Scroll indicators
  if(logScrollOff<maxScroll){

    if(blink)txShadow('\u25BC  newer',W/2-50,padTop+maxVisible*entryH+6,8,'#d8b028','rgba(0,0,0,.4)');
  }

  // Entry count
  txShadow(totalEntries+' entries',W-180,H-18,8,'#484858','rgba(0,0,0,.3)');

  // Back prompt
  win(W/2-100,H-38,200,28);
  txShadow('X = Back',W/2-32,H-16,8,FRLG.selHighlight,'rgba(0,0,0,.4)');
}

// FISHING MINIGAME (Corsair Bay docks)
// ═══════════════════════════════════════
function canFish(){
  if(currentMap!==0||fishingCooldownTimer>0||inBuilding)return false;
  const p=pl[0],m=getMap();
  // Check if player is on dock and facing water
  const tile=m[p.y]?.[p.x];
  if(tile!==10)return false;
  let fx=p.x,fy=p.y;
  if(p.dir===0)fy++;else if(p.dir===2)fy--;
  else if(p.dir===1)fx--;else if(p.dir===3)fx++;
  if(fx>=0&&fx<MW&&fy>=0&&fy<MH){
    const facingTile=m[fy]?.[fx];
    if(facingTile===0||facingTile===17)return true;
  }
  return false;
}

function startFishing(){
  fishingActive=true;
  fishingPhase='waiting';
  fishingTimer=60+Math.floor(Math.random()*120); // 1-3 seconds at 60fps
  sfxFishCast();
  twSet('Cast a line... wait for it...');
}

function updateFishing(){
  if(!fishingActive)return;
  if(fishingPhase==='waiting'){
    fishingTimer--;
    if(fishingTimer<=0){
      fishingPhase='bite';
      fishingBiteFrame=fr;
      sfxFishBite();
    }
  }else if(fishingPhase==='bite'){
    // Player has 30 frames (0.5s) to press Z
    if(fr-fishingBiteFrame>30){
      fishingPhase='miss';
      fishingTimer=60;
      sfxFishMiss();
      twSet('The catch got away!');
    }
  }else if(fishingPhase==='catch'){
    fishingTimer--;
    if(fishingTimer<=0){
      fishingActive=false;
      fishingCooldownTimer=FISHING_COOLDOWN;
    }
  }else if(fishingPhase==='miss'){
    fishingTimer--;
    if(fishingTimer<=0){
      fishingActive=false;
      fishingCooldownTimer=FISHING_COOLDOWN;
    }
  }
}

function fishingCatchCard(){
  fishingPhase='catch';
  fishingTimer=90;
  sfxFishCatch();
  // Random dock spirit card (Aegis or Umbra)
  const cardIdx=Math.random()<0.5?0:1;
  let slot=-1;
  for(let i=0;i<5;i++){if(pl[0].cd[i]===0){slot=i;break;}}
  if(slot>=0){
    pl[0].cd[slot]=cardIdx+1;
    cardTimers[slot]=Date.now();
    syncCardCount(0);
    startCardAcquisition(cardIdx);
    twSet('You caught a '+CD[cardIdx].n+' card!');
    lg.push('Fishing: Caught '+CD[cardIdx].n+'!');
    checkWinAndTransition(2000);
  }else{
    discardActive=true;discardSelIdx=0;discardPendingCard=cardIdx+1;discardSource='wild';
    twSet('Caught '+CD[cardIdx].n+'! Discard one to keep it.');
  }
}

function drawFishingOverlay(){
  if(!fishingActive)return;
  if(fishingPhase==='bite'){
    // Show "!" indicator
    const bobY=Math.sin(fr*0.3)*3;
    const px=pl[0].visualX-camX+8,py=pl[0].visualY-camY-30+bobY;
    bx(px-6,py-4,12,16,'#fff');
    bx(px-5,py-3,10,14,'#f0c830');
    tx('!',px-4,py+8,12,'#c04040');
    tx('Z NOW!',px-18,py+16,5,'#c04040');
  }else if(fishingPhase==='waiting'){
    // Show bobber animation
    const px=pl[0].visualX-camX,py=pl[0].visualY-camY;
    let bx_=px,by_=py;
    if(pl[0].dir===0){by_+=20;}else if(pl[0].dir===2){by_-=20;}
    else if(pl[0].dir===1){bx_-=20;}else{bx_+=20;}
    const bob=Math.sin(fr*0.1)*2;
    g.fillStyle='#c04040';g.beginPath();g.arc(bx_+8,by_+bob,3,0,Math.PI*2);g.fill();
    // Line from player to bobber
    g.strokeStyle='#a0a0a0';g.lineWidth=1;
    g.beginPath();g.moveTo(px+8,py);g.lineTo(bx_+8,by_+bob);g.stroke();
  }
}

// FOREST TRAPS
// ═══════════════════════════════════════
function checkForestTrap(){
  if(currentMap!==1)return false;
  const key='1-'+pl[0].x+'-'+pl[0].y;
  if(forestTraps.has(key)&&!triggeredTraps.has(key)){
    triggeredTraps.add(key);
    sfxTrap();
    flash();
    twSet('You triggered a trap!');
    // Reset streak on trap
    if(streakCount>0){streakCount=0;streakLostTimer=60;sfxStreakLost();}
    // Lose a random card
    const filled=[];
    for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
    if(filled.length>0){
      const slot=filled[Math.floor(Math.random()*filled.length)];
      const lost=pl[0].cd[slot];
      pl[0].cd[slot]=0;
      syncCardCount(0);
      lg.push('Trap! Lost '+CD[lost-1].n+'!');
      objectInteractMsg='Lost '+CD[lost-1].n+' to a trap!';
      objectInteractTimer=120;
    }else{
      lg.push('Trap triggered but you had no cards!');
      objectInteractMsg='Trap triggered! Lucky - no cards to lose.';
      objectInteractTimer=120;
    }
    return true;
  }
  return false;
}

// RUINS PUZZLE
// ═══════════════════════════════════════
function checkPuzzleInteraction(){
  if(currentMap!==2||puzzleSolved)return false;
  const p=pl[0];
  let fx=p.x,fy=p.y;
  if(p.dir===0)fy++;else if(p.dir===2)fy--;
  else if(p.dir===1)fx--;else if(p.dir===3)fx++;
  // Check if facing a puzzle pillar
  for(let i=0;i<3;i++){
    const pp=puzzlePillarPositions[i];
    if(fx===pp.x&&fy===pp.y){
      // Cycle stone at position i
      puzzleStoneOrder[i]=(puzzleStoneOrder[i]+1)%3;
      sfxSelect();
      const name=puzzleNames[puzzleStoneOrder[i]];
      puzzleMessage='Stone '+String(i+1)+' is now '+name;
      puzzleMessageTimer=90;
      // Check if solved: 0=red(fire), 1=blue(water), 2=yellow(light)
      if(puzzleStoneOrder[0]===0&&puzzleStoneOrder[1]===1&&puzzleStoneOrder[2]===2){
        puzzleSolved=true;
        sfxPuzzle();
        puzzleMessage='The passage opens!';
        puzzleMessageTimer=180;
        twSet('The passage opens! A void card appears!');
        lg.push('Ruins puzzle solved!');
        // Give a Void card
        let slot=-1;
        for(let j=0;j<5;j++){if(pl[0].cd[j]===0){slot=j;break;}}
        if(slot>=0){
          pl[0].cd[slot]=5;
          cardTimers[slot]=Date.now();
          syncCardCount(0);
          startCardAcquisition(4);
          checkWinAndTransition(2000);
        }else{
          discardActive=true;discardSelIdx=0;discardPendingCard=5;discardSource='wild';
        }
      }
      return true;
    }
  }
  return false;
}

function drawPuzzlePillars(){
  if(currentMap!==2)return;
  for(let i=0;i<3;i++){
    const pp=puzzlePillarPositions[i];
    const px=pp.x*TW-camX,py=pp.y*TH-camY;
    if(px<-TW||px>W||py<-TH||py>H)continue;
    if(!fogRevealed[2][pp.y]?.[pp.x])continue;
    // Draw colored pillar
    const col=puzzleColors[puzzleStoneOrder[i]];
    if(!puzzleSolved){
      bx(px+4,py+2,8,12,col);
      bx(px+5,py+3,6,10,lighten(col,.15));
      bx(px+3,py,10,3,col);
      // Label
      const label=puzzleNames[puzzleStoneOrder[i]][0];
      tx(label,px+5,py+13,5,'#fff');
      // Glow
      const pulse=Math.sin(fr*.06+i*2)*.2+.4;
      g.fillStyle=col.replace(')',`,${pulse})`).replace('rgb','rgba');
      if(col[0]==='#'){
        g.fillStyle=`rgba(${parseInt(col.slice(1,3),16)},${parseInt(col.slice(3,5),16)},${parseInt(col.slice(5,7),16)},${pulse})`;
      }
      g.beginPath();g.arc(px+8,py+8,8,0,Math.PI*2);g.fill();
    }
  }
}

function drawPuzzleMessage(){
  if(puzzleMessageTimer<=0)return;
  puzzleMessageTimer--;
  const alpha=puzzleMessageTimer>20?1:puzzleMessageTimer/20;
  g.globalAlpha=alpha;
  win(W/2-160,H/2-20,320,36);
  tx(puzzleMessage,W/2-140,H/2+4,7,'#d0c040');
  g.globalAlpha=1;
}

function enterBuilding(type,doorX,doorY){
  buildingType=type;
  buildingReturnX=pl[0].x;
  buildingReturnY=pl[0].y;
  buildingReturnMap=currentMap;
  buildingPlayerX=4;
  buildingPlayerY=6;
  buildingPlayerDir=2;
  sfxDoorOpen();
  // Door opening animation: dark rectangle expanding from door position
  const doorScreenX=doorX*TW-camX+TW/2;
  const doorScreenY=doorY*TH-camY+TH/2;
  startWipe('door_open',20,()=>{
    inBuilding=true;
    startWipe('door_close',15);
  },doorScreenX,doorScreenY);
}

function exitBuilding(){
  sfxDoorOpen();
  // Door close animation then restore map
  startWipe('door_open',15,()=>{
    inBuilding=false;
    pl[0].x=buildingReturnX;
    pl[0].y=buildingReturnY;
    currentMap=buildingReturnMap;
    startWipe('door_close',15,null,W/2,H/2);
  },W/2,H/2);
}

function getBuildingMap(){
  if(buildingType==='shop')return BUILDING_SHOP;
  if(buildingType==='info')return BUILDING_INFO;
  return BUILDING_SHOP;
}

function buildingTileWalkable(t){return t===0||t===4||t===5;}

function checkBuildingEntry(){
  const p=pl[0],m=getMap();
  let fx=p.x,fy=p.y;
  if(p.dir===0)fy++;else if(p.dir===2)fy--;
  else if(p.dir===1)fx--;else if(p.dir===3)fx++;
  if(fx>=0&&fx<MW&&fy>=0&&fy<MH){
    const t=m[fy]?.[fx];
    // Trading Post door (building type 5 at specific locations)
    // Check for Pirate Merchant NPC building - tile 5 in Corsair Bay
    if(currentMap===0&&t===5){
      // Check which building: (8,5) is trading post, (22,5)=spy master area -> (22,6 door)
      if(fx===8&&fy===5){enterBuilding('shop',fx,fy);return true;}
      if(fx===20&&fy===11){enterBuilding('shop',fx,fy);return true;}
    }
    if(currentMap===0&&t===15){
      // Blue building = Spy Masters Den
      if(fx===22&&fy===5){enterBuilding('info',fx,fy);return true;}
    }
  }
  return false;
}

function getFacingTile(){
  const p=pl[0],m=getMap();
  let fx=p.x,fy=p.y;
  if(p.dir===0)fy++;else if(p.dir===2)fy--;
  else if(p.dir===1)fx--;else if(p.dir===3)fx++;
  if(fx>=0&&fx<MW&&fy>=0&&fy<MH)return{x:fx,y:fy,tile:m[fy]?.[fx]};
  return null;
}

function checkObjectInteraction(){
  const ft=getFacingTile();
  if(!ft)return false;
  const key=currentMap+'-'+ft.x+'-'+ft.y;

  // Tree interaction (type 3)
  if(ft.tile===3){
    if(shakenTrees.has(key)){
      objectInteractMsg='Already shaken this tree.';
      objectInteractTimer=60;
      return true;
    }
    shakenTrees.add(key);
    if(Math.random()<0.1){
      // 10% chance: card falls out
      const cardIdx=Math.floor(Math.random()*5);
      let slot=-1;
      for(let i=0;i<5;i++){if(pl[0].cd[i]===0){slot=i;break;}}
      if(slot>=0){
        pl[0].cd[slot]=cardIdx+1;
        cardTimers[slot]=Date.now();
        syncCardCount(0);
        startCardAcquisition(cardIdx);
        objectInteractMsg='A card fell from the tree!';
        lg.push('Shook tree: Found '+CD[cardIdx].n+'!');
        checkWinAndTransition(2000);
      }else{
        discardActive=true;discardSelIdx=0;discardPendingCard=cardIdx+1;discardSource='wild';
        objectInteractMsg='Found '+CD[cardIdx].n+'! Discard to keep.';
      }
    }else{
      objectInteractMsg='Nothing fell from the tree.';
    }
    objectInteractTimer=90;
    sfxSelect();
    return true;
  }

  // Rock interaction (type 8)
  if(ft.tile===8){
    if(pushedRocks.has(key)){
      objectInteractMsg='Already checked this rock.';
      objectInteractTimer=60;
      return true;
    }
    pushedRocks.add(key);
    sfxSelect();
    if(Math.random()<0.2){
      const areaCards=AREA_CARDS[currentMap]||[1,2];
      const cardId=areaCards[Math.floor(Math.random()*areaCards.length)];
      let slot=-1;
      for(let i=0;i<5;i++){if(pl[0].cd[i]===0){slot=i;break;}}
      if(slot>=0){
        pl[0].cd[slot]=cardId;
        cardTimers[slot]=Date.now();
        syncCardCount(0);
        startCardAcquisition(cardId-1);
        objectInteractMsg='Found a hidden card under the rock!';
        lg.push('Rock: Found '+CD[cardId-1].n+'!');
        checkWinAndTransition(2000);
      }else{
        discardActive=true;discardSelIdx=0;discardPendingCard=cardId;discardSource='wild';
        objectInteractMsg='Found '+CD[cardId-1].n+'! Discard to keep.';
      }
    }else{
      objectInteractMsg='Nothing under the rock.';
    }
    objectInteractTimer=90;
    return true;
  }

  // Campfire interaction (type 29, Forest only)
  if(ft.tile===29&&currentMap===1){
    if(campfireUsed){
      objectInteractMsg='Already rested here.';
      objectInteractTimer=60;
      return true;
    }
    campfireUsed=true;
    sfxConfirm();
    // Restore 1 spell charge: rotate Steal->Barrier->Scout
    if(sp.s<3){sp.s++;objectInteractMsg='Rested by campfire. +1 Steal charge!';lg.push('Campfire: +1 Steal!');}
    else if(sp.b<3){sp.b++;objectInteractMsg='Rested by campfire. +1 Barrier charge!';lg.push('Campfire: +1 Barrier!');}
    else if(sp.c<3){sp.c++;objectInteractMsg='Rested by campfire. +1 Scout charge!';lg.push('Campfire: +1 Scout!');}
    else{
      // All spells full — extend nearest-to-expiry card timer by 60s
      let nearestSlot=-1,nearestAge=0;
      for(let i=0;i<5;i++){if(cardTimers[i]>0){const age=Date.now()-cardTimers[i];if(age>nearestAge){nearestAge=age;nearestSlot=i;}}}
      if(nearestSlot>=0){cardTimers[nearestSlot]+=60000;objectInteractMsg='Rested. '+CD[pl[0].cd[nearestSlot]-1].n+' decay slowed!';lg.push('Campfire: Extended '+CD[pl[0].cd[nearestSlot]-1].n+' timer!');}
      else{objectInteractMsg='Rested, but nothing to restore.';}
    }
    objectInteractTimer=120;
    return true;
  }

  // Fountain interaction (type 20, Corsair Bay)
  if(ft.tile===20&&currentMap===0){
    const filled=[];
    for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
    if(filled.length===0){
      objectInteractMsg='Toss a card? You have none!';
      objectInteractTimer=90;
      return true;
    }
    fountainActive=true;
    fountainConfirm=true;
    sfxSelect();
    return true;
  }

  // Crystal interaction (type 26, Ruins)
  if(ft.tile===26&&currentMap===2){
    if(usedCrystals.has(key)){
      objectInteractMsg='This crystal is spent.';
      objectInteractTimer=60;
      return true;
    }
    usedCrystals.add(key);
    sfxSelect();
    if(Math.random()<0.5){
      // Reveal rivals on minimap for 60 seconds (3600 frames)
      crystalRevealTimer=3600;
      objectInteractMsg='The crystal glows! Rivals revealed!';
      lg.push('Crystal: Rivals revealed for 60s!');
    }else{
      objectInteractMsg='The crystal shattered! Nothing happened.';
      lg.push('Crystal shattered.');
    }
    objectInteractTimer=120;
    flash();
    return true;
  }

  return false;
}

function doFountainExchange(){
  const filled=[];
  for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
  if(filled.length===0)return;
  // Remove random card, give different random card
  const slot=filled[Math.floor(Math.random()*filled.length)];
  const oldCard=pl[0].cd[slot];
  let newCard;
  do{newCard=Math.floor(Math.random()*5)+1;}while(newCard===oldCard);
  pl[0].cd[slot]=newCard;
  syncCardCount(0);
  startCardAcquisition(newCard-1);
  fountainResult='The fountain glows! Received '+CD[newCard-1].n+'!';
  fountainResultTimer=120;
  lg.push('Fountain: Traded '+CD[oldCard-1].n+' for '+CD[newCard-1].n+'!');
  sfxShopTrade();
  checkWinAndTransition(2000);
}

function drawObjectInteractMsg(){
  if(objectInteractTimer<=0)return;
  objectInteractTimer--;
  const alpha=objectInteractTimer>20?1:objectInteractTimer/20;
  g.globalAlpha=alpha;
  win(W/2-200,H/2-20,400,36);
  tx(objectInteractMsg,W/2-190,H/2+4,6,'#303028');
  g.globalAlpha=1;
}

function drawFountainDialog(){
  if(!fountainActive)return;
  if(fountainConfirm){
    bx(0,0,W,H,'rgba(0,0,0,.4)');
    win(W/2-180,H/2-50,360,100);
    tx('Toss a card into the fountain?',W/2-160,H/2-24,7,'#303028');

    tx('Z=Yes  X=No',W/2-60,H/2+24,7,'#c04040');
  }
  if(fountainResultTimer>0){
    fountainResultTimer--;
    const a=fountainResultTimer>20?1:fountainResultTimer/20;
    g.globalAlpha=a;
    win(W/2-180,H/2-20,360,36);
    tx(fountainResult,W/2-170,H/2+4,6,'#3060b0');
    g.globalAlpha=1;
    if(fountainResultTimer<=0)fountainActive=false;
  }
}

function getMapUsableCards(){
  // Returns [{slot, cardId, name}] for cards that can be used on map
  const result=[];
  for(let i=0;i<5;i++){
    const cd=pl[0].cd[i];
    if(cd===3)result.push({slot:i,cardId:3,name:'IGNIS',desc:'Burn tree/bush ahead'});
    else if(cd===2)result.push({slot:i,cardId:2,name:'UMBRA',desc:'Invisible 30 steps'});
    else if(cd===5)result.push({slot:i,cardId:5,name:'NIHIL',desc:'Phase through wall'});
  }
  return result;
}

function openMapCardUse(){
  const usable=getMapUsableCards();
  if(usable.length===0){
    twSet('No usable cards! Ignis/Umbra/Nihil work on the map.');
    return;
  }
  mapCardUseActive=true;
  mapCardUseIdx=0;
  sfxSelect();
}

function executeMapCard(cardId,slot){
  if(cardId===3){
    // Flame: burn tree/bush in direction
    mapCardDirSelect=true;
    mapCardDirIdx=pl[0].dir;
    mapCardPendingType=3;
    return;
  }else if(cardId===2){
    // Shadow: invisible 30 steps
    pl[0].cd[slot]=0;
    syncCardCount(0);
    shadowStepsLeft=30;
    mapCardUseActive=false;
    sfxShadow();
    twSet('You became invisible for 30 steps!');
    lg.push('Used Umbra on map: 30 invisible steps!');
  }else if(cardId===5){
    // Void: phase through wall in direction
    mapCardDirSelect=true;
    mapCardDirIdx=pl[0].dir;
    mapCardPendingType=5;
    return;
  }
}

function executeDirCard(dir){
  const p=pl[0],m=getMap();
  let dx=0,dy=0;
  if(dir===0){dy=1;}else if(dir===2){dy=-1;}
  else if(dir===1){dx=-1;}else if(dir===3){dx=1;}
  const tx_=p.x+dx,ty_=p.y+dy;

  if(mapCardPendingType===3){
    // Flame: burn tree or bush
    if(tx_>=0&&tx_<MW&&ty_>=0&&ty_<MH){
      const tile=m[ty_]?.[tx_];
      if(tile===3||tile===12||tile===13){
        // Find the slot with Flame
        let slot=-1;
        for(let i=0;i<5;i++){if(pl[0].cd[i]===3){slot=i;break;}}
        if(slot>=0){
          pl[0].cd[slot]=0;
          syncCardCount(0);
          // Replace tile with grass
          maps[currentMap][ty_][tx_]=1;
          burnedTiles.push({mapIdx:currentMap,x:tx_,y:ty_});
          edgeCacheDirty=true;
          sfxBurn();
          flash();
          twSet('The obstacle burns away!');
          lg.push('Used Ignis: burned tile at ('+tx_+','+ty_+')');
        }
      }else{
        twSet('Nothing to burn there.');
      }
    }
  }else if(mapCardPendingType===5){
    // Void: phase through wall (teleport 2 tiles)
    const fx=p.x+dx*2,fy=p.y+dy*2;
    if(fx>=0&&fx<MW&&fy>=0&&fy<MH&&WALKABLE.has(m[fy]?.[fx])){
      let slot=-1;
      for(let i=0;i<5;i++){if(pl[0].cd[i]===5){slot=i;break;}}
      if(slot>=0){
        pl[0].cd[slot]=0;
        syncCardCount(0);
        p.x=fx;p.y=fy;
        fogRevealRadius(currentMap,fx,fy,2);fogSave();
        edgeCacheDirty=true;
        sfxPhase();
        flash();
        twSet('You phase through the obstacle!');
        lg.push('Used Nihil: phased to ('+fx+','+fy+')');
      }
    }else{
      twSet('Cannot phase there - no walkable tile beyond.');
    }
  }
  mapCardDirSelect=false;
  mapCardUseActive=false;
}

function drawMapCardUseOverlay(){
  if(!mapCardUseActive)return;
  const usable=getMapUsableCards();
  if(usable.length===0){mapCardUseActive=false;return;}

  if(mapCardDirSelect){
    // Direction selection
    bx(0,0,W,H,'rgba(0,0,0,.45)');
    win(W/2-120,H/2-50,240,100);
    tx('Select direction:',W/2-80,H/2-26,7,'#806030');
    const dirNames=['DOWN','LEFT','UP','RIGHT'];
    const dirCodes=[0,1,2,3];
    for(let i=0;i<4;i++){
      const y=H/2-6+Math.floor(i/2)*22;
      const x=W/2-100+(i%2)*120;

        tx('\u25B6',x-10,y+12,7,'#c04040');
        tx(dirNames[i],x,y+12,7,'#c04040');

      }
    }
    tx('Z=Confirm  X=Cancel',W/2-90,H/2+42,5,'#686068');

  }

  bx(0,0,W,H,'rgba(0,0,0,.45)');
  const mh=usable.length*32+48;
  win(W/2-140,H/2-mh/2,280,mh);
  tx('USE CARD ON MAP',W/2-80,H/2-mh/2+22,7,'#806030');
  usable.forEach((item,j)=>{

    const y=H/2-mh/2+38+j*32;
    if(j===mapCardUseIdx){
      bx(W/2-130,y-2,260,28,'rgba(192,168,96,.22)');
      tx('\u25B6',W/2-134,y+14,7,'#c04040');
    }
    bx(W/2-118,y+2,20,20,cr.d);bx(W/2-116,y+4,16,16,cr.c);

    tx(item.name,W/2-92,y+14,7,j===mapCardUseIdx?'#c04040':'#303028');
    tx(item.desc,W/2+10,y+14,5,'#908878');
  });
  tx('Z=Use  X=Cancel',W/2-70,H/2+mh/2-10,5,'#686068');
}

// ═══════════════════════════════════════
// OPENING STORY SEQUENCE
// ═══════════════════════════════════════
function dStory(){
  bx(0,0,W,H,'#000');
  const lineTime=150; // frames per line (1s fade + 1.5s hold at 60fps)
  STORY_LINES.forEach((line,i)=>{
    const lineStart=i*lineTime;
    const elapsed=storyFrame-lineStart;
    if(elapsed<0)return;
    let alpha=0;
    if(elapsed<60)alpha=elapsed/60; // 1s fade in
    else if(elapsed<150)alpha=1; // stay
    else if(elapsed<180)alpha=1-(elapsed-150)/30; // 0.5s fade out
    else return;
    alpha=Math.max(0,Math.min(1,alpha));
    g.globalAlpha=alpha;
    const tw_=line.length*7;
    txShadow(line,W/2-tw_/2,H/2-20+i*0,10,'#c8c0a0','rgba(0,0,0,.5)');
    g.globalAlpha=1;
  });
  // Skip prompt
  if(storyFrame>30){
    const skipA=Math.sin(storyFrame*0.05)*0.2+0.5;
    g.globalAlpha=skipA;
    tx('Z = Skip',W-100,H-20,6,'#555570');
    g.globalAlpha=1;
  }
}

// GAME OVER - TIME'S UP SCREEN
// ═══════════════════════════════════════
function dGameOver(){
  const t=fr-victoryFrame;
  if(t<30){bx(0,0,W,H,`rgba(0,0,0,${t/30})`);return;}
  bx(0,0,W,H,'#0c0c18');
  // Dramatic red flicker
  const flicker=Math.sin(t*0.08)*0.03;
  bx(0,0,W,H,`rgba(180,40,40,${flicker})`);

  if(t>35){g.globalAlpha=Math.min(1,(t-35)/20);txShadow('SEASON OVER',W/2-100,80,20,'#d04040','rgba(0,0,0,.6)');g.globalAlpha=1;}
  if(t>45){g.globalAlpha=Math.min(1,(t-45)/15);win(W/2-220,100,440,28);txShadow('SEASON 1 RESULTS',W/2-76,120,10,'#f0c830','rgba(0,0,0,.4)');g.globalAlpha=1;}

  // Rank all 3 players by unique card count
  if(t>60){
    const rankings=[];
    for(let i=0;i<3;i++){
      const unique=hasUniqueCards(i).size;
      rankings.push({idx:i,name:pl[i].n,unique:unique,cards:[...pl[i].cd]});
    }
    rankings.sort((a,b)=>b.unique-a.unique);
    const medals=['1ST','2ND','3RD'];
    const medalColors=['#f0c830','#c0c0c0','#c08040'];
    rankings.forEach((r,rank)=>{
      const fadeT=t-60-rank*20;
      if(fadeT<0)return;
      const alpha=Math.min(1,fadeT/15);
      g.globalAlpha=alpha;
      const y=148+rank*120;
      const isPlayer=r.idx===0;
      win(W/2-260,y,520,110);
      // Medal
      txShadow(medals[rank],W/2-240,y+30,14,medalColors[rank],'rgba(0,0,0,.4)');
      // Name
      txShadow(r.name,W/2-160,y+30,12,isPlayer?'#48b8e8':'#c8c0a0','rgba(0,0,0,.4)');
      // Unique count
      txShadow(r.unique+'/5 CARDS',W/2+120,y+30,10,r.unique>=5?'#40d040':'#c8c0a0','rgba(0,0,0,.4)');
      // Show cards in a row
      for(let ci=0;ci<5;ci++){
        const cx_=W/2-140+ci*56;
        const cy_=y+46;
        if(r.cards[ci]>0){
          drawCardFrame(cx_,cy_,46,56,r.cards[ci]-1,false);
        }else{
          bx(cx_,cy_,46,56,'#383848');bx(cx_+2,cy_+2,42,52,'#2a2a38');
          tx('?',cx_+16,cy_+36,12,'#484858');
        }
      }
      g.globalAlpha=1;
    });
  }

  if(t>140){
    g.globalAlpha=Math.min(1,(t-140)/15);
    win(W/2-200,H-60,400,50);
    const blink_=Math.floor(fr/25)%2===0;
    if(blink_)txShadow('Z = Play Again    X = Title',W/2-140,H-30,8,FRLG.selHighlight,'rgba(0,0,0,.4)');
    g.globalAlpha=1;
  }
}
