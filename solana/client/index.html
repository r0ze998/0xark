function updateVisualPositions(){
  const lerpT=1-Math.pow(1-0.25,dt);
  pl.forEach(p=>{
    const targetX=p.x*TW, targetY=p.y*TH;
    p.visualX=lerp(p.visualX,targetX,lerpT);
    p.visualY=lerp(p.visualY,targetY,lerpT);
    // Snap to target when very close (prevents sub-pixel jitter)
    const dx=Math.abs(p.visualX-targetX),dy=Math.abs(p.visualY-targetY);
    if(dx<0.3&&dy<0.3){p.visualX=targetX;p.visualY=targetY;}
    // Round to integer for crisp pixel rendering
    p.visualX=Math.round(p.visualX);
    p.visualY=Math.round(p.visualY);
    // Update walk frame based on movement
    if(dx>0.5||dy>0.5){
      p._walkAccum=(p._walkAccum||0)+dt;
      if(p._walkAccum>=4){p._walkAccum=0;p.walkFrame=(p.walkFrame+1)%4;}
    }else{
      p.walkFrame=0;p._walkAccum=0;
    }
  });
}

function update(){
  fr++;
  if(fr%20===0)wt++;
  twTick();
  fadeUpdate();updateWipe();updateParticles();updateBanner();
  // Track area time for stats (every 60 frames = 1 second)
  if(sc==='map'&&fr%60===0&&currentMap>=0&&currentMap<3){stats.areaTime[currentMap]++;}
  // Story sequence update
  if(storyActive){storyFrame++;if(storyFrame>=STORY_LINES.length*150+60){storyActive=false;storyFrame=0;fadeIn();}}
  // Credits scroll update
  if(creditsActive){creditsFrame++;}
  // Save stats periodically
  if(fr%600===0)saveStats();
  // Tension drum for nearby rivals
  if(sc==='map'&&proximityDangerLevel>=3&&!tensionDrumNode){startTensionDrum();if(tensionDrumGain)try{tensionDrumGain.gain.linearRampToValueAtTime(proximityDangerLevel===4?0.05:0.025,AC.currentTime+0.2);}catch(e){}}
  else if((sc!=='map'||proximityDangerLevel<3)&&tensionDrumNode){stopTensionDrum();}
  // Safety caps: prevent unbounded array growth
  if(particles.length>500)particles.splice(0,particles.length-500);
  if(lg.length>200)lg.splice(0,lg.length-200);
  if(burnedTiles.length>500)burnedTiles.splice(0,burnedTiles.length-500);
  updateVisualPositions();updateAmbient();
  updateMapLoadScreen();updateFPS();
  // Save indicator countdown
  if(saveIndicatorTimer>0)saveIndicatorTimer--;
  // Auto-save every 30 seconds when on map
  if(sc==='map'&&!mo){
    autoSaveTimer++;
    if(autoSaveTimer>=AUTO_SAVE_INTERVAL){autoSaveTimer=0;saveGame();}
  }
  if(flashT>0)flashT-=dt;
  if(bpShakeTimer>0)bpShakeTimer-=dt;
  if(rivalAlert>0)rivalAlert-=dt;
  if(fishingCooldownTimer>0)fishingCooldownTimer--;
  if(crystalRevealTimer>0)crystalRevealTimer--;
  updateFishing();

  // Bird movement
  if(fr%10===0){
    birds.forEach(b=>{
      b.timer--;
      if(b.timer<=0){
        b.vx=(Math.random()-.5)*2;b.vy=(Math.random()-.5)*2;
        b.timer=20+Math.floor(Math.random()*40);
      }
      const nx=b.x+Math.round(b.vx),ny=b.y+Math.round(b.vy);
      const m=maps[1];
      if(nx>=1&&nx<MW-1&&ny>=1&&ny<MH-1){
        const t=m[ny]?.[nx];
        if(t===1||t===2||t===7||t===11)b.x=nx;
      }
      if(ny>=1&&ny<MH-1){
        const t=m[ny]?.[b.x];
        if(t===1||t===2||t===7||t===11)b.y=ny;
      }
    });
  }

  // x402 server check every ~5 seconds (300 frames at 60fps)
  x402CheckTimer++;
  if(x402CheckTimer>=1800){x402CheckTimer=0;x402CheckServer();} // check every 30s, not 5s

  // Multiplayer ping every 5 seconds
  if(mp.connected&&fr%300===0)mpPing();
  // Multiplayer disconnect timer
  if(mp.disconnectTimer>0)mp.disconnectTimer--;

  // Autonomous rival AI movement (skip if multiplayer replaces rivals)
  if(!mp.connected||mp.phase!=='playing'){
    updateRivalAI(0);
    updateRivalAI(1);
  }
  updateFootprints();
  updateProximityTension();

  // ── RIVAL WIN WARNING ──
  const r1u=hasUniqueCards(1).size,r2u=hasUniqueCards(2).size;
  const maxRU=Math.max(r1u,r2u);
  rivalWinWarning=maxRU>=4?1:0;
  if(maxRU>=4&&!rivalWinWarningShown){
    rivalWinWarningShown=true;
    const whoClose=r1u>=4?pl[1].n:pl[2].n;
    lg.push('WARNING: '+whoClose+' has '+maxRU+'/5 spirits! Stop them!');
    sfxDangerAlert();
  }
  if(maxRU<4)rivalWinWarningShown=false;

  // ── SEASON EXPIRY CHECK ──
  if(sc==='map'&&seasonEndTime>0&&Date.now()>=seasonEndTime&&!gameOverTimesUp){
    gameOverTimesUp=true;stats.gamesPlayed++;saveStats();
    fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});
  }

  // ── CARD DECAY TIMER ──
  if(sc==='map'||sc==='act'){
    const now=Date.now();
    for(let i=0;i<5;i++){
      if(pl[0].cd[i]>0&&cardTimers[i]>0){
        const elapsed=now-cardTimers[i];
        if(elapsed>=CARD_DECAY_MS){
          // Card expired!
          const expiredName=CD[pl[0].cd[i]-1].n;
          pl[0].cd[i]=0;cardTimers[i]=0;syncCardCount(0);
          sfxCardExpired();screenShake(3,6);
          triggerCardLostAnim(pl[0].visualX-camX,pl[0].visualY-camY-16);
          lg.push(expiredName+' card decayed and vanished!');
          objectInteractMsg=expiredName+' expired!';objectInteractTimer=90;
          // Reset streak on card expiry
          if(streakCount>0){streakCount=0;streakLostTimer=60;}
        }else if(CARD_DECAY_MS-elapsed<15000&&fr%30===0){
          // Warning flash in last 15 seconds
          cardDecayWarningFlash=10;
          if(fr%60===0)sfxCardDecayWarn();
        }
      }
    }
    if(cardDecayWarningFlash>0)cardDecayWarningFlash--;
  }

  // ── STREAK DISPLAY TIMERS ──
  if(streakDisplayTimer>0)streakDisplayTimer--;
  if(streakLostTimer>0)streakLostTimer--;

  // ── AREA DANGER LEVEL ──
  if(sc==='map'&&!mo&&!inBuilding){
    // Increase danger for current map
    areaDangerStayTimer[currentMap]++;
    // Danger increases from staying (faster to push movement between areas)
    if(areaDangerStayTimer[currentMap]%120===0){
      areaDanger[currentMap]=Math.min(1,areaDanger[currentMap]+0.03);
    }
    // Danger increases when rivals are on same map
    for(let ri=0;ri<2;ri++){
      if(rivalMaps[ri]===currentMap&&fr%60===0){
        areaDanger[currentMap]=Math.min(1,areaDanger[currentMap]+0.03);
      }
    }
    // Danger decreases for maps player is NOT on
    for(let mi=0;mi<3;mi++){
      if(mi!==currentMap&&fr%90===0){
        areaDanger[mi]=Math.max(0,areaDanger[mi]-0.02);
        areaDangerStayTimer[mi]=Math.max(0,areaDangerStayTimer[mi]-30);
      }
    }
    // Danger decreases when rivals leave
    for(let mi=0;mi<3;mi++){
      let rivalsHere=0;
      for(let ri=0;ri<2;ri++){if(rivalMaps[ri]===mi)rivalsHere++;}
      if(rivalsHere===0&&fr%120===0){
        areaDanger[mi]=Math.max(0,areaDanger[mi]-0.01);
      }
    }
  }

  // ── QTE UPDATE ──
  if(qteActive){
    qteFrame++;
    if(qteFrame>=qteWindow&&!qteKeyPressed){
      // Missed QTE
      qteActive=false;qteSuccess=false;
      sfxQteMiss();
      qteResultText='MISSED!';qteResultTimer=40;
    }
  }
  if(qteResultTimer>0)qteResultTimer--;

  // Atmosphere log messages based on proximity (throttled)
  if(fr%300===0){
    for(let i=0;i<2;i++){
      if(rivalMaps[i]!==currentMap)continue;
      const r=pl[i+1];
      const dist=Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y);
      if(dist<=8&&dist>5){lg.push('The air feels tense...');}
      else if(dist>8&&dist<=15){lg.push('You sense movement nearby...');}
    }
  }

  // Footprint log messages when player walks on rival footprints
  if(sc==='map'&&!mo){
    const pFp=footprints.find(f=>f.map===currentMap&&f.x===pl[0].x&&f.y===pl[0].y&&f.age<1800);
    if(pFp&&fr%60===0){
      lg.push('Footprints in the grass... someone passed here.');
      pFp.age=1800; // Don't log again
    }
  }

  // Encounter check (player walks to rival OR rival walks to player)
  if(sc==='map'&&!mo&&!npcDialogActive&&!wildEncounterActive&&!mapTransitioning&&!encounterExclActive&&!shopActive&&!signpostActive&&!inBuilding&&shadowStepsLeft<=0){
    pl.slice(1).forEach((r,idx)=>{
      if(rivalMaps[idx]!==currentMap)return;
      const adjDist=Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y);
      // At HIGH danger, encounter triggers at distance 2 as well
      const encounterDist=areaDanger[currentMap]>=DANGER_HIGH_THRESH?2:1;
      if(adjDist<=encounterDist&&adjDist>0){
        if(!encounterCooldown){
          // Collector rival: 70% chance to flee instead of fight
          const ai=rivalAI[idx];
          if(ai.personality==='collector'&&ai.state!=='fleeing'&&Math.random()<0.7){
            ai.state='fleeing';
            ai.stateTimer=6;
            ai.moveInterval=6;
            const fdx=r.x-pl[0].x;const fdy=r.y-pl[0].y;
            const fx=r.x+(fdx!==0?fdx*4:0);const fy=r.y+(fdy!==0?fdy*4:0);
            const flee=findWalkableTile(rivalMaps[idx],Math.max(2,Math.min(MW-3,fx)),Math.max(2,Math.min(MH-3,fy)),5);
            if(flee){ai.goalX=flee.x;ai.goalY=flee.y;ai.goalMap=rivalMaps[idx];}
            lg.push(r.n+' is trying to run away!');
            encounterCooldown=60;
            return;
          }

          encounterCooldown=120;
          encounterExclActive=true;
          encounterExclFrame=fr;
          encounterExclTarget=idx+1;
          encounterExclPlayerX=pl[0].visualX;
          encounterExclPlayerY=pl[0].visualY;
          encounterExclRivalX=r.visualX;
          encounterExclRivalY=r.visualY;
          sfxEncounterDramatic();
          const rivalName=r.n;
          const isRivalInitiated=ai.state==='hunting';
          setTimeout(()=>{
            encounterExclActive=false;
            flash();
            twSet(isRivalInitiated?rivalName+' ambushed you! Battle!':'Wild '+rivalName+' appeared! Entering battle...');
            // Use horizontal wipe like FRLG wild encounter
            startWipe('hswipe',24,()=>{
              sc='act';battlePhase='vs_splash';bpFrame=fr;
              startWipe('hswipe_out',18);
            });
          },500);
        }
      }
    });
    if(encounterCooldown>0)encounterCooldown--;
  }
}

function draw(){
  g.clearRect(0,0,W,H);
  // Global screen shake
  let _shaking=false;
  if(shakeT>0){
    _shaking=true;
    const sx=Math.round((Math.random()-0.5)*shakeIntensity*(shakeT/8));
    const sy=Math.round((Math.random()-0.5)*shakeIntensity*(shakeT/8));
    g.save();g.translate(sx,sy);
    shakeT--;
  }
  if(storyActive){dStory();}
  else if(sc==='splash'){dSplash();}
  else if(sc==='title'){
    if(creditsActive){dCredits();}
    else if(mp.mpScreen!=='off'){drawMPLobby();}
    else{dTitle();}
  }
  else if(sc==='map'){
    if(inBuilding){drawBuildingInterior();}
    else{dMap();if(mo)dMenu();}
  }
  else if(sc==='act')dAct();
  else if(sc==='crd')dCrd();
  else if(sc==='log')dLog();
  else if(sc==='stats')dStats();
  else if(sc==='victory'){if(gameOverTimesUp)dGameOver();else dVictory();}
  drawCardAcquisition();
  drawDiscardOverlay();
  drawTutorialMsg();
  drawIntroTutorial();
  if(!inBuilding&&sc==='map'){
    drawFishingOverlay();
    drawPuzzlePillars();
    drawPuzzleMessage();
    drawObjectInteractMsg();
    drawFountainDialog();
    drawMapCardUseOverlay();
    // Shadow effect on player sprite
    if(shadowStepsLeft>0){
      const px=pl[0].visualX-camX,py=pl[0].visualY-camY-16;
      g.globalAlpha=0.4;
      bx(px-4,py-4,40,56,'rgba(80,40,160,.3)');
      g.globalAlpha=1;
      tx('UMBRA:'+shadowStepsLeft,px-16,py-24,5,'#9060c0');
    }
  }
  // Multiplayer connection status overlay
  drawMPStatus();
  // Card collection progress bar (always visible on map)
  drawCardProgressBar();
  if(flashT>0){bx(0,0,W,H,`rgba(255,255,255,${(flashT>10?1:flashT/10)*.8})`);}
  // Screen transition wipes (replaces old battleWipe)
  drawWipe();
  // Map loading screen
  drawMapLoadScreen();
  fadeDraw();
  // FRLG-style decorative border around viewport
  g.strokeStyle=FRLG.borderOuter;g.lineWidth=2;g.strokeRect(1,1,W-2,H-2);
  g.strokeStyle=FRLG.borderInner;g.lineWidth=1;g.strokeRect(3,3,W-6,H-6);
  // FPS counter (top-left, on top of everything)
  drawFPS();
  if(_shaking)g.restore();
}

function loop(now){
  if(!lastTime)lastTime=now;
  dt=Math.min(3,Math.max(0.1,(now-lastTime)/16.67)); // normalized to 60fps, clamped
  lastTime=now;
  update();draw();updatePixiHud();requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
  if(e.repeat)return;

  // Sound toggle with M key
  if(e.code==='KeyM'){
    soundEnabled=!soundEnabled;
    localStorage.setItem('oxark_sound',soundEnabled?'on':'off');
    if(!soundEnabled){stopAmbientNodes();ambientState.currentArea=-1;}
    return;
  }
  // FPS counter toggle with F key
  if(e.code==='KeyF'){
    fpsCounterVisible=!fpsCounterVisible;
    return;
  }

  // Intro tutorial input
  if(introActive){
    if(e.code==='KeyZ'){
      sfxConfirm();introFrame=fr;
      introPage++;
      if(introPage>=INTRO_PAGES.length){
        introActive=false;
        // Give random starter card only on first play (player has 0 cards)
        if(pl[0].cd.filter(c=>c>0).length===0){
          const starterCard=1+Math.floor(Math.random()*5);
          pl[0].cd[0]=starterCard;pl[0].cc=1;cardTimers[0]=Date.now();syncCardCount(0);
          startCardAcquisition(starterCard-1);
          lg.push('You received '+CD[starterCard-1].n+'!');
          showBanner('CORSAIR BAY','Aegis & Umbra spirits haunt the docks');
          twSet('Good luck, sailor. Collect all 5 spirits to escape the ARK.');
        }
      }
    }
    if(e.code==='KeyX'&&introPage>0){sfxBack();introPage--;introFrame=fr;}
    return;
  }

  // Multiplayer screen input handling
  if(sc==='title'&&mp.mpScreen!=='off'){
    if(mp.mpScreen==='select'){
      if(e.code==='ArrowUp'){mp.mpMenuIdx=Math.max(0,mp.mpMenuIdx-1);sfxCursor();}
      if(e.code==='ArrowDown'){mp.mpMenuIdx=Math.min(2,mp.mpMenuIdx+1);sfxCursor();}
      if(e.code==='KeyZ'){
        if(mp.mpMenuIdx===0){
          // CREATE ROOM
          sfxConfirm();
          const rid=mpGenerateRoomId();
          mp.roomInput='';
          mpConnect(rid,true);
          mp.mpScreen='create';
        }else if(mp.mpMenuIdx===1){
          // JOIN ROOM
          sfxConfirm();
          mp.roomInput='';
          mp.mpScreen='join';
        }else if(mp.mpMenuIdx===2){
          // BACK
          sfxBack();mp.mpScreen='off';
        }
      }
      if(e.code==='KeyX'){mp.mpScreen='off';sfxBack();}
    }else if(mp.mpScreen==='join'){
      // Text input for room code
      if(e.code==='KeyX'){mp.mpScreen='select';sfxBack();}
      else if(e.code==='KeyZ'&&mp.roomInput.length>=4){
        sfxConfirm();mpConnect(mp.roomInput,false);mp.mpScreen='lobby';
      }else if(e.code==='Backspace'){mp.roomInput=mp.roomInput.slice(0,-1);sfxCursor();}
      else if(e.key&&e.key.length===1&&mp.roomInput.length<6){
        mp.roomInput+=e.key.toUpperCase();sfxCursor();
      }
    }else if(mp.mpScreen==='create'){
      if(e.code==='KeyX'){mpDisconnect();mp.mpScreen='select';sfxBack();}
      else if(e.code==='KeyZ'&&mp.connected){mp.mpScreen='lobby';sfxConfirm();}
    }else if(mp.mpScreen==='lobby'){
      if(e.code==='KeyX'){mpDisconnect();mp.mpScreen='select';sfxBack();}
      else if(e.code==='KeyZ'&&mp.playerCount>=2){
        // Start game
        sfxConfirm();
        mpSend({type:'start_game'});
        mp.phase='playing';
        // Replace AI rivals with real players
        if(mp.otherPlayers.length>0){
          pl[1].n=mp.otherPlayers[0].name||'Player 2';
        }
        if(mp.otherPlayers.length>1){
          pl[2].n=mp.otherPlayers[1].name||'Player 3';
        }
        mp.mpScreen='off'; // reset screen state
        fadeOut(()=>{
          if(loadGame()){
            sc='map';showBanner(mapNames[currentMap],AREA_CARD_DESC[currentMap]+' cards found here');
            fadeIn();twSet('Multiplayer game started!');
          }else{
            resetGameState(true);
            // Give random starter card for multiplayer (no tutorial)
            const mpCard=1+Math.floor(Math.random()*5);
            pl[0].cd[0]=mpCard;pl[0].cc=1;cardTimers[0]=Date.now();syncCardCount(0);
            sc='map';currentMap=0;showBanner('CORSAIR BAY','Aegis & Umbra spirits haunt the docks');
            fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
            fadeIn();twSet('Multiplayer started! You received '+CD[mpCard-1].n+'!');
          }
        });
      }
    }
    return;
  }

  // Stake confirmation overlay input
  if(sc==='title'&&stakeConfirmActive){
    if(e.code==='KeyZ'){
      sfxConfirm();
      stakeConfirmActive=false;
      stakeDeposited=true;
      lg.push('[ON-CHAIN] Stake deposited: '+STAKE_AMOUNT.toFixed(2)+' SOL (UI preview)');
      // Proceed with the game start that was pending

        fadeOut(()=>{
          if(loadGame()){
            sc='map';showBanner(mapNames[currentMap],AREA_CARD_DESC[currentMap]+' cards found here');
            fadeIn();twSet('Welcome back! Stake deposited.');
          }else{
            sc='map';currentMap=0;showBanner('CORSAIR BAY','Aegis & Umbra spirits haunt the docks');
            fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
            fadeIn();twSet('Welcome to the ARK! Stake deposited.');
          }
        });
      }else{
        resetGameState(true);
        fadeOut(()=>{sc='map';currentMap=0;
          fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
          introActive=true;introPage=0;introFrame=fr;
          fadeIn();});
      }
    }
    if(e.code==='KeyX'){sfxBack();stakeConfirmActive=false;}
    return;
  }
  if(sc==='title'){
    if(hasSave()){
      if(e.code==='ArrowUp'){titleMenuIdx=Math.max(0,titleMenuIdx-1);sfxCursor();}
      if(e.code==='ArrowDown'){titleMenuIdx=Math.min(4,titleMenuIdx+1);sfxCursor();}
      if(e.code==='KeyZ'){
        if(titleMenuIdx===0){
          // CONTINUE
          sfxConfirm();
          if(walletConnected&&!stakeDeposited){stakeConfirmActive=true;window._stakeAction='continue';return;}
          fadeOut(()=>{
            if(loadGame()){
              sc='map';showBanner(mapNames[currentMap],AREA_CARD_DESC[currentMap]+' cards found here');
              fadeIn();twSet('Welcome back!');
            }else{
              sc='map';currentMap=0;showBanner('CORSAIR BAY','Aegis & Umbra spirits haunt the docks');
              fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
              fadeIn();twSet('Welcome to the ARK, sailor! Five spirits guard this cursed island.');
            }
          });
        }else if(titleMenuIdx===1){
          // NEW GAME
          sfxConfirm();
          if(walletConnected&&!stakeDeposited){stakeConfirmActive=true;window._stakeAction='new';return;}
          resetGameState(true);
          // Show intro tutorial, then transition to map
          fadeOut(()=>{sc='map';currentMap=0;
            fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
            introActive=true;introPage=0;introFrame=fr;
            fadeIn();
          });

          // CONNECT WALLET
          sfxSelect();
          if(walletConnected){
            disconnectPhantom().then(()=>{lg.push('Wallet disconnected.');});

            if(!window.solana||!window.solana.isPhantom){
              twSet('Install Phantom wallet from phantom.app');

              connectPhantom().then(addr=>{
                if(addr){twSet('Connected: '+walletAddressTruncated());lg.push('Wallet connected: '+walletAddressTruncated());}
                else{twSet('Connection cancelled.');}
              }).catch(()=>{twSet('Connection failed.');});

          sfxSelect();mp.mpScreen='select';mp.mpMenuIdx=0;
        }else if(titleMenuIdx===4){

          sfxSelect();creditsActive=true;creditsFrame=0;

      if(e.code==='ArrowUp'){titleMenuIdx=Math.max(0,titleMenuIdx-1);sfxCursor();}
      if(e.code==='ArrowDown'){titleMenuIdx=Math.min(3,titleMenuIdx+1);sfxCursor();}
      if(e.code==='KeyZ'){
        if(titleMenuIdx===0){
          sfxConfirm();
          if(walletConnected&&!stakeDeposited){stakeConfirmActive=true;window._stakeAction='new';return;}
          // Show intro tutorial for first-time play
          resetGameState(true);
          fadeOut(()=>{sc='map';currentMap=0;
            fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
            introActive=true;introPage=0;introFrame=fr;
            fadeIn();
          });
        }else if(titleMenuIdx===1){
          // CONNECT WALLET (no save)
          sfxSelect();
          if(walletConnected){
            disconnectPhantom().then(()=>{lg.push('Wallet disconnected.');});
          }else{
            if(!window.solana||!window.solana.isPhantom){
              twSet('Install Phantom wallet from phantom.app');
            }else{
              connectPhantom().then(addr=>{
                if(addr){twSet('Connected: '+walletAddressTruncated());lg.push('Wallet connected: '+walletAddressTruncated());}
                else{twSet('Connection cancelled.');}
              }).catch(()=>{twSet('Connection failed.');});
            }
          }
        }else if(titleMenuIdx===2){
          // MULTIPLAYER (no save)
          sfxSelect();mp.mpScreen='select';mp.mpMenuIdx=0;
        }else if(titleMenuIdx===3){
          // CREDITS (no save)
          sfxSelect();creditsActive=true;creditsFrame=0;
        }
      }
    }
    return;
  }

  // NPC Dialog handling
  if(npcDialogActive){
    if(e.code==='KeyZ'||e.code==='Space'){
      npcDialogIdx+=2;
      if(npcDialogIdx>=npcDialogLines.length){npcDialogActive=false;npcDialogIdx=0;}
      else sfxSelect();
    }
    if(e.code==='KeyX'){npcDialogActive=false;sfxBack();}
    return;
  }

  // Signpost dialog handling
  if(signpostActive){
    if(e.code==='KeyZ'||e.code==='Space'||e.code==='KeyX'){signpostActive=false;sfxBack();}
    return;
  }

  // Trading Post handling
  if(shopActive){
    const filled=getPlayerFilledSlots();
    if(shopPhase==='list'){
      if(filled.length>0){
        if(e.code==='ArrowUp'){shopSelectedIdx=Math.max(0,shopSelectedIdx-1);sfxCursor();}
        if(e.code==='ArrowDown'){shopSelectedIdx=Math.min(filled.length-1,shopSelectedIdx+1);sfxCursor();}
        if(e.code==='KeyZ'){shopPhase='confirm';sfxSelect();}
      }
      if(e.code==='KeyX'){shopActive=false;sfxBack();}
    }else if(shopPhase==='confirm'){
      if(e.code==='KeyZ'){doShopTrade();}
      if(e.code==='KeyX'){shopPhase='list';sfxBack();}
    }else if(shopPhase==='result'){
      if(e.code==='KeyZ'){shopPhase='list';shopSelectedIdx=0;sfxSelect();}
      if(e.code==='KeyX'){shopActive=false;sfxBack();}
    }
    return;
  }

  // Random event dismiss
  if(randomEventActive){
    if(e.code==='KeyZ'||e.code==='Space'){randomEventActive=false;}
    return;
  }

  // Discard overlay handling
  if(discardActive){
    if(e.code==='ArrowUp'){discardSelIdx=Math.max(0,discardSelIdx-1);sfxCursor();}
    if(e.code==='ArrowDown'){discardSelIdx=Math.min(4,discardSelIdx+1);sfxCursor();}
    if(e.code==='KeyZ'){
      const slot=discardSelIdx;
      if(pl[0].cd[slot]>0){
        sfxConfirm();
        const discarded=pl[0].cd[slot];
        if(discardPendingCard>0){
          pl[0].cd[slot]=discardPendingCard;cardTimers[slot]=Date.now();
          lg.push('Discarded '+CD[discarded-1].n+', got '+CD[discardPendingCard-1].n+'!');
          discardActive=false;
          if(discardSource==='wild'||discardSource==='menu'){startCardAcquisition(discardPendingCard-1);}
          discardPendingCard=-1;discardSource='';
          checkWinAndTransition(500);
        }else{
          // Menu discard: just remove the card
          pl[0].cd[slot]=0;pl[0].cc=Math.max(0,pl[0].cc-1);
          lg.push('Discarded '+CD[discarded-1].n+'!');
          discardActive=false;discardPendingCard=-1;discardSource='';
        }
      }else{sfxBack();}
    }
    if(e.code==='KeyX'){
      sfxBack();
      if(discardPendingCard>0){
        // Canceling means rejecting the new card
        lg.push('Skipped '+CD[discardPendingCard-1].n+' (hand full).');
      }
      discardActive=false;discardPendingCard=-1;discardSource='';
      if(wildEncounterActive){wildEncounterActive=false;cardAcqDone=true;}
    }
    return;
  }

  // Wild encounter - wait
  if(wildEncounterActive)return;

  // Battle encounter exclamation or wipe - wait
  if(encounterExclActive||wipeActive)return;

  if(sc==='map'&&inBuilding){
    // Building interior input
    if(buildingNpcDialog){
      if(e.code==='KeyZ'||e.code==='Space'){
        buildingNpcIdx+=2;
        if(buildingNpcIdx>=buildingNpcLines.length){buildingNpcDialog=false;buildingNpcIdx=0;}
        else sfxSelect();
      }
      if(e.code==='KeyX'){buildingNpcDialog=false;sfxBack();}
      return;
    }
    if(infoBrokerConfirm){
      if(e.code==='KeyZ'){
        infoBrokerConfirm=false;
        // Check if player has a card to pay
        const filled=[];for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
        if(filled.length>0){
          const slot=filled[Math.floor(Math.random()*filled.length)];
          const lost=pl[0].cd[slot];pl[0].cd[slot]=0;syncCardCount(0);
          const rivalArea=mapNames[rivalMaps[0]]||'???';
          const hunterArea=mapNames[rivalMaps[1]]||'???';
          infoBrokerResult='Rival is in '+rivalArea+'. Hunter is in '+hunterArea+'.';
          infoBrokerResultTimer=240;
          lg.push('Spy Master: Rival='+rivalArea+', Hunter='+hunterArea+' (paid '+CD[lost-1].n+')');
          sfxConfirm();
        }else{
          infoBrokerResult='You have no cards to pay!';
          infoBrokerResultTimer=120;
        }
      }
      if(e.code==='KeyX'){infoBrokerConfirm=false;sfxBack();}
      return;
    }
    if(x402HowItWorksActive){
      if(e.code==='KeyZ'||e.code==='KeyX'){x402HowItWorksActive=false;sfxBack();}
      return;
    }
    if(agentMarketplaceActive){
      if(e.code==='KeyZ'||e.code==='KeyX'){agentMarketplaceActive=false;sfxBack();}
      return;
    }
    if(x402ShopOpen){
      if(x402ShopLoading)return; // wait for response
      if(e.code==='ArrowUp'){x402ShopIdx=Math.max(0,x402ShopIdx-1);sfxCursor();}
      if(e.code==='ArrowDown'){x402ShopIdx=Math.min(x402ShopItems.length-1,x402ShopIdx+1);sfxCursor();}
      if(e.code==='KeyZ'){
        const item=x402ShopItems[x402ShopIdx];
        if(item.endpoint==='_agentMarketplace'){agentMarketplaceActive=true;sfxSelect();return;}
        if(item.isInfo){x402HowItWorksActive=true;sfxSelect();return;}
        const cost=item.cardCost!==undefined?item.cardCost:1;
        const filled=[];for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
        if(cost>0&&filled.length<cost){
          x402ShopResult='Not enough cards! Need '+cost+'.';
          x402ShopResultTimer=120;sfxBack();
        }else{
          // Pay cards if cost > 0
          for(let c=0;c<cost;c++){
            if(filled.length>c){const slot=filled[c];pl[0].cd[slot]=0;syncCardCount(0);}
          }
          x402ShopLoading=true;
          x402PushState().then(()=>x402FetchIntel(item.endpoint)).then(data=>{
            x402ShopLoading=false;
            if(!data){
              x402ShopResult='Server error. Cards refunded.';
              // Refund not implemented for simplicity — server was available at menu open
              x402ShopResultTimer=150;sfxBack();return;
            }
            // Format response based on endpoint type
            if(item.endpoint.startsWith('/intel/location')){
              x402ShopResult=data.playerName+' is in '+data.areaName+' ('+Math.round(data.confidence*100)+'% sure)';
              lg.push('x402 Intel: '+data.playerName+' at '+data.areaName);
            }else if(item.endpoint.startsWith('/intel/hand')){
              const names=data.cards?data.cards.map(c=>c.name).join(', '):'none';
              x402ShopResult=data.playerName+' holds: '+names+' ('+data.cardCount+' cards)';
              lg.push('x402 Intel: '+data.playerName+' hand = '+names);
            }else if(item.endpoint.startsWith('/intel/strategy')){
              x402ShopResult=data.recommendation||'No advice available.';
              lg.push('x402 Strategy: '+data.recommendation);
            }else if(item.endpoint.startsWith('/intel/market')){
              const total=data.totalCardsInPool||0;
              x402ShopResult='Cards in pool: '+total+'. Check log for details.';
              if(data.pool)data.pool.forEach(p=>lg.push('  '+p.cardName+': '+p.remaining+'/'+p.totalSupply));
              lg.push('x402 Market: '+total+' cards remaining');
            }
            x402ShopResultTimer=300;sfxConfirm();
          }).catch(()=>{x402ShopLoading=false;x402ShopResult='Connection lost.';x402ShopResultTimer=120;sfxBack();});
        }
      }
      if(e.code==='KeyX'){x402ShopOpen=false;sfxBack();}
      return;
    }
    if(x402ShopResultTimer>0){
      if(e.code==='KeyZ'||e.code==='KeyX'){x402ShopResultTimer=0;sfxBack();}
      return;
    }
    if(e.code==='KeyX'){exitBuilding();return;}
    // Movement in building
    const bm=getBuildingMap();
    let bnx=buildingPlayerX,bny=buildingPlayerY;
    if(e.code==='ArrowUp'){bny--;buildingPlayerDir=2;}
    if(e.code==='ArrowDown'){bny++;buildingPlayerDir=0;}
    if(e.code==='ArrowLeft'){bnx--;buildingPlayerDir=1;}
    if(e.code==='ArrowRight'){bnx++;buildingPlayerDir=3;}
    if(bnx!==buildingPlayerX||bny!==buildingPlayerY){
      if(bnx>=0&&bnx<BUILDING_W&&bny>=0&&bny<BUILDING_H){
        const bt=bm[bny][bnx];
        if(bt===4){
          // Exit
          exitBuilding();return;
        }
        if(buildingTileWalkable(bt)){
          buildingPlayerX=bnx;buildingPlayerY=bny;sfxStep();
        }
      }
    }
    if(e.code==='KeyZ'){
      // Interact with NPC in building
      let fx=buildingPlayerX,fy=buildingPlayerY;
      if(buildingPlayerDir===0)fy++;else if(buildingPlayerDir===2)fy--;
      else if(buildingPlayerDir===1)fx--;else if(buildingPlayerDir===3)fx++;
      if(fx>=0&&fx<BUILDING_W&&fy>=0&&fy<BUILDING_H){
        const bt=bm[fy][fx];
        if(bt===5||bt===2){
          // Adjacent to NPC or counter
          if(buildingType==='shop'){
            openCardShop();
          }else if(buildingType==='info'){
            // Spy Master interaction — x402 shop or legacy card payment
            if(x402Available){
              x402ShopOpen=true;x402ShopIdx=0;x402ShopLoading=false;
              x402PushState();
              sfxSelect();
            }else{
              const filled=[];for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
              if(filled.length>0){
                infoBrokerConfirm=true;
                sfxSelect();
              }else{
                buildingNpcDialog=true;
                buildingNpcLines=[
                  'I sell intelligence.','Real-time. Micropayments','via x402 protocol.',
                  'Each query costs a','fraction of USDC. Your AI','agent can buy intel.',
                  'Connect your wallet','and I\'ll show you','what I know.'
                ];
                buildingNpcIdx=0;
                buildingNpcName='Spy Master';
                sfxConfirm();
              }
            }
          }
        }
      }
    }
    return;
  }

  if(sc==='map'){
    if(e.code==='Space'){mo=!mo;mi=0;menuOpenFrame=0;sfxSelect();if(mo){pxOpenMenu();pxMenuDim.visible=true;}else{pxCloseMenu();pxMenuDim.visible=false;}return;}
    if(mo){
      if(e.code==='ArrowUp'){mi=Math.max(0,mi-1);sfxCursor();}
      if(e.code==='ArrowDown'){mi=Math.min(12,mi+1);sfxCursor();}
      if(e.code==='KeyZ'){
        sfxConfirm();const s=['crd','map','act','log'];
        if(mi===12)mo=false;
        else if(mi===4){
          // STATS
          mo=false;menuOpenFrame=0;
          sc='stats';
        }
        else if(mi===5){
          // USE CARD on map
          mo=false;menuOpenFrame=0;
          openMapCardUse();
        }
        else if(mi===6){
          // DISCARD
          const filled=[];for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
          if(filled.length>0){
            discardActive=true;discardSelIdx=0;discardPendingCard=-1;discardSource='menu';
            mo=false;menuOpenFrame=0;
          }else{twSet('No cards to discard!');mo=false;menuOpenFrame=0;}
        }
        else if(mi===7){
          // WALLET
          mo=false;menuOpenFrame=0;
          if(walletConnected){
            disconnectPhantom().then(()=>{twSet('Wallet disconnected.');lg.push('Wallet disconnected.');});
          }else{
            if(!window.solana||!window.solana.isPhantom){
              twSet('Install Phantom wallet from phantom.app');
            }else{
              connectPhantom().then(addr=>{
                if(addr){twSet('Connected: '+walletAddressTruncated());lg.push('Wallet connected: '+walletAddressTruncated());}
                else{twSet('Connection cancelled.');}
              }).catch(()=>{twSet('Connection failed.');});
            }
          }
        }
        else if(mi===8){
          // TEXT SPEED
          textSpeedIdx=(textSpeedIdx+1)%3;
          localStorage.setItem('oxark_textspeed',String(textSpeedIdx));
          twSet('Text speed: '+TEXT_SPEED_LABELS[textSpeedIdx]);
          sfxCursor();
        }
        else if(mi===9){
          // SAVE
          saveGame();saveStats();
          twSet('Game saved!');
          mo=false;menuOpenFrame=0;
        }
        else if(mi===10){
          // RULES: show intro tutorial again
          mo=false;menuOpenFrame=0;
          introActive=true;introPage=0;introFrame=fr;
        }
        else if(mi===11){
          // NEW GAME: reset all state
          resetGameState(true);
          fadeOut(()=>{sc='title';mo=false;fadeIn();ub();});
        }
        else{fadeOut(()=>{sc=s[mi];mo=false;if(sc==='act'){battlePhase='vs_splash';bpFrame=fr;}fadeIn();ub();});}
      }
      if(e.code==='KeyX'){mo=false;menuOpenFrame=0;sfxBack();}
    }else{
      // Map card use overlay input
      if(mapCardUseActive){
        if(mapCardDirSelect){
          if(e.code==='ArrowUp'){mapCardDirIdx=2;sfxCursor();}
          if(e.code==='ArrowDown'){mapCardDirIdx=0;sfxCursor();}
          if(e.code==='ArrowLeft'){mapCardDirIdx=1;sfxCursor();}
          if(e.code==='ArrowRight'){mapCardDirIdx=3;sfxCursor();}
          if(e.code==='KeyZ'){sfxConfirm();executeDirCard(mapCardDirIdx);}
          if(e.code==='KeyX'){mapCardDirSelect=false;mapCardUseActive=false;sfxBack();}
          return;
        }
        const usable=getMapUsableCards();
        if(e.code==='ArrowUp'){mapCardUseIdx=Math.max(0,mapCardUseIdx-1);sfxCursor();}
        if(e.code==='ArrowDown'){mapCardUseIdx=Math.min(usable.length-1,mapCardUseIdx+1);sfxCursor();}
        if(e.code==='KeyZ'){
          sfxConfirm();
          const item=usable[mapCardUseIdx];
          executeMapCard(item.cardId,item.slot);
        }
        if(e.code==='KeyX'){mapCardUseActive=false;sfxBack();}
        return;
      }

      // Fountain dialog input
      if(fountainActive&&fountainConfirm){
        if(e.code==='KeyZ'){fountainConfirm=false;doFountainExchange();}
        if(e.code==='KeyX'){fountainConfirm=false;fountainActive=false;sfxBack();}
        return;
      }

      // Fishing input
      if(fishingActive){
        if(fishingPhase==='bite'&&e.code==='KeyZ'){
          fishingCatchCard();
          return;
        }
        if(e.code==='KeyX'){fishingActive=false;sfxBack();}
        return;
      }

      // Z = interact with NPC, signpost, building, puzzle, objects, or fish
      if(e.code==='KeyZ'){
        if(checkNPCInteraction())return;
        if(checkSignpostInteraction())return;
        if(checkBuildingEntry())return;
        if(checkPuzzleInteraction())return;
        if(checkObjectInteraction())return;
        // Fishing check
        if(canFish()){startFishing();return;}
      }

      const p=pl[0];let nx=p.x,ny=p.y;
      if(e.code==='ArrowUp'){ny--;p.dir=2;}
      if(e.code==='ArrowDown'){ny++;p.dir=0;}
      if(e.code==='ArrowLeft'){nx--;p.dir=1;}
      if(e.code==='ArrowRight'){nx++;p.dir=3;}
      if(nx!==p.x||ny!==p.y){
        const m=getMap();
        if(nx>=0&&nx<MW&&ny>=0&&ny<MH&&WALKABLE.has(m[ny]?.[nx])){
          p.x=nx;p.y=ny;p.step++;p.walkFrame=(p.walkFrame+1)%4;sfxMove();sfxStep();
          stepCounter++;stats.stepsWalked++;
          edgeCacheDirty=true;
          // Broadcast move to multiplayer
          mpBroadcastMove();
          // Leave player footprint
          footprints.push({map:currentMap,x:nx,y:ny,age:0});
          // Reveal fog around new position
          fogRevealRadius(currentMap,nx,ny,2);
          fogSave();
          const newTile=m[ny]?.[nx];
          if(newTile===1||newTile===7||newTile===11){spawnGrassParticles(nx*TW,ny*TH);sfxGrassRustle();}
          // Tutorial triggers
          if(!tutorialFlags.firstStep){tutorialFlags.firstStep=true;tutorialMsg='Commit in secret. Reveal with proof. The fog hides everything \u2014 but information has a price.';tutorialMsgTimer=300;}
          if(newTile===11&&!tutorialFlags.firstGrass){tutorialFlags.firstGrass=true;tutorialMsg='Walk through tall grass to find cards!';tutorialMsgTimer=180;}
          // Water proximity sound
          if(newTile!==0){const adj=[[nx-1,ny],[nx+1,ny],[nx,ny-1],[nx,ny+1]];if(adj.some(([ax,ay])=>ax>=0&&ax<MW&&ay>=0&&ay<MH&&m[ay]?.[ax]===0))sfxWaterNear();}

          // Shadow step countdown
          if(shadowStepsLeft>0)shadowStepsLeft--;

          // Check forest traps (skip if shadow active)
          if(shadowStepsLeft<=0)checkForestTrap();

          // Random map event every 150 steps
          randomEventTimer++;
          if(randomEventTimer>=150&&!randomEventActive&&!wildEncounterActive&&!cardAcqActive){
            randomEventTimer=0;
            triggerRandomEvent();
          }

          // Check exit
          const exit=checkExitTile(nx,ny);
          if(exit){doMapTransition(exit);return;}

          // Check treasure
          checkTreasure();

          // Check wild encounter (skip if shadow active)
          if(!cardAcqActive&&!randomEventActive&&shadowStepsLeft<=0)tryWildEncounter();
        }
      }
    }
  }

  if(sc==='act'){
    // QTE input during resolving phase
    if(battlePhase==='resolving'&&qteActive&&!qteKeyPressed&&e.code==='KeyZ'){
      qteKeyPressed=true;qteActive=false;qteSuccess=true;
      sfxQteSuccess();
      if(qteType==='defend'){
        qteResultText='BLOCKED!';qteResultTimer=40;
        // Halve steal damage: give back stolen card if possible
        // (The steal already happened, so we give a pity boost instead)
        sp.b=Math.min(sp.b+1,9);
        lg.push('QTE success! Barrier charge restored!');
      }else{
        qteResultText='BONUS!';qteResultTimer=40;
        // Attack bonus: extra steal charge
        sp.s=Math.min(sp.s+1,9);
        lg.push('QTE success! Steal charge bonus!');
      }
    }
    if(battlePhase==='select'&&bpCardSelectActive){
      // Card selection for USE CARD
      const filled=[];for(let i=0;i<5;i++){if(pl[0].cd[i]>0)filled.push(i);}
      if(e.code==='ArrowUp'){bpCardSelectIdx=Math.max(0,bpCardSelectIdx-1);sfxCursor();}
      if(e.code==='ArrowDown'){bpCardSelectIdx=Math.min(filled.length-1,bpCardSelectIdx+1);sfxCursor();}
      if(e.code==='KeyZ'){
        sfxConfirm();
        bpAction=4;bpCardSelectActive=false;
        // Store which slot to use
        bpSelectedCardSlot=filled[bpCardSelectIdx];
        battlePhase='confirming';bpFrame=fr;
      }
      if(e.code==='KeyX'){bpCardSelectActive=false;sfxBack();}
    }else if(battlePhase==='select'&&bpTargetSelectActive){
      // Target selection for STEAL/SCOUT
      if(e.code==='ArrowUp'||e.code==='ArrowDown'){bpTargetSelectIdx=bpTargetSelectIdx===1?2:1;sfxCursor();}
      if(e.code==='KeyZ'){
        sfxConfirm();bpTargetSelectActive=false;
        bpAction=bpPendingAction;bpSelectedTarget=bpTargetSelectIdx;
        battlePhase='confirming';bpFrame=fr;
      }
      if(e.code==='KeyX'){bpTargetSelectActive=false;sfxBack();}
    }else if(battlePhase==='select'){
      // 2x2 grid navigation: 0=DRAW(TL), 1=STEAL(TR), 2=BARRIER(BL), 3=SCOUT(BR), 4=USE CARD(below)
      if(e.code==='ArrowUp'){
        if(ai===4){ai=2;sfxCursor();}
        else if(ai>=2){ai-=2;sfxCursor();}
      }
      if(e.code==='ArrowDown'){
        if(ai<2){ai+=2;sfxCursor();}
        else if(ai<4){ai=4;sfxCursor();}
      }
      if(e.code==='ArrowLeft'){
        if(ai===1){ai=0;sfxCursor();}
        else if(ai===3){ai=2;sfxCursor();}
      }
      if(e.code==='ArrowRight'){
        if(ai===0){ai=1;sfxCursor();}
        else if(ai===2){ai=3;sfxCursor();}
      }
      if(e.code==='KeyZ'){
        if(!isActionAvailable(ai)){sfxBack();return;}
        if(ai===4){
          // USE CARD: open card selection
          bpCardSelectActive=true;bpCardSelectIdx=0;sfxSelect();
        }else if(ai===1||ai===3){
          // STEAL or SCOUT: open target selection
          bpTargetSelectActive=true;bpTargetSelectIdx=1;bpPendingAction=ai;sfxSelect();
        }else{
          sfxConfirm();bpAction=ai;
          mpBroadcastBattleAction(ai,bpSelectedTarget);
          battlePhase='confirming';bpFrame=fr;
        }
      }
    }else if(battlePhase==='result'){
      if(e.code==='KeyZ'){
        sfxConfirm();rd++;
        // Every 10 rounds: recharge 1 depleted spell (prevents late-game stalemate)
        if(rd%10===0){
          let recharged=false;
          if(sp.s<2){sp.s++;recharged=true;}
          if(sp.b<3){sp.b++;recharged=true;}
          if(sp.c<2){sp.c++;recharged=true;}
          if(recharged){lg.push('R'+rd+': Spell energy restored!');}
        }
        // Check if there's a pending draw card needing discard
        if(bpResolveQueue&&bpResolveQueue._pendingDrawCard>0){
          const pendCard=bpResolveQueue._pendingDrawCard;
          bpResolveQueue._pendingDrawCard=0;
          discardActive=true;discardSelIdx=0;discardPendingCard=pendCard;discardSource='wild';
        }
        saveGame();
        if(playerHasAllFive()){checkWinAndTransition(0);}
        else if(!discardActive){
          // Battle-to-map: quick slide-down wipe
          startWipe('vslide',16,()=>{
            sc='map';mo=false;battlePhase='select';ub();
            startWipe('vslide_out',16);
          });
        }
      }
    }
  }

  // Story sequence input (Z to skip)
  if(storyActive){
    if(e.code==='KeyZ'){storyActive=false;storyFrame=0;fadeIn();}
    return;
  }

  // Credits screen input
  if(sc==='title'&&creditsActive){
    if(e.code==='KeyX'||e.code==='KeyZ'){creditsActive=false;creditsFrame=0;sfxBack();}
    return;
  }

  // Log screen input (scroll + back)
  if(sc==='log'){
    if(e.code==='ArrowUp'){logScrollOff=Math.min(logScrollOff+1,Math.max(0,lg.length-8));sfxCursor();}
    if(e.code==='ArrowDown'){logScrollOff=Math.max(0,logScrollOff-1);sfxCursor();}
    if(e.code==='KeyX'||e.code==='KeyZ'){sfxBack();logScrollOff=0;sc='map';ub();}
    return;
  }

  // Stats screen input
  if(sc==='stats'){
    if(e.code==='KeyX'||e.code==='KeyZ'){sfxBack();sc='map';ub();}
    return;
  }

  if(sc==='victory'){
    const waitTime=gameOverTimesUp?140:170;
    if((fr-victoryFrame)>waitTime){
      if(e.code==='KeyZ'){
        // Play again - reset all state
        sfxConfirm();
        gameOverTimesUp=false;
        resetGameState(false);
        fadeOut(()=>{sc='map';mo=false;showBanner('CORSAIR BAY','Aegis & Umbra spirits haunt the docks');
          fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
          fadeIn();twSet('Welcome back! Collect all 5 card types to win!');ub();});
      }
      if(e.code==='KeyX'){sfxBack();gameOverTimesUp=false;fadeOut(()=>{sc='title';fadeIn();ub();});}
    }
    return;
  }

  if(e.code==='KeyX'&&sc!=='title'&&sc!=='victory'&&sc!=='stats'){
    if(sc==='act'&&battlePhase!=='select')return;
    sfxBack();fadeOut(()=>{sc='map';mo=false;battlePhase='select';fadeIn();ub();});
  }
});

function ss(s){sfxSelect();fadeOut(()=>{sc=s;mo=false;if(s==='act'){battlePhase='vs_splash';bpFrame=fr;}fadeIn();ub();});}
function ub(){document.querySelectorAll('.b').forEach((b,i)=>b.classList.toggle('a',['map','crd','log','stats'][i]===sc));}

// ═══════════════════════════════════════
// SAVE / LOAD SYSTEM
// ═══════════════════════════════════════
const SAVE_KEY='oxark_save';

function saveGame(){
  try{
    const data={
      px:pl[0].x, py:pl[0].y, pdir:pl[0].dir, pstep:pl[0].step,
      pcd:[...pl[0].cd], pcc:pl[0].cc,
      r1x:pl[1].x, r1y:pl[1].y, r1dir:pl[1].dir, r1cd:[...pl[1].cd], r1cc:pl[1].cc,
      r2x:pl[2].x, r2y:pl[2].y, r2dir:pl[2].dir, r2cd:[...pl[2].cd], r2cc:pl[2].cc,
      sps:sp.s, spb:sp.b, spc:sp.c,
      rd:rd, stepCounter:stepCounter,
      currentMap:currentMap,
      rivalMaps:[...rivalMaps],
      rivalAI:rivalAI.map(a=>({goalX:a.goalX,goalY:a.goalY,goalMap:a.goalMap,
        personality:a.personality,moveInterval:a.moveInterval,
        lastKnownPlayerMap:a.lastKnownPlayerMap,lastKnownPlayerX:a.lastKnownPlayerX,
        lastKnownPlayerY:a.lastKnownPlayerY,state:a.state})),
      log:lg.slice(-20),
      treasures:treasures.map(t=>t.collected),
      sc:sc,
      tutorialFlags:{...tutorialFlags},
      randomEventTimer:randomEventTimer,
      triggeredTraps:[...triggeredTraps],
      puzzleStoneOrder:[...puzzleStoneOrder],
      puzzleSolved:puzzleSolved,
      shakenTrees:[...shakenTrees],
      pushedRocks:[...pushedRocks],
      usedCrystals:[...usedCrystals],
      campfireUsed:campfireUsed,
      burnedTiles:[...burnedTiles],
      shadowStepsLeft:shadowStepsLeft,
      fishingCooldownTimer:fishingCooldownTimer,
      walletAddress:walletPublicKey||null,
      cardTimers:[...cardTimers],
      streakCount:streakCount,
      areaDanger:[...areaDanger],
      areaDangerStayTimer:[...areaDangerStayTimer],
      seasonStartTime:seasonStartTime,
      seasonEndTime:seasonEndTime
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    saveIndicatorTimer=60;
  }catch(e){}
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    pl[0].x=d.px;pl[0].y=d.py;pl[0].dir=d.pdir;pl[0].step=d.pstep;
    pl[0].cd=[...d.pcd];pl[0].cc=d.pcc;
    pl[0].visualX=d.px*TW;pl[0].visualY=d.py*TH;pl[0].walkFrame=0;
    pl[1].x=d.r1x;pl[1].y=d.r1y;pl[1].dir=d.r1dir;pl[1].cd=[...d.r1cd];pl[1].cc=d.r1cc;
    pl[1].visualX=d.r1x*TW;pl[1].visualY=d.r1y*TH;pl[1].walkFrame=0;
    pl[2].x=d.r2x;pl[2].y=d.r2y;pl[2].dir=d.r2dir;pl[2].cd=[...d.r2cd];pl[2].cc=d.r2cc;
    pl[2].visualX=d.r2x*TW;pl[2].visualY=d.r2y*TH;pl[2].walkFrame=0;
    sp.s=d.sps;sp.b=d.spb;sp.c=d.spc;
    rd=d.rd;stepCounter=d.stepCounter;
    currentMap=d.currentMap;
    rivalMaps=[...d.rivalMaps];
    if(d.rivalAI){
      d.rivalAI.forEach((a,i)=>{
        if(rivalAI[i]){
          rivalAI[i].goalX=a.goalX;rivalAI[i].goalY=a.goalY;rivalAI[i].goalMap=a.goalMap;
          rivalAI[i].moveInterval=a.moveInterval;
          rivalAI[i].lastKnownPlayerMap=a.lastKnownPlayerMap;
          rivalAI[i].lastKnownPlayerX=a.lastKnownPlayerX;
          rivalAI[i].lastKnownPlayerY=a.lastKnownPlayerY;
          rivalAI[i].state=a.state;
        }
      });
    }
    lg.length=0;d.log.forEach(l=>lg.push(l));
    d.treasures.forEach((c,i)=>{if(treasures[i])treasures[i].collected=c;});
    if(d.tutorialFlags)tutorialFlags={...tutorialFlags,...d.tutorialFlags};
    if(d.randomEventTimer!==undefined)randomEventTimer=d.randomEventTimer;
    if(d.triggeredTraps)d.triggeredTraps.forEach(t=>triggeredTraps.add(t));
    if(d.puzzleStoneOrder)puzzleStoneOrder=[...d.puzzleStoneOrder];
    if(d.puzzleSolved!==undefined)puzzleSolved=d.puzzleSolved;
    if(d.shakenTrees)d.shakenTrees.forEach(t=>shakenTrees.add(t));
    if(d.pushedRocks)d.pushedRocks.forEach(t=>pushedRocks.add(t));
    if(d.usedCrystals)d.usedCrystals.forEach(t=>usedCrystals.add(t));
    if(d.campfireUsed!==undefined)campfireUsed=d.campfireUsed;
    if(d.burnedTiles){burnedTiles.length=0;d.burnedTiles.forEach(t=>{burnedTiles.push(t);if(maps[t.mapIdx]&&maps[t.mapIdx][t.y])maps[t.mapIdx][t.y][t.x]=1;});}
    if(d.shadowStepsLeft!==undefined)shadowStepsLeft=d.shadowStepsLeft;
    if(d.fishingCooldownTimer!==undefined)fishingCooldownTimer=d.fishingCooldownTimer;
    if(d.walletAddress){walletPublicKey=d.walletAddress;walletConnected=true;}
    // Tension mechanics
    if(d.cardTimers){for(let i=0;i<5;i++)cardTimers[i]=d.cardTimers[i]||0;}
    if(d.streakCount!==undefined)streakCount=d.streakCount;
    if(d.areaDanger){for(let i=0;i<3;i++)areaDanger[i]=d.areaDanger[i]||0;}
    if(d.areaDangerStayTimer){for(let i=0;i<3;i++)areaDangerStayTimer[i]=d.areaDangerStayTimer[i]||0;}
    // Season data
    if(d.seasonStartTime){seasonStartTime=d.seasonStartTime;seasonEndTime=d.seasonEndTime||d.seasonStartTime+SEASON_DURATION_MS;}
    else{initSeason();} // legacy saves: start fresh season
    // Sync card counts from actual data to prevent drift
    syncCardCount(0);syncCardCount(1);syncCardCount(2);
    fogLoad();
    camX=pl[0].visualX-W/2;camY=pl[0].visualY-H/2;
    camTargetX=camX;camTargetY=camY;
    edgeCacheDirty=true;fogCacheDirty=true;
    return true;
  }catch(e){return false;}
}

function hasSave(){
  try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}
}

function clearSave(){
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

// ═══════════════════════════════════════
// TOUCH CONTROLS
// ═══════════════════════════════════════
const isTouchDevice=('ontouchstart' in window)||(navigator.maxTouchPoints>0);

function simulateKey(code){
  document.dispatchEvent(new KeyboardEvent('keydown',{code:code,bubbles:true}));
}

function haptic(){try{if(navigator.vibrate)navigator.vibrate(10);}catch(e){}}

if(isTouchDevice){
  document.getElementById('touch-overlay').classList.add('active');
  // Also resume audio on touch
  document.addEventListener('touchstart',resumeAudio,{once:false});

  const btnMap={
    'dpad-up':'ArrowUp','dpad-down':'ArrowDown','dpad-left':'ArrowLeft','dpad-right':'ArrowRight',
    'btn-a':'KeyZ','btn-b':'KeyX','btn-start':'Space'
  };
  Object.keys(btnMap).forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{
      e.preventDefault();
      el.classList.add('pressed');
      haptic();
      simulateKey(btnMap[id]);
    },{passive:false});
    el.addEventListener('touchend',e=>{
      e.preventDefault();
      el.classList.remove('pressed');
    },{passive:false});
    el.addEventListener('touchcancel',e=>{
      el.classList.remove('pressed');
    });
  });

  // Swipe detection on canvas (use pixiApp.view which is visible)
  let touchStartX=0,touchStartY=0,touchStartTime=0;
  const touchCanvas=pixiApp.view;
  touchCanvas.addEventListener('touchstart',e=>{
    if(e.touches.length===1){
      const t=e.touches[0];
      touchStartX=t.clientX;touchStartY=t.clientY;
      touchStartTime=Date.now();
    }
  },{passive:true});
  touchCanvas.addEventListener('touchend',e=>{
    const elapsed=Date.now()-touchStartTime;
    if(elapsed>300)return; // too slow for swipe
    const ct=e.changedTouches[0];
    const dx=ct.clientX-touchStartX,dy=ct.clientY-touchStartY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<20){
      // Tap: move toward tapped position
      const rect=touchCanvas.getBoundingClientRect();
      const scaleX=W/rect.width,scaleY=H/rect.height;
      const cx_=(ct.clientX-rect.left)*scaleX;
      const cy_=(ct.clientY-rect.top)*scaleY;
      if(sc==='map'&&!mo){
        const worldX=cx_+camX,worldY=cy_+camY;
        const tileX=Math.floor(worldX/TW),tileY=Math.floor(worldY/TH);
        const pdx=tileX-pl[0].x,pdy=tileY-pl[0].y;
        if(Math.abs(pdx)>=Math.abs(pdy)){
          simulateKey(pdx>0?'ArrowRight':'ArrowLeft');
        }else{
          simulateKey(pdy>0?'ArrowDown':'ArrowUp');
        }
      }
    }else{
      // Swipe
      if(Math.abs(dx)>Math.abs(dy)){
        simulateKey(dx>0?'ArrowRight':'ArrowLeft');
      }else{
        simulateKey(dy>0?'ArrowDown':'ArrowUp');
      }
    }
    haptic();
  },{passive:true});
}

// Initial x402 server check
x402CheckServer();

requestAnimationFrame(loop);
</script>
