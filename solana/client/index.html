// ═══════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════
function updateVisualPositions(){
  const lerpT=1-Math.pow(1-0.2,dt);
  pl.forEach(p=>{
    p.visualX=lerp(p.visualX,p.x*TW,lerpT);
    p.visualY=lerp(p.visualY,p.y*TH,lerpT);
    // Update walk frame based on movement distance
    const dx=Math.abs(p.visualX-p.x*TW),dy=Math.abs(p.visualY-p.y*TH);
    if(dx>0.5||dy>0.5){
      // Still moving - advance walk cycle
      p._walkAccum=(p._walkAccum||0)+dt;
      if(p._walkAccum>=4){p._walkAccum=0;p.walkFrame=(p.walkFrame+1)%4;}
    }else{
      p.walkFrame=0;p._walkAccum=0;
    }
  });
}

function update(){
  fr++;
  if(fr%20===0)wt++;
  twTick();
  fadeUpdate();updateParticles();updateBanner();
  updateVisualPositions();updateAmbient();
  // Save indicator countdown
  if(saveIndicatorTimer>0)saveIndicatorTimer--;
  // Auto-save every 30 seconds when on map
  if(sc==='map'&&!mo){
    autoSaveTimer++;
    if(autoSaveTimer>=AUTO_SAVE_INTERVAL){autoSaveTimer=0;saveGame();}
  }
  if(flashT>0)flashT-=dt;
  if(bpShakeTimer>0)bpShakeTimer-=dt;
  if(rivalAlert>0)rivalAlert-=dt;

  // Bird movement
  if(fr%10===0){
    birds.forEach(b=>{
      b.timer--;
      if(b.timer<=0){
        b.vx=(Math.random()-.5)*2;b.vy=(Math.random()-.5)*2;
        b.timer=20+Math.floor(Math.random()*40);
      }
      const nx=b.x+Math.round(b.vx),ny=b.y+Math.round(b.vy);
      const m=maps[1];
      if(nx>=1&&nx<MW-1&&ny>=1&&ny<MH-1){
        const t=m[ny]?.[nx];
        if(t===1||t===2||t===7||t===11)b.x=nx;
      }
      if(ny>=1&&ny<MH-1){
        const t=m[ny]?.[b.x];
        if(t===1||t===2||t===7||t===11)b.y=ny;
      }
    });
  }

  // NPC AI movement (rivals on their maps)
  if(fr%50===0){
    pl.slice(1).forEach((p,idx)=>{
      const rMap=rivalMaps[idx];
      const m=maps[rMap];
      const dx=Math.floor(Math.random()*3)-1;
      const dy=Math.floor(Math.random()*3)-1;
      const nx=p.x+dx,ny=p.y+dy;
      if(nx>=0&&nx<MW&&ny>=0&&ny<MH&&WALKABLE.has(m[ny]?.[nx])){
        if(dx<0)p.dir=1;else if(dx>0)p.dir=3;
        else if(dy<0)p.dir=2;else if(dy>0)p.dir=0;
        p.x=nx;p.y=ny;p.step++;
      }
    });
  }

  // Rival map teleport (every ~30 seconds = 1800 frames)
  rivalMapTimer++;
  if(rivalMapTimer>=1800){
    rivalMapTimer=0;
    for(let i=0;i<2;i++){
      const oldMap=rivalMaps[i];
      const newMap=Math.floor(Math.random()*3);
      rivalMaps[i]=newMap;
      // Reposition rival on new map
      const m=maps[newMap];
      let placed=false;
      for(let attempt=0;attempt<50&&!placed;attempt++){
        const rx=5+Math.floor(Math.random()*(MW-10));
        const ry=5+Math.floor(Math.random()*(MH-10));
        if(WALKABLE.has(m[ry]?.[rx])){
          pl[i+1].x=rx;pl[i+1].y=ry;
          pl[i+1].visualX=rx*TW;pl[i+1].visualY=ry*TH;
          placed=true;
        }
      }
      // Alert if entered player's map
      if(newMap===currentMap&&oldMap!==currentMap){
        rivalAlert=90;rivalAlertName=pl[i+1].n;
        flash();beep(660,.04,.06);
      }
    }
  }

  // Encounter check (only if rival on same map)
  if(sc==='map'&&!mo&&!npcDialogActive&&!wildEncounterActive&&!mapTransitioning&&!encounterExclActive&&!shopActive&&!signpostActive){
    pl.slice(1).forEach((r,idx)=>{
      if(rivalMaps[idx]!==currentMap)return;
      if(Math.abs(r.x-pl[0].x)<=1&&Math.abs(r.y-pl[0].y)<=1&&Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y)===1){
        if(!encounterCooldown){
          encounterCooldown=120;
          // Show "!" exclamation above both sprites, then freeze 0.5s before transition
          encounterExclActive=true;
          encounterExclFrame=fr;
          encounterExclTarget=idx+1;
          encounterExclPlayerX=pl[0].visualX;
          encounterExclPlayerY=pl[0].visualY;
          encounterExclRivalX=r.visualX;
          encounterExclRivalY=r.visualY;
          sfxEncounterDramatic();
          // After 0.5s freeze (30 frames), do screen wipe transition
          setTimeout(()=>{
            encounterExclActive=false;
            flash();
            twSet('Wild '+r.n+' appeared! Entering battle...');
            // Wipe transition (diagonal)
            battleWipeActive=true;battleWipeFrame=fr;
            setTimeout(()=>{
              battleWipeActive=false;
              fadeOut(()=>{sc='act';actEnterFrame=fr;battlePhase='vs_splash';bpFrame=fr;fadeIn();});
            },600);
          },500);
        }
      }
    });
    if(encounterCooldown>0)encounterCooldown--;
  }
}

function draw(){
  g.clearRect(0,0,W,H);
  if(sc==='title')dTitle();
  else if(sc==='map'){dMap();if(mo)dMenu();}
  else if(sc==='act')dAct();
  else if(sc==='crd')dCrd();
  else if(sc==='log')dLog();
  else if(sc==='victory')dVictory();
  drawCardAcquisition();
  if(flashT>0){bx(0,0,W,H,`rgba(255,255,255,${(flashT>10?1:flashT/10)*.8})`);}
  // Battle wipe transition (diagonal split)
  if(battleWipeActive){
    const t=Math.min(1,(fr-battleWipeFrame)/36);
    const ease=easeInOut(t);
    const splitW=W*ease*1.2;
    g.fillStyle='#181828';
    g.beginPath();g.moveTo(0,0);g.lineTo(splitW,0);g.lineTo(splitW-W*0.3,H);g.lineTo(0,H);g.closePath();g.fill();
    g.beginPath();g.moveTo(W,H);g.lineTo(W-splitW,H);g.lineTo(W-splitW+W*0.3,0);g.lineTo(W,0);g.closePath();g.fill();
  }
  fadeDraw();
}

function loop(now){
  if(!lastTime)lastTime=now;
  dt=Math.min(3,Math.max(0.1,(now-lastTime)/16.67)); // normalized to 60fps, clamped
  lastTime=now;
  update();draw();requestAnimationFrame(loop);
}

// ═══════════════════════════════════════
// INPUT
// ═══════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.repeat)return;

  // Sound toggle with M key
  if(e.code==='KeyM'){
    soundEnabled=!soundEnabled;
    localStorage.setItem('oxark_sound',soundEnabled?'on':'off');
    if(!soundEnabled){stopAmbientNodes();ambientState.currentArea=-1;}
    return;
  }

  if(sc==='title'){
    if(hasSave()){
      if(e.code==='ArrowUp'){titleMenuIdx=0;sfxMove();}
      if(e.code==='ArrowDown'){titleMenuIdx=1;sfxMove();}
      if(e.code==='KeyZ'){
        sfxConfirm();
        if(titleMenuIdx===0){
          // CONTINUE
          fadeOut(()=>{
            if(loadGame()){
              sc='map';showBanner(mapNames[currentMap]);
              fadeIn();twSet('Welcome back!');
            }else{
              sc='map';currentMap=0;showBanner('PORT TOWN');
              fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
              fadeIn();twSet('Welcome to 0xARK! Walk into tall grass to find cards. Collect all 5 types to win!');
            }
          });
        }else{
          // NEW GAME
          clearSave();fogClear();
          pl[0].cd=[1,3,0,0,0];pl[0].cc=2;pl[0].x=15;pl[0].y=13;pl[0].dir=0;pl[0].step=0;pl[0].visualX=15*TW;pl[0].visualY=13*TH;pl[0].walkFrame=0;
          pl[1].cd=[2,5,0,0,0];pl[1].cc=2;pl[1].x=19;pl[1].y=14;pl[1].dir=2;pl[1].step=0;pl[1].visualX=19*TW;pl[1].visualY=14*TH;pl[1].walkFrame=0;
          pl[2].cd=[4,0,0,0,0];pl[2].cc=1;pl[2].x=6;pl[2].y=11;pl[2].dir=0;pl[2].step=0;pl[2].visualX=6*TW;pl[2].visualY=11*TH;pl[2].walkFrame=0;
          sp.s=3;sp.b=2;sp.c=1;rd=3;stepCounter=0;randomEventTimer=0;
          rivalMaps=[0,0];lg.length=0;lg.push('Game started. Collect all 5 card types to win!');
          treasures.forEach(t=>t.collected=false);
          fadeOut(()=>{sc='map';currentMap=0;showBanner('PORT TOWN');
            fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
            fadeIn();twSet('Welcome to 0xARK! Walk into tall grass to find cards. Collect all 5 types to win!');});
        }
      }
    }else{
      if(e.code==='KeyZ'){
        sfxConfirm();
        fadeOut(()=>{sc='map';currentMap=0;showBanner('PORT TOWN');
          fogRevealRadius(0,pl[0].x,pl[0].y,2);fogSave();
          fadeIn();twSet('Welcome to 0xARK! Walk into tall grass to find cards. Collect all 5 types to win!');});
      }
    }
    return;
  }

  // NPC Dialog handling
  if(npcDialogActive){
    if(e.code==='KeyZ'||e.code==='Space'){
      npcDialogIdx+=2;
      if(npcDialogIdx>=npcDialogLines.length){npcDialogActive=false;npcDialogIdx=0;}
      else sfxSelect();
    }
    if(e.code==='KeyX'){npcDialogActive=false;sfxBack();}
    return;
  }

  // Signpost dialog handling
  if(signpostActive){
    if(e.code==='KeyZ'||e.code==='Space'||e.code==='KeyX'){signpostActive=false;sfxBack();}
    return;
  }

  // Card Shop handling
  if(shopActive){
    const filled=getPlayerFilledSlots();
    if(shopPhase==='list'){
      if(filled.length>0){
        if(e.code==='ArrowUp'){shopSelectedIdx=Math.max(0,shopSelectedIdx-1);sfxMove();}
        if(e.code==='ArrowDown'){shopSelectedIdx=Math.min(filled.length-1,shopSelectedIdx+1);sfxMove();}
        if(e.code==='KeyZ'){shopPhase='confirm';sfxSelect();}
      }
      if(e.code==='KeyX'){shopActive=false;sfxBack();}
    }else if(shopPhase==='confirm'){
      if(e.code==='KeyZ'){doShopTrade();}
      if(e.code==='KeyX'){shopPhase='list';sfxBack();}
    }else if(shopPhase==='result'){
      if(e.code==='KeyZ'){shopPhase='list';shopSelectedIdx=0;sfxSelect();}
      if(e.code==='KeyX'){shopActive=false;sfxBack();}
    }
    return;
  }

  // Random event dismiss
  if(randomEventActive){
    if(e.code==='KeyZ'||e.code==='Space'){randomEventActive=false;}
    return;
  }

  // Wild encounter - wait
  if(wildEncounterActive)return;

  // Battle encounter exclamation or wipe - wait
  if(encounterExclActive||battleWipeActive)return;

  if(sc==='map'){
    if(e.code==='Space'){mo=!mo;mi=0;menuOpenFrame=0;sfxSelect();return;}
    if(mo){
      if(e.code==='ArrowUp'){mi=Math.max(0,mi-1);sfxMove();}
      if(e.code==='ArrowDown'){mi=Math.min(6,mi+1);sfxMove();}
      if(e.code==='KeyZ'){
        sfxConfirm();const s=['crd','map','act','log'];
        if(mi===6)mo=false;
        else if(mi===4){
          // SAVE
          saveGame();
          twSet('Game saved!');
          mo=false;menuOpenFrame=0;
        }
        else if(mi===5){
          // NEW GAME: reset all state
          clearSave();fogClear();
          pl[0].cd=[1,3,0,0,0];pl[0].cc=2;pl[0].x=15;pl[0].y=13;pl[0].dir=0;pl[0].step=0;pl[0].visualX=15*TW;pl[0].visualY=13*TH;pl[0].walkFrame=0;
          pl[1].cd=[2,5,0,0,0];pl[1].cc=2;pl[1].x=19;pl[1].y=14;pl[1].dir=2;pl[1].step=0;pl[1].visualX=19*TW;pl[1].visualY=14*TH;pl[1].walkFrame=0;
          pl[2].cd=[4,0,0,0,0];pl[2].cc=1;pl[2].x=6;pl[2].y=11;pl[2].dir=0;pl[2].step=0;pl[2].visualX=6*TW;pl[2].visualY=11*TH;pl[2].walkFrame=0;
          edgeCacheDirty=true;fogCacheDirty=true;
          sp.s=3;sp.b=2;sp.c=1;rd=3;currentMap=0;
          stepCounter=0;randomEventTimer=0;
          rivalMaps=[0,0];lg.length=0;lg.push('New game started!');
          treasures.forEach(t=>t.collected=false);
          fadeOut(()=>{sc='title';mo=false;fadeIn();ub();});
        }
        else{fadeOut(()=>{sc=s[mi];mo=false;if(sc==='act'){actEnterFrame=fr;battlePhase='vs_splash';bpFrame=fr;}fadeIn();ub();});}
      }
      if(e.code==='KeyX'){mo=false;menuOpenFrame=0;sfxBack();}
    }else{
      // Z = interact with NPC or signpost
      if(e.code==='KeyZ'){
        if(checkNPCInteraction())return;
        if(checkSignpostInteraction())return;
      }

      const p=pl[0];let nx=p.x,ny=p.y;
      if(e.code==='ArrowUp'){ny--;p.dir=2;}
      if(e.code==='ArrowDown'){ny++;p.dir=0;}
      if(e.code==='ArrowLeft'){nx--;p.dir=1;}
      if(e.code==='ArrowRight'){nx++;p.dir=3;}
      if(nx!==p.x||ny!==p.y){
        const m=getMap();
        if(nx>=0&&nx<MW&&ny>=0&&ny<MH&&WALKABLE.has(m[ny]?.[nx])){
          p.x=nx;p.y=ny;p.step++;p.walkFrame=(p.walkFrame+1)%4;sfxMove();sfxStep();
          stepCounter++;
          edgeCacheDirty=true;
          // Reveal fog around new position
          fogRevealRadius(currentMap,nx,ny,2);
          fogSave();
          const newTile=m[ny]?.[nx];
          if(newTile===1||newTile===7||newTile===11){spawnGrassParticles(nx*TW,ny*TH);sfxGrassRustle();}
          // Water proximity sound
          if(newTile!==0){const adj=[[nx-1,ny],[nx+1,ny],[nx,ny-1],[nx,ny+1]];if(adj.some(([ax,ay])=>ax>=0&&ax<MW&&ay>=0&&ay<MH&&m[ay]?.[ax]===0))sfxWaterNear();}

          // Random map event every 200 steps
          randomEventTimer++;
          if(randomEventTimer>=200&&!randomEventActive&&!wildEncounterActive&&!cardAcqActive){
            randomEventTimer=0;
            triggerRandomEvent();
          }

          // Check exit
          const exit=checkExitTile(nx,ny);
          if(exit){doMapTransition(exit);return;}

          // Check treasure
          checkTreasure();

          // Check wild encounter
          if(!cardAcqActive&&!randomEventActive)tryWildEncounter();
        }
      }
    }
  }

  if(sc==='act'){
    if(battlePhase==='select'){
      if(e.code==='ArrowUp'){ai=Math.max(0,ai-1);sfxMove();}
      if(e.code==='ArrowDown'){ai=Math.min(4,ai+1);sfxMove();}
      if(e.code==='KeyZ'){
        if(!isActionAvailable(ai)){sfxBack();return;}
        sfxConfirm();bpAction=ai;
        battlePhase='confirming';bpFrame=fr;
      }
    }else if(battlePhase==='result'){
      if(e.code==='KeyZ'){
        sfxConfirm();rd++;
        saveGame();
        if(playerHasAllFive()){fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});}
        else if(rd>25){fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});}
        else{fadeOut(()=>{sc='map';mo=false;battlePhase='select';fadeIn();ub();});}
      }
    }
  }

  if(sc==='victory'){
    if(e.code==='KeyZ'&&(fr-victoryFrame)>170){sfxConfirm();fadeOut(()=>{sc='title';fadeIn();ub();});}
    return;
  }

  if(e.code==='KeyX'&&sc!=='title'&&sc!=='victory'){
    if(sc==='act'&&battlePhase!=='select')return;
    sfxBack();fadeOut(()=>{sc='map';mo=false;battlePhase='select';fadeIn();ub();});
  }
});

function ss(s){sfxSelect();fadeOut(()=>{sc=s;mo=false;if(s==='act'){actEnterFrame=fr;battlePhase='vs_splash';bpFrame=fr;}fadeIn();ub();});}
function ub(){document.querySelectorAll('.b').forEach((b,i)=>b.classList.toggle('a',['map','act','crd','log'][i]===sc));}

// ═══════════════════════════════════════
// SAVE / LOAD SYSTEM
// ═══════════════════════════════════════
const SAVE_KEY='oxark_save';

function saveGame(){
  try{
    const data={
      px:pl[0].x, py:pl[0].y, pdir:pl[0].dir, pstep:pl[0].step,
      pcd:[...pl[0].cd], pcc:pl[0].cc,
      r1x:pl[1].x, r1y:pl[1].y, r1dir:pl[1].dir, r1cd:[...pl[1].cd], r1cc:pl[1].cc,
      r2x:pl[2].x, r2y:pl[2].y, r2dir:pl[2].dir, r2cd:[...pl[2].cd], r2cc:pl[2].cc,
      sps:sp.s, spb:sp.b, spc:sp.c,
      rd:rd, stepCounter:stepCounter,
      currentMap:currentMap,
      rivalMaps:[...rivalMaps],
      log:lg.slice(-20),
      treasures:treasures.map(t=>t.collected),
      sc:sc
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    saveIndicatorTimer=60;
  }catch(e){}
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    pl[0].x=d.px;pl[0].y=d.py;pl[0].dir=d.pdir;pl[0].step=d.pstep;
    pl[0].cd=[...d.pcd];pl[0].cc=d.pcc;
    pl[0].visualX=d.px*TW;pl[0].visualY=d.py*TH;pl[0].walkFrame=0;
    pl[1].x=d.r1x;pl[1].y=d.r1y;pl[1].dir=d.r1dir;pl[1].cd=[...d.r1cd];pl[1].cc=d.r1cc;
    pl[1].visualX=d.r1x*TW;pl[1].visualY=d.r1y*TH;pl[1].walkFrame=0;
    pl[2].x=d.r2x;pl[2].y=d.r2y;pl[2].dir=d.r2dir;pl[2].cd=[...d.r2cd];pl[2].cc=d.r2cc;
    pl[2].visualX=d.r2x*TW;pl[2].visualY=d.r2y*TH;pl[2].walkFrame=0;
    sp.s=d.sps;sp.b=d.spb;sp.c=d.spc;
    rd=d.rd;stepCounter=d.stepCounter;
    currentMap=d.currentMap;
    rivalMaps=[...d.rivalMaps];
    lg.length=0;d.log.forEach(l=>lg.push(l));
    d.treasures.forEach((c,i)=>{if(treasures[i])treasures[i].collected=c;});
    fogLoad();
    camX=pl[0].visualX-W/2;camY=pl[0].visualY-H/2;
    camTargetX=camX;camTargetY=camY;
    edgeCacheDirty=true;fogCacheDirty=true;
    return true;
  }catch(e){return false;}
}

function hasSave(){
  try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}
}

function clearSave(){
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

// ═══════════════════════════════════════
// TOUCH CONTROLS
// ═══════════════════════════════════════
const isTouchDevice=('ontouchstart' in window)||(navigator.maxTouchPoints>0);

function simulateKey(code){
  document.dispatchEvent(new KeyboardEvent('keydown',{code:code,bubbles:true}));
}

function haptic(){try{if(navigator.vibrate)navigator.vibrate(10);}catch(e){}}

if(isTouchDevice){
  document.getElementById('touch-overlay').classList.add('active');
  // Also resume audio on touch
  document.addEventListener('touchstart',resumeAudio,{once:false});

  const btnMap={
    'dpad-up':'ArrowUp','dpad-down':'ArrowDown','dpad-left':'ArrowLeft','dpad-right':'ArrowRight',
    'btn-a':'KeyZ','btn-b':'KeyX','btn-start':'Space'
  };
  Object.keys(btnMap).forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{
      e.preventDefault();
      el.classList.add('pressed');
      haptic();
      simulateKey(btnMap[id]);
    },{passive:false});
    el.addEventListener('touchend',e=>{
      e.preventDefault();
      el.classList.remove('pressed');
    },{passive:false});
    el.addEventListener('touchcancel',e=>{
      el.classList.remove('pressed');
    });
  });

  // Swipe detection on canvas
  let touchStartX=0,touchStartY=0,touchStartTime=0;
  c.addEventListener('touchstart',e=>{
    if(e.touches.length===1){
      const t=e.touches[0];
      touchStartX=t.clientX;touchStartY=t.clientY;
      touchStartTime=Date.now();
    }
  },{passive:true});
  c.addEventListener('touchend',e=>{
    const elapsed=Date.now()-touchStartTime;
    if(elapsed>300)return; // too slow for swipe
    const ct=e.changedTouches[0];
    const dx=ct.clientX-touchStartX,dy=ct.clientY-touchStartY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<20){
      // Tap: move toward tapped position
      const rect=c.getBoundingClientRect();
      const scaleX=W/rect.width,scaleY=H/rect.height;
      const cx_=(ct.clientX-rect.left)*scaleX;
      const cy_=(ct.clientY-rect.top)*scaleY;
      if(sc==='map'&&!mo){
        const worldX=cx_+camX,worldY=cy_+camY;
        const tileX=Math.floor(worldX/TW),tileY=Math.floor(worldY/TH);
        const pdx=tileX-pl[0].x,pdy=tileY-pl[0].y;
        if(Math.abs(pdx)>=Math.abs(pdy)){
          simulateKey(pdx>0?'ArrowRight':'ArrowLeft');
        }else{
          simulateKey(pdy>0?'ArrowDown':'ArrowUp');
        }
      }
    }else{
      // Swipe
      if(Math.abs(dx)>Math.abs(dy)){
        simulateKey(dx>0?'ArrowRight':'ArrowLeft');
      }else{
        simulateKey(dy>0?'ArrowDown':'ArrowUp');
      }
    }
    haptic();
  },{passive:true});
}

requestAnimationFrame(loop);
