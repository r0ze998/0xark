<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0xARK — Card Battle on Solana</title>

  <!-- VT323 pixel font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <!-- Sprite Seas Design System — tokens are the single source of palette/type
       (DESIGN.md v1.0 / Appendix A). The :root palette that used to live here is
       replaced by tokens.css; load it before all component CSS below. -->
  <link rel="stylesheet" href="src/style/tokens.css">
  <style>
    /* ── Reset ───────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    img { image-rendering: auto; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
    }

    body {
      color: var(--text-cream);
      font-family: var(--font-main);
      font-size: 20px;
      letter-spacing: var(--ls-normal);
      overflow: hidden;
      user-select: none;
    }

    /* ── Stage viewport — letterbox host; centers + scales #app ──
       (DESIGN.md Stage & Layout; scaling driven by src/stage-scaler.js) */
    #stage-viewport {
      width: 100vw; height: 100dvh;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ── App container: the 1024×576 logical box (scaled by the scaler) ── */
    #app {
      width: 1024px;
      height: 576px;
      position: relative;
      overflow: hidden;
      background: var(--bg-deep);
      flex-shrink: 0;
    }

    /* Portrait (desktop-first): dim the stage, show the rotate overlay. */
    #rotate-overlay {
      position: fixed; inset: 0; z-index: var(--z-modal, 100);
      display: none; align-items: center; justify-content: center;
      background: var(--overlay-scrim, rgba(0,0,0,0.6));
      color: var(--text-cream);
      font-family: var(--font-main);
      font-size: var(--fs-title, 32px); letter-spacing: var(--ls-wide, 0.08em);
      text-align: center; padding: 24px;
    }
    html.is-portrait #rotate-overlay { display: flex; }
    html.is-portrait #stage-viewport { filter: brightness(0.22); }

    /* ── Loading state ───────────────────────────────────── */
    #app-loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--bg-deep);
      z-index: 999;
    }
    .load-logo { font-size: 72px; color: var(--accent-gold); letter-spacing: 0.12em; }
    .load-sub  { font-size: 18px; color: var(--text-dim); letter-spacing: 0.1em; }
    .load-bar-wrap {
      width: 200px; height: 4px; background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .load-bar {
      height: 100%; background: var(--accent-gold);
      animation: load-sweep 1.2s ease-in-out infinite;
    }
    @keyframes load-sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* ── Shared component classes ────────────────────────── */
    .gba-btn {
      font-family: var(--font-main);
      font-size: 20px;
      letter-spacing: var(--ls-normal);
      color: var(--text-cream);
      background: var(--bg-mid);
      border: var(--border-gold);
      padding: 7px 22px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 80ms, color 80ms;
      line-height: 1;
    }
    .gba-btn:hover, .gba-btn:focus-visible, .gba-btn.is-active {
      background: var(--accent-gold); color: var(--bg-deep); outline: none;
    }
    .gba-btn:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
    .gba-btn--primary { background: var(--accent-gold); color: var(--bg-deep); font-size: 22px; border-width: 2px; }
    .gba-btn--primary:hover { background: var(--accent-gold-bright); }
    .gba-btn--ghost { background: transparent; border: var(--border-dim); color: var(--text-dim); }
    .gba-btn--ghost:hover { border-color: var(--accent-gold); color: var(--text-cream); background: transparent; }
    .gba-btn--danger { border-color: var(--accent-red); }
    .gba-btn--danger:hover { background: var(--accent-red); color: #fff; }

    .panel { background: var(--bg-panel); border: var(--border-gold); padding: 12px 16px; }
    .chip {
      font-family: var(--font-main); font-size: 15px; letter-spacing: var(--ls-wide);
      background: var(--bg-panel); border: var(--border-dim); padding: 3px 10px;
      white-space: nowrap; line-height: 1.4;
    }

    .label-gold { color: var(--accent-gold); }
    .label-red  { color: var(--accent-red); }
    .label-dim  { color: var(--text-dim); font-size: 15px; }
    .sep        { color: var(--accent-gold); margin: 0 6px; }
    .mono       { font-family: 'Courier New', monospace; font-size: 13px; }

    .abs { position: absolute; }
    .flex-center { display: flex; align-items: center; justify-content: center; }
    .flex-row { display: flex; align-items: center; }
    .gap-8  { gap: 8px; }
    .gap-16 { gap: 16px; }
    .gap-24 { gap: 24px; }

    .clan-knight    { color: var(--clan-knight); }
    .clan-merchant  { color: var(--clan-merchant); }
    .clan-pirate    { color: var(--clan-pirate); }
    .clan-scholar   { color: var(--clan-scholar); }
    .clan-monk      { color: var(--clan-monk); }
    .clan-engineer  { color: var(--clan-engineer); }
  </style>
</head>
<body>
  <div id="stage-viewport">
    <div id="app">
      <div id="app-loading">
        <div class="load-logo">0xARK</div>
        <div class="load-sub">CARD BATTLE ON SOLANA</div>
        <div class="load-bar-wrap"><div class="load-bar"></div></div>
      </div>
    </div>
  </div>
  <div id="rotate-overlay" role="alert">ROTATE DEVICE ⟳<br><span style="font-size:var(--fs-ui,16px);color:var(--text-dim);">0xARK is landscape-first</span></div>

  <!-- Solana web3.js (required by onchain.js — sets window.solanaWeb3) -->
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>

  <!-- On-chain module (YKK-15 split: sets window.oxarkOnchain via compat shim).
       ES module — runs after the web3 CDN classic script, before app.js's module
       graph, so window.oxarkOnchain is populated before any screen consumes it. -->
  <script type="module" src="src/onchain/index.js"></script>

  <!-- x402 micropayment client (sets window.x402) -->
  <script src="src/02-x402.js"></script>

  <!-- ZK proof library (hand_commitment.circom Groth16) -->
  <script src="https://cdn.jsdelivr.net/npm/snarkjs@0.7.4/build/snarkjs.min.js"></script>

  <!-- Server config — override WS URL for production (auto-detected when unset) -->
  <!-- <script>window.OXARK_WS_URL = "wss://oxark-multiplayer.fly.dev";</script> -->

  <!-- Wallet adapter — bridges Phantom / Solflare to window.oxarkWallet -->
  <script>
    (function detectWallet() {
      var p  = window.phantom?.solana;
      var sf = window.solflare;
      var raw = (p?.isPhantom) ? p : (sf?.isSolflare) ? sf : null;
      if (!raw) { window.oxarkWallet = null; return; }
      window.oxarkWallet = {
        connect:      function() { return raw.connect(); },
        disconnect:   function() { return raw.disconnect?.(); },
        getPublicKey: function() { return raw.publicKey ?? null; },
        isConnected:  function() { return !!raw.isConnected; },
      };
    })();

    // If Phantom injects after this script runs, re-detect on first connect attempt.
    // main-screen.js calls window.oxarkWallet?.connect — the getter below ensures
    // we always read the freshest wallet state.
    Object.defineProperty(window, 'oxarkWallet', {
      get: function() {
        if (this._oxarkWallet) return this._oxarkWallet;
        var p  = window.phantom?.solana;
        var sf = window.solflare;
        var raw = (p?.isPhantom) ? p : (sf?.isSolflare) ? sf : null;
        if (!raw) return null;
        this._oxarkWallet = {
          connect:      function() { return raw.connect(); },
          disconnect:   function() { return raw.disconnect?.(); },
          getPublicKey: function() { return raw.publicKey ?? null; },
          isConnected:  function() { return !!raw.isConnected; },
        };
        return this._oxarkWallet;
      },
      set: function(v) { this._oxarkWallet = v; },
      configurable: true,
    });
  </script>

  <!-- ZK proof module (sets window.zkCardCommit — required for Groth16 proving) -->
  <script src="src/03-zk-prove.js"></script>

  <!-- Battle UI entry point -->
  <script type="module">
    // Hide loading once app.js executes
    import('./app.js').then(() => {
      const loading = document.getElementById('app-loading');
      if (loading) loading.style.display = 'none';
    }).catch(err => {
      const loading = document.getElementById('app-loading');
      if (loading) loading.innerHTML = `
        <div class="load-logo" style="color:var(--accent-red)">ERROR</div>
        <div class="load-sub">${err.message}</div>
      `;
      console.error(err);
    });
  </script>

  <!-- Stage scaler — fits the 1024×576 logical box to any display (F0-2) -->
  <script type="module" src="src/stage-scaler.js"></script>
</body>
</html>
