const CARD_SOURCE_HINTS=[
  // For each card index 0-59, which floor/source to find it
  // Floor 1=F1, 2=F2, etc., 0=any
  // Built from DUNGEON_FLOOR_CARDS in runtime below
];
function getCardSourceHint(cardId){
  // Check which dungeon floor pools contain this card
  const floors=[];
  for(let f=1;f<=5;f++){
    const pool=DUNGEON_FLOOR_CARDS[f];
    if(pool&&pool.includes(cardId))floors.push(f);
  }
  if(floors.length===0)return'Gacha / Trade';
  const floorNames=['','Floor I','Floor II','Floor III','Floor IV','Floor V'];
  return floors.map(f=>floorNames[f]).join(' / ');
}

  else{txShadow('?',px_+pw/2-18,py_+artH/2+16,40,'#201e38','rgba(0,0,0,.3)');}

  // Type

  txShadow(tLabel,px_+pw/2-tLabel.length*3.5,py_+artH+50,7,owned?(cr.h||'#aaa'):'#40385a','rgba(0,0,0,.35)');

  // Separator
  bx(px_+20,py_+artH+58,pw-40,1,owned?cr.h+'80':'#20183040');

// FISHING MINIGAME (Corsair Bay docks)

function canFish(){
  if(currentMap!==0||fishingCooldownTimer>0||inBuilding)return false;
  const p=pl[0],m=getMap();
  // Check if player is on dock and facing water
  const tile=m[p.y]?.[p.x];
  if(tile!==10)return false;
  let fx=p.x,fy=p.y;
  if(p.dir===0)fy++;else if(p.dir===2)fy--;
  else if(p.dir===1)fx--;else if(p.dir===3)fx++;
  if(fx>=0&&fx<MW&&fy>=0&&fy<MH){
    const facingTile=m[fy]?.[fx];
    if(facingTile===0||facingTile===17)return true;
  }
  return false;
}

function startFishing(){
  fishingActive=true;
  fishingPhase='waiting';
  fishingTimer=60+Math.floor(Math.random()*120); // 1-3 seconds at 60fps
  sfxFishCast();
  twSet('Cast a line... wait for it...');
}

function updateFishing(){
  if(!fishingActive)return;
  if(fishingPhase==='waiting'){
    fishingTimer--;
    if(fishingTimer<=0){
      fishingPhase='bite';
      fishingBiteFrame=fr;
      sfxFishBite();
    }
  }else if(fishingPhase==='bite'){
    // Player has 30 frames (0.5s) to press Z
    if(fr-fishingBiteFrame>30){
      fishingPhase='miss';
      fishingTimer=60;
      sfxFishMiss();
      twSet('The catch got away!');
    }
  }else if(fishingPhase==='catch'){
    fishingTimer--;
    if(fishingTimer<=0){
      fishingActive=false;
      fishingCooldownTimer=FISHING_COOLDOWN;
    }
  }else if(fishingPhase==='miss'){
    fishingTimer--;
    if(fishingTimer<=0){
      fishingActive=false;
      fishingCooldownTimer=FISHING_COOLDOWN;
    }
  }
}

function fishingCatchCard(){
  fishingPhase='catch';
  fishingTimer=90;
  sfxFishCatch();
  // Random dock spirit card — prefer vault-new
  const pool=AREA_CARDS[currentMap]||AREA_CARDS[1];
  const vault_f=pl[0].vault||new Set();
  const newPool_f=pool.filter(id=>!vault_f.has(id));
  const usePool_f=newPool_f.length>0?newPool_f:pool;
  const cardId=usePool_f[Math.floor(Math.random()*usePool_f.length)];
  const cardIdx=cardId-1;
  const fAdded=addCardToPlayer(0,cardId); // updates vault + hand
  if(fAdded){
    startCardAcquisition(cardIdx);
    twSet('You caught a '+CD[cardIdx].n+' card!');
    lg.push('Fishing: Caught '+CD[cardIdx].n+'!');
    checkWinAndTransition(2000);
  }else{
    discardActive=true;discardSelIdx=0;discardPendingCard=cardId;discardSource='wild';
    twSet('Caught '+CD[cardIdx].n+'! Discard one to keep it.');
  }
}

function drawFishingOverlay(){
  if(!fishingActive)return;
  if(fishingPhase==='bite'){
    // Show "!" indicator
    const bobY=Math.sin(fr*0.3)*3;
    const px=pl[0].visualX-camX+8,py=pl[0].visualY-camY-30+bobY;
    bx(px-6,py-4,12,16,'#fff');
    bx(px-5,py-3,10,14,'#f0c830');
    txShadow('!',px-4,py+8,12,'#c04040','rgba(0,0,0,.4)');
    txShadow('Z NOW!',px-18,py+16,5,'#c04040','rgba(0,0,0,.4)');
  }else if(fishingPhase==='waiting'){
    // Show bobber animation
    const px=pl[0].visualX-camX,py=pl[0].visualY-camY;
    let bx_=px,by_=py;
    if(pl[0].dir===0){by_+=20;}else if(pl[0].dir===2){by_-=20;}
    else if(pl[0].dir===1){bx_-=20;}else{bx_+=20;}
    const bob=Math.sin(fr*0.1)*2;
    g.fillStyle='#c04040';g.beginPath();g.arc(bx_+8,by_+bob,3,0,Math.PI*2);g.fill();
    // Line from player to bobber
    g.strokeStyle='#a0a0a0';g.lineWidth=1;
    g.beginPath();g.moveTo(px+8,py);g.lineTo(bx_+8,by_+bob);g.stroke();
  }
}

// ═══════════════════════════════════════
function checkForestTrap(){
  if(currentMap!==1)return false;
  const key='1-'+pl[0].x+'-'+pl[0].y;
  if(forestTraps.has(key)&&!triggeredTraps.has(key)){
    triggeredTraps.add(key);
    sfxTrap();
    flash();
    twSet('You triggered a trap!');
    // Reset streak on trap
    if(streakCount>0){streakCount=0;streakLostTimer=60;sfxStreakLost();}
    // Lose a random card
    const filled=[];
    for(let i=0;i<HAND_SIZE;i++){if(pl[0].cd[i]>0)filled.push(i);}
    if(filled.length>0){
      const slot=filled[Math.floor(Math.random()*filled.length)];
      const lost=removeCardFromPlayer(0,slot); // resets cardTimers/decayWarn/stats.cardsLost
      if(lost>0){
      lg.push('Trap! Lost '+CD[lost-1].n+'!');
      objectInteractMsg='Lost '+CD[lost-1].n+' to a trap!';
      objectInteractTimer=120;
      }
    }else{
      lg.push('Trap triggered but you had no cards!');
      objectInteractMsg='Trap triggered! Lucky - no cards to lose.';
      objectInteractTimer=120;
    }
    return true;
  }
  return false;
}

// RUINS PUZZLE
// ═══════════════════════════════════════
function checkPuzzleInteraction(){
  if(currentMap!==2||puzzleSolved)return false;
  const p=pl[0];
  let fx=p.x,fy=p.y;
  if(p.dir===0)fy++;else if(p.dir===2)fy--;
  else if(p.dir===1)fx--;else if(p.dir===3)fx++;
  // Check if facing a puzzle pillar
  for(let i=0;i<3;i++){
    const pp=puzzlePillarPositions[i];
    if(fx===pp.x&&fy===pp.y){
      // Cycle stone at position i
      puzzleStoneOrder[i]=(puzzleStoneOrder[i]+1)%3;
      sfxSelect();
      const name=puzzleNames[puzzleStoneOrder[i]];
      puzzleMessage='Stone '+String(i+1)+' is now '+name;
      puzzleMessageTimer=90;
      // Check if solved: 0=red(fire), 1=blue(water), 2=yellow(light)
      if(puzzleStoneOrder[0]===0&&puzzleStoneOrder[1]===1&&puzzleStoneOrder[2]===2){
        puzzleSolved=true;
        sfxPuzzle();
        puzzleMessage='The passage opens!';
        puzzleMessageTimer=180;
        twSet('The passage opens! A void card appears!');
        lg.push('Ruins puzzle solved!');
        // Give a rare card from the current floor pool — prefer vault-new
        const pzPool=AREA_CARDS[currentMap]||AREA_CARDS[1];
        const vault_pz=pl[0].vault||new Set();
        const pzNewPool=pzPool.filter(id=>!vault_pz.has(id));
        const pzCard=(pzNewPool.length>0?pzNewPool:pzPool)[Math.floor(Math.random()*(pzNewPool.length>0?pzNewPool:pzPool).length)];
        const pzAdded=addCardToPlayer(0,pzCard); // updates vault + hand
        if(pzAdded){
          startCardAcquisition(pzCard-1);
          checkWinAndTransition(2000);
        }else{
          discardActive=true;discardSelIdx=0;discardPendingCard=pzCard;discardSource='wild';
        }
      }
      return true;
    }
  }
  return false;
}

function drawPuzzlePillars(){
  if(currentMap!==2)return;
  for(let i=0;i<3;i++){
    const pp=puzzlePillarPositions[i];
    const px=pp.x*TW-camX,py=pp.y*TH-camY;
    if(px<-TW||px>W||py<-TH||py>H)continue;
    if(!fogRevealed[2][pp.y]?.[pp.x])continue;
    // Draw colored pillar
    const col=puzzleColors[puzzleStoneOrder[i]];
    if(!puzzleSolved){
      bx(px+4,py+2,8,12,col);
      bx(px+5,py+3,6,10,lighten(col,.15));
      bx(px+3,py,10,3,col);
      // Label
      const label=puzzleNames[puzzleStoneOrder[i]][0];
      txShadow(label,px+5,py+13,5,'#fff','rgba(0,0,0,.4)');
      // Glow
      const pulse=Math.sin(fr*.06+i*2)*.2+.4;
      g.fillStyle=col.replace(')',`,${pulse})`).replace('rgb','rgba');
      if(col[0]==='#'){
        g.fillStyle=`rgba(${parseInt(col.slice(1,3),16)},${parseInt(col.slice(3,5),16)},${parseInt(col.slice(5,7),16)},${pulse})`;
      }
      g.beginPath();g.arc(px+8,py+8,8,0,Math.PI*2);g.fill();
    }
  }
}

function drawPuzzleMessage(){
  if(puzzleMessageTimer<=0)return;
  puzzleMessageTimer--;
  const alpha=puzzleMessageTimer>20?1:puzzleMessageTimer/20;
  g.globalAlpha=alpha;
  win(W/2-160,H/2-20,320,36);
  txShadow(puzzleMessage,W/2-140,H/2+4,7,'#d0c040','rgba(0,0,0,.4)');
  g.globalAlpha=1;
}

function enterBuilding(type,doorX,doorY){
  buildingType=type;
  buildingReturnX=pl[0].x;
  buildingReturnY=pl[0].y;
  buildingReturnMap=currentMap;
  buildingPlayerX=4;
  buildingPlayerY=6;
  buildingPlayerDir=2;
  sfxDoorOpen();
  // Door opening animation: dark rectangle expanding from door position
  const doorScreenX=doorX*TW-camX+TW/2;
  const doorScreenY=doorY*TH-camY+TH/2;
  startWipe('door_open',20,()=>{
    inBuilding=true;
    startWipe('door_close',15);
  },doorScreenX,doorScreenY);
}

function exitBuilding(){
  sfxDoorOpen();
  // Door close animation then restore map
  startWipe('door_open',15,()=>{
    inBuilding=false;
    pl[0].x=buildingReturnX;
    pl[0].y=buildingReturnY;
    currentMap=buildingReturnMap;
    startWipe('door_close',15,null,W/2,H/2);
  },W/2,H/2);
}

function getBuildingMap(){
  if(buildingType==='shop')return BUILDING_SHOP;
  if(buildingType==='info')return BUILDING_INFO;
  return BUILDING_SHOP;
}

function buildingTileWalkable(t){return t===0||t===4||t===5;}

function checkBuildingEntry(){
  const p=pl[0],m=getMap();
  let fx=p.x,fy=p.y;
  if(p.dir===0)fy++;else if(p.dir===2)fy--;
  else if(p.dir===1)fx--;else if(p.dir===3)fx++;
  if(fx>=0&&fx<MW&&fy>=0&&fy<MH){
    const t=m[fy]?.[fx];
    // Trading Post / Spy Masters Den — tile 5 or 15 at specific locations in town
    if(currentMap===0&&t===5){
      // Check which building: (8,5) is trading post, (22,5)=spy master area -> (22,6 door)
      if(fx===8&&fy===5){enterBuilding('shop',fx,fy);return true;}
      if(fx===20&&fy===11){enterBuilding('shop',fx,fy);return true;}
    }
    if(currentMap===0&&t===15){
      // Blue building = Spy Masters Den
      if(fx===22&&fy===5){enterBuilding('info',fx,fy);return true;}
    }
  }
  return false;
}

function drawBuildingInterior(){
  // Black background
  bx(0,0,W,H,'#1a1a2a');
  const bm=getBuildingMap();
  const tileSize=32; // Larger tiles for interior
  const offsetX=W/2-BUILDING_W*tileSize/2;
  const offsetY=H/2-BUILDING_H*tileSize/2-20;

  for(let y=0;y<BUILDING_H;y++){
    for(let x=0;x<BUILDING_W;x++){
      const t=bm[y][x];

function getFacingTile(){
  const p=pl[0],m=getMap();
  let fx=p.x,fy=p.y;
  if(p.dir===0)fy++;else if(p.dir===2)fy--;
  else if(p.dir===1)fx--;else if(p.dir===3)fx++;
  if(fx>=0&&fx<MW&&fy>=0&&fy<MH)return{x:fx,y:fy,tile:m[fy]?.[fx]};
  return null;
}

function checkObjectInteraction(){
  const ft=getFacingTile();
  if(!ft)return false;
  const key=currentMap+'-'+ft.x+'-'+ft.y;

  // Tree interaction (type 3)
  if(ft.tile===3){
    if(shakenTrees.has(key)){
      objectInteractMsg='Already shaken this tree.';
      objectInteractTimer=60;
      return true;
    }
    shakenTrees.add(key);
    if(Math.random()<0.1){
      // 10% chance: card falls out — prefer vault-new
      const treePool=AREA_CARDS[currentMap]||AREA_CARDS[1];
      const vault_t=pl[0].vault||new Set();
      const treeNewPool=treePool.filter(id=>!vault_t.has(id));
      const treeCardId=(treeNewPool.length>0?treeNewPool:treePool)[Math.floor(Math.random()*(treeNewPool.length>0?treeNewPool:treePool).length)];
      const cardIdx=treeCardId-1;
      const treeAdded=addCardToPlayer(0,treeCardId); // updates vault + hand
      if(treeAdded){
        startCardAcquisition(cardIdx);
        objectInteractMsg='A card fell from the tree!';
        lg.push('Shook tree: Found '+CD[cardIdx].n+'!');
        checkWinAndTransition(2000);
      }else{
        discardActive=true;discardSelIdx=0;discardPendingCard=treeCardId;discardSource='wild';
        objectInteractMsg='Found '+CD[cardIdx].n+'! Discard to keep.';
      }
    }else{
      objectInteractMsg='Nothing fell from the tree.';
    }
    objectInteractTimer=90;
    sfxSelect();
    return true;
  }

  // Rock interaction (type 8)
  if(ft.tile===8){
    if(pushedRocks.has(key)){
      objectInteractMsg='Already checked this rock.';
      objectInteractTimer=60;
      return true;
    }
    pushedRocks.add(key);
    sfxSelect();
    if(Math.random()<0.2){
      const areaCards=AREA_CARDS[currentMap]||AREA_CARDS[1];
      const vault_r=pl[0].vault||new Set();
      const rockNewPool=areaCards.filter(id=>!vault_r.has(id));
      const cardId=(rockNewPool.length>0?rockNewPool:areaCards)[Math.floor(Math.random()*(rockNewPool.length>0?rockNewPool:areaCards).length)];
      const rockAdded=addCardToPlayer(0,cardId); // updates vault + hand
      if(rockAdded){
        startCardAcquisition(cardId-1);
        objectInteractMsg='Found a hidden card under the rock!';
        lg.push('Rock: Found '+CD[cardId-1].n+'!');
        checkWinAndTransition(2000);
      }else{
        discardActive=true;discardSelIdx=0;discardPendingCard=cardId;discardSource='wild';
        objectInteractMsg='Found '+CD[cardId-1].n+'! Discard to keep.';
      }
    }else{
      objectInteractMsg='Nothing under the rock.';
    }
    objectInteractTimer=90;
    return true;
  }

  // Campfire interaction (type 29, Forest only)
  if(ft.tile===29&&currentMap===1){
    if(campfireUsed){
      objectInteractMsg='Already rested here.';
      objectInteractTimer=60;
      return true;
    }
    campfireUsed=true;
    sfxConfirm();
    // Restore 1 spell charge: rotate Steal->Barrier->Scout
    if(sp.s<3){sp.s++;objectInteractMsg='Rested by campfire. +1 Steal charge!';lg.push('Campfire: +1 Steal!');}
    else if(sp.b<3){sp.b++;objectInteractMsg='Rested by campfire. +1 Barrier charge!';lg.push('Campfire: +1 Barrier!');}
    else if(sp.c<3){sp.c++;objectInteractMsg='Rested by campfire. +1 Scout charge!';lg.push('Campfire: +1 Scout!');}
    else{
      // All spells full — extend nearest-to-expiry card timer by 60s
      let nearestSlot=-1,nearestAge=0;
      for(let i=0;i<HAND_SIZE;i++){if(cardTimers[i]>0){const age=Date.now()-cardTimers[i];if(age>nearestAge){nearestAge=age;nearestSlot=i;}}}
      if(nearestSlot>=0){cardTimers[nearestSlot]+=60000;objectInteractMsg='Rested. '+CD[pl[0].cd[nearestSlot]-1].n+' decay slowed!';lg.push('Campfire: Extended '+CD[pl[0].cd[nearestSlot]-1].n+' timer!');}
      else{objectInteractMsg='Rested, but nothing to restore.';}
    }
    objectInteractTimer=120;
    return true;
  }

  // Fountain interaction (type 20, Corsair Bay)
  if(ft.tile===20&&currentMap===0){
    const filled=[];
    for(let i=0;i<HAND_SIZE;i++){if(pl[0].cd[i]>0)filled.push(i);}
    if(filled.length===0){
      objectInteractMsg='Toss a card? You have none!';
      objectInteractTimer=90;
      return true;
    }
    fountainActive=true;
    fountainConfirm=true;
    sfxSelect();
    return true;
  }

  // Crystal interaction (type 26, any dungeon floor)
  if(ft.tile===26&&inDungeon){
    if(usedCrystals.has(key)){
      objectInteractMsg='This crystal is spent.';
      objectInteractTimer=60;
      return true;
    }
    usedCrystals.add(key);
    sfxSelect();
    if(Math.random()<0.5){
      // Reveal rivals on minimap for 60 seconds (3600 frames)
      crystalRevealTimer=3600;
      objectInteractMsg='The crystal glows! Rivals revealed!';
      lg.push('Crystal: Rivals revealed for 60s!');
    }else{
      objectInteractMsg='The crystal shattered! Nothing happened.';
      lg.push('Crystal shattered.');
    }
    objectInteractTimer=120;
    flash();
    return true;
  }

  // Altar interaction (type 27, deep dungeon floors 3-5)
  if(ft.tile===27&&inDungeon){
    if(usedCrystals.has(key+'_altar')){
      objectInteractMsg='The altar is silent.';
      objectInteractTimer=60;
      return true;
    }
    usedCrystals.add(key+'_altar');
    sfxSelect();flash();
    const roll=Math.random();
    if(roll<0.4){
      // Restore a spell charge (prayer answered)
      if(sp.s<3){sp.s++;objectInteractMsg='The altar hums. +1 Steal charge!';lg.push('Altar: +1 Steal!');}
      else if(sp.b<3){sp.b++;objectInteractMsg='The altar hums. +1 Barrier charge!';lg.push('Altar: +1 Barrier!');}
      else{sp.c=Math.min(3,sp.c+1);objectInteractMsg='The altar hums. +1 Scout charge!';lg.push('Altar: +1 Scout!');}
    }else if(roll<0.7){
      // Extend decay on the most-decayed card
      let nearestSlot=-1,nearestAge=0;
      for(let i=0;i<HAND_SIZE;i++){if(cardTimers[i]>0){const age=Date.now()-cardTimers[i];if(age>nearestAge){nearestAge=age;nearestSlot=i;}}}
      if(nearestSlot>=0&&pl[0].cd[nearestSlot]>0){
        cardTimers[nearestSlot]+=90000; // +1.5 min extra
        objectInteractMsg='The altar preserved '+CD[pl[0].cd[nearestSlot]-1].n+'! +1.5min';
        lg.push('Altar: Extended '+CD[pl[0].cd[nearestSlot]-1].n+' by 1.5min!');
      }else{
        objectInteractMsg='The altar glows... but no cards to protect.';
      }
    }else{
      // Nothing / minor flash
      objectInteractMsg='The altar is cold. Nothing happens.';
      lg.push('Altar: No effect.');
    }
    objectInteractTimer=120;
    return true;
  }

  return false;
}

function doFountainExchange(){
  const filled=[];
  for(let i=0;i<HAND_SIZE;i++){if(pl[0].cd[i]>0)filled.push(i);}
  if(filled.length===0)return;
  // Remove random card, give vault-new card if possible
  const slot=filled[Math.floor(Math.random()*filled.length)];
  const oldCard=pl[0].cd[slot];
  const vault_fn=pl[0].vault||new Set();
  const ownedInHand_fn=new Set(pl[0].cd.filter(c=>c>0));
  const fnNew=[],fnOwned=[];
  for(let i=1;i<=60;i++){
    if(i===oldCard)continue;
    if(!vault_fn.has(i))fnNew.push(i);
    else if(!ownedInHand_fn.has(i))fnOwned.push(i);
  }
  let newCard;
  if(fnNew.length>0)newCard=fnNew[Math.floor(Math.random()*fnNew.length)];
  else if(fnOwned.length>0)newCard=fnOwned[Math.floor(Math.random()*fnOwned.length)];
  else{do{newCard=Math.floor(Math.random()*60)+1;}while(newCard===oldCard);}
  pl[0].cd[slot]=0;cardTimers[slot]=0;syncCardCount(0); // clear old slot
  addCardToPlayer(0,newCard); // updates vault + hand
  startCardAcquisition(newCard-1);
  fountainResult='The fountain glows! Received '+CD[newCard-1].n+'!';
  fountainResultTimer=120;
  lg.push('Fountain: Traded '+CD[oldCard-1].n+' for '+CD[newCard-1].n+'!');
  sfxShopTrade();
  checkWinAndTransition(2000);
}

// v85: Floor-clear fanfare — dramatic cinematic overlay on floor descent

  const rar=d.rarity;
  const rarCols=['','#50d060','#5090f0','#b060e0','#e0a020','#fff8e0'];
  const rcol=rarCols[rar]||'#c0c0c0';
  const floorNums=['','I','II','III','IV','V'];

  g.globalAlpha=alpha*0.78;

  // Panel
  const pw=440,ph=220,px_=W/2-pw/2,py_=H/2-ph/2-20;
  g.globalAlpha=alpha;
  win(px_,py_,pw,ph);

  bx(px_,py_,pw,3,rcol);
  bx(px_,py_+ph-1,pw,1,'rgba(200,180,100,.3)');

  bx(px_+16,py_+34,pw-32,1,'rgba(200,180,100,.2)');
  // Card display (left side of panel)
  const cX=px_+60,cY=py_+80;
  const cw_=56,ch_=80;
  // Rarity glow behind card
  const glA=0.5+Math.sin(t*0.12)*0.2;
  g.globalAlpha=alpha*glA;
  const grd=g.createRadialGradient(cX+cw_/2,cY+ch_/2,0,cX+cw_/2,cY+ch_/2,50);
  grd.addColorStop(0,rcol.replace('#','rgba(').replace(/([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/,
    (_,r,g_,b)=>`${parseInt(r,16)},${parseInt(g_,16)},${parseInt(b,16)}`)+',0.5)').replace('rgba(','rgba(').replace('#','')||'rgba(200,160,80,0.5)';

  g.globalAlpha=alpha*glA*0.55;
  bx(cX-12,cY-12,cw_+24,ch_+24,rcol+'40'||'rgba(200,160,80,.3)');
  g.globalAlpha=alpha;
  // Card frame
  const cr2=CD[d.cardId-1];
  bx(cX,cY,cw_,ch_,cr2.d);bx(cX+2,cY+2,cw_-4,ch_-4,cr2.c);
  drawCardCharacter(cX+4,cY+4,d.cardId,1.8,fr+t);
  // Rarity orbit sparks
  const sparkCount=2+rar*2;
  for(let i=0;i<sparkCount;i++){
    const ang=t*0.12+i*(Math.PI*2/sparkCount);
    const dist=38+Math.sin(t*0.1)*4;
    g.globalAlpha=alpha*0.75;
    bx(cX+cw_/2+Math.cos(ang)*dist-2,cY+ch_/2+Math.sin(ang)*dist-2,4,4,rcol);
  }
  g.globalAlpha=alpha;
  // Card info (right side)
  const infoX=cX+cw_+24;
  txShadow(d.isNew?'NEW CARD!':'GOT:',infoX,py_+68,9,'#a09878','rgba(0,0,0,.3)');
  txShadow(cr2.n,infoX,py_+90,12,d.isNew?rcol:'#e8e0c8','rgba(0,0,0,.4)');
  const rarLabel=['','Common','Uncommon','Rare','Epic','Legendary'];
  txShadow(rarLabel[rar]||'',infoX,py_+110,9,rcol,'rgba(0,0,0,.3)');
  txShadow(cr2.f||'',infoX,py_+128,7,'#888878','rgba(0,0,0,.2)');
  // "Continue deeper" footer
  if(t>50){
    const ftA=Math.min(1,(t-50)/20);
    g.globalAlpha=alpha*ftA*(0.5+Math.abs(Math.sin(t*0.06))*0.5);
    txShadow('Descending deeper...',px_+pw/2-90,py_+ph-22,8,'#686880','rgba(0,0,0,.3)');
  }
  g.globalAlpha=1;
}

// v76: Exit proximity tooltip — show destination info when near an exit
function drawExitProximityTooltip(){
  if(!inDungeon||sc!=='map'||mapTransitioning)return;
  const p=pl[0];
  // Find nearest exit tile within 2 tiles
  let nearExit=null,nearDist=99;
  for(const ex of exits){
    if(ex.fromMap!==currentMap)continue;
    for(const [etx,ety] of ex.tiles){
      const d=Math.abs(p.x-etx)+Math.abs(p.y-ety);
      if(d<=2&&d<nearDist){nearDist=d;nearExit=ex;}
    }
  }
  if(!nearExit)return;

  const isEsc=nearExit.isEscape;
  const targetFloor=nearExit.targetMap;
  const flNums=['','I','II','III','IV','V'];
  const rarLabels=['','Common','Uncommon','Rare','Epic','Legendary'];
  const rarCols=['','#888898','#60b060','#6090d8','#c060c0','#f0c830'];
  // Determine rarity tier for target floor
  const floorRar=[0,1,2,3,4,5]; // floor → rarity
  const mainRar=isEsc?0:Math.min(5,floorRar[targetFloor]||1);

  const ttW=200,ttH=isEsc?44:62;
  const ttX=W/2-ttW/2,ttY=H-HUD_HEIGHT-ttH-56;

  // Background
  const bgCol=isEsc?'rgba(20,50,20,.92)':'rgba(20,20,50,.92)';
  bx(ttX,ttY,ttW,ttH,bgCol);
  bx(ttX,ttY,ttW,1,isEsc?'#40c060':'#6080c0');
  bx(ttX,ttY+ttH-1,ttW,1,isEsc?'#40c060':'#6080c0');

  const arrow=isEsc?'\u2196 ESCAPE':'\u2198 DESCEND';
  const dest=isEsc?'\u2190 TOWN':'FLOOR '+(flNums[targetFloor]||targetFloor);
  txShadow(arrow,ttX+10,ttY+14,6,isEsc?'#50e080':'#a0b0d8','rgba(0,0,0,.4)');
  txShadow(dest,ttX+ttW/2-dest.length*4.5,ttY+30,9,isEsc?'#40e070':'#c8d8f0','rgba(0,0,0,.5)');

  if(!isEsc&&mainRar>0){
    const rarTxt=rarLabels[mainRar]+' cards';
    txShadow(rarTxt,ttX+ttW/2-rarTxt.length*3,ttY+46,6,rarCols[mainRar]||'#888','rgba(0,0,0,.3)');
  }
}

function getMapUsableCards(){
  // Returns [{slot, cardId, name}] for cards that can be used on map
  // Card 2=UMBRA: stealth, Card 3=IGNIS: burn, Card 28=PHASE: walk through walls,
  // Card 29=BLINK: teleport, Card 30=SHADOW: longer stealth
  const MAP_CARD_IDS=new Set([2,3,28,29,30,35,36]);
  const result=[];
  for(let i=0;i<HAND_SIZE;i++){
    const cd=pl[0].cd[i];
    if(!MAP_CARD_IDS.has(cd))continue;
    const cr=CD[cd-1];
    let desc='';
    if(cd===2)desc='Invisible 30 steps';
    else if(cd===3)desc='Burn tree/bush ahead';
    else if(cd===28)desc='Phase through wall in direction';
    else if(cd===29)desc='Teleport 5 tiles in direction';
    else if(cd===30)desc='Invisible 60 steps';
    else if(cd===35)desc='Escape to Town instantly!';
    else if(cd===36)desc='Escape & restart from Town';
    result.push({slot:i,cardId:cd,name:cr.n,desc});
  }
  return result;
}

function openMapCardUse(){
  const usable=getMapUsableCards();
  if(usable.length===0){
    twSet('No usable cards! UMBRA/IGNIS/PHASE/BLINK/SHADOW/ARK GATE/GENESIS can be used on the map.');
    return;
  }
  mapCardUseActive=true;
  mapCardUseIdx=0;
  sfxSelect();
}

    shadowStepsLeft=60;
    mapCardUseActive=false;
    sfxShadow();
    twSet('SHADOW: You became invisible for 60 steps!');

    // PHASE: walk through wall in direction

    mapCardDirIdx=pl[0].dir;

      saveGame();
      startWipe('vslide_out',16);
    });
  }else if(cardId===36){
    // GENESIS: escape dungeon to town (dungeon-only)
    mapCardUseActive=false;
    if(!inDungeon){twSet('GENESIS only works in the dungeon!');return;}
    pl[0].cd[slot]=0;cardTimers[slot]=0;syncCardCount(0);
    sfxMapChange();sfxAreaEntry();

    startWipe('vslide',16,()=>{
      currentMap=0;inDungeon=false;currentFloor=0;
      pl[0].x=35;pl[0].y=13;pl[0].dir=1;
      pl[0].visualX=35*TW;pl[0].visualY=13*TH;
      for(let i=0;i<HAND_SIZE;i++){cardTimers[i]=0;decayWarn[i]=0;}
      escapeUrgencyActive=false;escapeUrgencyPulse=0;
      sp.s=2;sp.b=3;sp.c=2;
      fogRevealAll(0);fogSave();
      encounterCooldown=600;
      camX=pl[0].visualX-W/2;camY=pl[0].visualY-H/2;
      camTargetX=camX;camTargetY=camY;
      tileCacheDirty=true;edgeCacheDirty=true;fogCacheDirty=true;
      showBanner('はじまりの街','GENESIS: Reborn in town!');
      twSet('GENESIS activated! Escaped — cards intact, back to safety!');
      saveGame();
      startWipe('vslide_out',16);
    });
  }
}

function executeDirCard(dir){
  const p=pl[0],m=getMap();
  let dx=0,dy=0;
  if(dir===0){dy=1;}else if(dir===2){dy=-1;}
  else if(dir===1){dx=-1;}else if(dir===3){dx=1;}
  const tx_=p.x+dx,ty_=p.y+dy;

  if(mapCardPendingType===3){
    // Flame: burn tree or bush
    if(tx_>=0&&tx_<MW&&ty_>=0&&ty_<MH){
      const tile=m[ty_]?.[tx_];
      if(tile===3||tile===12||tile===13){
        // Find the slot with Flame
        let slot=-1;
        for(let i=0;i<HAND_SIZE;i++){if(pl[0].cd[i]===3){slot=i;break;}}
        if(slot>=0){
          pl[0].cd[slot]=0;cardTimers[slot]=0;
          syncCardCount(0);
          // Replace tile with grass
          maps[currentMap][ty_][tx_]=1;
          burnedTiles.push({mapIdx:currentMap,x:tx_,y:ty_});
          tileCacheDirty=true;edgeCacheDirty=true;
          sfxBurn();
          flash();
          twSet('The obstacle burns away!');
          lg.push('Used Ignis: burned tile at ('+tx_+','+ty_+')');
        }
      }else{
        twSet('Nothing to burn there.');
      }
    }
  }else if(mapCardPendingType===28){
    // PHASE: walk through 1 wall tile (2 tiles in direction)
    const fx=p.x+dx*2,fy=p.y+dy*2;
    if(fx>=0&&fx<MW&&fy>=0&&fy<MH&&WALKABLE.has(m[fy]?.[fx])){
      let slot=-1;
      for(let i=0;i<HAND_SIZE;i++){if(pl[0].cd[i]===28){slot=i;break;}}
      if(slot>=0){
        pl[0].cd[slot]=0;cardTimers[slot]=0;
        syncCardCount(0);
        p.x=fx;p.y=fy;p.visualX=fx*TW;p.visualY=fy*TH;
        fogRevealRadius(currentMap,fx,fy,3);fogSave();
        tileCacheDirty=true;edgeCacheDirty=true;
        sfxPhase();
        flash();
        twSet('PHASE: You walked through the wall!');
        lg.push('Used PHASE: phased to ('+fx+','+fy+')');
      }
    }else{
      twSet('Cannot phase there — no walkable tile beyond.');
    }
  }else if(mapCardPendingType===29){
    // BLINK: teleport up to 5 tiles in direction
    const origX=p.x,origY=p.y;
    let bestX=p.x,bestY=p.y;
    for(let step=1;step<=5;step++){
      const nx=p.x+dx*step,ny=p.y+dy*step;
      if(nx<0||nx>=MW||ny<0||ny>=MH)break;
      if(WALKABLE.has(m[ny]?.[nx])){bestX=nx;bestY=ny;}
      else break;
    }
    if(bestX!==origX||bestY!==origY){
      let slot=-1;
      for(let i=0;i<HAND_SIZE;i++){if(pl[0].cd[i]===29){slot=i;break;}}
      if(slot>=0){
        pl[0].cd[slot]=0;cardTimers[slot]=0;
        syncCardCount(0);
        const dist=Math.abs(bestX-origX)+Math.abs(bestY-origY);
        p.x=bestX;p.y=bestY;p.visualX=bestX*TW;p.visualY=bestY*TH;
        fogRevealRadius(currentMap,bestX,bestY,3);fogSave();
        tileCacheDirty=true;edgeCacheDirty=true;
        sfxPhase();
        flash();
        twSet('BLINK: Teleported '+dist+' tiles!');
        lg.push('Used BLINK: teleported to ('+bestX+','+bestY+')');
      }
    }else{
      twSet('BLINK: No open tile to teleport to!');
    }
  }
  mapCardDirSelect=false;
  mapCardUseActive=false;
}

// Held-key continuous movement (overworld only — dungeon stays turn-based per press)
// Time-based so movement rate is consistent regardless of fps
const _MOVE_REPEAT_MS     = 115; // ms between steps while holding (~8.7Hz)
let _moveRepeatAccumMs    = _MOVE_REPEAT_MS; // start ready so first step fires immediately

function processHeldMovement(){
  // Only in map mode, no overlays, no dungeon (dungeon stays turn-based)
  if(sc!=='map'||inDungeon||mo||npcDialogActive||shopActive||gachaActive||marketActive||
     battlePhase||introActive||handInspectActive||fishingActive||
     mapCardUseActive||fountainActive||dungeonConfirmActive||cardAcqActive||mapTransitioning)return;
  _moveRepeatAccumMs+=dt*16.67;
  if(_moveRepeatAccumMs < _MOVE_REPEAT_MS) return;
  _moveRepeatAccumMs=0;
  let mdx=0,mdy=0;
  if(keysHeld.has('ArrowUp'))     mdy=-1;
  else if(keysHeld.has('ArrowDown')) mdy=1;
  if(keysHeld.has('ArrowLeft'))   mdx=-1;
  else if(keysHeld.has('ArrowRight'))mdx=1;
  if(mdx===0&&mdy===0)return;
  if(tryMovePlayer(mdx,mdy)){
    checkTreasure();
    if(!cardAcqActive&&!randomEventActive&&shadowStepsLeft<=0)tryWildEncounter();
  }
}

function updateVisualPositions(){
  const lerpT=1-Math.pow(1-0.45,dt); // Fast lerp for snappy tile-step feel
  pl.forEach(p=>{
    const targetX=p.x*TW, targetY=p.y*TH;
    p.visualX=lerp(p.visualX,targetX,lerpT);
    p.visualY=lerp(p.visualY,targetY,lerpT);
    // Snap to target when very close (prevents sub-pixel jitter)
    const dx=Math.abs(p.visualX-targetX),dy=Math.abs(p.visualY-targetY);
    if(dx<0.3&&dy<0.3){p.visualX=targetX;p.visualY=targetY;}
    // Round to integer for crisp pixel rendering
    p.visualX=Math.round(p.visualX);
    p.visualY=Math.round(p.visualY);
    // Update walk frame based on movement
    if(dx>0.5||dy>0.5){
      p._walkAccum=(p._walkAccum||0)+dt;
      if(p._walkAccum>=4){p._walkAccum=0;p.walkFrame=(p.walkFrame+1)%4;}
    }else{
      p.walkFrame=0;p._walkAccum=0;
    }
  });
}

function update(){
  // Hitpause: freeze game simulation for N frames (visual impact on steal/card-get)
  if(hitPauseFrames>0){hitPauseFrames--;return;}
  fr++;
  if(fr%20===0)wt++;
  twTick();
  fadeUpdate();updateWipe();updateParticles();updateBanner();
  // Track area time for stats (every 60 frames = 1 second)
  if(sc==='map'&&fr%60===0&&currentMap>=0&&currentMap<FOG_MAP_COUNT){stats.areaTime[currentMap]++;}
  // Story sequence update
  // Story update removed (replaced by intro tutorial)
  // Credits scroll update
  if(creditsActive){creditsFrame++;}
  // Save stats periodically
  if(fr%600===0)saveStats();
  // Tension drum for nearby rivals
  if(sc==='map'&&proximityDangerLevel>=3&&!tensionDrumNode){startTensionDrum();if(tensionDrumGain)try{tensionDrumGain.gain.linearRampToValueAtTime(proximityDangerLevel===4?0.05:0.025,AC.currentTime+0.2);}catch(e){}}
  else if((sc!=='map'||proximityDangerLevel<3)&&tensionDrumNode){stopTensionDrum();}
  // Safety caps: prevent unbounded array growth
  if(particles.length>500)particles.splice(0,particles.length-500);
  if(lg.length>200)lg.splice(0,lg.length-200);
  if(burnedTiles.length>500)burnedTiles.splice(0,burnedTiles.length-500);
  processHeldMovement();
  // Invalidate tile cache when wt changes (every 20 frames) — lava/campfire use wt for animation
  if(wt!==_tileCacheLastWt){tileCacheDirty=true;_tileCacheLastWt=wt;}
  // Refresh atmosphere cache on lantern flicker cadence
  if(!inDungeon&&fr%90===0)_atmosDirty=true;
  updateVisualPositions();updateAmbient();
  updateMapLoadScreen();updateRunSummary();updateRivalNews();updateHandInspect();updateFPS();
  // Save indicator countdown
  if(saveIndicatorTimer>0)saveIndicatorTimer--;
  // Auto-save every 30 seconds when on map
  if(sc==='map'&&!mo){
    autoSaveTimer++;
    if(autoSaveTimer>=AUTO_SAVE_INTERVAL){autoSaveTimer=0;saveGame();}
  }
  if(flashT>0)flashT-=dt;
  if(bpShakeTimer>0)bpShakeTimer-=dt;
  for(let hi=0;hi<3;hi++){if(bpHPDmgAnim[hi]>0)bpHPDmgAnim[hi]-=dt;}
  if(rivalAlert>0)rivalAlert-=dt;
  if(fishingCooldownTimer>0)fishingCooldownTimer--;
  if(crystalRevealTimer>0)crystalRevealTimer--;
  updateFishing();

  // Bird movement
  if(fr%10===0){
    birds.forEach(b=>{
      b.timer--;
      if(b.timer<=0){
        b.vx=(Math.random()-.5)*2;b.vy=(Math.random()-.5)*2;
        b.timer=20+Math.floor(Math.random()*40);
      }
      const nx=b.x+Math.round(b.vx),ny=b.y+Math.round(b.vy);
      const m=maps[1];
      if(nx>=1&&nx<MW-1&&ny>=1&&ny<MH-1){
        const t=m[ny]?.[nx];
        if(t===1||t===2||t===7||t===11)b.x=nx;
      }
      if(ny>=1&&ny<MH-1){
        const t=m[ny]?.[b.x];
        if(t===1||t===2||t===7||t===11)b.y=ny;
      }
    });
  }

  // x402 server check every 30s; state push every 2min to keep broker in sync
  x402CheckTimer++;
  if(x402CheckTimer>=1800){x402CheckTimer=0;x402CheckServer();}
  if(x402Available&&fr%7200===0){x402PushState();} // push every ~2 min at 60fps

  // Multiplayer ping every 5 seconds
  if(mp.connected&&fr%300===0)mpPing();
  // Multiplayer disconnect timer
  if(mp.disconnectTimer>0)mp.disconnectTimer--;

  // Autonomous rival AI movement (only on map/act screens, skip during intro/title/splash/multiplayer)
  if(sc!=='title'&&sc!=='splash'&&!introActive&&(!mp.connected||mp.phase!=='playing')){
    updateRivalAI(0);
    updateRivalAI(1);
  }
  updateFootprints();
  updateRivalActivity();
  updateProximityTension();
  updateNPCWander();
  updateTownWeather(); // v84
  updateFloorTitle(); // v155: PMD floor title card

  // ── RIVAL WIN WARNING (GDD v1.0: rivals use 5-card system internally) ──
  const r1u=hasUniqueCards(1).size,r2u=hasUniqueCards(2).size;
  const maxRU=Math.max(r1u,r2u);
  rivalWinWarning=maxRU>=4?1:0;
  if(maxRU>=4&&!rivalWinWarningShown){
    rivalWinWarningShown=true;
    const whoClose=r1u>=4?pl[1].n:pl[2].n;
    lg.push('WARNING: '+whoClose+' has '+maxRU+'/5 cards — DANGER! They\'re gaining power!');
    sfxDangerAlert();
  }
  if(maxRU<4)rivalWinWarningShown=false;

  // ── v105: COLLECTION MILESTONE CHECK ──
  if(pl[0].vault&&pl[0].vault.size>0){
    const vs=pl[0].vault.size;
    for(const m of CARD_MILESTONES){
      if(vs>=m&&!milestonesReached.has(m)){
        milestonesReached.add(m);
        milestoneToastText=CARD_MILESTONE_MSG[m]||'';
        milestoneToastFrame=fr;
        if(vs<60){sfxStreakUp();}
      }
    }
  }

  // ── SEASON EXPIRY CHECK ──
  if(sc==='map'&&seasonEndTime>0&&Date.now()>=seasonEndTime&&!gameOverTimesUp){
    gameOverTimesUp=true;stats.gamesPlayed++;saveStats();
    fadeOut(()=>{sc='victory';victoryFrame=fr;fadeIn();ub();});
  }

  // ── CARD DECAY TIMER (GDD v1.0: only active in dungeon, town is safe) ──
  if((sc==='map'||sc==='act')&&inDungeon){
    const now=Date.now();
    let anyCardCritical=false;
    for(let i=0;i<HAND_SIZE;i++){
      if(pl[0].cd[i]>0&&cardTimers[i]>0){
        const elapsed=now-cardTimers[i];
        const remaining=CARD_DECAY_MS-elapsed;
        if(elapsed>=CARD_DECAY_MS){
          // Card expired in dungeon!
          const expiredName=CD[pl[0].cd[i]-1].n;
          cardShatterTimers[i]=fr; // v113: trigger HUD shatter animation before clearing
          pl[0].cd[i]=0;cardTimers[i]=0;decayWarn[i]=0;syncCardCount(0);
          sfxCardExpired();screenShake(3,6);
          triggerCardLostAnim(pl[0].visualX-camX,pl[0].visualY-camY-16);
          lg.push('[DUNGEON] '+expiredName+' decayed — escape to Town to preserve cards!');
          tutorialMsg=expiredName+' DECAYED! Escape to Town!';tutorialMsgTimer=200;
          if(streakCount>0){streakCount=0;streakLostTimer=60;}
        }else{
          const cardName=CD[pl[0].cd[i]-1].n;
          // 50% decay warning (one-time per card)
          if(elapsed>=CARD_DECAY_MS*0.5&&decayWarn[i]<1){
            decayWarn[i]=1;
            if(!tutorialMsg||tutorialMsgTimer<60){
              tutorialMsg=cardName+': halfway. Head back to Town!';tutorialMsgTimer=180;
            }
          }
          // 30-second warning
          if(remaining<30000&&decayWarn[i]<2){
            decayWarn[i]=2;sfxCardDecayWarn();screenShake(1,3);
            objectInteractMsg=cardName+' FADING! 30s!';objectInteractTimer=90;
          }
          // 10-second critical warning
          if(remaining<10000&&decayWarn[i]<3){
            decayWarn[i]=3;sfxDangerAlert();screenShake(2,4);
            objectInteractMsg=cardName+' CRITICAL! RUN!';objectInteractTimer=90;
          }
          // Flashing at <15s
          if(remaining<15000){
            anyCardCritical=true;
            if(fr%30===0)cardDecayWarningFlash=10;
            if(fr%60===0)sfxCardDecayWarn();
          }
          // Escape urgency (any card <30s)
          if(remaining<30000)anyCardCritical=true;
        }
      }
    }
    escapeUrgencyActive=anyCardCritical;
    if(escapeUrgencyActive)escapeUrgencyPulse++;
    else escapeUrgencyPulse=0;
    if(cardDecayWarningFlash>0)cardDecayWarningFlash--;
  }else{
    escapeUrgencyActive=false;escapeUrgencyPulse=0;
  }

  // ── STREAK DISPLAY TIMERS ──
  if(streakDisplayTimer>0)streakDisplayTimer--;
  if(streakLostTimer>0)streakLostTimer--;

  // ── AREA DANGER LEVEL ──
  if(sc==='map'&&!mo&&!inBuilding){
    // Increase danger for current map
    areaDangerStayTimer[currentMap]++;
    // Danger increases from staying (faster to push movement between areas)
    if(areaDangerStayTimer[currentMap]%120===0){
      areaDanger[currentMap]=Math.min(1,areaDanger[currentMap]+0.03);
    }
    // Danger increases when rivals are on same map
    for(let ri=0;ri<2;ri++){
      if(rivalMaps[ri]===currentMap&&fr%60===0){
        areaDanger[currentMap]=Math.min(1,areaDanger[currentMap]+0.03);
      }
    }
    // Danger decreases for maps player is NOT on
    for(let mi=0;mi<3;mi++){
      if(mi!==currentMap&&fr%90===0){
        areaDanger[mi]=Math.max(0,areaDanger[mi]-0.02);
        areaDangerStayTimer[mi]=Math.max(0,areaDangerStayTimer[mi]-30);
      }
    }
    // Danger decreases when rivals leave
    for(let mi=0;mi<3;mi++){
      let rivalsHere=0;
      for(let ri=0;ri<2;ri++){if(rivalMaps[ri]===mi)rivalsHere++;}
      if(rivalsHere===0&&fr%120===0){
        areaDanger[mi]=Math.max(0,areaDanger[mi]-0.01);
      }
    }
  }

  // ── QTE UPDATE ──
  if(qteActive){
    qteFrame++;
    if(qteFrame>=qteWindow&&!qteKeyPressed){
      // Missed QTE
      qteActive=false;qteSuccess=false;
      sfxQteMiss();
      qteResultText='MISSED!';qteResultTimer=40;
    }
  }
  if(qteResultTimer>0)qteResultTimer--;

  // Atmosphere log messages based on proximity (throttled)
  if(fr%300===0){
    for(let i=0;i<2;i++){
      if(rivalMaps[i]!==currentMap)continue;
      const r=pl[i+1];
      const dist=Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y);
      if(dist<=8&&dist>5){lg.push('The air feels tense...');}
      else if(dist>8&&dist<=15){lg.push('You sense movement nearby...');}
    }
  }

  // Footprint log messages when player walks on rival footprints
  if(sc==='map'&&!mo){
    const pFp=footprints.find(f=>f.map===currentMap&&f.x===pl[0].x&&f.y===pl[0].y&&f.age<1800);
    if(pFp&&fr%60===0){
      lg.push('Footprints in the grass... someone passed here.');
      pFp.age=1800; // Don't log again
    }
  }

  // Encounter check (player walks to rival OR rival walks to player)
  // GDD v1.0: Town (map 0) is a safe zone — no PvP encounters allowed
  if(sc==='map'&&inDungeon&&!introActive&&!mo&&!npcDialogActive&&!wildEncounterActive&&!mapTransitioning&&!encounterExclActive&&!shopActive&&!signpostActive&&!inBuilding&&shadowStepsLeft<=0){
    pl.slice(1).forEach((r,idx)=>{
      if(rivalMaps[idx]!==currentMap)return;
      const adjDist=Math.abs(r.x-pl[0].x)+Math.abs(r.y-pl[0].y);
      // At HIGH danger, encounter triggers at distance 2 as well
      const encounterDist=areaDanger[currentMap]>=DANGER_HIGH_THRESH?2:1;
      if(adjDist<=encounterDist&&adjDist>0){
        if(!encounterCooldown){
          // Dungeon encounters always start battle — no fleeing
          encounterCooldown=120;
          encounterExclActive=true;
          encounterExclFrame=fr;
          encounterExclTarget=idx+1;
          encounterExclPlayerX=pl[0].visualX;
          encounterExclPlayerY=pl[0].visualY;
          encounterExclRivalX=r.visualX;
          encounterExclRivalY=r.visualY;
          sfxEncounterDramatic();
          hitPause(3); // freeze-frame dramatic tension at encounter trigger
          const rivalName=r.n;
          const isRivalInitiated=ai.state==='hunting';
          // v81: choose context-sensitive pre-battle line
          const rCards=cdCount(r.cd);
          const pCards=cdCount(pl[0].cd);
          const vegaLines_hunt=['Hand over the cards. Now.','I\'ve been tracking you since B1.','The ARK\'s legacy is mine.','No walls stop a hunter.','Cornered. Just like the crew.'];
          const vegaLines_surp=['You... found me first?','Reckless. I respect it.','Bold. The ARK liked bold.','Didn\'t expect prey to hunt.','So you\'ve learned something.'];
          const miraLines_hunt=['I mapped every route. You had no chance.','The ARK crew fell to calculation. So will you.','Your card count fell below threshold. Engaging.','Probability of your escape: zero.','Precisely where my model predicted.'];
          const miraLines_surp=['A variable I didn\'t account for.','Interesting. You deviated from the pattern.','You read the dungeon well. Respect.','My model was wrong. Recalculating.','Even the ARK surprised its own crew once.'];
          const rich=rCards>=3;
          if(idx===0){// VEGA
            const pool=isRivalInitiated?vegaLines_hunt:vegaLines_surp;
            encounterRivalLine=(rich?'I have '+rCards+' cards. ':'')+pool[Math.floor(Math.random()*pool.length)];
          }else{// MIRA
            const pool=isRivalInitiated?miraLines_hunt:miraLines_surp;
            encounterRivalLine=(rCards===0?'I have nothing to lose. ':'')+pool[Math.floor(Math.random()*pool.length)];
          }
          setTimeout(()=>{
            encounterExclActive=false;
            flash();
            twSet(isRivalInitiated?rivalName+' ambushed you! Battle!':'Wild '+rivalName+' appeared! Entering battle...');
            // FRLG-style mosaic pixelation wipe into battle
            startWipe('mosaic',30,()=>{
              sc='act';battlePhase='vs_splash';bpFrame=fr;
              battleRoundHistory=[]; // v90: reset round history on new battle
              bpHP=[BATTLE_HP_MAX,BATTLE_HP_MAX,BATTLE_HP_MAX];bpHPDmgAnim=[0,0,0];
              startWipe('mosaic_out',20);
              // v79: track battle_rival mission
              if(runMission&&runMission.type==='battle_rival'&&!runMission.completed){
                runMission.progress=1;runMission.completed=true;sfxStreakUp();
              }
            });
          },500);
        }
      }
    });
    if(encounterCooldown>0)encounterCooldown--;
  }
}

  drawWipe();

  if(sc==='map'||sc==='act'||sc==='crd'||sc==='log'||sc==='stats'||sc==='victory')g.drawImage(scanCanvas,0,0,W,H);

  g.strokeStyle=FRLG.borderOuter;g.lineWidth=2;g.strokeRect(1,1,W-2,H-2);
  g.strokeStyle=FRLG.borderInner;g.lineWidth=1;g.strokeRect(3,3,W-6,H-6);
  // FPS counter (top-left, on top of everything)
  drawFPS();
  if(_shaking)g.restore();
}

// Mobile: throttle to 30fps for stable performance
const _frameInterval = _isMobile ? 33 : 16.67;
function loop(now){
  if(!lastTime)lastTime=now;
  const delta=now-lastTime;
  if(delta<_frameInterval){requestAnimationFrame(loop);return;}
  dt=Math.min(3,Math.max(0.1,delta/16.67));
  lastTime=now;
  update();draw();updatePixiHud();
  // Manually drive PixiJS: tick animations then render (prevents black flash from auto-ticker racing ahead)
  if(!_isMobile){pixiApp.ticker.update(now);pixiApp.renderer.render(pixiApp.stage);}
  requestAnimationFrame(loop);
}

// Extract move logic so both keydown and held-key loop can call it
function tryMovePlayer(dx, dy) {
  const p = pl[0];
  const nx = p.x + dx, ny = p.y + dy;
  if(dx < 0) p.dir = 1; else if(dx > 0) p.dir = 3;
  if(dy < 0) p.dir = 2; else if(dy > 0) p.dir = 0;
  const m = getMap();
  if(nx < 0 || nx >= MW || ny < 0 || ny >= MH) return false;
  if(!WALKABLE.has(m[ny]?.[nx])) return false;
  p.x = nx; p.y = ny; p.step++; p.walkFrame = (p.walkFrame + 1) % 4;
  sfxMove(); sfxStep();
  stepCounter++; stats.stepsWalked++;
  edgeCacheDirty = true;
  mpBroadcastMove();
  footprints.push({map:currentMap, x:nx, y:ny, age:0});
  if(inDungeon){ fogRevealCurrentRoom(currentMap,nx,ny); fogRevealRadius(currentMap,nx,ny,2); }
  fogSave();
  const newTile = m[ny]?.[nx];
  if(newTile===1||newTile===7||newTile===11){ spawnGrassParticles(nx*TW,ny*TH); sfxGrassRustle(); }
  // v217: Dungeon footstep dust — stone floor puffs when walking through dungeon
  if(inDungeon&&(newTile===1||newTile===4||newTile===10)){
    const dustX=nx*TW,dustY=ny*TH+TH-4;
    for(let i=0;i<3;i++){
      const dustVX=(Math.random()-.5)*1.2;
      const dustCol=currentFloor>=4?'rgba(90,40,20,1)':currentFloor===3?'rgba(80,60,120,1)':'rgba(60,60,70,1)';
      particles.push({x:dustX+4+Math.random()*TW/2,y:dustY,vx:dustVX,vy:-Math.random()*0.8-0.2,life:12+Math.random()*6,c:dustCol});
    }
  }
  if(newTile===25&&inDungeon){
    for(let li=0;li<HAND_SIZE;li++){if(cardTimers[li]>0)cardTimers[li]-=30000;}
    if(objectInteractTimer<=0){objectInteractMsg='Lava! Cards decaying faster!';objectInteractTimer=60;}
    screenShake(2,4);
  }
  if(inDungeon){ processDungeonTurn(); checkFloorItemPickup(nx,ny); }
  if(!tutorialFlags.firstStep){tutorialFlags.firstStep=true;tutorialMsg='Goal: collect all 60 cards to win the Prize Pool! Dungeon entrance is EAST.';tutorialMsgTimer=300;}
  if(newTile===11&&!tutorialFlags.firstGrass){tutorialFlags.firstGrass=true;tutorialMsg='Walk through tall grass to find cards!';tutorialMsgTimer=180;}
  if(newTile!==0){const adj=[[nx-1,ny],[nx+1,ny],[nx,ny-1],[nx,ny+1]];if(adj.some(([ax,ay])=>ax>=0&&ax<MW&&ay>=0&&ay<MH&&m[ay]?.[ax]===0))sfxWaterNear();}
  if(shadowStepsLeft>0)shadowStepsLeft--;
  if(shadowStepsLeft<=0)checkForestTrap();
  randomEventTimer++;
  if(randomEventTimer>=150&&!randomEventActive&&!wildEncounterActive&&!cardAcqActive){randomEventTimer=0;triggerRandomEvent();}
  const exit = checkExitTile(nx,ny);
  if(exit){
    if(!inDungeon&&exit.targetMap>0){dungeonConfirmActive=true;dungeonConfirmExit=exit;}
    else{doMapTransition(exit);}
  }
  return true;
}

document.addEventListener('keydown',e=>{
