[workspace]
members = [
    "programs/*",
    "tests",
]
resolver = "2"

[patch.crates-io]
# Anchor 1.0 compat: fix sysvar::Sysvar/Rent import paths in solana_compat.rs
ephemeral-rollups-sdk = { path = "er-sdk-patch" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
