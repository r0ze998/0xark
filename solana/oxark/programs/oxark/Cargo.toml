[package]
name = "oxark"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oxark"

[features]
default = ["custom-heap"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# mint instructions moved to programs/oxark-cards


[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", features = ["token", "associated_token"] }
ephemeral-rollups-sdk = { version = "0.6.6", features = ["anchor", "disable-realloc"] }
solana-bn254 = "3"
solana-sha256-hasher = "3.1.0"
# T-D13-A0: light-poseidon for on-chain Poseidon hash (DEF-16)
pso-poseidon = { version = "0.2.0", default-features = false }
ark-bn254 = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }

[dev-dependencies]
litesvm = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "3.0.0"
solana-sdk-ids = "3.0.0"
solana-instruction = "3.0.0"
solana-compute-budget = "3.1.12"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
